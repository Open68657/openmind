};

/* TEMPORARY — devLevels(4) forces every new body's subdivision depth, and
   devLevels() puts it back. The one question it answers: is a seam a mesh too
   coarse for its curvature, or a kink the surface really has? Raising the depth
   moves the first and leaves the second exactly where it was. */
window.devLevels = n => { LEVEL_OVERRIDE = (n === undefined || n === null) ? null : n; return LEVEL_OVERRIDE ?? 'per-material'; };

/* TEMPORARY — walks a scanline across the last body's height field and reports
   the biggest step between neighbouring samples. A smooth field steps by well
   under 0.02 per two units; the medial-axis crease showed up as a cliff. This
   is what separated "the profile has a ridge" from "the triangles are uneven",
   which looked the same on screen and needed opposite fixes. */
window.devField = (rows = 3) => {
  const f = LAST_FIELD;
  if (!f) return 'draw something first';
  const out = [];
  for (let r = 0; r < rows; r++) {
    const y = f.rcy + (r - (rows - 1) / 2) * f.dmax * 0.5;
    let prev = null, worst = 0, atX = 0;
    for (let x = -f.dmax * 4; x <= f.dmax * 4; x += f.dmax * 0.02) {
      const t = f.radialW > 0 ? f.radialT(x, y) : 0;
      if (prev !== null && Math.abs(t - prev) > worst) { worst = Math.abs(t - prev); atX = x; }
      prev = t;
    }
    out.push({ scanY: +y.toFixed(1), worstStep: +worst.toFixed(4), atX: +atX.toFixed(1) });
  }
  // vetoes counts vertex-moves the fold guard refused. Zero on a convex
  // outline; a large number on a crescent is the guard doing its job, and is
  // what tells a torn body apart from a merely coarse one
  return { verts: f.P.length, radialWeight: f.radialW, dmax: +f.dmax.toFixed(1),
           relaxVetoes: RELAX_VETOES,
           // must stay well clear of 0: at 0 the body is pinched through
           thinnestInterior: LAST_THIN, scans: out };
};

/* TEMPORARY — diagnostic for "glass comes out dark".
   Reads the glass mask back off the GPU and reports, per transmissive body,
   how much of its own screen footprint the mask actually covers. A body the
   mask misses is a body the composite is still multiplying occlusion onto,
   and the number says so instead of the eye guessing. Coverage near 1 means
   the mask is doing its job there and the darkness is coming from the
   material, not from the AO. */
window.devGlassMask = () => {
  if (!glassRT) return 'no target yet';
  const w = glassRT.width, h = glassRT.height;
  const buf = new Uint8Array(w * h * 4);
  renderer.readRenderTargetPixels(glassRT, 0, 0, w, h, buf);
  let lit = 0;
  for (let i = 0; i < w * h; i++) if (buf[i * 4] > 127) lit++;

  // a body's footprint, taken from the screen-space box of its own vertices
  const v = new THREE.Vector3();
  const rows = [];
  for (const b of bodies) {
    if (!b.glass) continue;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    b.mesh.updateWorldMatrix(true, true);
    b.mesh.traverse(o => {
      if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
      const p = o.geometry.attributes.position;
      const step = Math.max(1, Math.floor(p.count / 400));
      for (let i = 0; i < p.count; i += step) {
        v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld).project(camera);
        x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x);
        y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
      }
    });
    if (x0 > x1) { rows.push({ material: b.matName, note: 'no geometry found' }); continue; }
    // NDC -> mask pixels. readRenderTargetPixels comes back bottom-up, and so
    // does NDC y, so no flip is needed here
    const px0 = Math.max(0, Math.floor((x0 * 0.5 + 0.5) * w)), px1 = Math.min(w - 1, Math.ceil((x1 * 0.5 + 0.5) * w));
    const py0 = Math.max(0, Math.floor((y0 * 0.5 + 0.5) * h)), py1 = Math.min(h - 1, Math.ceil((y1 * 0.5 + 0.5) * h));
    let n = 0, on = 0;
    for (let y = py0; y <= py1; y++) for (let x = px0; x <= px1; x++) { n++; if (buf[(y * w + x) * 4] > 127) on++; }
    rows.push({ material: b.matName, boxPixels: n, maskedFraction: +(on / Math.max(1, n)).toFixed(3) });
  }
  return { maskSize: w + 'x' + h, maskedScreenFraction: +(lit / (w * h)).toFixed(3), glassBodies: rows };
};

/* ---------- drawing surface ---------- */
const dc = document.getElementById('draw');
const dctx = dc.getContext('2d');
let pts = [], drawing = false;

function toWorld(x, y) { return { x: (x - innerWidth / 2) * VIEW, y: -(y - innerHeight / 2) * VIEW }; }

/* Graphite v2. Constant-width core drawn as quadratic curves through
   segment midpoints (no joins, no width steps), pressure only modulates
   OPACITY and is smoothed over time. Grain is fine and hugs the core. */
function tooth(x, y) {
  return fbm(x * 0.11, y * 0.11, 3.1, 2) * 0.5 + 0.5;
}
let pressS = 0.75;                                   // smoothed pressure
function strokeSegment(p0, p1, p2, speed) {
  const target = Math.max(0.35, Math.min(1, 1 - speed / 90));
  pressS += (target - pressS) * 0.12;                // slow, pencil-like response
  const press = pressS;

  const m1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
  const m2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

  // core: one smooth curve, fixed width
  dctx.strokeStyle = `rgba(40,38,35,${0.34 * press + 0.08})`;
  dctx.lineWidth = 1.6;
  dctx.lineCap = 'round';
  dctx.beginPath();
  dctx.moveTo(m1.x, m1.y);
  dctx.quadraticCurveTo(p1.x, p1.y, m2.x, m2.y);
  dctx.stroke();

  // grain: sparse, tight to the line, gated by fixed paper tooth
  const d = Math.hypot(m2.x - m1.x, m2.y - m1.y);
  const steps = Math.max(1, Math.round(d));
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    const x = m1.x + (m2.x - m1.x) * t, y = m1.y + (m2.y - m1.y) * t;
    for (let k = 0; k < 3; k++) {
      const gx = x + (Math.random() - 0.5) * 3.2;
      const gy = y + (Math.random() - 0.5) * 3.2;
      if (tooth(gx, gy) < 0.42) continue;
      const fall = 1 - Math.hypot(gx - x, gy - y) / 2.4;
      if (fall <= 0) continue;
      dctx.fillStyle = `rgba(46,44,41,${(0.05 + Math.random() * 0.08) * press * fall})`;
      dctx.fillRect(gx, gy, 1, 1);
    }

}
function clearStroke() { dctx.clearRect(0, 0, innerWidth, innerHeight); }

let lastT = 0;
dc.addEventListener('pointerdown', e => {
  drawing = true; pts = [{ x: e.clientX, y: e.clientY }];
  lastT = performance.now();
  try { dc.setPointerCapture(e.pointerId); } catch (_) {}
  idle = 0; spinning = false;
});
dc.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = { x: e.clientX, y: e.clientY }, last = pts[pts.length - 1];
  const d = Math.hypot(p.x - last.x, p.y - last.y);
  if (d < 2) return;
  const now = performance.now();
  const speed = d / Math.max(1, now - lastT) * 16;
  lastT = now;
  // the core is a quadratic through segment midpoints, so it needs three
  // consecutive points — the first move only seeds them
  if (pts.length > 1) strokeSegment(pts[pts.length - 2], last, p, speed);
  // the speed rides along on the point: the ink has always used it, and the body
  // is about to. A stroke that slowed down was pressed harder
  p.v = speed;
  pts.push(p);
});
function endStroke() {
  if (!drawing) return;
  drawing = false;
  if (pts.length > 3) birth(pts.slice());
  pts = []; clearStroke();
}
// listen on window: a pointerup that lands outside the canvas must still
// end the stroke, or the drawn line is stranded on screen forever
addEventListener('pointerup', endStroke);
addEventListener('pointercancel', endStroke);

/* ---------- stroke analysis ---------- */

/* Roundness that does not confuse "long" with "cornered".

   The isoperimetric quotient, 4πA/L², answers one question — how close is this
   to a CIRCLE — and the shape pipeline was asking it a different one: does this
   drawing have corners in it. Those are the same question only for shapes that
   are as wide as they are tall. Measured on this build: a smooth ellipse at 3:1
   scores 0.665 and a square scores 0.785, so an oval drawn by hand came out
   MORE angular than a square. Everything downstream followed: the depth profile
   went to a plateau with a wall, the outline kept its creases, and jelly drawn
   as a long soft blob returned a flat slab with hard edges.

   Whitening fixes it at the source. Take the outline's own principal axes and
   scale each to unit variance: an ellipse of any elongation becomes a circle, a
   rectangle of any elongation becomes a square, and the quotient of THAT is
   about corners alone. Verified: ellipses from 1:1 to 6:1 land 1.00–0.966,
   every rectangle 0.77–0.785, a triangle 0.61. The 0.88→0.80 window it feeds
   was calibrated against those same numbers and still holds.

   Even resampling first is not optional — covariance over points the hand left
   bunched up in the slow parts of a stroke describes the hand, not the shape. */
function cornerRoundness(poly) {
  const n = poly.length;
  if (n < 8) return 1;
  const seg = [];
  let L = 0;
  for (let i = 0; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    seg.push(d); L += d;
  }
  if (L < 1e-6) return 1;
  const N = 256, step = L / N, R = [];
  let e = 0, acc = 0;
  for (let k = 0; k < N; k++) {
    const target = k * step;
    while (e < n - 1 && acc + seg[e] < target) { acc += seg[e]; e++; }
    const t = seg[e] > 1e-9 ? (target - acc) / seg[e] : 0;
    const a = poly[e], b = poly[(e + 1) % n];
    R.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  }
  let mx = 0, my = 0;
  for (const q of R) { mx += q.x; my += q.y; }
  mx /= N; my /= N;
  let sxx = 0, syy = 0, sxy = 0;
  for (const q of R) { const dx = q.x - mx, dy = q.y - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  sxx /= N; syy /= N; sxy /= N;
  const tr = sxx + syy;
  const disc = Math.sqrt(Math.max(0, tr * tr / 4 - (sxx * syy - sxy * sxy)));
  const l1 = tr / 2 + disc, l2 = tr / 2 - disc;
  // a stroke with no width at all in one direction has no shape to judge
  if (l2 < 1e-9) return 0;
  let ex, ey;
  if (Math.abs(sxy) > 1e-9) { ex = l1 - syy; ey = sxy; } else { ex = 1; ey = 0; }
  const en = Math.hypot(ex, ey); ex /= en; ey /= en;
  let len = 0, area = 0;
  const W = R.map(q => {
    const dx = q.x - mx, dy = q.y - my;
    return { x: (dx * ex + dy * ey) / Math.sqrt(l1), y: (-dx * ey + dy * ex) / Math.sqrt(l2) };
  });
  for (let k = 0; k < N; k++) {
    const a = W[k], b = W[(k + 1) % N];
    len += Math.hypot(b.x - a.x, b.y - a.y);
    area += a.x * b.y - b.x * a.y;
  }
  area = Math.abs(area) / 2;
  return Math.min(1, 4 * Math.PI * area / Math.max(len * len, 1e-9));
}

function analyse(p) {
  let len = 0;
  for (let i = 1; i < p.length; i++) len += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, cx = 0, cy = 0;
  p.forEach(q => {
    minx = Math.min(minx, q.x); maxx = Math.max(maxx, q.x);
    miny = Math.min(miny, q.y); maxy = Math.max(maxy, q.y);
    cx += q.x; cy += q.y;
  });
  cx /= p.length; cy /= p.length;
  // shoelace area
  let area = 0;
  for (let i = 0; i < p.length; i++) {
    const a = p[i], b = p[(i + 1) % p.length];
    area += a.x * b.y - b.x * a.y;
  }
  area = Math.abs(area) / 2;
  const gap = Math.hypot(p[0].x - p[p.length - 1].x, p[0].y - p[p.length - 1].y);
  const closed = gap / Math.max(len, 1) < 0.28;
  // isoperimetric quotient: 1 = perfect circle. Kept because it is genuinely
  // "how circular", which the readout reports and the pivot logic reads
  const round = Math.min(1, (4 * Math.PI * area) / Math.max(len * len, 1));
  // and "how cornered", which is the different question the shape pipeline asks
  const corner = cornerRoundness(p);
  return { len, cx, cy, w: maxx - minx, h: maxy - miny, area, closed, round, corner };
}

/* ---------- geometry generators ---------- */
/* Light smoothing + decimation so the extruded outline stays clean
   without drifting away from what was actually drawn. */
function smoothPath(p, passes = 2) {
  let q = p.slice();
  for (let s = 0; s < passes; s++) {
    const r = [q[0]];
    for (let i = 1; i < q.length - 1; i++) {
      r.push({ x: (q[i - 1].x + q[i].x * 2 + q[i + 1].x) / 4,
               y: (q[i - 1].y + q[i].y * 2 + q[i + 1].y) / 4,
               v: ((q[i - 1].v ?? 0) + (q[i].v ?? 0) * 2 + (q[i + 1].v ?? 0)) / 4 });
    }
    r.push(q[q.length - 1]); q = r;
  }
  const out = [q[0]];
  for (let i = 1; i < q.length; i++) {
    const l = out[out.length - 1];
    if (Math.hypot(q[i].x - l.x, q[i].y - l.y) > 3) out.push(q[i]);
  }
  return out;
}

/* ---------- inflation ----------
   The move that turns a drawing into a body. An extrude gives constant depth
   with a bevel, which is a coin: the front silhouette is right and the side
   view gives the whole thing away.

   Here the outline is triangulated as drawn, the triangles are subdivided so
   the inside gains vertices the outline never had, and every vertex is pushed
   out of the page by how far it sits from the drawn edge. The edge keeps a
   distance of zero and therefore never moves, so the front silhouette is still
   exactly the line the hand made, while the middle swells to its own
   thickness. Thickness follows the shape instead of being dialled in: a fat
   blob comes out fat, a thin sliver comes out thin.

   The profile is the sphere's, sqrt(t(2-t)). Its slope at the rim is vertical,
   so the surface leaves the outline perpendicular to the page and the edge
   reads as a rolled lip rather than a knife. Drawn round, it returns a ball. */
function segDist2(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay, wx = px - ax, wy = py - ay;
  const vv = vx * vx + vy * vy;
  let t = vv > 1e-12 ? (wx * vx + wy * vy) / vv : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  const dx = px - (ax + vx * t), dy = py - (ay + vy * t);
  return dx * dx + dy * dy;
}

let LAST_FIELD = null, LEVEL_OVERRIDE = null, RELAX_VETOES = 0, LAST_THIN = 1;
/* How much a long shape flattens. `round` is the power the elongation is
   raised to, `block` how much of the elongation a block's depth still takes.
   Both are zero-effect on a 1:1 drawing, so a circle is a ball and a square is
   a cube whatever these say — they only decide what happens as it stretches. */
const DEPTH_TAPER = { round: 0.35, block: 0.45 };
/* The smallest fraction of the distance-field profile a body is allowed to keep
   once the radial measure has had its say. Not a look setting — it is what makes
   "a closed outline always encloses a solid" true rather than usually true. */
const RADIAL_FLOOR = 0.45;
/* How much of a shallow body's lost path length is given back to it as
   absorption, so the same material reads the same however flat it was drawn.
   0 leaves it to physics and a flat jelly comes out pale; 1 compensates in full
   and overshoots badly. Swept against v07 on the same drawing, whose jelly was
   382 units deep where the same drawing now gives 110: full compensation gave
   saturation 0.59 and half gave 0.52, against the 0.438 to match. 0.15 lands on
   0.439 — and matching v07 exactly turned out to be aiming too low, since v07
   was the version being called pale. 0.28 reads about 0.47, a little richer
   than the old deep slab rather than equal to it. */
let GLASS_DEPTH_COMP = 0.28;
window.tuneGlassDepth = v => { GLASS_DEPTH_COMP = v; return { comp: GLASS_DEPTH_COMP, note: 'affects the NEXT body drawn' }; };
// tuneDepth({round: 0.5}) — the proportion is a judgement, so it is on a dial
window.tuneDepth = v => {
  if (v.round !== undefined) DEPTH_TAPER.round = v.round;
  if (v.block !== undefined) DEPTH_TAPER.block = v.block;
  return { ...DEPTH_TAPER, note: 'affects the NEXT body drawn' };
};
function inflate(poly, o = {}) {
  const aspect = o.aspect ?? 0.9;    // half-thickness as a fraction of the inradius
  const puff   = o.puff   ?? 1.0;    // 1 = sphere, below 1 = flatter top, rounder rim
  /* How much of the way in the surface takes to reach full thickness. At 1 it
     rises all the way to the middle, which is a sphere. Small, it rises over a
     narrow band at the edge and then runs flat — a plateau with a wall, which is
     a block.

     This replaces doing the same thing by crushing the exponent. Crushing it made
     the surface climb almost vertically at the first ring of vertices, so the
     whole wall was ONE strip of triangles: no vertices in it, therefore no room
     for pitting, therefore a smooth band with the material smeared down it. Those
     were the stripes. Spending a fifth of the distance field on the wall gives it
     rings of its own, and it comes out pitted and chiselled like every other
     face — while the plateau is just as flat as before. */
  const edge   = o.edge   ?? 1.0;
  const wob    = o.wob    ?? 0;      // fbm break-up, as a fraction of thickness
  const chisel = o.chisel ?? 0;      // banded break-up: struck faces, not moulded ones
  const seed   = o.seed   ?? 0;

  // below is vertices times edges, so a long outline takes one level less
  // TEMPORARY — devLevels(4) forces the subdivision depth, to tell a mesh that
  // is too coarse apart from a surface that genuinely has a kink in it
  const levels = LEVEL_OVERRIDE ?? (o.levels ?? (poly.length > 150 ? 2 : 3));

  const shape = new THREE.Shape();
  poly.forEach((p, i) => i ? shape.lineTo(p.x, p.y) : shape.moveTo(p.x, p.y));
  shape.closePath();
  const flat = new THREE.ShapeGeometry(shape);      // earcut: outline vertices only
  const fp = flat.attributes.position;
  let P = [];
  for (let i = 0; i < fp.count; i++) P.push({ x: fp.getX(i), y: fp.getY(i) });
  let I = Array.from(flat.index.array);
  flat.dispose();
  if (!I.length) return new THREE.BufferGeometry();

  // 1 -> 4 split, sharing midpoints so the surface cannot crack. A midpoint of
  // an outline edge lands back on the outline, which is what keeps the
  // silhouette exact however many times this runs.
  for (let L = 0; L < levels; L++) {
    const mid = new Map(), J = [];
    const midpoint = (a, b) => {
      const k = a < b ? a * 4194304 + b : b * 4194304 + a;
      let m = mid.get(k);
      if (m === undefined) {
        m = P.length;
        P.push({ x: (P[a].x + P[b].x) / 2, y: (P[a].y + P[b].y) / 2 });
        mid.set(k, m);
      }
      return m;
    };

      const a = I[t], b = I[t + 1], c = I[t + 2];
      const ab = midpoint(a, b), bc = midpoint(b, c), ca = midpoint(c, a);
      J.push(a, ab, ca, ab, b, bc, ca, bc, c, ab, bc, ca);

  const dist = new Float32Array(P.length);
  const nearest = i => {
    let best = Infinity;
    for (let e = 0; e < n; e++) {
      const a = poly[e], b = poly[(e + 1) % n];
      const d2 = segDist2(P[i].x, P[i].y, a.x, a.y, b.x, b.y);
      if (d2 < best) best = d2;

  for (let i = 0; i < P.length; i++) dist[i] = nearest(i);

  /* Even out the triangles before anything is measured on them.

     earcut is a fan from the outline: it triangulates correctly and says nothing
     about triangle QUALITY. Where the hand slowed down and left points bunched
     it produces a knot of slivers; across an open middle it produces triangles
     as long as the body. Subdividing multiplies both equally, so the coarse
     regions stay coarse relative to the curvature and the surface arrives
     faceted — visible as long straight seams on anything smooth. It is not a
     resolution problem: measured, going from three subdivision levels to four
     left the seams exactly where they were.

     A few Laplacian passes on the vertex POSITIONS fix what subdivision cannot.
     Every interior vertex slides toward the average of its neighbours, which is
     the standard way to make a mesh isotropic, and the rim is pinned throughout
     so the drawn silhouette does not move by a pixel. Distances are taken again
     afterwards, since the vertices are no longer where they were measured. */
  {
    let blo = Infinity, bhi = -Infinity, clo = Infinity, chi = -Infinity;
    for (const q of poly) {

      clo = Math.min(clo, q.y); chi = Math.max(chi, q.y);

    const eps = 1e-4 * Math.max(1e-6, Math.max(bhi - blo, chi - clo));
    const onRim = new Uint8Array(P.length);
    for (let i = 0; i < P.length; i++) onRim[i] = dist[i] <= eps ? 1 : 0;
    const nb = [], deg = new Int32Array(P.length);
    for (let i = 0; i < P.length; i++) nb.push([]);
    const link = (a, b) => { if (!nb[a].includes(b)) { nb[a].push(b); deg[a]++; } };
    for (let t = 0; t < I.length; t += 3) {
      const a = I[t], b = I[t + 1], c = I[t + 2];
      link(a, b); link(b, a); link(b, c); link(c, b); link(c, a); link(a, c);
    }
    /* And it has to be stopped from turning a triangle inside out.

       Smoothing with the boundary pinned settles into a harmonic map, and a
       harmonic map is only guaranteed not to fold when the boundary it is
       pinned to is CONVEX. A crescent is not, and there the averaging drags
       interior vertices straight across the concave bay and out the other side:
       the triangles they belong to turn over, their faces point backwards, and
       the body arrives torn — pale gaps showing the backdrop straight through a
       shape that was drawn closed.

       So each pass is proposed rather than applied. A triangle that would come
       out wound the wrong way vetoes the move for its own three vertices, and
       since freezing one vertex can rescue or ruin its neighbours the veto is
       swept until it settles. The mesh still evens out everywhere it safely
       can, and where it cannot it simply stays as earcut left it. */
    let orient = 0;
    for (let t = 0; t < I.length; t += 3) {
      const a = P[I[t]], b = P[I[t + 1]], c = P[I[t + 2]];
      orient += (b.x - a.x) * (c.y - a.y) - (c.x - a.x) * (b.y - a.y);
    }
    const sgn = orient >= 0 ? 1 : -1;
    const nx = new Float64Array(P.length), ny = new Float64Array(P.length);
    const locked = new Uint8Array(P.length);
    let vetoed = 0;
    for (let pass = 0; pass < 12; pass++) {
      for (let i = 0; i < P.length; i++) {
        if (onRim[i] || !deg[i]) { nx[i] = P[i].x; ny[i] = P[i].y; continue; }
        let sx = 0, sy = 0;
        for (const j of nb[i]) { sx += P[j].x; sy += P[j].y; }
        // damped: a full jump to the average overshoots and needs more vetoing
        nx[i] = P[i].x + (sx / deg[i] - P[i].x) * 0.6;
        ny[i] = P[i].y + (sy / deg[i] - P[i].y) * 0.6;
      }
      locked.fill(0);
      for (let sweep = 0; sweep < 4; sweep++) {
        let hit = 0;
        for (let t = 0; t < I.length; t += 3) {
          const ia = I[t], ib = I[t + 1], ic = I[t + 2];
          const ax = locked[ia] ? P[ia].x : nx[ia], ay = locked[ia] ? P[ia].y : ny[ia];
          const bx = locked[ib] ? P[ib].x : nx[ib], by = locked[ib] ? P[ib].y : ny[ib];
          const cx2 = locked[ic] ? P[ic].x : nx[ic], cy2 = locked[ic] ? P[ic].y : ny[ic];
          const area = ((bx - ax) * (cy2 - ay) - (cx2 - ax) * (by - ay)) * sgn;
          if (area > 0) continue;
          if (!locked[ia]) { locked[ia] = 1; hit++; }
          if (!locked[ib]) { locked[ib] = 1; hit++; }
          if (!locked[ic]) { locked[ic] = 1; hit++; }
        }
        if (!hit) break;
      }
      for (let i = 0; i < P.length; i++) {
        if (locked[i]) { vetoed++; continue; }
        P[i].x = nx[i]; P[i].y = ny[i];
      }
    }
    RELAX_VETOES = vetoed;
    for (let i = 0; i < P.length; i++) dist[i] = onRim[i] ? 0 : nearest(i);
  }

  let dmax = 0;
  for (let i = 0; i < P.length; i++) if (dist[i] > dmax) dmax = dist[i];

  /* The deepest point inside the outline, found on a grid rather than read off
     the mesh — and this is what the thickness is measured against, so getting it
     wrong scales the whole body.

     `dmax` above is only the deepest point that a VERTEX happens to sit on, and
     the triangulator has no reason to put one at the middle: earcut fans a
     square from its corners, and after subdivision the innermost vertex still
     falls short of the centre. Measured, a square came back with its depth at
     0.78 of its width where 0.94 was asked for, because dmax was reading about
     0.42 of the side instead of a true half. The body was not the shape it was
     told to be, and by an amount that moved with the triangulation.

     A grid does not care how the mesh was cut. It costs one pass over 40x40
     points, once, at birth. */
  const inside = (x, y) => {
    let hit = false;
    for (let i = 0, j = n - 1; i < n; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) hit = !hit;
    }
    return hit;
  };
  let glo = Infinity, ghi = -Infinity, hlo = Infinity, hhi = -Infinity;
  for (const q of poly) {
    glo = Math.min(glo, q.x); ghi = Math.max(ghi, q.x);
    hlo = Math.min(hlo, q.y); hhi = Math.max(hhi, q.y);
  }
  const G = 40;
  for (let gy = 0; gy <= G; gy++) {
    const y = hlo + (hhi - hlo) * (gy / G);
    for (let gx = 0; gx <= G; gx++) {
      const x = glo + (ghi - glo) * (gx / G);
      if (!inside(x, y)) continue;
      let best = Infinity;
      for (let e = 0; e < n; e++) {
        const a = poly[e], b = poly[(e + 1) % n];
        const d2 = segDist2(x, y, a.x, a.y, b.x, b.y);
        if (d2 < best) best = d2;
      }
      const d = Math.sqrt(best);
      if (d > dmax) dmax = d;
    }
  }
  if (dmax < 1e-6) return new THREE.BufferGeometry();

  const H = dmax * aspect;
  const RIM = dmax * 1e-4;             // only vertices actually on the outline

  /* The second way of asking "how far in is this vertex", and the one that makes
     a long shape a solid rather than a slab.

     Distance-to-the-outline has a crease along the medial axis — the points with
     two nearest edges. On a circle that set is a single point and nothing shows.
     On anything elongated it is a LINE down the length of the shape: the
     gradient flips across it, and the body arrives with a seam along its spine
     and a hard ridge wherever the outline wobbles. Subdivision cannot help,
     because the surface genuinely has that kink. Smoothing the height afterwards
     cannot either — measured, sixteen Laplacian passes reach about ten pixels
     while the ridge is as long as the body.

     So measure the other way: how far out toward the RIM this vertex sits along
     its own ray from the centre, u = r / R(θ). That is 1 on the outline and 0 at
     the centre, and it has no crease anywhere, because there is nothing to take
     a minimum of. Feeding `1 - u` into the same sqrt(t(2-t)) gives sqrt(1-u²),
     which for an ellipse is exactly an ellipsoid — a drawn oval comes back a
     solid with a circular cross-section however long it is.

     Blended in by roundness rather than swapped: the plateau-and-wall that makes
     a block is defined on the distance field, and a block should keep its
     creases. And it is dropped entirely when the centroid falls outside the
     outline — a crescent has no sensible ray from its own middle. */
  let rcx = 0, rcy = 0, ra = 0;
  for (let i = 0; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n];
    const cr = a.x * b.y - b.x * a.y;
    ra += cr; rcx += (a.x + b.x) * cr; rcy += (a.y + b.y) * cr;
  }
  let radialW = o.radial ?? 0;
  const RB = 360, rbin = new Float32Array(RB);
  if (radialW > 0) {
    if (Math.abs(ra) < 1e-9) radialW = 0;
    else {
      rcx /= 3 * ra; rcy /= 3 * ra;
      if (!inside(rcx, rcy)) radialW = 0;
    }
  }
  if (radialW > 0) {
    // walk the outline finely enough that no angular bin is skipped, and keep
    // the FARTHEST crossing per direction so a dent cannot cut the body in half
    for (let e = 0; e < n; e++) {
      const a = poly[e], b = poly[(e + 1) % n];
      const steps = Math.max(2, Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / 2));
      for (let s = 0; s < steps; s++) {
        const t = s / steps;
        const x = a.x + (b.x - a.x) * t - rcx, y = a.y + (b.y - a.y) * t - rcy;
        const k = ((Math.atan2(y, x) / (2 * Math.PI) * RB) % RB + RB) % RB | 0;
        const r = Math.hypot(x, y);
        if (r > rbin[k]) rbin[k] = r;
      }
    }
    // any bin the walk missed borrows from its neighbours, then one circular
    // smoothing pass so the ray length itself carries no steps into the surface
    for (let pass = 0; pass < 2; pass++) {
      for (let k = 0; k < RB; k++) {
        if (rbin[k] > 0) continue;
        let lo = k, hi = k;
        for (let s = 1; s < RB; s++) { lo = (k - s + RB) % RB; if (rbin[lo] > 0) break; }
        for (let s = 1; s < RB; s++) { hi = (k + s) % RB; if (rbin[hi] > 0) break; }
        rbin[k] = (rbin[lo] + rbin[hi]) * 0.5;
      }
    }
    /* Smoothed, but never DOWNWARD. R(theta) is how far the rim is in that
       direction, and the profile divides by it — so any value that comes back
       smaller than the truth says "this vertex is past the rim" about a vertex
       that is not, and the surface is pinched to nothing there. A plain blur
       lowers every local maximum, which is exactly the tip of every lobe. Taking
       the larger of the blurred and the original keeps the smoothing where it
       rounds a dip and refuses it where it would shave a peak. */
    const sm = new Float32Array(RB);
    for (let k = 0; k < RB; k++) sm[k] = (rbin[(k - 1 + RB) % RB] + rbin[k] * 2 + rbin[(k + 1) % RB]) * 0.25;
    for (let k = 0; k < RB; k++) rbin[k] = Math.max(rbin[k], sm[k]);
  }
  const radialT = (x, y) => {
    const dx = x - rcx, dy = y - rcy;
    const f = ((Math.atan2(dy, dx) / (2 * Math.PI) * RB) % RB + RB) % RB;
    const k = f | 0, g = f - k;
    const R = rbin[k] * (1 - g) + rbin[(k + 1) % RB] * g;
    if (R < 1e-6) return 0;
    return Math.max(0, 1 - Math.hypot(dx, dy) / R);
  };
  const verts = [], tris = [];
  const fIdx = new Int32Array(P.length), bIdx = new Int32Array(P.length);
  const push = (x, y, z) => { verts.push(x, y, z); return verts.length / 3 - 1; };

  /* Heights first, vertices second, so the depth that comes out is the depth
     that was asked for.

     `H` is the target half-thickness, but every modifier after it is a
     MULTIPLIER on the profile — the noise, the chisel banding, the relief — and
     each one is free to land negative at exactly the deepest point. On top of
     that the profile only reaches its peak where a vertex happens to sit on the
     deepest point inside the outline, which no triangulation promises. Between
     them a circle asked to be as deep as it is wide was arriving at 0.85, and by
     a different amount per material: sponge, with the heaviest relief, was
     furthest off. Depth was a suggestion.

     Measuring the peak and scaling to it makes the spec exact and leaves the
     shape alone: every modifier keeps its relative effect, the whole profile is
     simply brought back onto its target. */
  const hh = new Float32Array(P.length);
  let hPeak = 0;
  for (let i = 0; i < P.length; i++) {
    if (dist[i] <= RIM) continue;
    const td = Math.min(1, dist[i] / dmax);
    let t0 = td;
    if (radialW > 0) {
      /* The creaseless measure, mixed in by how round the drawing was — and
         floored by the distance field, which is the thing that cannot be wrong.

         r/R(theta) is only a true measure of "how far in" for a shape that is
         star-shaped about its own centroid. Real drawings are not: a lobe that
         swings back on itself has vertices further from the centre than the rim
         is in that direction, and there the radial term reads zero and the body
         is pinched to zero thickness — front and back surfaces meeting in a
         lens-shaped slit you can see straight through. That is the tear, and on
         glass it is unmissable because there is nothing opaque to hide it.

         Distance-to-the-outline has no such assumption: it is strictly positive
         everywhere strictly inside, always, for any closed outline whatever.
         So it sets a floor. Where the two measures agree the floor never binds
         and the profile is the smooth radial one; where the radial term
         collapses, the floor holds the body open. The seam that leaves is then
         ironed by the same relax passes that were already running. */
      const tr = radialT(P[i].x, P[i].y);
      t0 = Math.max(td * (1 - radialW) + tr * radialW, td * RADIAL_FLOOR);
    }
    const t = Math.min(1, t0 / edge);
    let h = Math.pow(t * (2 - t), 0.5 * puff);
    if (wob) h *= 1 + wob * fbm(P[i].x * 0.011 + seed, P[i].y * 0.011, seed * 0.31, 3);
    if (chisel) {
      // four steps: enough for a face to break into planes, few enough that each
      // one still reads as a plane rather than as noise
      const f = fbm(P[i].x * 0.0075 + seed * 2.3, P[i].y * 0.0075, seed * 0.77, 2);
      h *= 1 + chisel * (Math.floor(f * 4) / 4 - 0.38) * 0.55;
    }
    hh[i] = h;
  }

  /* The ridge down the middle, and why an oval never came out smooth.

     The height is a function of distance-to-the-outline, and that field has a
     crease along the medial axis — the set of points with two nearest edges. On
     a circle the medial axis is a single point and nothing shows. On anything
     elongated it is a LINE running the length of the shape, the gradient flips
     across it, and the body arrives with a seam down its spine and a crease
     wherever the outline wobbles. It is not a tessellation artefact and no
     amount of subdivision removes it: the surface really does have that kink.

     A few Laplacian passes over the mesh graph round the kink off. The rim is
     pinned at zero throughout, so the drawn silhouette is untouched — this only
     ever moves the middle, which is the part nobody drew. Off by default, and
     off entirely for anything faceted or chiselled, where the creases are the
     point. */
  const relax = o.relax ?? 0;
  if (relax > 0) {
    const nb = [], deg = new Int32Array(P.length);
    for (let i = 0; i < P.length; i++) nb.push([]);
    const link = (a, b) => { if (!nb[a].includes(b)) { nb[a].push(b); deg[a]++; } };
    for (let t = 0; t < I.length; t += 3) {
      const a = I[t], b = I[t + 1], c = I[t + 2];
      link(a, b); link(b, a); link(b, c); link(c, b); link(c, a); link(a, c);
    }
    const tmp = new Float32Array(P.length);
    for (let pass = 0; pass < relax; pass++) {
      for (let i = 0; i < P.length; i++) {
        if (dist[i] <= RIM || !deg[i]) { tmp[i] = hh[i]; continue; }
        let s = 0;
        for (const j of nb[i]) s += hh[j];
        // half its own height, half the neighbourhood: fast enough to clear the
        // crease in a few passes, gentle enough not to deflate the dome
        tmp[i] = hh[i] * 0.5 + (s / deg[i]) * 0.5;
      }
      hh.set(tmp);
    }
  }

  for (let i = 0; i < P.length; i++) if (hh[i] > hPeak) hPeak = hh[i];
  const hk = hPeak > 1e-6 ? H / hPeak : 0;

  /* The invariant, measured rather than trusted: a vertex properly inside the
     outline must have thickness. A tear is exactly this going to zero, and it
     is invisible in a stone and glaring in a bubble, so it cannot be left to
     whichever material happens to be drawn next. Reported as a fraction of the
     peak, taken over vertices at least a tenth of the way in — nearer than that
     the profile is meant to be vanishing, since that is the rim. */
  let thin = 1;
  for (let i = 0; i < P.length; i++) {
    if (dist[i] < dmax * 0.10) continue;
    const f = hh[i] / Math.max(hPeak, 1e-9);
    if (f < thin) thin = f;
  }
  LAST_THIN = P.length ? +thin.toFixed(4) : 1;
  /* The last body's finished height field, so a suspected crease can be
     measured instead of squinted at. devField() walks a scanline across it and
     reports the biggest step between neighbouring samples — that is how the
     medial ridge was told apart from the faceting, which looked identical on
     screen and needed opposite fixes. */
  LAST_FIELD = { P, hh, dist, dmax, radialW, radialT, rcx, rcy, hk };

  for (let i = 0; i < P.length; i++) {
    if (dist[i] <= RIM) {
      // front and back share this vertex, so the rim welds shut and the
      // averaged normal rounds it instead of leaving a hard seam
      fIdx[i] = bIdx[i] = push(P[i].x, P[i].y, 0);
      continue;
    }
    const h = hh[i] * hk;
    fIdx[i] = push(P[i].x, P[i].y, h);
    bIdx[i] = push(P[i].x, P[i].y, -h);
  }
  for (let t = 0; t < I.length; t += 3) {
    const a = I[t], b = I[t + 1], c = I[t + 2];
    tris.push(fIdx[a], fIdx[b], fIdx[c]);
    // a sliver lying wholly on the rim has the same three welded vertices on
    // both sides; emitting it twice would leave two coplanar faces fighting
    if (fIdx[a] === bIdx[a] && fIdx[b] === bIdx[b] && fIdx[c] === bIdx[c]) continue;
    tris.push(bIdx[c], bIdx[b], bIdx[a]);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(tris);
  g.computeVertexNormals();
  return g;
}

/* Surface tension.

   Every material until now kept the promise that the front silhouette is
   exactly the line the hand drew. A bubble breaks it, and has to: a soap film
   blown through a square frame does not come out square, because tension pulls
   every part of it toward the shape with the least surface for its volume. Same
   for jelly, and for glass that has been rolling in surf for thirty years.

   Each vertex is drawn toward the circle of the SAME AREA about the drawing's
   centre — same area, so relaxing never quietly shrinks or inflates what was
   drawn, it only rounds it. `t` is how far: at 0.8 a fifth of the angularity
   survives, which is enough for a corner to still read as a corner that has
   been rounded off rather than as a corner that was never there. */
/* Tension smooths ALONG the outline, and this is the half that was missing.
   Pulling every vertex toward a circle of equal area rounds the big form but
   leaves the hand's tremor riding on top of it, merely scaled — so a bubble came
   out round in outline and still faintly corrugated, which reads as a moulded
   object rather than a surface held by tension. A film has no tremor: any
   wrinkle in it costs area, so it is gone before you can see it.

   Neighbour averaging is exactly that erasure, and the wrap-around matters —
   the outline is a loop, and smoothing it as a line leaves a kink where the two
   ends meet, which is the one place the eye is guaranteed to look. */
function smoothOutline(poly, passes) {
  let P = poly;
  for (let k = 0; k < passes; k++) {
    const n = P.length, Q = new Array(n);
    for (let i = 0; i < n; i++) {
      const a = P[(i - 1 + n) % n], b = P[i], c = P[(i + 1) % n];
      Q[i] = { x: (a.x + 2 * b.x + c.x) * 0.25, y: (a.y + 2 * b.y + c.y) * 0.25 };
    }
    P = Q;
  }
  return P;
}

/* Round the CORNERS, and leave everything else where it was drawn.

   The first version of tension pulled every vertex toward a circle of equal
   area, which does turn a square into something bubble-like and also throws the
   drawing away: a rectangle came back as a blob, and the rectangle was the point.
   What a soap film actually does to a frame is take the corners off it — tension
   is a force against CURVATURE, so it acts where the outline turns and does
   almost nothing along a straight run.

   So each vertex is moved toward the midpoint of its neighbours in proportion to
   how sharply the outline turns there. Corners round off; edges stay edges; a
   rectangle comes back as a rectangle with soft corners. Area is restored at the
   end, because rounding a corner always removes a little and a body that shrinks
   as it softens reads as deflating. */
function filletOutline(poly, t, passes) {
  if (!t) return poly;
  const area = (P) => {
    let A = 0;
    for (let i = 0, n = P.length; i < n; i++) { const p = P[i], q = P[(i + 1) % n]; A += p.x * q.y - q.x * p.y; }
    return Math.abs(A) * 0.5;
  };
  const A0 = area(poly);
  let P = poly;
  for (let k = 0; k < passes; k++) {
    const n = P.length, Q = new Array(n);
    for (let i = 0; i < n; i++) {
      const a = P[(i - 1 + n) % n], b = P[i], c = P[(i + 1) % n];
      const ux = b.x - a.x, uy = b.y - a.y, vx = c.x - b.x, vy = c.y - b.y;
      const lu = Math.hypot(ux, uy) || 1e-6, lv = Math.hypot(vx, vy) || 1e-6;
      // 0 where the outline runs straight on, 1 where it doubles back
      const turn = Math.min(1, Math.acos(Math.max(-1, Math.min(1, (ux * vx + uy * vy) / (lu * lv)))) / (Math.PI * 0.5));
      const w = t * turn * turn;
      Q[i] = { x: b.x + ((a.x + c.x) * 0.5 - b.x) * w, y: b.y + ((a.y + c.y) * 0.5 - b.y) * w };
    }
    P = Q;
  }
  const A1 = area(P);
  if (A1 > 1e-6) {
    let cx = 0, cy = 0;
    for (const q of P) { cx += q.x; cy += q.y; }
    cx /= P.length; cy /= P.length;
    const k = Math.sqrt(A0 / A1);
    P = P.map(q => ({ x: cx + (q.x - cx) * k, y: cy + (q.y - cy) * k }));
  }
  return P;
}

function relaxOutline(poly, t) {
  if (!t) return poly;
  let A = 0, cx = 0, cy = 0;
  for (let i = 0, n = poly.length; i < n; i++) {
    const p = poly[i], q = poly[(i + 1) % n];
    const cross = p.x * q.y - q.x * p.y;
    A += cross;
    cx += (p.x + q.x) * cross; cy += (p.y + q.y) * cross;
  }
  A *= 0.5;
  if (Math.abs(A) < 1e-6) return poly;
  cx /= 6 * A; cy /= 6 * A;
  const R = Math.sqrt(Math.abs(A) / Math.PI);
  return poly.map(p => {
    const dx = p.x - cx, dy = p.y - cy, d = Math.hypot(dx, dy) || 1e-6;
    const k = ((1 - t) * d + t * R) / d;
    return { x: cx + dx * k, y: cy + dy * k };
  });
}

/* Keep the corners that were drawn, instead of inventing new ones.

   facetOutline cuts an outline into runs of even arc length, which is the right
   way to face a circle and the wrong way to treat a rectangle: the drawing
   already HAS four corners and four straight sides, and resampling it into eleven
   uneven segments throws all eight away. That is why a stone rectangle came back
   with wandering edges — the block was being re-broken by the code after the hand
   had already broken it.

   Ramer–Douglas–Peucker keeps the points that carry the shape and drops the rest,
   so a hand-drawn rectangle collapses to its four corners with dead straight runs
   between them, while a wobbly outline keeps however many corners it really has.
   The tolerance is a fraction of the drawing, so it behaves the same at any size. */
function simplifyOutline(poly, tol) {
  const n = poly.length;
  if (n < 8) return poly;
  const keep = new Uint8Array(n);
  const perp = (p, a, b) => {
    const vx = b.x - a.x, vy = b.y - a.y, L = Math.hypot(vx, vy) || 1e-6;
    return Math.abs((p.x - a.x) * vy - (p.y - a.y) * vx) / L;
  };
  const walk = (i0, i1) => {
    if (i1 <= i0 + 1) return;
    let far = -1, best = tol;
    for (let i = i0 + 1; i < i1; i++) {
      const d = perp(poly[i], poly[i0], poly[i1]);
      if (d > best) { best = d; far = i; }
    }
    if (far < 0) return;
    keep[far] = 1;
    walk(i0, far); walk(far, i1);
  };
  // a loop has no ends, so it is split at the point furthest from the centre and
  // its opposite: both are certainly corners if the shape has any
  let cx = 0, cy = 0;
  for (const q of poly) { cx += q.x; cy += q.y; }
  cx /= n; cy /= n;
  let a0 = 0, bestD = -1;
  for (let i = 0; i < n; i++) { const d = Math.hypot(poly[i].x - cx, poly[i].y - cy); if (d > bestD) { bestD = d; a0 = i; } }
  const rot = poly.slice(a0).concat(poly.slice(0, a0));
  const mid = Math.floor(n / 2);
  const R = rot.concat([rot[0]]);
  const src = poly; // perp reads `poly`, so point it at the rotated copy
  poly = R;
  keep[0] = 1; keep[mid] = 1; keep[n] = 1;
  walk(0, mid); walk(mid, n);
  const out = [];
  for (let i = 0; i < n; i++) if (keep[i]) out.push(R[i]);
  return out.length >= 4 ? out : src;
}

/* And the opposite direction: a gem. Resampled at even arc length into a small
   number of straight runs, so the outline becomes a polygon with real corners
   rather than a smoothed curve. Paired with flat shading and one subdivision
   less, the dome over it breaks into facets instead of swelling — which is what
   separates a crystal from a pebble. */
function facetOutline(poly, n, jitter = 0) {
  const len = [0];
  for (let i = 1; i <= poly.length; i++) {
    const a = poly[i - 1], b = poly[i % poly.length];
    len.push(len[i - 1] + Math.hypot(b.x - a.x, b.y - a.y));
  }
  const total = len[poly.length];
  if (!(total > 0)) return poly;
  /* Uneven runs when asked for them. Equal arc lengths give a regular polygon,
     and a rock is the one thing that never breaks into one: a fracture follows
     whatever plane was weakest, so the faces come out long, short, and nothing in
     between. Weights first, normalised, so the breaks land unevenly but still go
     all the way round exactly once. */
  const w = [];
  for (let k = 0; k < n; k++) w.push(1 + (Math.random() * 2 - 1) * jitter * 0.85);
  const wsum = w.reduce((p, q) => p + q, 0);
  const cut = [0];
  for (let k = 0; k < n; k++) cut.push(cut[k] + w[k] / wsum);

  const out = [];
  for (let k = 0, j = 0; k < n; k++) {
    const target = total * cut[k];
    while (j < poly.length && len[j + 1] < target) j++;
    const a = poly[j], b = poly[(j + 1) % poly.length];
    const seg = len[j + 1] - len[j] || 1;
    const f = (target - len[j]) / seg;
    out.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f });
  }
  return out;
}

/* Give a block real edges.

   The rim here is welded — front and back share the vertex, and the averaged
   normal rolls the surface round it instead of leaving a seam. On a pebble that
   is exactly right. On a cube it is the whole problem: the wall pulled back into
   depth is not a face of its own, it is the front face continuing to bend, so it
   is shaded as the same surface running away from you and the material smears
   down it. A face needs to END somewhere.

   This is the standard fix and it is worth spelling out: normals are averaged
   only between triangles that actually lie in the same plane, to within an angle.
   Below the threshold neighbours are one smooth surface; past it they are two
   surfaces meeting at an edge, and each keeps its own normal. So the rounded
   corner of a jelly cube stays rounded, and the ninety degrees where the face
   turns into the wall becomes a line. */
function creaseNormals(g, deg) {
  const src = g.index ? g.toNonIndexed() : g;
  const pos = src.attributes.position;
  const n = pos.count;
  const fn = new Float32Array(n * 3);      // face normal per vertex slot, xyz each
  const ax = new THREE.Vector3(), bx = new THREE.Vector3(), cx = new THREE.Vector3();
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), nr = new THREE.Vector3();
  for (let t = 0; t < n; t += 3) {
    ax.fromBufferAttribute(pos, t); bx.fromBufferAttribute(pos, t + 1); cx.fromBufferAttribute(pos, t + 2);
    e1.subVectors(bx, ax); e2.subVectors(cx, ax);
    nr.crossVectors(e1, e2).normalize();
    for (let k = 0; k < 3; k++) { fn[(t + k) * 3] = nr.x; fn[(t + k) * 3 + 1] = nr.y; fn[(t + k) * 3 + 2] = nr.z; }
  }
  // vertices that sit in the same place, however they were indexed
  const bucket = new Map();
  const key = (i) => {
    const q = 1e3;
    return Math.round(pos.getX(i) * q) + ',' + Math.round(pos.getY(i) * q) + ',' + Math.round(pos.getZ(i) * q);
  };
  for (let i = 0; i < n; i++) {
    const k = key(i);
    let a2 = bucket.get(k);
    if (!a2) bucket.set(k, a2 = []);
    a2.push(i);
  }
  const lim = Math.cos(deg * Math.PI / 180);
  const out = new Float32Array(n * 3);
  for (const group of bucket.values()) {
    for (const i of group) {
      let sx = 0, sy = 0, sz = 0;
      const ix = fn[i * 3], iy = fn[i * 3 + 1], iz = fn[i * 3 + 2];
      for (const j of group) {
        const jx = fn[j * 3], jy = fn[j * 3 + 1], jz = fn[j * 3 + 2];
        if (ix * jx + iy * jy + iz * jz < lim) continue;   // across an edge: not our surface
        sx += jx; sy += jy; sz += jz;
      }
      const L = Math.hypot(sx, sy, sz) || 1;
      out[i * 3] = sx / L; out[i * 3 + 1] = sy / L; out[i * 3 + 2] = sz / L;
    }
  }
  src.setAttribute('normal', new THREE.BufferAttribute(out, 3));
  return src;
}

/* Relief as geometry, which is the answer to a sponge that reads as printed.

   A bump map cannot make a hole. It tilts the light at a pixel and nothing else,
   so the surface stays exactly where it was and the eye — which has the
   silhouette, the cast shadow and two slightly different views to go on — knows
   it. A sponge's pits are the whole of what a sponge is, and drawn as shading
   they arrive as a photograph of a sponge stuck onto a smooth lump.

   The vertices for real pitting are already there: inflate() subdivides three
   times, so a body carries thousands of them, and each can simply be pushed in
   along its own normal by how dark the scan is at that point. Which needs the
   scan on the CPU, so it is read back once per file and kept.

   Sampling picks the axis the normal points along most and uses the other two
   coordinates — the same trick as the triplanar shader, at the same scale, so
   the geometry and the shading agree about where the pits are. */
const SCAN_PIX = {};
function scanPixels(file) {
  if (SCAN_PIX[file] !== undefined) return SCAN_PIX[file];
  const t = SCAN_CACHE[file];
  const img = t && t.image;
  // a scan that has not finished loading yet: try again on the next body rather
  // than caching the miss
  if (!img || !img.width) return null;
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  const d = c.getContext('2d').getImageData(0, 0, c.width, c.height);
  return (SCAN_PIX[file] = { w: c.width, h: c.height, data: d.data });
}

function reliefDisplace(g, file, scale, depth, sharp = 4) {
  const px = scanPixels(file);
  if (!px) return;
  const pos = g.attributes.position, nrm = g.attributes.normal;
  const { w, h, data } = px;
  const lum = (u, v) => {
    let x = Math.floor(((u % 1) + 1) % 1 * w), y = Math.floor(((v % 1) + 1) % 1 * h);
    const i = (y * w + x) * 4;
    return (data[i] * 0.2126 + data[i + 1] * 0.7152 + data[i + 2] * 0.0722) / 255;
  };
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const nx = nrm.getX(i), ny = nrm.getY(i), nz = nrm.getZ(i);
    /* Blend the three projections, weighted like the shader does, rather than
       picking the dominant one. Picking is fine everywhere except along the
       diagonals where two axes are equally dominant — and there it switches
       between two entirely different pieces of the scan from one vertex to the
       next, which shows up as a band where the surface looks smeared. Same
       fourth-power weighting as the shader, so the geometry and the shading are
       carving the same rock in the same place. */
    let wx = Math.pow(Math.abs(nx), sharp), wy = Math.pow(Math.abs(ny), sharp), wz = Math.pow(Math.abs(nz), sharp);
    const wsum = wx + wy + wz || 1;
    wx /= wsum; wy /= wsum; wz /= wsum;
    /* Below the scan's own mean is a pit, above it a ridge, and the mean itself
       does not move — so the body keeps the volume it was drawn with. But the two
       are not symmetric in the world: a gas bubble in rock is a cavity with an
       edge, while what stands between bubbles is a broad plateau, so the dark
       side is driven harder than the light one. */
    const raw = lum(y * scale, z * scale) * wx
              + lum(x * scale, z * scale) * wy
              + lum(x * scale, y * scale) * wz - SCAN_MEAN;
    const d = (raw < 0 ? raw * 1.7 : raw) * depth;
    pos.setXYZ(i, x + nx * d, y + ny * d, z + nz * d);
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
}

/* A gradient painted into the geometry.

   Sea glass is never one colour. A piece of it holds green where it is thick and
   goes almost white where it thins out, partly because that is what absorption
   does over a shorter path and partly because the frosting scatters more of what
   little colour is left — and the two together are most of why a handful of it
   looks like a handful of different stones.

   Vertex colours rather than a texture, for two reasons: the triplanar
   projection would tile a gradient map into stripes, and a gradient belongs to
   the BODY rather than to the surface — it should run through the whole piece, so
   turning it does not slide the colour across the form.

   The axis is tilted differently per body, with a bias to the vertical, so a
   pile of these reads as a pile of pieces from the same beach and not as a set. */
function paintGradient(g, from, to, seed, patch) {
  g.computeBoundingBox();
  const bb = g.boundingBox;
  // a mostly-upright axis, leaning by up to about 35 degrees
  const lean = (fbm(seed * 1.7, 4.2, 3.1, 2)) * 0.62;
  const ax = Math.sin(lean), ay = Math.cos(lean), az = Math.sin(lean * 1.9) * 0.4;
  const lo = bb.min.x * ax + bb.min.y * ay + bb.min.z * az;
  const hi = bb.max.x * ax + bb.max.y * ay + bb.max.z * az;
  const span = (hi - lo) || 1;
  const A = new THREE.Color(from), B = new THREE.Color(to);
  /* An optional third colour, laid on in PATCHES rather than as another ramp.
     Sea glass is not a two-stop gradient: it holds a wash of green with cooler
     blue where the batch it came from was a different glass, and those areas have
     edges of their own that owe nothing to the shape of the piece. A second ramp
     would only tilt the first one; a noise field gives regions. */
  const C = patch ? new THREE.Color(patch) : null;
  const k = 1 / (span * 0.42 || 1);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    let t = ((x * ax + y * ay + z * az) - lo) / span;
    t = Math.max(0, Math.min(1, t));
    t = t * t * (3 - 2 * t);                 // ease, so neither end reads as a band
    let cr = A.r + (B.r - A.r) * t, cg = A.g + (B.g - A.g) * t, cb = A.b + (B.b - A.b) * t;
    if (C) {
      // biased so the patches are the minority: mostly the green, touched with blue
      let m = fbm01(x * k + seed, y * k, z * k + seed * 0.7, 3) * 1.9 - 0.55;
      m = Math.max(0, Math.min(1, m));
      m = m * m * (3 - 2 * m) * 0.65;
      cr += (C.r - cr) * m; cg += (C.g - cg) * m; cb += (C.b - cb) * m;
    }
    col[i * 3] = cr; col[i * 3 + 1] = cg; col[i * 3 + 2] = cb;
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
}

/* A cloud of beads, and the first body here that is not an outline pulled back
   into depth. Every one of the fourteen profiles so far answers the same question
   — what solid does this line enclose — and answering it well fourteen times is
   still one idea. This one reads the drawing as a REGION to be filled rather than
   a shell to be inflated: hundreds of small spheres packed into it, touching and
   overlapping, so what holds the shape is the crowd and not a surface.

   Sizes on a power law. Equal beads read as a pattern — a bag of peas — while a
   few large ones with a great many small ones between them read as a mass that
   settled, which is what the reference on the board is.

   Depth from the same distance field the solid bodies use, so the cloud is deep
   in the middle and thins toward the drawn edge instead of being a slab of foam.

   One InstancedMesh: four hundred separate meshes would be four hundred draw
   calls, and the whole point of them is that there are a lot. Colour rides on the
   instance rather than the material, which is what makes the gradient possible at
   all — see below. */
/* Sampling along a STROKE, which is a different job from filling an outline.

   An open line was being turned into a polygon first — offset to both sides and
   closed into a band — and then filled like any other shape. On a gentle curve
   that works. On anything that doubles back, the two offset walls cross, and an
   even-odd inside test on a self-crossing loop reports the overlap as OUTSIDE:
   whole stretches of the stroke are excluded while pockets elsewhere are kept.
   The result is a clump of beads with no visible relationship to the line that was
   drawn, which is exactly the bug.

   A stroke has no inside to test. Walk its length instead, and put each bead at a
   random distance along it with a random offset inside a tube — no polygon, no
   parity, and it follows the hand by construction however sharply it turns. */
function beadsAlongPath(pts, tube, seed) {
   const seg = [], cum = [0];
   for (let i = 1; i < pts.length; i++) {
     const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
     seg.push(d); cum.push(cum[i - 1] + d);
   }
   const total = cum[cum.length - 1];
   if (!(total > 0)) return null;
   // spacing and size are separate: see the note in beadCloud
   const rSpace = 2.5 * VIEW;
   const rDraw = rSpace * 0.62;
   const want = Math.round(Math.max(500, Math.min(6000, (total * tube * 2) / (rSpace * rSpace) * 0.55)));
   const beads = [];
   let guard = 0;
   while (beads.length < want && guard++ < want * 10) {
     const at = Math.random() * total;
     // where along the polyline that distance lands
     let i = 1;
     while (i < cum.length - 1 && cum[i] < at) i++;
     const f = (at - cum[i - 1]) / (seg[i - 1] || 1);
     const p0 = pts[i - 1], p1 = pts[i];
     const cx = p0.x + (p1.x - p0.x) * f, cy = p0.y + (p1.y - p0.y) * f;
     // a point in the tube's cross-section, sampled so it is denser at the axis
     const a1 = Math.random() * 6.2832, a2 = Math.random() * 6.2832;
     const rad = tube * Math.pow(Math.random(), 0.7);
     const dx = Math.cos(a1) * Math.cos(a2), dy = Math.sin(a1) * Math.cos(a2), dz = Math.sin(a2);
     const x = cx + dx * rad, y = cy + dy * rad, z = dz * rad;
     const ord = at / total;                     // where along the stroke this sits
     // the same uneven density as the filled clouds: knots and gaps
     const kc = 5.5 / Math.max(1e-3, total);
     const clump = field01(x, y, kc, seed * 2.3);
     if (Math.random() > (0.35 + 1.1 * clump) * (1 - 0.55 * (rad / tube))) continue;
     const r = rDraw * (0.55 + Math.random() * 1.15);
     beads.push({
       x, y, z, r, ord,
       p1: Math.random() * 6.283, p2: Math.random() * 6.283, p3: Math.random() * 6.283,
       w1: 0.35 + Math.random() * 0.5, w2: 0.31 + Math.random() * 0.45, w3: 0.27 + Math.random() * 0.4,
       amp: rSpace * (1.6 + Math.random() * 2.2)
     });
   }
   return beads.length ? beads : null;
}

function beadCloud(poly, span, seed, mat, warm, along = null, tube = 0, weights = null) {
  // point-in-polygon, so beads land inside what was drawn and not in its bbox
  const inside = (x, y) => {
    let hit = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) hit = !hit;
    }
    return hit;
  };
  let lox = Infinity, hix = -Infinity, loy = Infinity, hiy = -Infinity;
  for (const q of poly) {
    lox = Math.min(lox, q.x); hix = Math.max(hix, q.x);
    loy = Math.min(loy, q.y); hiy = Math.max(hiy, q.y);
  }
  const w = hix - lox, h = hiy - loy;
  const R0 = Math.min(w, h);
  // how far a point is from the outline, cheaply: the nearest edge
  const edgeDist = (x, y) => {
    let best = Infinity;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      best = Math.min(best, Math.sqrt(segDist2(x, y, poly[i].x, poly[i].y, poly[j].x, poly[j].y)));
    }
    return best;
  };

  /* Grain, not gravel. The first pass drew a few hundred beads on a power law —
     some large, most small — which is how a pile of stones is built and not how a
     cloud of particles is. In the reference every bead is the same small size and
     there are thousands of them: what varies is DENSITY, not scale, and that is
     the whole difference between a mass of objects and a material made of grains.

     Density also has to fail at the edges. A hard boundary reads as a shape cut
     out of foam; the reference frays — the crowd thins as it goes out, and a few
     beads have left it altogether. So the chance of keeping a candidate falls with
     its distance from the middle, and a handful are deliberately allowed to sit
     outside the outline entirely. */
  /* Absolute size. A bead is a bead: about four pixels across whatever it was
     drawn inside, so a big shape holds MORE of them rather than bigger ones. That
     is what makes it a material — sand does not come in larger grains because you
     poured out more of it — and it is why the count has to follow the area while
     the radius stays put. Capped, because the count is now unbounded by anything
     but how large a shape someone feels like drawing. */
  const preset = along ? beadsAlongPath(along, tube, seed) : null;
  const beads = preset || [];
  const area = w * h;
  /* Spacing and size are two different things, and they used to be one number.

     `rSpace` is the pitch of the crowd: it sets how many beads a given area gets,
     and therefore where they land. `rDraw` is how big each one is actually drawn.
     Tying the second to the first meant a smaller bead automatically brought more
     beads to fill the gap it left, so the cloud never opened up — shrinking them
     just produced finer sand at the same coverage. Split, the positions stay put
     and the air between them grows, which is the whole point of making them
     smaller. */
  const rSpace = 2.5 * VIEW;
  const rDraw = rSpace * 0.62;
  const want = Math.round(Math.max(600, Math.min(6000, area / (rSpace * rSpace) * 0.55)));
  let guard = 0;
  while (!preset && beads.length < want && guard++ < want * 12) {
    const stray = Math.random() < 0.03;
    const pad = stray ? R0 * 0.16 : 0;
    const x = lox - pad + Math.random() * (w + pad * 2);
    const y = loy - pad + Math.random() * (h + pad * 2);
    const within = inside(x, y);
    if (!within && !stray) continue;
    const d = within ? edgeDist(x, y) : -edgeDist(x, y);
    // thin out toward the rim, and thin out fast just outside it
    const norm = d / (R0 * 0.5);
    /* Density itself is uneven, and that is the difference between a cloud and a
       fill. An even crowd that only thins at the rim reads as a shape packed with
       beads to a specification; a real one has knots where they crowd and holes
       where they have thinned out, at a scale much larger than a bead. So a slow
       noise field rides on top of the rim falloff: it opens gaps in the middle and
       lets the edge stay thick in places, which is what stops the outline from
       reading as a boundary that was obeyed. */
    // and the same for the clumping: four or five knots across a cloud, not a
    // frequency in world units that a small one never gets to see
    const kc = 4.5 / Math.max(1e-3, R0);
    const clump = field01(x, y, kc, seed * 2.3);
    const air = 0.34 + 1.05 * clump;
    const keep = (within ? 0.4 + 0.6 * Math.min(1, norm * 1.5) : 0.10 * Math.exp(norm * 5)) * air;
    if (Math.random() > keep) continue;
    /* Give or take a bit more than before. At ±20% the crowd read as machined —
       every grain the same bead from the same bag. Widened to roughly a factor of
       two between the smallest and the largest, held around the same mean so the
       cloud neither thickens nor thins by it: enough for the eye to find some
       grains sitting in front of others, not enough to go back to gravel. */
    const r = rDraw * (0.55 + Math.random() * 1.15);
    const t = Math.max(0, Math.min(1, norm));
    const zMax = R0 * 0.40 * Math.sqrt(t * (2 - t)) + r;
    const z = (Math.random() * 2 - 1) * zMax;
    /* And they do not hold still. A cloud of anything this fine is never at rest
       — dust turns over, a swarm simmers — so every bead gets its own slow orbit:
       three periods that do not divide into each other, its own phase, and an
       amplitude of a couple of its own diameters. Cheap on purpose: three sines a
       bead a frame, where sampling a noise field for thousands of them every frame
       would not survive the frame budget. */
    beads.push({
      x, y, z, r, ord: 0,
      p1: Math.random() * 6.283, p2: Math.random() * 6.283, p3: Math.random() * 6.283,
      w1: 0.35 + Math.random() * 0.5, w2: 0.31 + Math.random() * 0.45, w3: 0.27 + Math.random() * 0.4,
      amp: rSpace * (1.6 + Math.random() * 2.2)
    });
  }
  if (!beads.length) return null;

  const geo = new THREE.IcosahedronGeometry(1, 2);
  const mesh = new THREE.InstancedMesh(geo, mat, beads.length);
  /* No shadow map from a cloud. Thousands of grains a pixel or two across cannot
     be resolved by a shadow map at any size worth paying for — what comes back is
     a grey wash under the body, which is exactly the unconvincing grey. The dark
     inside a cloud is not shadow anyway, it is occlusion: beads standing in front
     of other beads, which the occlusion pass already draws, and which is why the
     crowd reads as deep. Receiving stays on, so a solid body beside it can still
     lay a shadow across it. */
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  const pos = new THREE.Vector3();

  /* Colour in REGIONS, which is how the reference actually works.

     A ramp across the cloud was the first idea and it is the wrong one: it reads
     as a gradient laid over the shape, printed on. What that photograph does is
     hold two separate families — a blue one running navy to periwinkle, a warm one
     running coral to cream — in masses of their own, and where the masses meet
     they interleave BEAD BY BEAD rather than blending. Nothing in it is ever the
     average of blue and orange, which is the muddy grey-purple that lerping the
     two would give on every boundary.

     So: a slow noise field decides which family a bead belongs to, with a little
     random dither on the threshold so the border comes out speckled instead of
     drawn. A second, finer field picks the shade WITHIN the family, so each mass
     has its own light and dark rather than being one flat colour. Then the usual
     per-bead jitter, because no two grains of anything match. */
  const fams = warm.map(list => list.map(c => new THREE.Color(c)));
  const wts = (weights && weights.length === fams.length)
    ? weights.map(w => w / weights.reduce((p, q) => p + q, 0))
    : fams.map(() => 1 / fams.length);
  const col = new THREE.Color(), tmp = new THREE.Color();
  /* The noise frequencies have to be relative to THIS cloud, and they were fixed
     in world units. On a large cloud that gave two or three colour regions, which
     is what was wanted; on a small one — a quick short mark — the field barely
     changed across the whole thing, so every bead landed in the same family and the
     mark came out one flat navy. A cloud should read the same way at any size: two
     or three masses across it, whatever "across it" happens to measure. */
  let blo = Infinity, bhi = -Infinity, clo = Infinity, chi = -Infinity;
  for (const b of beads) {
    blo = Math.min(blo, b.x); bhi = Math.max(bhi, b.x);
    clo = Math.min(clo, b.y); chi = Math.max(chi, b.y);
  }
  const extent = Math.max(1e-3, Math.max(bhi - blo, chi - clo));

  /* Order of appearance. A cloud that arrives all at once, scaling up from its
     middle, has no relationship to the act that made it — and this whole piece is
     about the line being drawn. So every bead knows where along the stroke it
     belongs, and the cloud comes in along that path, in the direction the hand
     went.

     A filled outline has no arc length of its own, but `poly` IS in drawing
     order — it is the path as recorded — so a bead takes the order of the outline
     point it is nearest to. Which is also what the eye reads as the shape being
     traced rather than swelling. */
  if (!along) {
    const N = poly.length;
    for (const b of beads) {
      let best = Infinity, bi = 0;

   width all the way along and finishes in a dome, because the same surface

   that already governs roundness rather than to a switch of its own.

     of the whole — and a hemisphere described by four rings is a cone. So the

     reason the chrome kept coming to a point after the profile was already right:
     the shape was correct and there was nothing there to draw it with. */

     constant. It was 0.42 of the half length: on a short stroke that is a dome,
     and on a long one it is forty per cent of the whole thing tapering — which is
     not a rounded end, it is a spike with a soft tip, and it is what "still too
     pointy" was looking at. A capsule ends in a hemisphere, so the cap has to be
     one RADIUS long however far the stroke runs, and the fraction falls out of
     the geometry instead of being chosen. Floored, so a very long stroke still
     gets a visible dome rather than a flat cut. */

    }
    const swell = press * (1 + lumps * fbm(t * 4.2 + seed, seed * 0.7, 1.9, 3) * 0.9);
    for (let j = 0; j < RING; j++) {

  // inside out: front faces get culled, you see the inner wall of the far side
  // through it, and a solid stroke reads as a half-open pipe.
  for (let i = 0; i < STEPS; i++) {
