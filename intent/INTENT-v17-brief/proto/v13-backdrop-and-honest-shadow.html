<style>
  :root {
    --ground: #e6e4dd;
    --ink: #1a1c19;
    --muted: #7d7f76;
    /* the interface's own lines, as variables rather than as the same rgba
       written out nine times — once the paper can be any colour, every one of
       them has to be able to turn over with it */
    --edge: rgba(26,28,25,.28);
    --edge-strong: rgba(26,28,25,.5);
    --wash: rgba(26,28,25,.06);
    --wash-on: rgba(26,28,25,.10);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--ground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    direction: rtl;   /* stated here too: a shareable build has no <html dir> */
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  #draw {
    position: fixed; inset: 0; z-index: 2; cursor: crosshair;
  }
  .hud {
    position: fixed; z-index: 5; color: var(--ink);
    font-size: 13px; letter-spacing: .01em;
  }
  #title { top: 22px; right: 24px; font-weight: 500; }
  #title small { display: block; color: var(--muted); font-weight: 400; margin-top: 3px; }
  #hint {
    bottom: 24px; right: 24px; color: var(--muted); max-width: 40ch; line-height: 1.6;
  }
  @media (max-width: 720px) { #hint { display: none; } }
  /* TEMPORARY — the material picker.

     The finished piece gives no choice at all: a body's material is drawn for
     you, and not knowing what the line will become is part of what the thing is.
     This exists only so a material can be judged without drawing a dozen bodies
     to walk the cycle round to it, and it comes out before anything ships. It is
     styled as a dev tool on purpose — small, grey, unlovely — so nobody mistakes
     it for part of the work. */
  #matpick {
    top: 62px; left: 24px; display: flex; flex-wrap: wrap; gap: 5px;
    max-width: 260px; direction: ltr;
  }
  #matpick button { font-size: 10px; padding: 3px 8px; opacity: .55; }
  #matpick button[aria-pressed="true"] { opacity: 1; }
  #matpick .devtag {
    width: 100%; font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 1px;
  }
  #readout {
    bottom: 24px; left: 24px; color: var(--muted);
    font-variant-numeric: tabular-nums; text-align: left; direction: ltr;
    font-size: 12px; line-height: 1.7;
  }
  #tools { top: 20px; left: 24px; display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 12px; padding: 7px 14px;
    background: transparent; color: var(--ink);
    border: 1px solid var(--edge); border-radius: 999px;
    cursor: pointer; transition: background .15s;
  }
  button:hover { background: var(--wash); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--wash-on); border-color: var(--edge-strong); }

  /* The backdrop swatch. A native colour input carries an OS-drawn box that
     cannot be talked out of its own border and padding, so the input is made
     to fill a round label and the label does the looking. */
  #bgpick {
    width: 30px; height: 30px; border-radius: 999px; overflow: hidden;
    border: 1px solid var(--edge); cursor: pointer; position: relative;
    display: inline-block; flex: 0 0 auto;
  }
  #bgpick:hover { border-color: var(--edge-strong); }
  #bgpick input {
    position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px);
    padding: 0; border: none; background: none; cursor: pointer;
  }
  #bgpick input::-webkit-color-swatch-wrapper { padding: 0; }
  #bgpick input::-webkit-color-swatch { border: none; }
  #bgpick:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* the tuning panel. Deliberately quiet: it sits over the picture it is
     changing, so anything with weight of its own would compete with the thing
     being judged */
  #panel {
    top: 62px; left: 24px; width: 216px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
    border: 1px solid rgba(26,28,25,.12); border-radius: 12px;
    padding: 12px 14px 14px;
  }
  #panel[hidden] { display: none; }
  #panel .grp {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin: 12px 0 6px;
  }
  #panel .grp:first-child { margin-top: 0; }
  #panel label { display: block; margin: 0 0 7px; font-size: 11px; color: var(--ink); }
  #panel .row { display: flex; justify-content: space-between; margin-bottom: 2px; }
  #panel .row b {
    font-weight: 400; color: var(--muted);
    font-variant-numeric: tabular-nums; direction: ltr;
  }
  #panel input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 14px;
    background: transparent; margin: 0; cursor: pointer; direction: ltr;
  }
  #panel input[type=range]::-webkit-slider-runnable-track {
    height: 2px; background: rgba(26,28,25,.22); border-radius: 2px;
  }
  #panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--ink); margin-top: -4.5px;
  }
  #panel .reset {
    width: 100%; margin-top: 12px; font-size: 11px; padding: 5px 0;
  }
  @media (max-height: 760px) { #panel { top: 62px; max-height: calc(100vh - 110px); overflow-y: auto; } }

{ "imports": {

<script type="module">
import * as THREE from 'three';

/* ---------- noise (value noise + fbm) ---------- */
function hash3(x, y, z) {
  let h = x * 374761393 + y * 668265263 + z * 1274126177;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function smooth(t) { return t * t * (3 - 2 * t); }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = smooth(xf), v = smooth(yf), w = smooth(zf);
  let r = 0;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) for (let k = 0; k < 2; k++) {
    const wx = i ? u : 1 - u, wy = j ? v : 1 - v, wz = k ? w : 1 - w;
    r += hash3(xi + i, yi + j, zi + k) * wx * wy * wz;
  }
  return r * 2 - 1;
}
/* fbm and vnoise are SIGNED — vnoise ends on `r * 2 - 1`, so both run about -1 to
   1 around zero. Every use that wants a probability, a mix factor or an index into
   a list wants 0 to 1 instead, and treating one as the other is a bug that hides:
   it does not throw, it just quietly clamps half of everything to nothing. It cost
   a bead cloud that dropped whole stretches of a stroke and a palette that only
   ever showed its first colour. This is that conversion, named. */
function fbm01(x, y, z, oct = 4) { return fbm(x, y, z, oct) * 0.5 + 0.5; }

/* A smooth field with a GUARANTEED spread, for the places that need one.

   The colour regions in a bead cloud were being taken from fbm, and the measured
   result was that every bead came out white: red 0.78 to 1.0, blue 0.95 to 1.0,
   not one warm bead in five thousand. The palette was fine and the selection never
   left its first entry — fbm over a patch this small was returning nearly the same
   value everywhere, so the noise had no say and its own bias decided everything.

   Three sine waves at three angles instead. It is a quasi-periodic interference
   pattern, which is what a slow noise field looks like anyway at this scale, and
   its range is arithmetic rather than statistical: it genuinely covers 0 to 1
   whatever coordinates it is handed. Regions get chosen; the palette gets used. */
function field01(x, y, k, seed) {
  const a1 = seed * 0.7, a2 = seed * 1.9 + 2.1, a3 = seed * 3.3 + 4.7;
  const s = Math.sin(x * k * 0.9 + y * k * 0.35 + a1)
          + Math.sin(-x * k * 0.4 + y * k * 1.05 + a2) * 0.85
          + Math.sin(x * k * 0.65 - y * k * 0.75 + a3) * 0.7;
  return Math.max(0, Math.min(1, 0.5 + s / 5.1));
}

function fbm(x, y, z, oct = 4) {
  let a = 1, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * vnoise(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; }
  return sum / norm;
}

/* ---------- material library (placeholder scans) ----------
   These are procedural stand-ins. The real system uses photographed
   material, shot neutral so it can be tinted here in code. */
function tex(draw, size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* Triplanar projection: samples the material from three axes and blends.
   Kills UV seams and stretching on organic bodies — the "gift wrap" problem.

   It carries the whole material response, not only colour. An eye reads
   material from the way light CHANGES across a surface, so the scan's own
   luminance also drives a bump and a roughness break-up — one flat albedo
   map is what makes a body read as default plastic. Two more things the
   scans need: conditioning on load (see conditionScan), and sampling as two
   layers at different scales and angles, so no repeat ever lines up. */
function triplanar(mat, scale, o = {}) {
  // the bump is computed from screen derivatives, which are core in WebGL2
  // but an extension below it — declaring it costs nothing and keeps older
  // builds of three from compiling a shader that cannot run
  mat.extensions = { derivatives: true };
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTriScale = { value: scale };
    shader.uniforms.uBump = { value: o.bump ?? 70 };
    shader.uniforms.uRoughVar = { value: o.roughVar ?? 0.35 };
    shader.uniforms.uTriSharp = { value: o.sharp ?? 4.0 };
    // hold the conditioned mean so layering cannot drift off it
    shader.uniforms.uMean = { value: Math.pow(SCAN_MEAN, 2.2) };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vTriPos;\nvarying vec3 vTriNrm;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvTriPos = position;\nvTriNrm = normal;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vTriPos;
        varying vec3 vTriNrm;
        uniform float uTriScale;
        uniform float uBump;
        uniform float uRoughVar;
        uniform float uTriSharp;
        uniform float uMean;
        float triLum = 0.0;
        const mat2 TRI_ROT = mat2(0.7986, -0.6018, 0.6018, 0.7986);   // 37 degrees
        vec4 triLayer(sampler2D t, vec2 uv, float bias) {
          vec4 a = texture2D(t, uv, bias);
          vec4 b = texture2D(t, TRI_ROT * uv * 0.43 + 7.3, bias);
          return a + (b - uMean) * 0.85;
        }`)
      .replace('#include <map_fragment>', `
        /* The blend exponent, and on a wall it is the difference between a
           surface and a smear. At 4 the three projections overlap generously,
           which is what keeps a curved body seamless — but a face pulled back
           into depth barely moves in x and y, so the front projection sampled
           along it repeats the same pixels down the whole wall as streaks. The
           sharper the weighting, the sooner the wall switches to the projection
           that is actually facing it. Per material, since the seams the soft
           blend was hiding are real on anything round. */
        vec3 triW = pow(abs(normalize(vTriNrm)), vec3(uTriSharp));
        triW /= (triW.x + triW.y + triW.z);
        vec4 triC = triLayer(map, vTriPos.yz * uTriScale, 0.0) * triW.x
                  + triLayer(map, vTriPos.xz * uTriScale, 0.0) * triW.y
                  + triLayer(map, vTriPos.xy * uTriScale, 0.0) * triW.z;
        // height comes off a deliberately blurred mip: a screen-derivative
        // bump on the sharp sample amplifies the scan's own JPEG noise into
        // a fizz of pixel-sized dents
        vec4 triH = triLayer(map, vTriPos.yz * uTriScale, 2.2) * triW.x
                  + triLayer(map, vTriPos.xz * uTriScale, 2.2) * triW.y
                  + triLayer(map, vTriPos.xy * uTriScale, 2.2) * triW.z;
        triLum = dot(triH.rgb, vec3(0.2126, 0.7152, 0.0722));
        diffuseColor *= triC;
      `)
      // crevices scatter, ridges catch — a single uniform highlight is the
      // giveaway that nothing is actually varying across the surface
      .replace('#include <roughnessmap_fragment>', `
        float roughnessFactor = clamp(roughness + (uMean - triLum) * uRoughVar, 0.04, 1.0);
      `)
      // bump straight off the scan's luminance, via screen derivatives, so
      // it needs no tangents and follows the triplanar sample exactly
      .replace('#include <normal_fragment_maps>', `
        vec3 triSurf = -vViewPosition;
        vec3 triSx = dFdx(triSurf), triSy = dFdy(triSurf);
        vec3 triR1 = cross(triSy, normal), triR2 = cross(normal, triSx);
        float triDet = dot(triSx, triR1);
        vec3 triGrad = sign(triDet) * (dFdx(triLum) * triR1 + dFdy(triLum) * triR2) * uBump;
        // derivatives blow up along the silhouette; without this the rim
        // turns into a ring of glitter
        triGrad = clamp(triGrad, -1.5 * abs(triDet), 1.5 * abs(triDet));
        /* And this is the rest of the streaking on a wall pulled back into depth.
           The bump is built from SCREEN derivatives, so it depends on how much
           world distance one pixel covers — and on a face turned nearly edge-on
           that distance is enormous in one screen direction and tiny in the other.
           The gradient it measures is therefore wildly stretched along the wall,
           which arrives as lines running backwards. It is not a texture artefact
           and no projection fixes it: the measurement itself is degenerate there.

           So the bump fades out as the surface turns away from the camera. That is
           also the honest thing physically — a relief you are looking along rather
           than at has no shading to give — and the colour and the real displaced
           geometry carry the wall on their own, which they can now that it has
           vertices of its own. */
        float triGraze = abs(dot(normalize(normal), normalize(vViewPosition)));
        triGrad *= smoothstep(0.10, 0.42, triGraze);
        normal = normalize(abs(triDet) * normal - triGrad);
      `);
    mat.userData.tri = shader.uniforms;   // live tuning handle, see tuneTri()
  };
  mat.customProgramCacheKey = () => 'tri3-' + (o.sharp ?? 4);
  TRI_MATS.push(mat);
}
const TRI_MATS = [];
// tuneTri({bump: 60}) from the console: retunes every material on screen at
// once, so a value can be judged against the real thing before it is baked in
function tuneTri(v) {
  TRI_MATS.forEach(m => {
    const u = m.userData.tri;
    if (!u) return;
    for (const k in v) if (u['u' + k[0].toUpperCase() + k.slice(1)]) u['u' + k[0].toUpperCase() + k.slice(1)].value = v[k];
  });
  return TRI_MATS.length + ' materials';
}
window.tuneTri = tuneTri;   // dev handle: the page is a module, so the
                            // console cannot reach anything not hung here
// tuneLight({exposure: .8, key: 1.2}) — same idea for the room, since exposure
// and lamp strength can only really be judged against each other on screen
window.tuneLight = v => {
  if (v.exposure !== undefined) renderer.toneMappingExposure = v.exposure;
  if (v.key !== undefined) key.intensity = v.key;
  if (v.rim !== undefined) rim.intensity = v.rim;
  if (v.back !== undefined) back.intensity = v.back;
  return { exposure: renderer.toneMappingExposure, key: key.intensity,
           rim: rim.intensity, back: back.intensity };
};
/* The scans are photographs, not tiles: 16:9, lit with a vignette, each with
   its own big soft blob in the middle. Tiled raw, the vignette becomes a grid
   of patches and the edges become hard straight lines across the body — the
   "technical, patterned" read. So every scan is conditioned once on load:
   cropped square, high-passed to strip everything at the scale of the shot
   itself, normalised so a near-flat scan carries the same grain as a
   contrasty one, and closed into a tile that actually repeats. */
const SCAN_MEAN = 200 / 255;      // every conditioned scan is centred here
function conditionScan(img) {
  const S = 768;
  const a = document.createElement('canvas'); a.width = a.height = S;
  const ga = a.getContext('2d', { willReadFrequently: true });
  ga.drawImage(img, (img.naturalWidth - S) / 2, (img.naturalHeight - S) / 2, S, S, 0, 0, S, S);

  // the blur radius is the cut: wide enough to keep brush strokes and grain,
  // narrow enough to take the lighting of the shot with it
  const b = document.createElement('canvas'); b.width = b.height = S;
  const gb = b.getContext('2d', { willReadFrequently: true });
  gb.filter = `blur(${Math.round(S / 8)}px)`;
  gb.drawImage(a, 0, 0);

  const A = ga.getImageData(0, 0, S, S), B = gb.getImageData(0, 0, S, S);
  const da = A.data, db = B.data;
  let sum2 = 0, n = 0;
  for (let i = 0; i < da.length; i += 4) {
    const d = 0.299 * (da[i] - db[i]) + 0.587 * (da[i + 1] - db[i + 1]) + 0.114 * (da[i + 2] - db[i + 2]);
    sum2 += d * d; n++;
  }
  const gain = Math.min(9, 26 / Math.max(1, Math.sqrt(sum2 / n)));
  const base = SCAN_MEAN * 255;
  const hp = new Float32Array(da.length);
  for (let i = 0; i < da.length; i += 4) {
    for (let k = 0; k < 3; k++) {
      hp[i + k] = Math.max(0, Math.min(255, base + (da[i + k] - db[i + k]) * gain));
    }
  }

  /* Close the tile. Mirrored wrapping also hides the seam, but it hides it
     behind a kaleidoscope — an X across a small body, which reads as pattern
     just as loudly as the seam did. So blend in a half-shifted copy of the
     same scan near the borders: the shifted copy's edges are the original's
     continuous middle, and the join disappears. */
  const half = S / 2, band = S * 0.25;
  const feather = d => { const t = Math.min(1, d / band); return t * t * (3 - 2 * t); };
  for (let y = 0; y < S; y++) {
    const wy = feather(Math.min(y, S - 1 - y));
    for (let x = 0; x < S; x++) {
      const w = feather(Math.min(x, S - 1 - x)) * wy;
      const i = (y * S + x) * 4;
      const j = (((y + half) % S) * S + ((x + half) % S)) * 4;
      for (let k = 0; k < 3; k++) da[i + k] = hp[i + k] * w + hp[j + k] * (1 - w);
    }
  }
  ga.putImageData(A, 0, 0);
  return a;
}
// filled in once the renderer exists; every scan is created lazily, well after
let MAX_ANISO = 8;

/* Tuff: lava that cooled, drawn rather than photographed.

   The first pass at this was granite — angular crystals, because a rock of flat
   broken planes covered in round craters is two contradictory claims about how
   it was made. That reasoning was sound and the rock was wrong. Volcanic stone is
   not crystalline at all: it is foam that froze. The holes in it are gas bubbles
   caught while the melt went stiff, and bubbles are round because pressure is
   the same in every direction. So here the roundness is the evidence, and the
   angularity belongs only to the outline, where the block broke.

   Dark, and matte to the point of dusty. What separates volcanic rock from every
   other dark stone is that it barely reflects at all — the surface is broken at
   a scale finer than the eye resolves, so light goes in and does not come back.

   The vesicles are drawn dark on purpose. Their darkness becomes depth twice
   over: once through the shader bump, and once as real geometry, since the body
   is displaced along its normals by exactly this luminance. A painted hole and a
   hole are not the same thing, and on this material the difference is the whole
   material. */
function tuffCanvas(s) {
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const base = Math.round(SCAN_MEAN * 255);
  g.fillStyle = `rgb(${base},${base},${base})`;
  g.fillRect(0, 0, s, s);
  const wraps = [[0, 0], [s, 0], [0, s], [-s, 0], [0, -s], [s, s], [-s, -s], [s, -s], [-s, s]];
  const R = (n) => Math.random() * n;
  const grey = (v) => `rgb(${Math.max(0, Math.min(255, v | 0))},${Math.max(0, Math.min(255, v | 0))},${Math.max(0, Math.min(255, v | 0))})`;

  /* Vesicles, and the first pass at these was wrong in a way worth keeping a
     note about: sparse, evenly sized, and drawn with a soft radial falloff, they
     came out as CRATERS and the rock read as the moon. A crater is a hole made by
     something arriving. A vesicle is a bubble that was already there when the
     melt went stiff, and the melt was full of them — so they crowd, they overlap,
     they burst into each other, their sizes run over two orders of magnitude, and
     every edge is broken glass rather than a slope. Hard fills, no gradients, and
     enough of them to touch. */
  const vesicle = (x, y, r) => {
    const deep = base - 58 - R(34);
    const lip = base + 26 + R(26);
    for (const [ox, oy] of wraps) {
      // the proud lip on the side the melt drained from: a bright crescent, which
      // the bump reads as a raised rim
      g.globalAlpha = 0.55;
      g.fillStyle = grey(lip);
      g.beginPath(); g.arc(x + ox, y + oy, r * 1.14, 0, 6.2832); g.fill();
      // and the hollow, hard-edged and slightly off-centre inside its own lip
      g.globalAlpha = 0.92;
      g.fillStyle = grey(deep);
      g.beginPath(); g.arc(x + ox + r * 0.06, y + oy - r * 0.05, r, 0, 6.2832); g.fill();
    }
  };
  // sizes on a power law: a few large, a great many small
  for (let i = 0; i < 40; i++)   vesicle(R(s), R(s), 13 + R(20));
  for (let i = 0; i < 260; i++)  vesicle(R(s), R(s), 5 + R(9));
  for (let i = 0; i < 1300; i++) vesicle(R(s), R(s), 1.8 + R(3.6));
  for (let i = 0; i < 3600; i++) vesicle(R(s), R(s), 0.6 + R(1.3));

  // fractures: a rock this brittle is always cracked, and a crack is the one
  // mark on it that runs in a line
  g.globalAlpha = 0.5;
  for (let i = 0; i < 22; i++) {
    let x = R(s), y = R(s), a = R(6.2832);
    const pts = [[x, y]];
    for (let k = 0; k < 8 + R(10); k++) {
      a += (Math.random() - 0.5) * 0.9;
      x += Math.cos(a) * (6 + R(16)); y += Math.sin(a) * (6 + R(16));
      pts.push([x, y]);
    }
    for (const [ox, oy] of wraps) {
      g.strokeStyle = grey(base - 48 - R(26));
      g.lineWidth = 0.7 + R(1.8);
      g.beginPath();
      pts.forEach(([px, py], k) => k ? g.lineTo(px + ox, py + oy) : g.moveTo(px + ox, py + oy));
      g.stroke();
    }
  }

  // ash grit between the bubbles, coarse enough to still be there at body scale
  const grit = (x, y, r, v, a) => {
    g.globalAlpha = a;
    g.fillStyle = grey(v);
    const n = 3 + Math.floor(Math.random() * 3), rot = R(6.2832);
    for (const [ox, oy] of wraps) {
      g.beginPath();
      for (let k = 0; k < n; k++) {
        const a2 = rot + k / n * 6.2832, rr = r * (0.6 + Math.random() * 0.6);
        const px = x + ox + Math.cos(a2) * rr, py = y + oy + Math.sin(a2) * rr;
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.fill();
    }
  };
  for (let i = 0; i < 2600; i++) grit(R(s), R(s), 1.4 + R(3.4), base - 34 + R(74), 0.28);
  g.globalAlpha = 1;

  /* And the whole thing high-passed, which is the step that separates a material
     from a picture of one. Drawing thousands of overlapping marks leaves large
     soft fields of light and dark behind — one side of the tile ends up brighter
     than the other — and wrapped onto a body that field arrives as a painted
     shadow that does not move when the light does. The scans coming off the
     camera get exactly this treatment on load, for exactly this reason; this one
     was drawn here and still needs it. */
  highPass(c, base);
  return c;
}

/* Subtract the low frequencies: downscale hard, scale back up, and the
   difference is everything smaller than the blur. Twelve pixels across is chosen
   so a large vesicle survives and a gradient across the whole tile does not. */
function highPass(c, base) {
  const s = c.width;
  const small = document.createElement('canvas');
  small.width = small.height = 12;
  small.getContext('2d').drawImage(c, 0, 0, 12, 12);
  const up = document.createElement('canvas');
  up.width = up.height = s;
  const ug = up.getContext('2d');
  ug.imageSmoothingEnabled = true;
  ug.drawImage(small, 0, 0, s, s);
  const g = c.getContext('2d');
  const A = g.getImageData(0, 0, s, s), B = ug.getImageData(0, 0, s, s);
  for (let i = 0; i < A.data.length; i += 4) {
    for (let k = 0; k < 3; k++) {
      const v = A.data[i + k] - B.data[i + k] + base;
      A.data[i + k] = v < 0 ? 0 : v > 255 ? 255 : v;
    }
  }
  g.putImageData(A, 0, 0);
}

/* Sandblasting, which is not a shape but a surface.

   Sea glass with no map at all is geometrically perfect, and perfect is the one
   thing thirty years in surf does not leave behind. What frosting actually is: a
   field of micro-pits far too small to see one by one, each scattering the light
   its own way, so the glass stops giving a clean reflection and glows softly
   instead.

   Deliberately LOW contrast. This map drives roughness and a fine bump, not
   colour — all of it stays near the mean so the tint set on the material
   survives untouched, and only the way light leaves the surface changes. */
function frostCanvas(s) {
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const base = Math.round(SCAN_MEAN * 255);
  g.fillStyle = `rgb(${base},${base},${base})`;
  g.fillRect(0, 0, s, s);
  const wraps = [[0, 0], [s, 0], [0, s], [-s, 0], [0, -s], [s, s], [-s, -s], [s, -s], [-s, s]];
  const R = (n) => Math.random() * n;
  // grit marks: angular, because sand is angular, and that is what cuts glass
  const speck = (x, y, r, v, a) => {
    g.globalAlpha = a;
    g.fillStyle = `rgb(${v},${v},${v})`;
    const n = 3 + Math.floor(Math.random() * 3), rot = R(6.2832);
    for (const [ox, oy] of wraps) {
      g.beginPath();
      for (let k = 0; k < n; k++) {
        const a2 = rot + k / n * 6.2832, rr = r * (0.6 + Math.random() * 0.6);
        const px = x + ox + Math.cos(a2) * rr, py = y + oy + Math.sin(a2) * rr;
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.fill();
    }
  };
  for (let i = 0; i < 5200; i++) speck(R(s), R(s), 0.8 + R(2.2), base - 26 + R(52), 0.30);
  for (let i = 0; i < 1400; i++) speck(R(s), R(s), 2.0 + R(4.0), base - 16 + R(34), 0.16);
  /* And the knocks. A piece in the photograph is not evenly frosted — it has
     been hit: shallow dishes where something struck it, a chip or two with a
     brighter facet where the frosting broke away and clear glass shows through.
     Sparse on purpose. Frosting is the rule and these are the exceptions, and it
     is the exceptions that stop a surface reading as a setting. */
  for (let i = 0; i < 26; i++) {
    const x = R(s), y = R(s), rr = 14 + R(30);
    for (const [ox, oy] of wraps) {
      const grd = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, rr);
      grd.addColorStop(0, `rgba(${base - 34},${base - 34},${base - 34},0.55)`);
      grd.addColorStop(1, `rgba(${base},${base},${base},0)`);
      g.globalAlpha = 1; g.fillStyle = grd;
      g.beginPath(); g.arc(x + ox, y + oy, rr, 0, 6.2832); g.fill();
    }
  }
  for (let i = 0; i < 14; i++) speck(R(s), R(s), 5 + R(9), base + 30 + R(22), 0.5);   // chips, clear again
  g.globalAlpha = 1;
  return c;
}

const PROCEDURAL = { tuff: tuffCanvas, frost: frostCanvas };

function fileTex(name) {
  if (PROCEDURAL[name]) {
    const t = new THREE.CanvasTexture(PROCEDURAL[name](768));
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = MAX_ANISO;
    return t;
  }
  const t = new THREE.Texture();
  t.wrapS = t.wrapT = THREE.RepeatWrapping;   // the scan tiles for real now
  t.colorSpace = THREE.SRGBColorSpace;
  // the whole of what anisotropic filtering does is hold a texture together when
  // it is seen at a slant, and on a curved body most of the surface is at a
  // slant. It was pinned at 8; the hardware here allows more, and the docs are
  // explicit that the maximum is what to ask for
  t.anisotropy = MAX_ANISO;
  const img = new Image();
  img.onload = () => { t.image = conditionScan(img); t.needsUpdate = true; };
  // a shareable build bakes the scans in, since a published page cannot
  // reach any file of its own (see build_artifact.py)
  img.src = (window.TEX_DATA && window.TEX_DATA[name]) || `textures/${name}.jpg`;
  return t;
}

scene.add(back);

const cove = limboGround();
scene.add(cove);           // outside `world`, so the room does not turn with the pile

const QUAD_VERT = `

`;

  uniforms: aoUniforms, vertexShader: QUAD_VERT, toneMapped: false, depthTest: false, depthWrite: false,

    uniform float uNear, uFar, uRadius, uBias, uPower;

        vec3 S = P + (TBN * h) * (uRadius * mix(0.22, 1.0, fi));

   stops the pass from drawing a halo. A plain box blur mixes every neighbour
   equally, so along the silhouette the deep occlusion computed in the
   sculpture's own creases is smeared out over the backdrop behind it, and the
   backdrop picks up a dark fringe that the eye reads as a bright rim just

  cove.material = maskBlockMat;
  renderer.setRenderTarget(glassRT);
  // the clear colour is renderer-wide state, so it has to be put back or the
  // beauty pass clears to whatever this pass wanted
  const clearWas = renderer.getClearColor(new THREE.Color()), alphaWas = renderer.getClearAlpha();
  renderer.setClearColor(0x000000, 1);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setClearColor(clearWas, alphaWas);
  cove.material = coveWas;
  for (const [o, m] of dressed) o.material = m;

  renderer.setRenderTarget(null);
}

/* ---------- the coloured patch a transmissive body throws ----------

   A shadow map answers one question, "did light reach here", and its answer is
   a number. That is right for stone and wrong for everything the light goes
   THROUGH: what lands under a pink jelly is not a grey shadow with less of it,
   it is pink. The grey version was the single thing that most gave away that
   these were solids with a transparent shader on them rather than transparent
   things.

   So the glass gets a pass of its own. It is rendered from the lamp's point of
   view into a small target, each body flat in the colour the light would come
   out as — the attenuation colour, which is exactly "what this material does to
   light crossing it" — accumulating where bodies overlap, alpha carrying how
   much was in the way. The ground then projects that back and uses it twice:
   the alpha takes a little light out, because a body in the way does dim things,
   and the colour puts colour back in. Dimmer AND coloured, which is what a gel
   does.

   It is added as light rather than painted on, inside the lighting so it is
   tone-mapped with everything else — a patch composited after tone mapping
   reads as a decal lying on the floor, which is the same mistake in a different
   place. */
/* 1024, up from 512, and the reason is the multiply.

   The gel is projected from the LAMP, which sits at about 25 degrees — so its
   texels land on the floor at a grazing angle and stretch, badly, along the
   receding direction. One texel of a 512 map covers a great many screen pixels
   down there. The additive term never showed it, because adding a small number
   is smooth wherever it lands; a multiply scales what is already on the ground
   and the grid comes with it. Reported as blotches, squares and dots.

   Measured at 512, second difference across the floor: 0.05 on a tile of open
   backdrop against 9.7 to 11.8 on the tiles holding the shadow — two hundred
   times the structure, in the one place that is supposed to be a soft wash.

   Doubling the grid is the honest fix rather than blurring harder, which would
   only trade a visible grid for a shadow with no shape. The blur step doubles
   with it so the softness stays exactly where it was in world terms: the radius
   below is written per texel, and there are now twice as many of them. */
const GEL_RES = 1024;
let gelRT = null, gelBlurRT = null;
const gelCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 100);
const gelMatrix = new THREE.Matrix4();
const gelUniforms = {
  tGel: { value: null },
  uGelMatrix: { value: gelMatrix },
  /* How much colour it puts back, and how much light the body takes out.

     The tint used to be 8 and had to be, because it multiplied a raw colour that
     was ADDED to the ground — a number that had to be large enough to see and
     was therefore always one step from a light source. It was reported as one:
     neon cyan under the crystal, neon magenta under the jelly, and again on 10
     Aug as "cyan and pink and yellow" once a dark backdrop gave it nothing to
     hide behind. Now it scales the share of the BLOCKED light that comes back
     coloured, so the scale means something: 1 returns exactly what the body
     took, wearing the colour that came through it, and cannot exceed the
     unshadowed ground at any value up to 1. Above 1 it starts adding light
     again — which is the old fault, on a dial where it can at least be seen
     coming. */
  /* 2.0, retuned 10 Aug for this build. 2.5 came over with the formula from
     version 11 and reads heavier here — see the shade note below for why the
     pair had to move together. */
  uGelTint: { value: 2.0 },
  /* And the shade is not a small number, because what it multiplies is not a
     large one: the patch is blurred across a wide radius, so the alpha arriving
     at any given spot is a few hundredths. At 0.30 the tint won outright and
     every transmissive body came out BRIGHTER than the bare ground — measured,
     bubble -0.059, crystal -0.043, seaglass -0.011, against an opaque tuff at
     +0.035. A glow with no shadow under it, which is what "the transparent
     shapes cast nothing" was. At 8 and 5 a crystal darkens the ground 0.017,
     about half what the stone does, and the patch keeps its colour. */
  /* 4.0, DOWN FROM 5.0, and this is the number the multiply actually needed.
     block is clamp(cover * shade), so at 5 it reaches 1 as soon as coverage
     passes a fifth — and the blurred gel spends most of its area above that.
     The whole patch therefore sat on the flat top of the clamp: uniformly
     black, edged hard, and showing the gel target's own texel grid because a
     clipped signal has no gradient left to hide it. Reported as "dark grey with
     a cyan halo, too dark and murky" and "dotty, not smooth", which is three
     descriptions of one clipped buffer.

     The additive version never showed it: adding a small number is gentle
     wherever it lands, so the clamp was never reached. Swapping to a multiply
     is what made the dial's old value wrong, not the multiply itself.

     At 4 the ramp stays inside the blur and the patch comes back as a gradient
     — a shadow stained by the body above it. Swept by eye: 2.0 loses the shadow
     altogether, 3.2 is faint, 5.0 is the fault above. */
  /* 3.4. 4.0 fixed the clipping but still read heavy once the grid stopped
     hiding it — "still a bit too dark". Below about 3 the shadow stops being a
     shadow: 2.0 loses it entirely and 3.2 is faint. */
  /* 3.0, and the honest reason is Hadar's eye, not a measurement.

     It went 5.0 -> 4.0 to stop the clamp clipping, then 4.0 -> 3.4 on "still a
     bit too dark", then 3.4 -> 3.0 chasing a red row — and that last step was
     me tuning against noise. `and a lighter one than stone` compares the glass
     shadow's depth to an opaque one, and run three times at identical settings
     it returned 0.534, 0.514 and 0.496: a spread of 0.04 against the 0.004
     margin being argued about, failing once and passing twice. The dial never
     moved it. 3.0 stays because it is lighter and she asked for lighter.

     THE ROW ITSELF IS THE THING TO FIX, not the dial. It is luck-dependent in
     the same way the moss row was before it was made deterministic — see the
     brief's warning about single runs. Until then, treat one red result from it
     as no information. */
  uGelShade: { value: 3.0 }
};

function gelTargets() {
  if (gelRT) return;
  const opt = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, type: THREE.HalfFloatType };
  gelRT = new THREE.WebGLRenderTarget(GEL_RES, GEL_RES, opt);
  gelBlurRT = new THREE.WebGLRenderTarget(GEL_RES, GEL_RES, opt);
  gelUniforms.tGel.value = gelBlurRT.texture;
}

/* Wide and cheap. A caustic has no edge worth keeping — the whole point is that
   it is soft — so this is a big-radius blur at low resolution rather than an
   accurate one, taken in two separable passes. */
const gelBlurUniforms = { tSrc: { value: null }, uDir: { value: new THREE.Vector2() } };
const gelBlurMat = new THREE.ShaderMaterial({
  uniforms: gelBlurUniforms, vertexShader: QUAD_VERT, toneMapped: false,
  depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D tSrc;
    uniform vec2 uDir;
    varying vec2 vUv;
    void main() {
      vec4 s = vec4(0.0);
      float w = 0.0;
      for (int i = -8; i <= 8; i++) {
        float f = float(i);
        float k = exp(-f * f / 32.0);
        s += texture2D(tSrc, vUv + uDir * f) * k;
        w += k;
      }
      gl_FragColor = s / w;
    }
  `
});

/* The colour light comes out as, not the colour the body looks. For a
   transmissive material those are different things and the second one is the
   surface — using it put a pink patch under a bubble whose tint is white. */
function gelColour(b) {
  const out = new THREE.Color(0xffffff);
  let found = false;
  b.mesh.traverse(o => {
    if (found || !o.isMesh || !o.material || !o.material.transmission) return;
    const m = o.material;
    out.copy(m.attenuationColor && m.attenuationDistance < 1e4 ? m.attenuationColor : m.color);
    found = true;
  });
  return out;
}

function renderGel() {
  gelTargets();
  // the lamp's own view, framed exactly like its shadow camera so the two agree
  const sc = key.shadow.camera;
  gelCam.left = sc.left; gelCam.right = sc.right;
  gelCam.top = sc.top; gelCam.bottom = sc.bottom;
  gelCam.near = sc.near; gelCam.far = sc.far;
  gelCam.position.copy(key.position);
  gelCam.lookAt(0, 0, 0);
  gelCam.updateMatrixWorld(true);
  gelCam.updateProjectionMatrix();
  gelMatrix.multiplyMatrices(gelCam.projectionMatrix, gelCam.matrixWorldInverse);

  const swapped = [], hidden = [];
  for (const b of bodies) {
    if (b.glass) {
      if (!b.gelMat) {
        /* How much light this body's gel takes out of the ground. It was a
           flat 0.55 for every glass body, and sixteen clear bubbles then
           stacked sixteen dimmings into one grey pool behind the cluster —
           which the front bodies showed through themselves, and which read as
           "the front bubbles are darker". A body that actually absorbs light
           (a finite attenuation distance: jelly, seaglass, crystal, gem,
           iris) keeps its patch; a clear film takes almost nothing, which is
           what a film does. */
        let gelDim = 0.08;
        b.mesh.traverse(o => {
          if (o.isMesh && o.material && o.material.transmission &&
              o.material.attenuationDistance && isFinite(o.material.attenuationDistance)) gelDim = 0.55;
        });
        b.gelMat = new THREE.MeshBasicMaterial({
          color: gelColour(b), toneMapped: false,
          transparent: true, opacity: gelDim, depthWrite: false,
          blending: THREE.CustomBlending,
          // colour adds so overlapping bodies stack, alpha accumulates the same
          // way — one pass gives both the tint and how much was in the way
          blendEquation: THREE.AddEquation,
          blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneFactor,
          blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor
        });
      }
      b.mesh.traverse(o => {
        if (o.isMesh) { swapped.push([o, o.material]); o.material = b.gelMat; }
      });
    } else if (b.mesh.visible) {
      // opaque bodies are not in this pass at all: they already have a shadow,
      // and letting them write here would put a black hole in the middle of it
      b.mesh.visible = false; hidden.push(b.mesh);
    }
  }

  const groundWas = cove.visible;
  cove.visible = false;
  const bgWas = scene.background;
  scene.background = null;
  const clearWas = renderer.getClearColor(new THREE.Color()), alphaWas = renderer.getClearAlpha();
  renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(gelRT);
  renderer.clear();
  if (swapped.length) renderer.render(scene, gelCam);

  /* TWO ROUNDS AT A TAP SPACING THAT DOES NOT SKIP TEXELS.

     The kernel is seventeen taps, and its reach was being bought by spreading
     them: 2.2 texels apart at 512, and 4.4 when the map was doubled to keep the
     same softness in world terms. Taps 4.4 texels apart do not blur a signal,
     they SAMPLE it — every fifth texel, with the four between them ignored —
     and since the pass is separable, the aliasing that comes back is a grid.
     Squares. Worst under the crystal, which has the most structure in its alpha
     to alias in the first place.

     So the spacing goes back to where a tap still overlaps its neighbour, and
     the width is bought by running the separable pair TWICE instead. Two
     gaussians compose into one of sigma * sqrt(2), which lands close to the
     original softness with nothing skipped. Four quad passes over a 1024 map,
     which is not where this frame's time goes. */
  quadMesh.material = gelBlurMat;
  for (let pass = 0; pass < 2; pass++) {
    gelBlurUniforms.tSrc.value = gelRT.texture;
    gelBlurUniforms.uDir.value.set(2.2 / GEL_RES, 0);
    renderer.setRenderTarget(gelBlurRT);
    renderer.clear();
    renderer.render(quadScene, quadCam);
    gelBlurUniforms.tSrc.value = gelBlurRT.texture;
    gelBlurUniforms.uDir.value.set(0, 2.2 / GEL_RES);
    renderer.setRenderTarget(gelRT);
    renderer.clear();
    renderer.render(quadScene, quadCam);
  }
  gelUniforms.tGel.value = gelRT.texture;

  renderer.setClearColor(clearWas, alphaWas);
  renderer.setRenderTarget(null);
  scene.background = bgWas;
  cove.visible = groundWas;
  for (const [o, m] of swapped) o.material = m;
  for (const m of hidden) m.visible = true;
}

/* ---------- how much of itself the glass is ----------

   "Why can't the twentieth piece of glass look like the first?" Because as
   written it cannot: three's transmission replaces the body's own colour with a
   sample of whatever is behind it, so the first bubble is the colour of an empty
   bright room and the twentieth is the colour of nineteen dark bodies. Measured,
   a bubble alone reads 227 and the same bubble over a pile of 28 reads 93. That
   is not a fault to tune out — it is what a window does — and no amount of
   attenuation or ior moves it, both of which were tried and measured.

   The way out is to stop the glass being purely a window. Real glass of any
   thickness scatters a little light inside itself, and a soap film has its own
   colour that does not come from the wall behind it; both mean some fixed share
   of what you see belongs to the material rather than to the backdrop. That
   share is what makes a row of glass objects read as the same material.

   So: a floor. `uGlassBody` mixes the transmitted colour toward the body's own
   tint, and the higher it is the less the backdrop decides what the glass looks
   like. At 0 the glass is a pure window, which is what version 9 shipped.

   Set to 0.035 by Hadar, off the bench, and it is deliberately a whisper: it
   takes about an eighth off the gap between a bubble standing alone and one
   over twenty bodies, and leaves seeing through it untouched. The larger values
   that close the gap properly cost transparency one for one, and that trade was
   looked at and declined. */
/* ---------- the glass layer: what the glass actually samples ----------

   three's transmission is a second pass that renders the OPAQUE scene into a
   private target, and every transmissive material samples that target instead
   of carrying a colour of its own. Both reported faults fall straight out of
   that: glass is not in the target, so glass cannot see glass (jelly behind a
   bubble measured 0.03 of itself, seaglass 0.00 — not dimmed, absent); and the
   sample arrives at the pile's own exposure, so the twentieth bubble wears the
   accumulated darkness of everything behind it (227 alone against 93 over 28).

   r160 does try to help — it re-renders the back faces of DOUBLE-SIDED
   transmissive materials into that target — and on this renderer that
   contribution measures exactly zero (flipping a body between FrontSide,
   DoubleSide and BackSide moved the through-reading by 0.001). Rather than
   lean harder on a private mechanism that provably does not deliver here, the
   glass now samples a target THIS file owns:

   the layer pass renders the whole scene once more with every glass body
   swapped to a translucent tinted shell — the same swap-in-place technique the
   gel pass uses, so nothing joins the scene graph and nothing leaks into the
   GLB. Painter-sorted alpha blending does the seeing-through: a shell is
   blended over whatever already stands behind it, so the target ends up
   holding the opaque scene WITH every glass body present as a tinted window.
   Glass sampling that target sees its neighbours; a body's own shell at its
   own pixels only tints the view with the body's own colour, which is a
   whisper of self and not a wall. The bubble's shell is nearly clear — a film
   seen from behind is nearly nothing, and a milky shell would print itself on
   everything the bubble shows.

   The internal transmission pass still runs (the materials keep their real
   transmission so nothing else about them changes); its target is simply no
   longer sampled. That costs one redundant opaque render per frame, measured
   under "fps" before freezing — the alternative was to fake the material into
   the opaque list and re-plumb five uniforms by hand, and that trade was
   declined for surface area. */
let glassLayerRT = null;
const glassLayerUniforms = {
  uGlassLayersMap: { value: null },
  uGlassLayersSize: { value: new THREE.Vector2(1, 1) }
};
function makeGlassLayerTarget() {
  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  if (glassLayerRT && glassLayerRT.width === s.x && glassLayerRT.height === s.y) return;
  if (glassLayerRT) glassLayerRT.dispose();
  glassLayerRT = new THREE.WebGLRenderTarget(s.x, s.y, {
    generateMipmaps: true,
    minFilter: THREE.LinearMipmapLinearFilter,
    magFilter: THREE.LinearFilter,
    // no MSAA: the layer is only ever read through mip levels and refraction
    // blur, so edge smoothing buys nothing here — and a plain target stays
    // readable by devGlassLayer without a resolve step in the way
    type: renderer.capabilities.isWebGL2 ? THREE.HalfFloatType : THREE.UnsignedByteType
  });
  glassLayerUniforms.uGlassLayersMap.value = glassLayerRT.texture;
  glassLayerUniforms.uGlassLayersSize.value.set(s.x, s.y);
}
/* The shell a glass body wears inside the layer target. Colour, in order of
   who actually knows it: the colour painted on the body (a palette profile
   keeps its material white and wears its hue in the vertices — read the
   material and the shell says nothing), else the attenuation colour when it
   is a real colour, else the body's own tint. Milk: a volume reads through
   glass as a BODY, so its shell is most of the way to solid; a film reads as
   nearly nothing, and a milky shell would print itself onto everything the
   bubble shows — measured, 0.06 of shell costs about a tenth of the moss
   show-through and 0.6 would have cost most of it. */
const GLASS_SHELL = { milk: 0.9 };
function glassShell(b) {
  let colour = new THREE.Color(0xffffff), milk = 0.06, found = false;
  b.mesh.traverse(o => {
    if (found || !o.isMesh || !o.material || !o.material.transmission) return;
    const m = o.material;
    const att = m.attenuationColor;
    const attSat = att ? Math.max(att.r, att.g, att.b) - Math.min(att.r, att.g, att.b) : 0;
    if (m.userData.shellColour) colour.copy(m.userData.shellColour);
    else colour.copy(att && attSat > 0.04 ? att : m.color);
    if (m.name !== 'bubble') {
      milk = GLASS_SHELL.milk;
      /* Pushed a quarter more saturated than the body's mid tone, because the
         shell is fighting two dilutions on its way to the eye: the front
         glass's own film and specular add white on top, and the tone mapper's
         shoulder flattens whatever arrives bright. Measured on the seaglass:
         at the body's own saturation the through-reading was 0.13 of the
         direct one; the target for a body to still read as ITSELF is 0.5. */
      const hsl = { h: 0, s: 0, l: 0 };
      colour.getHSL(hsl);
      colour.setHSL(hsl.h, Math.min(1, hsl.s * 1.25), hsl.l);
    }
    found = true;
  });
  return { colour, milk };
}
/* tuneGlassShell({milk: 0.75}) — how much of a volume-glass body's shell is
   body rather than window inside the glass layer. Takes effect on the NEXT
   body drawn and, for bodies already standing, immediately. */
window.tuneGlassShell = v => {
  if (v.milk !== undefined) {
    GLASS_SHELL.milk = v.milk;
    for (const b of bodies) {
      if (b.shellMat && b.shellMat.opacity > 0.2) b.shellMat.opacity = v.milk;
    }
  }
  return { ...GLASS_SHELL };
};
function renderGlassLayers() {
  makeGlassLayerTarget();
  const swapped = [];
  for (const b of bodies) {
    if (!b.glass || !b.mesh.visible) continue;
    if (!b.shellMat) {
      const s = glassShell(b);
      /* Unlit on purpose. A lit shell takes the room's light on top of its
         colour and arrives in the layer as a bright pastel — measured, an
         aqua body's shell sampled [0.61, 0.94, 0.91] where the body itself
         reads [0.09, 0.28, 0.29] on screen, and the tone mapper's shoulder
         then crushed what little chroma survived. Flat colour lands the
         shell where the body actually sits. */
      b.shellMat = new THREE.MeshBasicMaterial({
        color: s.colour,
        transparent: true, opacity: s.milk, depthWrite: false
      });
    }
    b.mesh.traverse(o => {
      if (o.isMesh) { swapped.push([o, o.material]); o.material = b.shellMat; }
    });
  }
  // tone mapping off, exactly as the internal pass does it: this target is
  // sampled inside the lighting, and mapping it twice bends every colour
  const tmWas = renderer.toneMapping;
  renderer.toneMapping = THREE.NoToneMapping;
  const clearWas = renderer.getClearColor(new THREE.Color()), alphaWas = renderer.getClearAlpha();
  renderer.setRenderTarget(glassLayerRT);
  renderer.setClearColor(0xffffff, 0.5);   // the internal pass's own idea of "nothing"
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.setClearColor(clearWas, alphaWas);
  renderer.toneMapping = tmWas;
  for (const [o, m] of swapped) o.material = m;
}

const GLASS_BODY = { amount: 0.035, lift: 0.85 };
/* ---------- every pane at the same exposure ----------

   The other half of the same report, and it is not the same lever. `uGlassBody`
   mixes the window toward the material's own tint, and closing the gap with it
   costs seeing-through one for one — measured, declined, and fenced off in the
   brief. What actually darkens the twentieth bubble is not that it shows the
   pile; it is that it shows the pile AT THE PILE'S OWN EXPOSURE, so the
   accumulated darkness of everything behind is printed onto the front of the
   glass.

   So the transmitted light is re-exposed instead of repainted. The OPAQUE
   scene's local mean behind the pane (a deep mip of three's own opaque-only
   transmission target, which conveniently still renders) is brought toward
   that map's overall mean, and the transmitted sample is scaled by the ratio
   — luminance only, chroma and detail ride along untouched. Judged against
   the opaque map and not against the glass layer, deliberately: a dark stone
   pile is darkness the glass should not wear, but a dark glass neighbour is
   a body at its own exposure, and lifting it burns its colour into the tone
   mapper's shoulder (measured: the seaglass through-reading fell by a third). A bubble alone reads the room against the room and
   moves nothing; a bubble over twenty dark bodies is lifted back to the room's
   level and still shows every one of them, displaced and tinted, at their own
   contrast. Nothing is mixed toward a constant, so this is not the trade the
   brief forbids: what stands behind stays visible, it just stops deciding how
   bright the glass is.

   `strength` is the whole dial: 0 is version 9's pure window, 1 pins every
   pane to the scene's exposure. `detail` is how local "local" is, in octaves
   below the whole screen — 0 judges by the entire scene and does nothing (the
   scene against itself), and each step judges by a neighbourhood half the
   size. Measured on the bench: at 2 the neighbourhood is still mostly
   backdrop and the dial barely moves; 4 to 5 is where the neighbourhood is
   the size of what a bubble actually covers and the gap actually closes.
   Both live on the bench in tune.html. */
/* 1.0 by an explicit decision, 7 August 2026: every pane at the same
   exposure comes FIRST, and the version-9 guardrail on this axis was waived
   in so many words — "the problem was never solved there". The trade is
   real and measured, not painted over: at 1.0 the eight-body pile gap closes
   to 16 points and a dark body behind a bubble keeps 0.421 of its colour
   (at 0 it keeps 0.733 and the gap is 73). The bench slider spans the whole
   axis for anyone who wants to look at the other end; the light checks below
   still catch outright vanishing. */
const GLASS_EQ = { strength: 1.0, detail: 4.0, damp: 0.12 };
const glassBodyUniforms = {
  uGlassBody: { value: GLASS_BODY.amount },
  uGlassLift: { value: GLASS_BODY.lift },
  uGlassEq: { value: GLASS_EQ.strength },
  uGlassEqDetail: { value: GLASS_EQ.detail }
};
function glassOwnColour(mat) {
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = shader => {
    if (prev) prev(shader);
    Object.assign(shader.uniforms, glassBodyUniforms, glassLayerUniforms, glassEqMapUniforms);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uGlassBody, uGlassLift, uGlassEq, uGlassEqDetail;
        /* The equaliser's own picture of the room, rendered opaque-only in
           renderExposure and damped against the frame before it. It used to
           re-adopt three's live transmission target by re-declaring the
           originals here — same content, but arriving at whatever speed the
           scene happened to move, which is where the brightness wobble came
           from. The decision it encodes is unchanged: judge exposure against
           what is OPAQUE behind a pane, because a dark stone pile is darkness
           the glass should not wear, while a dark glass neighbour is a body at
           its own exposure and lifting it burns its colour into the tone
           mapper's shoulder. */
        uniform sampler2D uExposureMap;
        /* Two sizes, and they are not the same one. uExposureSize is the map's
           own resolution, which is what the mip arithmetic is in; the viewport
           is what gl_FragCoord is in, and is what turns a fragment into a uv.
           They used to be a single uniform only because the old map happened to
           be the size of the drawing buffer. */
        uniform vec2 uExposureSize;
        uniform vec2 uExposureViewport;`)
      /* The whole of "glass sees glass", in one substitution: the resolved
         pars chunk is inlined with its sampler renamed, so every helper it
         defines — getTransmissionSample, getIBLVolumeRefraction — reads the
         layer target this file renders instead of the private opaque-only one.
         Refraction, roughness blur, attenuation: all untouched, pointed at a
         picture that has the glass in it. */
      .replace('#include <transmission_pars_fragment>',
        THREE.ShaderChunk.transmission_pars_fragment
          .split('transmissionSamplerMap').join('uGlassLayersMap')
          .split('transmissionSamplerSize').join('uGlassLayersSize'))
      /* After transmission_fragment, which is where three overwrites
         totalDiffuse with the sample from behind. It is inside main and runs
         after the lighting, so everything needed is already in scope —
         including `transmitted`, the sample itself, which is what makes the
         re-exposure possible without unpicking the mix that follows it:

             this fragment is its uv directly — and the detail dial keeps its

/* tuneGlassBody({amount: 0.35}) — 0 is a pure window and what version 9 shipped;

   on everything on screen. */
window.tuneGlassBody = v => {
  if (v.amount !== undefined) glassBodyUniforms.uGlassBody.value = GLASS_BODY.amount = v.amount;
  if (v.lift !== undefined) glassBodyUniforms.uGlassLift.value = GLASS_BODY.lift = v.lift;

};
/* tuneGlassEq({strength: 0.85, detail: 2, damp: 0.12}) — strength 0 is version
   9's pure window, 1 holds every pane at the scene's exposure; detail is how
   small a neighbourhood the pane is judged against, in octaves below the whole
   screen; damp is how much of each frame's reading is new, so 1 is undamped and
   is the behaviour that flickered. Takes effect immediately on everything on
   screen. */
window.tuneGlassEq = v => {
  if (v.strength !== undefined) glassBodyUniforms.uGlassEq.value = GLASS_EQ.strength = v.strength;
  if (v.detail !== undefined) glassBodyUniforms.uGlassEqDetail.value = GLASS_EQ.detail = v.detail;
  if (v.damp !== undefined) expUniforms.uK.value = GLASS_EQ.damp = v.damp;
  return { ...GLASS_EQ };
};

/* ---------- the film belongs on the rim ----------

   A bubble kept arriving as a white shell whenever anything opaque stood behind
   it, and the level was not the answer at either end: measured, show-through
   goes 0.46, 0.54, 0.61, 0.82 as the iridescence comes down 0.45, 0.30, 0.18, 0.
   Turn it up and the bubble is a shell; turn it down and it is a plain window
   with nothing of a bubble about it. Both of those were reported, in that order.

   The mistake is that three applies iridescence evenly over the whole surface,
   and a soap film does not work that way. Its colour comes from interference in
   a film whose PATH LENGTH grows as the view slants across it, so the spectrum
   lives on the silhouette and the part facing you is very nearly clear — which
   is exactly why you can read a newspaper through the middle of a real bubble
   and see an oil slick around its edge.

   So the film is weighted by the grazing angle instead of being dialled. The
   centre goes clear, which is where you look through it, and the rim keeps the
   whole spectrum, which is where a bubble announces itself. It stops being a
   trade between two faults and becomes the thing it was imitating. */

const filmUniforms = { uFilmPower: { value: FILM.power }, uFilmFloor: { value: FILM.floor } };

  const prev = mat.onBeforeCompile;

    if (prev) prev(shader);
    Object.assign(shader.uniforms, filmUniforms);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uFilmPower, uFilmFloor;`)
      /* After lights_physical_fragment, which is where material.iridescence is
         actually assigned and which sits inside main() below the normals.
         `iridescence_fragment` was the obvious-looking anchor and is the wrong
         one: it is the thin-film FUNCTIONS, at file scope, so the block landed
         outside main and the shader failed to compile. three logs that and
         carries on, so the bubble simply stopped being drawn — and the
         see-through measurement happily reported a perfect 1.000 for a body
         that was not there. Measure the thing, then check the thing exists. */
      .replace('#include <lights_physical_fragment>', `#include <lights_physical_fragment>
        #ifdef USE_IRIDESCENCE
        {
          // both view space, so the grazing term costs one dot product
          float g = 1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
          material.iridescence *= mix(uFilmFloor, 1.0, pow(g, uFilmPower));

// tuneRimFilm({power: 3, floor: 0.05}) — how fast the film gives way to clear
window.tuneRimFilm = v => {
  if (v.power !== undefined) filmUniforms.uFilmPower.value = v.power;
  if (v.floor !== undefined) filmUniforms.uFilmFloor.value = v.floor;
  return { power: filmUniforms.uFilmPower.value, floor: filmUniforms.uFilmFloor.value };
};

/* ---------- the wire of light round a mirror ----------

   Chrome keeps disappearing into the backdrop, and the reason is in what a
   mirror is. It has no colour of its own to separate it from anything: what it
   shows at its edge is whatever lies behind IT, and behind it is the same pale
   room the backdrop is made of. The black flags in the mirror room already fight
   this, and they cannot finish the job, because they darken the rim — and a dark
   rim against a pale ground is a silhouette, not an edge.

   A bubble never has the problem, and not because it is brighter: it has a
   grazing-angle highlight. Reflectance climbs toward one at glancing incidence
   for every material, so a thin band of light rides the silhouette wherever the
   surface turns away — the wire that says "there is a form here" before the eye
   has read anything else. Metal has the same Fresnel climb and it is being
   swamped by the reflection sitting on top of it.

   So it is put back explicitly, and narrow: a high power on the grazing term
   makes a wire rather than a wash. Weighted toward the key, because a rim that
   runs the whole way round is a cartoon outline — it belongs where the light
   actually is, which is what makes it read as light rather than as a stroke. */
/* Set on screen against a lone chrome body on the bare backdrop, which is the
   case that fails. At power 7 the wire was wide enough to read as a white
   outline drawn round the shape; at 12 it is a highlight the form is producing,
   and the silhouette still separates. */
const RIM = { strength: 0.85, power: 12.0, dir: new THREE.Vector3() };
const rimUniforms = {
  uRimStrength: { value: RIM.strength },
  uRimPower: { value: RIM.power },
  uRimDir: { value: RIM.dir },
  uRimColor: { value: new THREE.Color(0xfff6e8) }
};
function rimLight(mat) {
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = shader => {
    if (prev) prev(shader);
    Object.assign(shader.uniforms, rimUniforms);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uRimStrength, uRimPower;
        uniform vec3 uRimDir, uRimColor;`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          // normal and vViewPosition are both view space here, so the grazing
          // term needs no extra matrices
          vec3 V = normalize(vViewPosition);
          float graze = 1.0 - clamp(dot(normalize(normal), V), 0.0, 1.0);
          float wire = pow(graze, uRimPower);
          // and only where the lamp is: a rim all the way round is an outline
          float side = smoothstep(-0.45, 0.85, dot(normalize(normal), uRimDir));
          reflectedLight.indirectSpecular += uRimColor * wire * side * uRimStrength;
        }`);
  };
  mat.needsUpdate = true;

// tuneRim({strength: 0.8, power: 5}) — a wire this thin is only judgeable on screen
window.tuneRim = v => {
  if (v.strength !== undefined) rimUniforms.uRimStrength.value = v.strength;
  if (v.power !== undefined) rimUniforms.uRimPower.value = v.power;
  return { strength: rimUniforms.uRimStrength.value, power: rimUniforms.uRimPower.value };
};

/* Patched into the ground's own shader rather than laid over it, so the patch
   is light the surface received: it darkens under the shadow, it is tone-mapped
   with the rest, and it cannot be seen sliding across the floor when the pile
   turns. */
function gelReceiver(mat) {
  mat.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, gelUniforms);
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vGelWorld;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvGelWorld = (modelMatrix * vec4(position, 1.0)).xyz;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vGelWorld;
        uniform sampler2D tGel;
        uniform mat4 uGelMatrix;
        uniform float uGelTint, uGelShade;`)
      // after the lights are gathered and before anything is done with them
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          vec4 gp = uGelMatrix * vec4(vGelWorld, 1.0);
          vec2 guv = gp.xy / gp.w * 0.5 + 0.5;
          if (guv.x > 0.0 && guv.x < 1.0 && guv.y > 0.0 && guv.y < 1.0) {
            vec4 g = texture2D(tGel, guv);
            /* Alpha is how much body stood in the way, rgb is what came
               through. The dimming has to reach the DIRECT term as well: the
               cove is lit mostly by the key lamp, and taking it only out of the
               indirect one meant the shade could be wound all the way up and
               still never make a shadow. Measured, glass came out BRIGHTER than
               bare ground at every setting — a glow with no shadow under it,
               which is what "transparent things cast nothing" looked like. */
            /* THE COLOUR MULTIPLIES, IT DOES NOT ADD.

               Written in version 11, left out of 12 by a decision on 9 Aug to
               keep 12's shadow, and taken up again on 10 Aug when the fault it
               was written for was described from scratch: "the shadow comes out
               really colourful, cyan and pink and yellow — it should work as a
               multiply, not brighten the background." That is this line, and
               that is the diagnosis.

               It was indirectDiffuse += g.rgb * uGelTint with the tint at 8: a
               light source added to the floor, unbounded, with no relation to
               how much light the floor had to begin with. A saturated body
               pushed one channel far past 1.0 while the others stayed low, and
               the tone mapper returned that as a glowing patch. It also explains
               why it read as a glow and not as a shadow: it WAS a lamp pointed
               at the ground — which is why it showed up worst the moment the
               backdrop went dark, since there the added light has nothing to
               compete with.

               Adding was then tried bounded by the light the body removed, which
               is defensible and measured invisible: chroma 4.6 in the shadow
               against 6.9 on bare floor, greyer than the floor it sat on. Both
               failures are the same mistake. A stained shadow is not light
               arriving — it is light that got through and was coloured on the
               way — so the only honest operator is one that can take away and
               cannot give. Multiplying scales the whole light the ground was
               already receiving, so it is visible at honest strength, and NO
               value of either dial can make the ground emit.

               The colour is taken as a HUE and not as a level, because the gel
               is blurred across a wide radius and the alpha arriving anywhere is
               a few hundredths — every attempt to read a level out of it lands
               on noise. Normalising by the strongest channel asks the only
               question that matters: which way does this glass push the colour.

               AND IT MUST BE GATED BY COVERAGE, which cost a whole square to
               learn. A hue carries no strength, so normalising the near-zero
               noise that sits outside the bodies produces a full-strength hue
               out of nothing — and the tint then applied across the ENTIRE gel
               square, which is framed like the lamp's shadow camera. The floor
               went pale blue up to a hard horizontal line with the bodies
               nowhere near it. The old additive term was accidentally immune to
               this (adding roughly zero does nothing); a multiply is not, so
               presence has to be stated, and block is that statement. */
            float peak = max(g.r, max(g.g, g.b));
            vec3 through = peak > 1e-4 ? g.rgb / peak : vec3(1.0);
            float cover = clamp(g.a, 0.0, 1.0);
            float block = clamp(cover * uGelShade, 0.0, 1.0);
            /* And the colouring is made ENERGY-NEUTRAL before it is applied.
               Every channel of a normalised hue is at or below 1, so tinting
               with it also removes light — and the glass shadow came out DEEPER
               than the stone's, 0.542 against 0.532, which fails "and a lighter
               one than stone" and is wrong on its face: colour is not opacity.
               Dividing the tint by its own mean shifts the balance between
               channels and leaves the total where the shade dial put it, so
               depth stays the business of block alone. The product still cannot
               exceed 1: the tint only departs from white in proportion to
               block, which is also what dims it. */
            float tintAmt = clamp(uGelTint * block, 0.0, 1.0);
            vec3 tint = mix(vec3(1.0), through, tintAmt);
            tint /= max((tint.r + tint.g + tint.b) / 3.0, 1e-4);

            reflectedLight.indirectDiffuse *= keep;

/* tuneFilm(0.5) — the thin-film strength on every live body. It is on a dial
   because its failure mode is not "too shiny": past about a third it blows out
   over a dark body and reads as a hole torn in whatever is behind it. */
window.tuneFilm = v => {
  let n = 0;
  eachBodyMat(m => { if (m.iridescence !== undefined && m.iridescence > 0) { m.iridescence = v; m.needsUpdate = true; n++; } });

};

// tuneGel({tint: 1.6, shade: 0.4}) — judged against the thing itself, like the rest
window.tuneGel = v => {
  if (v.tint !== undefined) gelUniforms.uGelTint.value = v.tint;
  if (v.shade !== undefined) gelUniforms.uGelShade.value = v.shade;

function compositeAO() {
  quadMesh.material = blurMat;
  const auto = renderer.autoClear;

}

/* How far back the pile actually reaches, which is what decides how close the
   ground is allowed to come before a body starts poking through it. */
window.pileDepth = () => {
  let lo = Infinity, hi = -Infinity;
  for (const b of bodies) {
    lo = Math.min(lo, b.mesh.position.z - b.radius);
    hi = Math.max(hi, b.mesh.position.z + b.radius);

  return { back: Math.round(lo + world.position.z), front: Math.round(hi + world.position.z),

/* Where every body actually sits on screen, in the same CSS pixels the hand
   drew in. `drawnAt` is recorded at birth, before the frame clamp touches it,
   so the two columns can be read against each other: a gap means the clamp
   moved the shape, and a gap that grows frame to frame means something is
   dragging it after the fact, which is a different bug entirely. */
/* TEMPORARY — devGlassLayer(x, y) reads what the glass-layer target actually

   glass, this says whether it is missing from the layer (the pass is wrong)
   or present and unsampled (the shader is wrong). */
window.devGlassLayer = (x, y, half = 6) => {
  if (!glassLayerRT) return 'no layer target yet';
  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  const px = Math.round(x * s.x / innerWidth), py = Math.round((innerHeight - y) * s.y / innerHeight);

    Math.max(0, px - half), Math.max(0, py - half), w, w, buf);

/* TEMPORARY — devBox(i) is the screen box of body i (the last body when no
   index is given), in CSS pixels, taken from the body's own projected vertices.
   It exists because of a measurement that lied twice: a sample box parked where
   a body was DRAWN keeps measuring that spot after placeInFrame and the pivot
   have moved the composition, and what it reads there is the backdrop. The
   brief's "a tool that does not frame what it measured" — this is the frame. */
window.devBox = i => {
  const b = bodies[i === undefined ? bodies.length - 1 : i];
  if (!b) return null;
  const v = new THREE.Vector3();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  b.mesh.updateWorldMatrix(true, true);
  b.mesh.traverse(o => {
    if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
    const p = o.geometry.attributes.position;
    const step = Math.max(1, Math.floor(p.count / 400));
    for (let k = 0; k < p.count; k += step) {
      v.fromBufferAttribute(p, k).applyMatrix4(o.matrixWorld).project(camera);
      x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x);
      y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
    }

  // NDC y runs up, CSS y runs down
  return { material: b.matName,
           x0: +((x0 * 0.5 + 0.5) * innerWidth).toFixed(1),
           x1: +((x1 * 0.5 + 0.5) * innerWidth).toFixed(1),
           y0: +((1 - (y1 * 0.5 + 0.5)) * innerHeight).toFixed(1),
           y1: +((1 - (y0 * 0.5 + 0.5)) * innerHeight).toFixed(1) };
};

window.devWhere = () => bodies.map(b => {
  const w = b.mesh.getWorldPosition(new THREE.Vector3());
  return { drawnAt: b.drawnAt === undefined ? null : Math.round(b.drawnAt),
           nowAt: Math.round(w.x / VIEW + innerWidth / 2),
           movedBy: b.drawnAt === undefined ? null
                  : Math.round(w.x / VIEW + innerWidth / 2 - b.drawnAt) };

/* The cross-section of the last body, as numbers.

   "Flat front face and then a pull back into depth" and "a ball" are the same
   silhouette from the front and differ only in the profile between the rim and
   the middle, which is exactly what cannot be judged from a screenshot taken
   head-on. So: bin every vertex by how far it sits from the outline, and report
   the surface height in each bin against the height a true sphere would have
   there. Ratios near 1 across the range are a dome. Ratios that climb fast and
   then sit at 1.0 for the whole middle are a plateau with a wall, which is the
   flat face. */
window.devProfile = (bins = 10) => {
  const b = bodies[bodies.length - 1];
  const core = b && b.mesh.children[0];
  if (!core || !core.geometry || !core.geometry.attributes.position) return 'nothing to measure';
  const pos = core.geometry.attributes.position;
  let cx = 0, cy = 0, R = 0;
  core.geometry.computeBoundingBox();
  const bb = core.geometry.boundingBox;
  cx = (bb.min.x + bb.max.x) / 2; cy = (bb.min.y + bb.max.y) / 2;
  R = Math.min(bb.max.x - bb.min.x, bb.max.y - bb.min.y) / 2;
  /* Mean per ring, not peak. Taking the tallest vertex in a ring and comparing it
     to a sphere's height at the ring's MIDDLE compares two different radii, and
     it flatters the profile by exactly the width of a ring — enough, near the
     rim, to make a dome look like a plateau. The mean sits at the middle of the
     ring, which is where the sphere is being evaluated. */
  const sum = new Float64Array(bins), cnt = new Float64Array(bins);
  for (let i = 0; i < pos.count; i++) {
    const dx = pos.getX(i) - cx, dy = pos.getY(i) - cy;
    // r = 0 at the middle, 1 at the rim
    const r = Math.min(0.9999, Math.hypot(dx, dy) / Math.max(R, 1e-6));
    const k = Math.floor(r * bins);
    sum[k] += Math.abs(pos.getZ(i)); cnt[k]++;
  }
  let top = 0;
  for (let k = 0; k < bins; k++) if (cnt[k]) top = Math.max(top, sum[k] / cnt[k]);
  return Array.from({ length: bins }, (_, k) => {
    if (!cnt[k]) return null;
    const rMid = (k + 0.5) / bins;
    const sphere = Math.sqrt(Math.max(0, 1 - rMid * rMid));   // what a ball would give
    return { atRadius: +rMid.toFixed(2),
             height: +((sum[k] / cnt[k]) / Math.max(top, 1e-6)).toFixed(3),
             sphereWouldBe: +sphere.toFixed(3) };
  }).filter(Boolean);
};

// walks every live body's material, so a finish parameter can be judged by eye
window.eachBodyMat = f => {
  for (const b of bodies) b.mesh.traverse(o => { if (o.isMesh && o.material) f(o.material); });
};

// tuneAO({radius: 60, strength: 1, power: 2}) from the console, same idea as tuneLight
window.tuneAO = v => {
  if (v.radius !== undefined) aoUniforms.uRadius.value = v.radius;
  if (v.strength !== undefined) blurUniforms.uStrength.value = v.strength;
  if (v.power !== undefined) aoUniforms.uPower.value = v.power;
  if (v.bias !== undefined) aoUniforms.uBias.value = v.bias;
  return { radius: aoUniforms.uRadius.value, strength: blurUniforms.uStrength.value,
