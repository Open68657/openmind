  /* RECALIBRATED 10 Aug 26, because the thing being measured changed. The
     window's two anchors were read off the RAW pointer trail; cornerness is now
     taken from the smoothed path, which lifts every reading a little — a square
     went 0.785 -> 0.813 — and against a window only 0.08 wide that was enough to
     drop it out of "fully angular" and fail its own check at 0.83.

     So the far end moves with it, 0.80 -> 0.82, and the two populations sit
     further apart than they did before:

         square        0.813  -> angular 1.00
         3:1 rect      0.792  -> angular 1.00
         deep 5-lobe   0.524  -> angular 1.00
         14px tremor   0.887  -> angular 0
         10px tremor   0.932  -> angular 0
         circle / 3:1 ellipse  1.00 / 0.98 -> angular 0

     One smoothing pass instead of two was tried first and is the worse trade: it
     leaves the square at 0.805 and a 14px tremor at 0.835, thirty thousandths
     apart, which is a window with nothing in it. */
  const angularity = Math.max(0, Math.min(1, (0.88 - drawnRoundness) / 0.06));
  const angular = angularity * allow;
  LAST_SHAPE = { roundness: +drawnRoundness.toFixed(3), angularity: +angularity.toFixed(2),
                 allow: +allow.toFixed(2), angular: +angular.toFixed(2) };

  // how far from square the drawing is, which is what the depth has to answer to
  let plo = Infinity, phi = -Infinity, qlo = Infinity, qhi = -Infinity;
  for (const q of poly) {
    plo = Math.min(plo, q.x); phi = Math.max(phi, q.x);
    qlo = Math.min(qlo, q.y); qhi = Math.max(qhi, q.y);
  }
  const bw = Math.max(1e-3, phi - plo), bh = Math.max(1e-3, qhi - qlo);
  const sideRatio = Math.min(2.5, Math.max(bw, bh) / Math.min(bw, bh));

  if (M.round) {
    /* Jelly stays soft in almost everything drawn — and a jelly CUBE still has to
       read as a cube, so the softening steps back where the hand clearly meant a
       corner. Full rounding on an organic outline, about a third of it on a
       square. Same reasoning as the faces: ask the drawing what it wanted instead
       of letting the material answer for it every time. */
    const soften = M.round * (1 - 0.78 * angular);
    /* Resample first when the outline has just been FACETED, or the rounding
       eats the shape. A fillet works by pulling each point toward its
       neighbours, which on a hundred points takes the corner off and on five
       points is simply an average of five — thirty passes of that collapses a
       pentagon toward its own centre, and the printed stone came back as a
       sliver. facetOutline asked for many points is an even-arc-length
       resampler, so this puts points along the flat faces for the fillet to
       work with while leaving the faces themselves exactly where they are. */
    if (M.facets) poly = facetOutline(poly, 96);
    // the hand's tremor first — that is noise and nobody drew it — and then the
    // corners, which somebody did
    poly = smoothOutline(poly, Math.round(soften * 8));
    poly = filletOutline(poly, 0.9, Math.round(6 + soften * 26));
  }
  const g = inflate(poly, {
    /* Depth, and this is now solved rather than nudged.

       Two separate corrections were being multiplied together — one for "a block
       is deeper than a cushion", one for "measure it off the WIDE side" — and the
       product overshot: the block came back deeper than it was wide, which is a
       shape nobody drew.

       So work it out. `aspect` is the half-thickness as a fraction of the distance
       from the outline to the deepest point inside it, which on a rectangle is half
       the SHORT side. Wanting the full depth to equal the wide side makes aspect
       exactly the ratio between the two sides — and on a square that ratio is 1,
       giving a body as deep as its own side. A cube.

       Held a little under, at 0.94: a block measuring exactly as deep as it is
       wide reads as slightly deeper than that, since the face is seen straight on
       while the depth is foreshortened. And a relaxed body keeps the old rule — a
       bubble is not a rounded outline pulled backwards, it is a ball. */
    /* A cube is a cube: at 0.94 a square came back visibly shallower than it was
       wide, and the reasoning for holding it under (that a face seen straight on
       reads deeper than it measures) does not survive being asked for a cube and
       handed a slab. `aspect` is the half-thickness as a fraction of the distance
       from the outline to the deepest point inside it, which on a rectangle is
       half the short side — so this ratio makes the full depth equal the wide
       side exactly, and on a square that is all three sides equal. */
    /* Both ends are now the thing they are named after, and neither was.

       Round: at 0.9 a drawn circle came back a tenth shallower than it was wide,
       which is not a ball, it is a ball with the back taken off. Drawn round, it
       returns round: depth equal to width.

       Angular: at 0.94 a square came back visibly shallower than it was wide, and
       the reasoning for holding it under (that a face seen straight on reads
       deeper than it measures) does not survive being asked for a cube and handed
       a slab. `aspect` is the half-thickness as a fraction of the distance from
       the outline to the deepest point inside, which on a rectangle is half the
       short side — so this ratio makes the full depth equal the wide side, and on
       a square that is all three sides equal. */
    /* Depth against the SHORT side was the whole rule, and on a long shape that
       is too much of it. `aspect` is measured off the distance from the outline
       to the deepest point inside, which on anything elongated is half the short
       side — so a round body came back with a circular cross-section however
       long it was, and a 410-wide blob arrived 156 deep. Correct for a sphere,
       and it reads as a log rather than as something lying there.

       So the cross-section flattens as the shape stretches, by a power of how
       elongated it is. A circle is untouched at 1:1 and stays a ball, which is
       the end that was right; by 2.5:1 the depth is down to about three
       quarters of the short side. The same softening on the block end, which
       had the opposite problem: depth ran to the LONG side, so a 3:1 rectangle
       came out 250 deep against 100 tall — a beam standing on edge, not a
       block. A square is 1:1 either way, so a cube is still a cube. */
    /* `log` turns the elongation taper off, and it is the one profile that wants
       it off. The taper exists because a long blob given a circular cross-section
       "reads as a log rather than as something lying there" — and a trunk IS a
       log. Drawn long, it comes back round the whole way along, which is the
       difference between a branch and a flattened leaf.
       (14 Aug: bark no longer carries `log` — the request moved from trunk to
       BARK, a shell split off the tree, flat-ish however it was drawn. That is
       `depthScale`, a straight multiplier on the whole answer, and any profile
       may use it.) */
    aspect: ((M.log ? 1 : Math.pow(sideRatio, -DEPTH_TAPER.round)) * (1 - angular)
          + (1 + (sideRatio - 1) * DEPTH_TAPER.block) * (M.boxDepth ?? 1) * angular)
          * (M.depthScale ?? 1),
    /* The depth profile, and what decides whether a square comes back as a
       cushion or as a block. The exponent runs the surface from a sphere at 1 to
       a plateau with a near-vertical wall as it approaches 0 — which is a slab,
       and a slab with a square outline is a cube.

       Which one to use is not the material's decision alone: it is the drawing's.
       A circle drawn in stone should still be a boulder, and a rectangle drawn in
       stone should be a block, so the boxiness follows how angular the outline
       actually was — `analyse` already measures that. Materials with tension in
       them stay cushioned however sharply they were drawn, since the corners on
       those have just been rounded off anyway. */
    // the rim keeps its rolled profile — a chamfer rather than a knife — and the
    // block-ness now comes from `edge` instead of from flattening this
    /* A true sphere profile, exponent and all. Below 1 the dome flattens into a
       plateau with a wall, and that is exactly the "straight front face with some
       depth behind it" a round drawing kept coming back as: the curvature was
       being spent near the rim and the middle ran flat. The block-ness has its own
       control in `edge` and does not need this one held down as well. */
    puff: 1.0,
    edge: 1 - angular * 0.8,
    /* Chisel marks. A block of stone is not a block that came out of a mould: it
       was struck off, so its faces are several shallow planes meeting at ridges
       rather than one flat surface. Quantising the height into a few steps is
       exactly that — banded noise instead of smooth, and each band reads as one
       blow. Only on angular hard bodies: a boulder has no chisel marks, and
       neither does jelly. */
    chisel: M.chisel ? M.chisel * angular : 0,
    /* Measure the depth along the ray to the rim rather than to the nearest
       edge, so a long shape comes back a solid and not a slab with a seam down
       it. Full on anything drawn round, off on a block, which needs the
       plateau-and-wall the distance field gives it. */
    radial: M.facets ? 0 : 1 - angular,
    /* And a few Laplacian passes on top, for the small creases the hand's own
       wobble puts in the outline. The ridge itself is `radial`'s job — measured,
       this alone reaches about ten pixels and the ridge is as long as the body. */
    relax: M.facets ? 0 : Math.round(6 * (1 - angular)),
    // and it is smooth. The fbm break-up is what gives clay its slump, and it is
    // the one thing tension would have ironed out — so it is gone well before
    // round reaches 1, not merely faded in proportion
    wob: M.facets ? 0 : 0.2 * Math.max(0, 1 - (M.round || 0) * 1.7),
    seed,
    /* Polish shows the mesh. A matte body can hide a coarse tessellation inside
       its own scan, and a mirror cannot hide anything: it doubles every crease,
       once in its form and once in what it reflects, which is why the chrome
       arrived visibly built out of pieces. Worse, the even-spacing resample
       pushed the outline past the 150-point mark, where inflate drops a
       subdivision level to save work — so the smoothest materials were quietly
       getting the coarsest mesh. Both are settled here: fewer outline points,
       since a smoothed loop needs no more, and the level said out loud. */
    /* A faceted body normally needs one level and no more, since subdividing a
       flat plane only makes more flat plane. Pitting is the exception, and three
       levels was nowhere near enough for it: eleven outline points earcut into
       about nine triangles, and nine times four cubed is under six hundred — on a
       body two hundred pixels across that is a vertex every eight pixels, while
       the vesicles being carved are smaller than that. So the displacement had
       nothing to move and the rock kept arriving as a picture of a rock on a
       smooth block, which is exactly what it looked like. Five levels puts it
       over nine thousand triangles, and the holes become holes. */
    /* `M.levels` overrides, and bark is why it exists. The rock learned this
       already and the note is worth repeating because it caught us twice: a
       displacement cannot carve what the mesh has no vertices for. Bark fell
       through to the default three levels, which on a body two hundred pixels
       across is a vertex every eight or so — while the fissures being cut are
       narrower than that. So the relief was being computed, averaged across a
       triangle, and mostly thrown away, and no amount of `relief` could fix it
       because the fault was the tessellation and not the depth. */
    levels: M.levels ?? (M.facets ? (M.relief ? 5 : 1) : (M.round ? 3 : undefined))
  });
  /* Real pits, for the materials that are made of them. Kept off the smooth and
     the faceted ones: tension irons relief out by definition, and a facet with
     pitting on it is no longer a facet. The depth is a fraction of the body, so
     a thumbnail and something filling the window are equally pitted. */
  /* RELIEF GETS ITS OWN, COARSER FREQUENCY, and this is the fix for "the trunk
     still produces strange jagged shapes when they are closed".

     `1 / M.tile` is the shading frequency, and on bark that is 520 — dozens of
     repeats across the body, which is right for a map read per PIXEL and far too
     fine for one read per VERTEX. Neighbouring vertices land on unrelated parts
     of the scan, so each one is pushed a different distance along its own normal
     and the surface comes apart into spikes. It shows on closed bodies and not
     on drawn lines because the outline mesh is dense exactly where the shape
     turns, which is where the spikes stand out most.

     So the carving may be told to run coarser than the shading. It is the same
     distinction the blur passes keep having to relearn in the other direction:
     a sample spacing that is fine for one consumer is aliasing for another. */
  // the grain field first, so the carve below can turn with it — the fibres of
  // a bent closed shape run with the long edges, not with one straight axis
  if (M.grainLocal) outlineGrainAttr(g, poly, M._rot || 0);
  if (M.relief && M.file && (!M.round || M.reliefRound)) {
    const reliefScale = 1 / (M.tile * (M.reliefTile ?? 1));
    /* 24 rather than 16 on a block. The wall now has rings of its own, but the ones
       nearest the chamfer still have normals halfway between facing forward and
       facing sideways — and while the front projection keeps any weight at all
       there, those vertices are displaced by a value that barely changes down the
       wall, which is a stripe carved in the geometry itself. */
    // a wrap material carves through the same single-sheet lookup it is
    // painted through — three object-space planes would carve a different
    // rock than the one being printed (see reliefDisplace's planar note)
    reliefDisplace(g, M.file, reliefScale, span * VIEW * 0.075 * M.relief, M.facets ? 24 : 4, M._rot || 0,
                   { planar: !!M.wrap, bias: M.reliefBias,
                     rotAttr: g.attributes.aGrainRot });
  }
  /* And once the shape is final, the edges. Only where the drawing asked for a
     block: on anything rounded this would find no creases to keep and cost the
     mesh its indexing for nothing. */
  /* keepFrame: a lobe of a self-crossing outline must NOT be recentred on
     itself. Centering is what puts a single body on its own origin, and doing
     it per lobe would stack both lobes of an 8 on top of each other and lose
     the one thing the drawing said about them — where they meet. The merged
     body is centred once, by the caller. */
  if (angular > 0.45) {
    const c = creaseNormals(g, 34);
    g.dispose();
    if (!keepFrame) c.center();
    return c;
  }
  if (!keepFrame) g.center();
  return g;
}

function lumpySphere(radius, lumps, grain, seed) {
  const g = new THREE.IcosahedronGeometry(radius, 38);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = v.clone().normalize();
    const big = fbm(n.x * 1.7 + seed, n.y * 1.7 + seed, n.z * 1.7, 3);
    const mid = fbm(n.x * 6.5 + seed, n.y * 6.5, n.z * 6.5 + seed, 3);
    // real geometric micro-relief — reads as texture under raking light,
    // and needs no bump map, so it survives rotation honestly
    const fine = fbm(n.x * 26 + seed, n.y * 26, n.z * 26 + seed, 2);
    const micro = fbm(n.x * 64, n.y * 64 + seed, n.z * 64, 2);
    const d = radius * (1 + lumps * (big * 0.72 + mid * 0.26))
            + radius * grain * (fine * 0.05 + micro * 0.022);
    v.copy(n).multiplyScalar(d);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

/* An open stroke, given a body that actually closes.

   TubeGeometry builds no end caps at all. With front faces only you looked
   straight through the opening and out the far side, and the shape collapsed
   into a flat diagonal facet the moment it turned — the single loudest tell
   in the whole piece. Building the tube by hand fixes it at the source: the
   radius is driven along the path and taken to zero at both ends, so each end
   converges to a point and the surface is closed by construction, with no cap
   to fake and no seam to hide. A stroke thickens where the hand pressed
   through and thins as it leaves, the way a brush actually unloads. */
/* An open stroke, as a body.

   The taper here is sin(pi*t)^0.45, which holds most of the length near full
   width and then runs out to a point at each end — a thorn. That is right for
   clay and wrong for everything that flows: a run of liquid metal has the same
   width all the way along and finishes in a dome, because the same surface
   tension that keeps it round in section will not let it come to a point. Which
   is exactly what Hadar asked for on the chrome, and it belongs to the same field
   that already governs roundness rather than to a switch of its own.

   `even` blends the thorn into a capsule: full width down the whole length, then
   a quarter circle into a hemispherical cap. And it damps the wander, since a
   width that varies is another way of not being uniform. */
/* The drawn trail in the body's own local space, which every open-stroke shape
   needs before it can be swept. Lifted out of the tube branch when the ribbon
   arrived and needed exactly the same thing. */
function strokeToWorld(path, bcx, bcy) {
  return path.map(q => {
    const w = toWorld(q.x, q.y);
    return new THREE.Vector3(w.x - (bcx - innerWidth / 2) * VIEW, w.y + (bcy - innerHeight / 2) * VIEW, 0);
  });
}

/* How wide the hand was at each point, and the base width to scale it by.

   Width used to be `span / 11` — the size of the whole drawing — so a long sweep
   came out fat and a short flick came out thin, for no reason anyone drawing it
   would recognise: the hand did the same thing both times. Nothing about a
   stroke's thickness belongs to its length. What it does belong to is SPEED. A
   brush pressed into the paper moves slowly and lays a wide mark; the same brush
   flicked away lifts and narrows. Liquid metal draws thinner than clay
   throughout, which is what lineR is for.

   The base is in pixels, and a phone is not a small desktop: it is the same
   number of pixels doing a much larger share of the frame. So it eases down on
   the narrowest screens and nothing else in the system moves with it. */
function handWidths(path, M) {
  const fit = Math.max(0.6, Math.min(1, Math.min(innerWidth, innerHeight) / 560));
  const base = 15 * VIEW * fit * (M.lineR ?? 1);
  const widths = path.map(q => {
    const v = q.v ?? 6;
    // 2 px a frame is a deliberate crawl, 26 is a flick
    const t = Math.max(0, Math.min(1, (v - 2) / 24));
    // a 2:1 range end to end. Three to one was the first try and it turned the
    // slow end into a ball with a tail — the hand varies, it does not transform
    return 1.28 - t * 0.62;
  });
  /* A taper the material asks for, on top of whatever the hand did. Sea glass is
     never an even bar: a piece of it is thicker at one end, because that is how
     it broke off the bottle before the sea got to work on it. Held around its own
     average so the stroke does not gain weight overall. */
  if (M.lineTaper) {
    const n = widths.length - 1 || 1;
    const mid = 1 + M.lineTaper * 0.5;
    for (let i = 0; i <= n; i++) widths[i] *= (1 + M.lineTaper * (i / n)) / mid;
  }
  // smoothed along the stroke: pressure does not change from one point to the
  // next, and unsmoothed it beads the body like a string of sausages
  for (let pass = 0; pass < 6; pass++) {
    for (let i = 1; i < widths.length - 1; i++) {
      widths[i] = (widths[i - 1] + widths[i] * 2 + widths[i + 1]) * 0.25;
    }
  }
  return { base, widths };
}

/* ---------- a coat of quills ----------
   Roadmap item 5, "spikes and hairs". The note beside it said the colony already
   does 80% of this — needles instead of leaves, in quantity — and that turned
   out to be half right and worth writing down.

   The colony sprouts along the PATH, which is exactly right for gouache, where
   the shards are growth along the drawn line and the line is the subject. A coat
   is not that: it is growth out of a SURFACE, everywhere the body has one, and a
   hedgehog drawn as spines along its own spine is a comb.

   Triangles are picked in proportion to their AREA, not per vertex. A subdivided
   mesh bunches its vertices wherever the outline had detail, so a coat drawn off
   them is dense at the corners and bald across the middle — the same lesson the
   bead cloud learned about sampling a field by threshold.

   One InstancedMesh for the lot. Three thousand small meshes is three thousand
   draw calls; this is one. */
function needleGeometry(len, rad, curl, tipDark, blunt = 0, rootDark = 0) {
  /* A cone comes to a mathematical point, and rubber does not. Anything soft
     ends in a rounded stub, because a tip that fine could not hold itself up —
     which is most of what separates a rubber spine from a thorn, and it is
     cheap: a cylinder-cone with a flat top of its own, radius set by how blunt
     it should be, with the shading rounding the join. */
  const g = new THREE.CylinderGeometry(rad * blunt, rad, len, 7, 4, false);
  // three centres a cone on its own middle; a quill grows FROM the skin, so the
  // base sits at the origin and the tip is up the +y axis
  g.translate(0, len / 2, 0);
  const pos = g.attributes.position;
  const col = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const t = Math.max(0, Math.min(1, pos.getY(i) / len));
    if (curl) {
      // quadratic, so the base leaves the skin straight and only the far half
      // bends over: a spine that is not rigid lies back under its own weight,
      // it is not a hook
      pos.setX(i, pos.getX(i) + curl * len * t * t);
    }
    /* The dark tip, which is most of what makes a mass of these read as a mass
       rather than as fur. In the reference every spine is coral for its length
       and near-black for the last fifth, so the ends draw a second, finer
       silhouette inside the first. Baked into the geometry's own colours and
       multiplied by the per-instance colour, which is how one geometry can still
       give every quill its own hue. */
    /* AND DARK AT THE ROOT, which is the occlusion between the spines that the
       shadow map was never going to give.

       Reported as "there is still no shading on the surface" and "there is a
       kind of halo on the quills". Both are the same absence: a quill's lower
       half is buried among its neighbours and can see almost none of the sky,
       while its tip stands clear in the open. That gradient IS what a pincushion
       looks like, and with `castShadow` off — rightly off, a spine is thinner
       than a shadow-map texel — nothing was producing it, so every quill was lit
       identically from root to tip and the mass read as one flat pile.

       Baked into the vertex colours next to the dark tip rather than computed:
       it costs nothing, it survives instancing, and it is a MULTIPLY on the
       quill's own colour, so the roots go deep coral instead of grey. */
    const root = 1 - rootDark * (1 - Math.min(1, t / 0.6));
    const k = (1 - tipDark * Math.pow(t, 3.2)) * root;
    col[i * 3] = k; col[i * 3 + 1] = k * (1 - tipDark * 0.10 * t); col[i * 3 + 2] = k;
  }
  pos.needsUpdate = true;
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

function needleCoat(geo, M, span, seed) {
  const C = M.coat || {};
  const R = rng(seed * 977 + 13);
  const pos = geo.attributes.position, nrm = geo.attributes.normal;
  if (!pos || !nrm) return null;
  const index = geo.index;
  const triCount = index ? index.count / 3 : pos.count / 3;
  if (triCount < 1) return null;
  const vi = (t, k) => index ? index.getX(t * 3 + k) : t * 3 + k;

  const cum = new Float64Array(triCount);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), cr = new THREE.Vector3();
  let total = 0;
  for (let t = 0; t < triCount; t++) {
    a.fromBufferAttribute(pos, vi(t, 0));
    b.fromBufferAttribute(pos, vi(t, 1));
    c.fromBufferAttribute(pos, vi(t, 2));
    ab.subVectors(b, a); ac.subVectors(c, a);
    total += cr.crossVectors(ab, ac).length() * 0.5;
    cum[t] = total;
  }
  if (!(total > 0)) return null;

  /* How many. Density is per unit of SKIN rather than a fixed count, so a
     thumbnail and something filling the window are equally prickly — the same
     rule the bead cloud uses for grain size, and for the same reason: a material
     may not change because the hand drew it bigger.

     THE DIAL DID NOTHING, and the arithmetic is why. World units here are screen
     pixels, so multiplying the spacing by a further hundred asked for quills a
     few hundred pixels apart — on a body a couple of hundred pixels across that
     is a fraction of one, and every setting from end to end of the slider landed
     under the floor of 200 and was handed the floor. The slider moved and the
     count never did. Spacing is a distance in pixels and nothing else now, the
     floor is low enough to be reachable, and the ceiling is raised because "so
     dense you can barely see the body" is a real thing to ask for. */
  const spacing = Math.max(0.8, (C.spacing ?? 5) * VIEW);
  const n = Math.max(60, Math.min(14000, Math.round(total / (spacing * spacing))));
  const len = span * VIEW * (C.len ?? 0.16);
  const rad = len * (C.thick ?? 0.07);
  const blob = C.shape === 'blob';
  const unit = blob
    ? new THREE.IcosahedronGeometry(len * 0.5, 1)
    : needleGeometry(len, rad, C.curl ?? 0, C.tipDark ?? 0, C.blunt ?? 0, C.rootDark ?? 0);
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, roughness: C.rough ?? 0.62, metalness: 0,
    vertexColors: !blob,
    // a quill is a cone of five sides and should look like one at the tip:
    // smooth normals over five faces give a soft nub where a point belongs
    flatShading: !blob
  });
  /* Sheen, which is what a spine actually does with light and what the flat
     standard material was refusing to do. A fine fibre lit from behind or across
     glows along its whole length rather than showing a highlight at one point —
     retroreflection, the same property that makes velvet and moss read, and the
     library already uses it for exactly those. Without it a coat of cones is a
     coat of grey cones whichever way the lamp is pointed. */
  if (C.sheen) {
    mat.sheen = C.sheen;
    // a fibre's glow is tight, a dusty bud's is broad — the buds ask for the
    // moss treatment and the moss keeps this near the top
    mat.sheenRoughness = blob ? 0.95 : 0.45;
    mat.sheenColor = new THREE.Color(C.sheenColor ?? 0xffd9c2);
  }
  mat.name = M.name + (blob ? '-bud' : '-quill');
  if (C.emissive) {
    mat.emissive = new THREE.Color(C.emissive);
    mat.emissiveIntensity = C.emissiveIntensity ?? 0.6;
  }

  const mesh = new THREE.InstancedMesh(unit, mat, n);
  /* No shadow map, and this is the fix for "the lighting on them is not
     convincing". It is the bead cloud's lesson arriving a second time: a shadow
     map answers one depth question per texel, and a quill is thinner than a
     texel, so thousands of them return a grey smear rather than shadows — the
     mass fills in flat and dark and the light stops describing any of it. What
     makes a pincushion read is occlusion between the spines, and that is what
     the AO pass is for. Cast off, receive off, and the sheen below carries the
     rest. */
  /* IT CASTS, IT DOES NOT RECEIVE, and the asymmetry is the point.

     Receiving is what the note above rules out and still rules out: a shadow map
     answers one depth question per texel, a quill is thinner than a texel, and
     thousands of them receiving return a grey smear rather than shadows.

     CASTING is a different question and was thrown out with it. Without it the
     only thing putting a shadow on the ground is the core body buried somewhere
     inside the coat — much smaller than the mass standing above it — so a
     pincushion the size of a fist laid down the shadow of a marble. Asked on 13
     August: "and why is there no shadow on the surface?". The coat casts now,
     the mass throws a shadow the size of itself, and nothing about the grey
     smear comes back because that was always the receiving half. */
  mesh.castShadow = true;
  mesh.receiveShadow = false;

  /* AND THE BODY SHADOWS ITS OWN FAR SIDE, which is what the line above gave up
     and never replaced.

     Reported as "the shading is greyish and washed out, and it is not as
     impressive as the references". With the shadow map off, every quill is lit
     on its own and nothing knows there is a BALL underneath: a spine on the far
     side catches the lamp on whichever of its five faces happens to turn that
     way, exactly as brightly as one on the near side. Several thousand of those
     average out to an evenly bright disc — a texture, not a mass. The AO pass
     cannot rescue it either, because it darkens creases at screen scale and the
     thing missing here is at BODY scale.

     So each quill carries the skin normal it grew from, and the coat is dimmed
     by how far that normal has turned away from the key. It is not a shadow map
     and does not pretend to be — no quill shadows another — but it restores the
     one cue that makes a sphere read as a sphere, at one dot product.

     The floor is 0.30 rather than 0: the far side of a pincushion is in shade,
     not in a hole, and the fill and the dome genuinely do reach it. */
  const baseN = new Float32Array(n * 3);
  const coatKey = new THREE.Vector3().copy(key.position).normalize();
  mat.onBeforeCompile = shader => {
    shader.uniforms.uCoatKey = { value: coatKey };
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        attribute vec3 aBase;
        uniform vec3 uCoatKey;`)
      .replace('#include <color_vertex>', `#include <color_vertex>
        {
          vec3 bw = normalize(mat3(modelMatrix) * aBase);
          vColor.rgb *= mix(0.30, 1.0, smoothstep(-0.45, 0.55, dot(bw, uCoatKey)));
        }`);
  };

  const UP = new THREE.Vector3(0, 1, 0);
  const P = new THREE.Vector3(), N = new THREE.Vector3(), tmpN = new THREE.Vector3();
  const q = new THREE.Quaternion(), sc = new THREE.Vector3(), m4 = new THREE.Matrix4();
  const col = new THREE.Color();
  const fams = (C.colours || [C.colour ?? M.tint]).map(x => new THREE.Color(x));
  const jitter = C.jitter ?? 0.30;

  for (let i = 0; i < n; i++) {
    const r = R() * total;
    let lo = 0, hi = triCount - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cum[mid] < r) lo = mid + 1; else hi = mid; }
    const t = lo;
    a.fromBufferAttribute(pos, vi(t, 0));
    b.fromBufferAttribute(pos, vi(t, 1));
    c.fromBufferAttribute(pos, vi(t, 2));
    // a uniform point inside the triangle: the fold is what stops them crowding
    // into one corner
    let u = R(), v = R();
    if (u + v > 1) { u = 1 - u; v = 1 - v; }
    P.copy(a).addScaledVector(ab.subVectors(b, a), u).addScaledVector(ac.subVectors(c, a), v);
    N.set(0, 0, 0);
    for (let k = 0; k < 3; k++) { tmpN.fromBufferAttribute(nrm, vi(t, k)); N.add(tmpN); }
    N.normalize();
    // the skin's own normal, kept before the lean scatters it: the dimming above
    // is a question about the BODY, and a spine's private tilt is noise in it
    baseN[i * 3] = N.x; baseN[i * 3 + 1] = N.y; baseN[i * 3 + 2] = N.z;
    /* Which way it leans. A coat is never combed, and this is also where "not
       completely rigid" lives: one geometry cannot bend differently per
       instance, but a few hundred of them leaning their own way and rolled to
       their own angle about the normal reads as softness, because what the eye
       is judging is the spread of the mass and not any one spine. */
    const lean = new THREE.Vector3((R() - 0.5), (R() - 0.5), (R() - 0.5))
      .multiplyScalar(jitter);
    N.add(lean).normalize();
    q.setFromUnitVectors(UP, N);
    // rolled about its own axis, so the curl points every way round the body
    q.multiply(new THREE.Quaternion().setFromAxisAngle(UP, R() * 6.2832));
    // sunk slightly, so a quill grows out of the skin rather than resting on it
    P.addScaledVector(N, -len * 0.06);
    const s = (C.varyLen ?? 0.9);
    sc.set(0.7 + R() * 0.6, (1 - s * 0.5) + R() * s, 0.7 + R() * 0.6);
    m4.compose(P, q, sc);
    mesh.setMatrixAt(i, m4);
    /* Which family, clumped rather than salted. Picking at random gives an even
       mix that reads as one muddy average from any distance; taking it off a
       smooth field of the position means the colours arrive in patches, which is
       what growth actually does. */
    const fi = fams.length > 1
      ? Math.min(fams.length - 1, Math.floor(fbm01(P.x * 0.02 + seed, P.y * 0.02, P.z * 0.02, 2) * fams.length))
      : 0;
    col.copy(fams[fi]).offsetHSL((R() - 0.5) * 0.04, (R() - 0.5) * 0.12, (R() - 0.5) * 0.16);
    mesh.setColorAt(i, col);
  }
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  // hung on the geometry rather than the mesh, because that is where an
  // instanced attribute is read from, and this geometry belongs to this coat
  unit.setAttribute('aBase', new THREE.InstancedBufferAttribute(baseN, 3));
  return mesh;
}

/* ---------- the brush stroke ----------
   Roadmap item 6, and the rule that came with it: a brush mark is an OPEN RIBBON
   that twists through space, not a solid body. It follows the line, it stays
   open, and it is allowed to be a little more fluid than what was drawn.

   Which makes it the one profile that answers an open stroke with something
   other than a tube. The cross-section is a lens several times wider than it is
   thick, and it turns as it travels — so the mark is broad where it faces you
   and narrows to an edge where it has rolled over, which is how a loaded brush
   changes width without the hand changing pressure.

   It keeps a thickness rather than being a plane. The shard learned that the
   expensive way: a surface of no thickness disappears to a one-pixel line when
   it turns edge-on, and a stroke that vanishes at the moment it turns is worse
   than a leaf doing it, because the turn is the whole gesture. */

  const curve = new THREE.CatmullRomCurve3(path3, !!closed, 'centripetal', 0.5);

  /* The map runs along the mark, so u runs down the length — and at a scale set
     by the mark's own width, or a long sweep gets long stretched bristles and a
     short one gets a rash of them. Held to whole numbers so the repeat joins
     itself instead of cutting a stroke off mid-bristle. */
  const uRepeat = Math.max(1, Math.round(curveLen / Math.max(1e-3, radius * 9)));

  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    curve.getPointAt(closed ? t % 1 : t, P);
    const N = frames.normals[i], B = frames.binormals[i];
    let press = 1;
    if (widths && widths.length > 1) {
      const f = t * (widths.length - 1), i0 = Math.floor(f), k = f - i0;
      press = widths[i0] * (1 - k) + widths[Math.min(widths.length - 1, i0 + 1)] * k;
    }
    /* The lift, and it was far too eager at 0.55: a mark that begins tapering
       from the middle is a leaf, and every stroke came back lens-shaped whatever
       the hand did. A loaded flat brush runs at its own width for nearly the
       whole mark and gives it up in the last stretch, so the exponent drops until
       the curve is flat across the middle — and a floor holds the ends at a
       fifth of the width rather than at nothing, because a brush lifted off the
       paper leaves an END, not a point. */
    const lift = closed ? 1 : 0.2 + 0.8 * Math.pow(Math.sin(Math.PI * t), 0.22);
    const w = radius * press * lift;
    // the roll: a slow turn along the length plus the brush's own wobble. One
    // alone is a machined helix, the other alone is a shiver
    const ang = twist * (t * 2.4 + fbm(t * 3.1 + seed, seed * 0.6, 2.2, 3) * 1.5);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    // the fluidity the roadmap allows: a slow sideways drift off the drawn line,
    // by a fraction of the mark's own width
    const drift = flow * radius * fbm(t * 2.0 + seed * 1.3, 5.1, seed, 2) * 3;
    for (let j = 0; j < RING; j++) {
      const b = j / RING * Math.PI * 2;
      // the lens: wide across the mark, thin through it, turned by `ang`
      const ex = Math.cos(b) * w, ey = Math.sin(b) * w * thick;
      const rx = ex * ca - ey * sa, ry = ex * sa + ey * ca;
      verts.push(P.x + N.x * (rx + drift) + B.x * ry,
                 P.y + N.y * (rx + drift) + B.y * ry,
                 P.z + N.z * (rx + drift) + B.z * ry);
      /* v is folded: the section runs all the way round, so letting v run 0..1
         round it would mirror the map on the back face and put a seam down both
         edges. Folded, the back wears the same band as the front, which is what
         a stroke of paint with two sides actually looks like. */
      uvs.push(t * uRepeat, 1 - Math.abs(2 * (j / RING) - 1));
    }
  }
  for (let i = 0; i < STEPS; i++) {
    for (let j = 0; j < RING; j++) {
      const p = i * RING + j, q = i * RING + (j + 1) % RING;
      // wound so the faces point out, the same way round as lumpyTube: three's
      // binormal is tangent cross normal, and the other winding turns the whole
      // stroke inside out
      tris.push(p, q, p + RING, q, q + RING, p + RING);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(tris);
  g.computeVertexNormals();
  return g;
}

/* `flat` turns the sweep from a rod into a SLAB, and bark is what asked for it.

   A closed drawing already comes out right — the outline is inflated and the
   plates sit on a face. An open stroke went down the tube branch and came back
   as a branch: round in section, so the bark wrapped all the way round it and
   there was no face for the fissures to run down. The reference is a piece that
   was split off a trunk, which is flat, and it should be the same piece however
   long the line is.

   One number does it: the section's thickness through the stroke is scaled while
   its width across is left alone, so the capsule becomes a flattened bar with
   the ends still closed. Nothing else in the sweep changes, which matters —

  const curve = new THREE.CatmullRomCurve3(path3, false, 'centripetal', 0.5);

     the reference's top and bottom are broken across the plates. Same move as
     the jag block on closed outlines — quantised levels held over runs, smoothed
     once so the corners are broken rather than milled — but around the RING,
     scaled by how deep into the cap the ring sits, per-end seeds so the two
     breaks differ. Radius modulation on a tube that closes by convergence stays
     watertight by construction; no cap faces exist to leak (the file's own
     invariant — a tube ends by radius, never by a lid). */

     to write aGrainRot: the per-ring DELTA between the local tangent's angle and
     that body angle, unwrapped so a bend never jumps a whole turn between
     neighbouring rings. The shader and the carve add it back on top of the
     uniform — grain that turns with the drawn line instead of borrowing one
     straight axis for the whole stroke. */

  let grainPrev = null;
  /* Real UVs along the sweep, when the material asks (o.tile). The triplanar
     projection can only be rotated in one plane at a time, and a stroke on
     the turntable shows its SIDE faces — where the projection's other planes
     take over and the grain lies down flat. Reported on a turned trunk. The
     ribbon solved this the honest way long ago: a surface that knows which
     way along runs carries that knowledge as uv. v rides the arclength — the
     scan's fissures run up its own v — so the fibres follow the stroke on
     every face at every turn, and the shader stops projecting entirely. */
  const uvs = o.tile ? [] : null;
  /* aReliefMask — how much of the carve a vertex may keep, 14 Aug. The carve
     pushes along normals; on a slab's LONG EDGES the normals point sideways,
     so every dark fissure became a tooth in the silhouette — reported, and
     backwards: the jag doctrine says sides follow a fissure and come away
     fairly straight while only the ENDS tear. Faces keep full depth, the
     side rims keep a quarter — carved texture without a serrated outline. */
  const reliefMask = (o.tear || o.grainFrom != null) ? [] : null;
  /* Steps along the length, and the cap is what sets the floor on them. The
     rounded end is one radius long, which on a long thin stroke is a few per cent
     of the whole — and a hemisphere described by four rings is a cone. So the
     count is raised until the cap alone gets a dozen of them, which is the real
     reason the chrome kept coming to a point after the profile was already right:
     the shape was correct and there was nothing there to draw it with. */
  const wEnd = widths && widths.length ? Math.max(widths[0], widths[widths.length - 1]) : 1;
  const capFrac = Math.max(0.05, Math.min(0.5, radius * wEnd / Math.max(1e-3, curveLen * 0.5)));
  const STEPS = Math.round(Math.max(30, Math.min(320, Math.max(path3.length * 2, 12 / capFrac))));
  const RING = 22;
  const frames = curve.computeFrenetFrames(STEPS, false);
  /* How much of the length the rounded end takes, and this had to stop being a
     constant. It was 0.42 of the half length: on a short stroke that is a dome,
     and on a long one it is forty per cent of the whole thing tapering — which is
     not a rounded end, it is a spike with a soft tip, and it is what "still too
     pointy" was looking at. A capsule ends in a hemisphere, so the cap has to be
     one RADIUS long however far the stroke runs, and the fraction falls out of
     the geometry instead of being chosen. Floored, so a very long stroke still
     gets a visible dome rather than a flat cut. */
  const CAP = capFrac;
  if (o.tear) {
    const steps = o.tear.steps ?? 3, runLen = Math.max(2, Math.round(o.tear.run ?? 4));
    tearAmt = o.tear.amount ?? 0.3; tearFocus = o.tear.focus ?? 1.5;
    const mk = T => {
      const lv = new Array(RING).fill(0);
      for (let j = 0; j < RING; j += runLen) {
        const v = Math.floor(T() * steps) / Math.max(1, steps - 1);
        for (let k = 0; k < runLen && j + k < RING; k++) lv[j + k] = v;
      }
      const pr = lv.slice();
      for (let j = 0; j < RING; j++) {
        lv[j] = (pr[(j - 1 + RING) % RING] + pr[j] * 2 + pr[(j + 1) % RING]) * 0.25;
      }
      return lv;
    };

    tearB = mk(rng(seed * 13 + 2));

  const verts = [], tris = [];
  const P = new THREE.Vector3();

  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    curve.getPointAt(t, P);
    const N = frames.normals[i], B = frames.binormals[i];
    if (grainRot) {
      const T = frames.tangents[i];
      let ga = Math.PI / 2 - Math.atan2(T.y, T.x);

        while (grainPrev - ga > Math.PI) ga += Math.PI * 2;

      grainPrev = ga;

    // sin to the 0.45 holds most of the length near full width and then drops
    // away fast, so the body stays substantial and still comes to a tip
    const pointed = Math.pow(Math.sin(Math.PI * t), 0.45);
    // and the capsule: flat until the cap begins, then a circle into the end
    const u = Math.abs(2 * t - 1);
    const into = Math.max(0, (u - (1 - CAP)) / CAP);
    const capped = Math.sqrt(Math.max(0, 1 - into * into));
    const taper = pointed * (1 - even) + capped * even;
    // the hand's own width at this point along the stroke
    let press = 1;
    if (widths && widths.length > 1) {
      const f = t * (widths.length - 1), i0 = Math.floor(f), k = f - i0;
      press = widths[i0] * (1 - k) + widths[Math.min(widths.length - 1, i0 + 1)] * k;
    }
    const swell = press * (1 + lumps * fbm(t * 4.2 + seed, seed * 0.7, 1.9, 3) * 0.9);
    for (let j = 0; j < RING; j++) {
      const a = j / RING * Math.PI * 2;
      const cs = Math.cos(a), sn = Math.sin(a);
      // the section itself wanders, so this is not a cylinder swept down a line
      let r = radius * taper * swell *
        (1 + lumps * 0.55 * fbm(cs * 1.6 + seed, sn * 1.6, t * 5.5, 2));
      // the tear takes its bite only inside the cap, harder toward the tip
      if (tearA && into > 0) {
        const lv = (t < 0.5 ? tearA : tearB)[j];
        r *= 1 - tearAmt * lv * Math.pow(into, tearFocus);
      }
      verts.push(P.x + (N.x * cs + B.x * sn * flat) * r,
                 P.y + (N.y * cs + B.y * sn * flat) * r,
                 P.z + (N.z * cs + B.z * sn * flat) * r);
      if (grainRot) grainRot.push(grainPrev - o.grainFrom);
      // |sin a| is the face side of the ring, |cos a| the edge side
      if (reliefMask) reliefMask.push(0.22 + 0.78 * Math.pow(Math.abs(sn), 1.5));
      /* u MIRRORS at the half-ring rather than wrapping 0→2πr: a wrap has to
         spend the whole scan width again, backwards, inside the final ring
         segment — a stripe seam parked on the in-plane rim, which is the very
         face the turntable brings to camera. The mirror is continuous
         everywhere and costs only a symmetry no one can see in bark. v rides
         the arclength; both in tiles of the scan. */
      if (uvs) uvs.push((j <= RING / 2 ? j : RING - j) / RING * 2 * (3.1415 * radius / o.tile),
                        t * curveLen / o.tile);
    }
  }
  // Wind the rings so the faces point OUT. three builds its Frenet frames with
  // binormal = tangent cross normal, and going round the ring from the normal
  // towards the binormal with the path as the other edge gives a face normal of
  // exactly minus the radial direction. Wound the other way the whole tube is
  // inside out: front faces get culled, you see the inner wall of the far side
  // through it, and a solid stroke reads as a half-open pipe.
  for (let i = 0; i < STEPS; i++) {
    for (let j = 0; j < RING; j++) {
      const a = i * RING + j, b = i * RING + (j + 1) % RING;
      tris.push(a, b, a + RING, b, b + RING, a + RING);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  if (grainRot) g.setAttribute('aGrainRot', new THREE.Float32BufferAttribute(grainRot, 1));
  if (reliefMask) g.setAttribute('aReliefMask', new THREE.Float32BufferAttribute(reliefMask, 1));
  if (uvs) g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(tris);
  g.computeVertexNormals();
  return g;
}

/* ---------- colony ----------
   A stroke spawns many small parts along its own path, not one solid.

      const y = Math.random() * s;

      g.fillStyle = `rgba(${60 + Math.random() * 60},${58 + Math.random() * 60},${54 + Math.random() * 60},${Math.random() * 0.10})`;
      g.fillRect(0, y, s, Math.random() * 5 + 1);

      g.fillStyle = `rgba(255,255,255,${Math.random() * 0.5})`;
      g.fillRect(Math.random() * s, Math.random() * s, Math.random() * 26 + 2, 1.2);

/* A torn, curled shard of paint. It used to be a ShapeGeometry, which is a
   plane of no thickness: seen edge-on it vanished to a one-pixel line, and a

   body, then curled so it is a leaf and not a cut-out. */

  // repeated point is what makes the triangulator hand back nothing

    const t = i / N;

  const pos = g.attributes.position;

  }

  const parts = [];
  const n = Math.min(26, Math.max(6, Math.round(span / 16)));
  const gTex = gouache();
  for (let i = 0; i < n; i++) {
    const t = i / n;
