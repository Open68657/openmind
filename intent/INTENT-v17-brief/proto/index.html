  if (M.emissiveTrack && pick) {
    // a third of the way toward the second stop, not half: the midpoint of two
    // opposite hues is grey, and a grey light is a lamp rather than a colour
    mat.emissive = new THREE.Color(pick[0]).lerp(new THREE.Color(pick[1]), 0.33);
  }
  /* Ribs, cut after the colour and before the mesh: they are shape, and the
     swirl above is painted per vertex on positions these are about to move —
     which is fine in that order and wrong in the other, since the displacement
     would slide the colour across the form. */
  if (M.rib && geo) ribDisplace(geo, M._rot || 0, M.rib.freq ?? 20, M.rib.depth ?? 0.5);
  /* The sheet, laid on after the shape is final — including the facets, so the
     paper follows the rock rather than the rock being cut to suit the paper. The
     same map drives a shallow bump, which is where the fibre and the fold marks
     come from: the type must stay flat (ink has no thickness) but the PAPER is
     not flat, and without that the stone reads as printed rather than covered. */
  if (M.wrap && geo && map) {
    /* Rolled round the body rather than projected onto its front, and turned by
       the body's own angle so two of them side by side are not printed off the
       same square inch of the page. `wrapUVs` returns a new geometry — it goes
       non-indexed so each face can carry its own direction — so it is taken
       back rather than being assumed to have edited in place. */
    geo = wrapUVs(geo, 1 / M.tile, M.wrap.faceTurn ?? 1, seed,
                  M.wrap.steps === 0 ? (M._rot || 0) : null);
    mat.bumpMap = map;
    mat.bumpScale = M.wrap.bump ?? 0.25;
  }
  const core = cloud || new THREE.Mesh(geo, mat);
  // bodies throw and catch light on each other. Without this the colony just
  // floated in front of the core with nothing to say they were touching, which
  // is most of why the pile read as pasted-together layers instead of a solid.
  // glass is the exception: the shadow map knows nothing about refraction, so
  // a transmissive body would stamp a flat black disc where it should be
  // throwing light through itself
  /* A lamp does not cast a shadow, and it was casting two: a real one from the
     shadow map and a grey one from the ambient occlusion. Both are the same
     category error — those passes ask "what is blocked from reaching this
     surface", and a body that is itself a source is not blocking light, it is
     making it. The dark patch it laid on whatever stood beside it was the exact
     opposite of the halo it should be throwing. */
  /* Only a body that IS a light gets the exemption, which is not the same as a
     body that merely has lamps in it. Glitter carries sparks and is still an
     opaque object: it blocks the key light, so it casts a shadow and takes its
     occlusion like anything else. The neon is the source itself. */
  const isSource = !!M.lamps && !M.lamps.flash;
  core.castShadow = !glass && !isSource;
  /* And it cannot receive one either, which is the other half of the same fact.
     A shadow map answers one question per pixel — was this point reached by the
     lamp — and it answers it for an opaque surface. Painted onto a soap film the
     answer arrives as a grey patch sitting on the front of the bubble, as though
     something had been stencilled on it. What should happen when a body stands
     between the lamp and a bubble is that the bubble shows less of the room
     through itself, and the transmission pass already does that on its own. */
  core.receiveShadow = !glass;
  group.add(core);

  /* Light that lands on the neighbours, which is what "it does not feel like it
     emits light" actually meant.

     The references are all the same observation: a white body with red spikes on
     it goes PINK next to them, a cluster of green beads tints the shape it sits
     in. None of that is bloom — bloom is what a camera does — it is the object
     lighting the things around it. Emission in three does nothing of the kind: it
     adds to the pixels of the emitting surface and stops there, which is why a
     stroke could be as bright as it liked and still read as painted.

     So the body gets real lamps, strung along the stroke it was drawn as, in the
     colour it glows. Cheap ones: no shadows, a decay and a reach set from the
     body's own size, so they light what is beside them and do not wash the room.
     Capped hard, because every extra light is paid for by every material in the
     scene on every frame. */
  if (M.lamps && geo) {
    geo.computeBoundingBox();
    const bb = geo.boundingBox;
    /* Reach measured against the WINDOW and not against the stroke, which is the
       correction that made these visible at all. A lamp's distance is where its
       light is cut off entirely, and set to a couple of times the body's own
       size it stopped at the edge of the thing already glowing — so it lit
       nothing that was not already lit. What it has to cross is the gap to the
       NEIGHBOURS, and that gap is a fraction of the window however big the
       stroke happens to be. */
    const reach = Math.min(innerWidth, innerHeight) * VIEW * (M.lamps.reach ?? 0.9);
    /* What colour the lamps are. A body that glows lights the room in the colour
       it glows, so the tracked emissive wins — but a material with no emission at
       all has a BLACK one, and reading that literally gave lamps that emitted
       nothing. Black means "not set", not "black light". */
    const emHex = mat.emissive ? mat.emissive.getHex() : 0;
    const lit = new THREE.Color(
      (emHex && emHex !== 0xffffff) ? emHex : (M.lamps.colour ?? M.emissive ?? 0xffffff));
    /* A ceiling across the whole board, not just per body. Every light is paid
       for by every material on every frame, so a session that draws a dozen
       glowing strokes would quietly halve the frame rate — and the piece is
       drawn on for as long as somebody keeps drawing. Past the cap a body still
       glows, it simply stops lighting its neighbours; the cheap half of the
       effect survives and the expensive half is what gets dropped. */
    const room = Math.max(0, 12 - LAMP_COUNT);
    const count = Math.min(M.lamps.count ?? 3, 4, room);
    for (let i = 0; i < count; i++) {
      const t = count === 1 ? 0.5 : i / (count - 1);
      /* Intensity is in candela and falls off with the square of the distance, so
         the number that matters is what survives at the far end of `reach`. At a
         few hundred pixels the divisor is in the tens of thousands, which is why
         a value that looks enormous written down arrives as a blush on the body
         next door — which is exactly the amount wanted. `decay` is held under 2
         so it carries a little further than physics would allow: this is a lamp
         standing in for a glowing volume, not a point. */
      /* Scaled by the reach ONCE, not squared by it. Squared, a lamp with an
         800-pixel reach arrived at nearly four hundred thousand candela and lit
         the whole room orange — the cove, the floor and every body in it — which
         is a coloured studio, not an object that glows. What is wanted is a
         blush on whatever is standing next to it, which at these distances is a
         couple of thousand. */
      const lamp = new THREE.PointLight(lit, (M.lamps.power ?? 26) * reach * 0.06, reach, 1.5);
      /* Sparks: lamps that blink rather than burn. Glitter does not glow, it
         CATCHES — a flake turns into the lamp for a fraction of a second and is
         gone — so these sit inside the body, each on its own phase and its own
         speed, and spend most of their time at nothing. Kept as short bursts by
         raising the wave to a high power: at the eighth, a sine is dark for most
         of its cycle and briefly very bright, which is the shape of a catch. */
      if (M.lamps.flash) {
        lamp.userData.flash = {
          base: lamp.intensity, phase: Math.random() * 6.2832,
          speed: 0.9 + Math.random() * 2.6
        };
        FLASH_LAMPS.push(lamp);
      }
      LAMP_COUNT++;
      lamp.position.set(
        bb.min.x + (bb.max.x - bb.min.x) * t,
        bb.min.y + (bb.max.y - bb.min.y) * t,
        (bb.min.z + bb.max.z) * 0.5
      );
      lamp.castShadow = false;
      group.add(lamp);
    }
  }

  /* A halo was tried here and taken out again, which is worth a note so nobody
     builds it a second time.

     The reasoning was sound: emission alone cannot make a light in this room. A
     surface here competes with a beige cove already near the top of the range —
     below about two the glow disappears into it, above about two and a half all
     three channels clip together and the colour goes white, and there is no
     value that is both bright and coloured. What a photograph of a neon tube has
     that this lacks is the bloom AROUND it, so the fix looked like geometry: the
     same stroke, larger, additive, writing no depth.

     Additive means "add my colour to what is behind me", and what is behind
     everything here is a pale cove that is ALREADY near white. Adding to it
     clips, so the halo rendered as a hard white shape sitting beside the stroke.
     A glow needs somewhere dark to be seen against, and this room has none. If
     the piece ever gets a dark backdrop, or a real bloom pass, it is worth
     revisiting; against beige it cannot work at any opacity. */

  /* The coat, grown out of the body that was just built rather than along the
     line that made it. It has to come after the core for the plainest of
     reasons: there is no surface to plant anything in until the geometry is
     final, relief, ribs and all. */
  if (M.coat && geo) {
    const coat = needleCoat(geo, M, span, seed);
    if (coat) group.add(coat);
  }

  /* Colony: parts sprouting along the same path the hand drew — for the
     materials that want them. It used to be on everything, and that is most of
     why nine different profiles read as one family: the pointed leaves are the
     strongest mark in the picture and they were on every single body. Polished
     metal in particular has no business growing leaves; a mirror is a surface,
     and the whole of what it says is said by its edge. */
  const parts = M.colony === 0 ? [] : sproutColony(path, bcx, bcy, span, M, seed);
  parts.forEach(p => {
    p.mesh.castShadow = p.mesh.receiveShadow = true;
    group.add(p.mesh);
  });

  // Born where the hand drew it, on screen — regardless of how far the
  // sculpture has already turned. Convert the screen point into the
  // rotated group's local space, and counter-rotate so it faces front.
  // Each new body must clear everything already there, so the depth step
  // scales with the drawing — a fixed step lands new shapes inside old ones.
  // depth is what swings widest when the sculpture turns, so the step is kept
  // tight — enough to clear the body in front, not enough to throw this one
  // out of frame on the quarter turn
  zCursor += span * VIEW * 0.32 + 16;
  const w = toWorld(bcx, bcy);
  pile.updateMatrixWorld();
  const target = pile.worldToLocal(new THREE.Vector3(w.x, w.y, zCursor));
  /* What the frame is asked to hold is the shape that was drawn — not the
     colony that sprouts off it, which throws parts further sideways than the
     stroke is long. Counting those in makes any large shape wider than half the
     window, and then a line down the side of the frame is impossible to draw:
     there is no position that fits, so it gets hauled inward. So the drawn
     outline is what is guaranteed to stay in view, and colony parts are allowed
     to run off the edge. A sculpture that bleeds out of frame is a picture; one
     that has been slid to the middle is a broken tool. */
  group.position.copy(placeInFrame(target, a.w * 0.5 * VIEW, a.h * 0.5 * VIEW));
  group.rotation.y = -world.rotation.y;
  group.scale.setScalar(0.001);
  pile.add(group);

  bodies.push({
    mesh: group, parts, glass, born: performance.now(), dur: 620 + Math.random() * 200,
    // a source is exempt from occlusion, the same way glass is: see the mask pass
    lit: isSource,
    matName: M.name,     // which profile it actually came out as, for the dev readouts
    drawnAt: bcx,        // screen x of the drawn outline, for devWhere()
    shape: LAST_SHAPE,   // how angular the outline was judged, for devLast()
    phase: Math.random() * 6.283, breathe: 0.010 + Math.random() * 0.012,
    // generous: the colony throws parts well past the drawn outline
    radius: span * VIEW * 0.95,
    // the drawn outline's own half-width: what the pivot and the frame are
    // measured on, so neither is thrown off by a colony that sprouts to one side
    reachX: a.w * 0.5 * VIEW,
    // how much this one refuses to hold still
    liquid: M.liquid || 0,
    // and whether it refuses to hold a SHAPE, which is a different question
    flow: M.flow || 0,
    // and a cloud refuses in its own way: bead by bead
    cloud,
    // and whether it has to be taken out of its own reflection
    mirror
  });

  document.getElementById('readout').textContent =
    `${label}  ·  ${M.name}${demoted ? ' (ללא שקיפות)' : ''}  ·  ${parts.length} parts\nround ${a.round.toFixed(2)}  corner ${a.corner.toFixed(2)}  closed ${a.closed}\nbodies ${bodies.length}`;
  idle = 0; spinning = false;
}

/* ---------- loop ---------- */
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
let idle = 0, spinning = false, spinVel = 0, SPIN_LOCK = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* There is no depth squeeze any more, and removing it is the fix rather than a
   simplification.

   It used to cap the pile's z range at 0.22 of the window and rescale every body
   into it, justified like this: the camera is orthographic, so depth costs
   nothing on the front view, and flattening the stack changes the turn while
   leaving the drawing untouched pixel for pixel.

   That is true at exactly one angle. Turned a quarter, local z IS screen x — so
   the axis being squashed is the one now carrying the composition's width, and
   the whole piece collapses toward its middle. Measured: two bodies drawn 354
   pixels apart sat 17 apart once the sculpture reached 90 degrees. It also did
   this by moving bodies that were already placed, which is the one thing this
   piece is not allowed to do.

   Nothing is needed in its place. placeInFrame already bounds hypot(x, z), the
   radius a body swings on, against the room the window has — so depth cannot run
   away on its own, and it is bounded by the same measure the width is, instead
   of by a tighter one that only looked free because it was measured head-on. */

/* Move the axis to the sculpture, never the sculpture to the axis.

   The turn needs its axis to run through the middle of the cluster, or the
   whole composition orbits the centre of the window instead of turning in
   place. The obvious way to get that is to slide the cluster onto the axis —
   which is what this did, and it is why a shape drawn at the side crept to the
   middle a second later. The drawing was being moved to suit the axis.

   The axis can be moved instead, and for free. A body's screen position is
   world.position + R·local, so shifting the pivot by R·c while taking c off
   every local position leaves every term of that sum unchanged: nothing moves
   by a pixel, and the turn is now about c. The rotation has to be applied to
   the shift because the pivot sits outside it — that is the whole point of it.

   x and z only. y is left alone: a turn about y never moves it, and nudging it
   would slide the composition up and down for no reason. */
function repivot() {
  if (!bodies.length) return;
  let lox = Infinity, hix = -Infinity, loz = Infinity, hiz = -Infinity;
  for (const b of bodies) {
    // reachX, not radius: a tall stroke is narrow, and calling it as wide as it
    // is long pushes the pivot off the middle of what is actually on screen
    lox = Math.min(lox, b.mesh.position.x - b.reachX); hix = Math.max(hix, b.mesh.position.x + b.reachX);
    loz = Math.min(loz, b.mesh.position.z); hiz = Math.max(hiz, b.mesh.position.z);
  }
  const cx = (lox + hix) / 2, cz = (loz + hiz) / 2;
  // it converges to nothing the moment the cluster is centred on its own pivot,
  // so this runs every frame and costs a compare for all but the first one
  if (Math.abs(cx) < 0.01 && Math.abs(cz) < 0.01) return;

  for (const b of bodies) { b.mesh.position.x -= cx; b.mesh.position.z -= cz; }
  const shift = new THREE.Vector3(cx, 0, cz).applyQuaternion(world.quaternion);
  world.position.x += shift.x;
  world.position.z += shift.z;
}

/* Where a new body is allowed to land, so that it can never swing out of frame.

   The choice here was between zooming the whole sculpture out to make room, and
   pulling the new shape in. Zooming out is the easy one to write and the wrong
   one to look at: every stroke visibly shrinks everything already standing, so
   the piece keeps retreating from you as you work on it. Pulling in costs one
   thing only, and only at the edges — a shape drawn right at the border lands a
   little inside it — and everything already placed is left exactly as it was.

   What crops a body is not where it sits but how far it swings. The turn is
   about y, so a body travels a circle about the pivot whose radius is its own
   distance from it: a shape sitting happily inside the window head-on can be
   well outside it a quarter turn later. Clamping that radius rather than the
   current x is what makes this hold for the whole rotation instead of for one
   frame of it.

   Since repivot() keeps the pivot in the middle of the cluster and the pivot
   itself does not turn, the widest a body ever reaches is the pivot's own
   offset plus that radius — so the room left for it is measured from there.
   The bound is honest for the composition as it stands and no further: putting
   the next shape down moves the pivot, and an earlier body can end up reaching
   a little wider than it was cleared for. Nothing already placed is touched to
   fix that up, which is the trade this whole function is built on. */
function placeInFrame(local, reachX, reachY) {
  const halfW = innerWidth / 2 * VIEW, halfH = innerHeight / 2 * VIEW;

  const maxY = Math.max(reachY * 0.4, halfH * 0.94 - reachY);
  if (Math.abs(local.y) > maxY) local.y = Math.sign(local.y) * maxY;

  /* The swing has to be measured against the pivot as it will be once repivot()
     has taken this body in — which happens on the very next frame. Measuring it
     against the pivot as it stands now is measuring a swing that is about to be
     redistributed, and it is why a lone shape drawn near the edge was hauled
     inward: the axis was about to land on it, so it was never going to swing at
     all. Two passes, because moving the shape moves the pivot it was measured
     against; the second one is already within a pixel or two. */
  /* Every pass measures the pull against the position the hand actually drew,
     never against the result of the pass before it. That distinction is the
     whole bug: the cap below allows a fifth off the drawn offset, but applied
     to its own output it takes a fifth of a fifth as well, and a third pass
     would take more again. Four shapes laid across the window came back visibly
     squeezed toward the middle, each one displaced further than the last, and
     the leftmost still clipped — pulled in, and for nothing.

     Iterating is still needed, because the centre a shape is measured against
     moves once that shape joins the cluster. So the estimate of the centre
     converges while the offset being scaled stays fixed at what was drawn. */
  const x0 = local.x, z0 = local.z;
  let cx = 0, cz = 0;
  for (let pass = 0; pass < 3; pass++) {
    let lox = local.x - reachX, hix = local.x + reachX;
    let loz = local.z, hiz = local.z;
    for (const b of bodies) {
      lox = Math.min(lox, b.mesh.position.x - b.reachX); hix = Math.max(hix, b.mesh.position.x + b.reachX);
      loz = Math.min(loz, b.mesh.position.z); hiz = Math.max(hiz, b.mesh.position.z);
    }
    cx = (lox + hix) / 2; cz = (loz + hiz) / 2;
    const shift = new THREE.Vector3(cx, 0, cz).applyQuaternion(world.quaternion);
    const dx = x0 - cx, dz = z0 - cz;
    const rho = Math.hypot(dx, dz);
    if (rho < 1e-6) break;
    const room = halfW * 0.94 - Math.abs(world.position.x + shift.x) - reachX;
    /* A fifth off the drawn offset, and no more.

       Pulling as far as it takes so that nothing is ever clipped was tried here
       and measured worse at the only thing that matters: shapes drawn across the
       window moved 92, 107 and 124 pixels toward the middle, against 4, 18, 35
       and 59 under this cap. Version 3 could afford the stricter rule because it
       also recentred the whole pile every frame, which kept the pull symmetric —
       and recentring is itself the "it jumps to the middle" this is trying to
       avoid. With the pivot free to sit where the drawing put it, an unbounded
       pull just drags each new shape onto the ones already down.

       So past a fifth the composition is wider than the window and gets to say
       so. Clipping at the edge beats folding the drawing into its own middle. */
    const maxRho = Math.max(rho * 0.8, room);
    const k = rho > maxRho ? maxRho / rho : 1;
    const nx = cx + dx * k, nz = cz + dz * k;
    const settled = Math.abs(nx - local.x) < 0.5 && Math.abs(nz - local.z) < 0.5;
    local.x = nx; local.z = nz;
    if (settled) break;
  }
  return local;
}

let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  idle += dt;
  if (idle > 1.4 && bodies.length && !SPIN_LOCK) spinning = true;
  spinVel += ((spinning && !reduce ? 0.22 : 0) - spinVel) * 0.03;
  world.rotation.y += spinVel * dt;
  repivot();

  const tSec = now * 0.001;
  /* The twinkle's clock. One number per frame for the whole library, since a
     material that does not sparkle reads it as zero and ignores it — and a body
     that has finished arriving is still not finished moving, which is the
     difference between a piece that is alive and a photograph of one. */
  if (!reduce) for (const m of TRI_MATS) {
    const u = m.userData.tri;
    if (u && u.uTime) u.uTime.value = tSec;
  }
  // and the sparks, each on its own clock, dark most of the time
  if (!reduce) for (const l of FLASH_LAMPS) {
    const f = l.userData.flash;
    l.intensity = f.base * Math.pow(Math.sin(tSec * f.speed + f.phase) * 0.5 + 0.5, 8);
  }
  for (const b of bodies) {
    const age = (now - b.born) / b.dur;
    /* A cloud grows bead by bead rather than as a whole, so its group is left at
       full size and the growth happens inside — otherwise the two would multiply
       and the thing would arrive twice. */
    if (b.cloud) {
      stirCloud(b.cloud, reduce ? 0 : tSec, Math.min(1.0001, age));
      b.mesh.scale.setScalar(1);
      continue;
    }
    const t = Math.min(1, age);
    const grow = easeOutBack(t);
    const br = reduce ? 1 : 1 + Math.sin(now * 0.0011 + b.phase) * b.breathe;
    /* Breathing was one number on all three axes, which is not breathing — a
       body scaled evenly is a body being zoomed, and the eye reads camera rather
       than life. A drop of liquid metal holds its own shape against gravity and
       loses, slowly, in one direction at a time. Three sines at three periods
       that do not divide into each other never repeat, and each axis takes its
       turn being the long one; on a mirror the reflection slides while the
       silhouette barely moves, which is exactly how a heavy liquid reads. */
    // the shape itself drifting, for the one profile that is a liquid rather
    // than a body that behaves a bit like one
    if (b.flow && !reduce && b.mesh.children[0] && b.mesh.children[0].isMesh) {
      flowMesh(b.mesh.children[0], tSec, b.flow);
    }
    if (b.liquid && !reduce) {
      /* Two speeds, because one was invisible. The slow term is the breath — a
         seven-second drift of a few percent, which is the right size for a heavy
         drop settling and, on its own, right at the threshold where nothing
         reads as moving at all. The quick term is the quiver: about a second,
         and it is what makes jelly jelly. A bubble gets almost none of it, since
         a film has no mass to overshoot with; the jelly and the metal do. */
      const w = b.liquid * 0.055;
      // the quick term was a second per cycle, which is not a quiver but a pulse
      // — a heartbeat, and a body with a heartbeat is alive in the wrong way.
      // Slowed to two and a half seconds and cut by half: at that speed it reads
      // as mass that has not finished settling
      const q = w * (b.liquid >= 0.85 ? 0.28 : 0.08);
      b.mesh.scale.set(
        grow * (br + Math.sin(now * 0.00091 + b.phase) * w + Math.sin(now * 0.0025 + b.phase * 3.0) * q),
        grow * (br + Math.sin(now * 0.00117 + b.phase * 1.7 + 2.1) * w + Math.sin(now * 0.0029 + b.phase * 4.1) * q),
        grow * (br + Math.sin(now * 0.00143 + b.phase * 2.3 + 4.2) * w + Math.sin(now * 0.0022 + b.phase * 5.3) * q));
    } else {
      b.mesh.scale.setScalar(grow * br);
    }
    // parts sprout one after another along the path, not all at once
    if (b.parts) for (const p of b.parts) {
      const pt = Math.max(0, Math.min(1, (age - p.delay) / 0.8));
      p.mesh.scale.setScalar(easeOutBack(pt) * 0.999 + 0.001);
    }
  }
  /* Every frame. It ran at one in four to save the six renders a cube costs, on
     the reasoning that a slow cluster does not need a fresher reflection than
     that — and the reasoning was wrong, because the mirror itself is never still.
     It turns, and it breathes, so a reflection held for four frames lags the
     surface carrying it and then catches up in a jump: the stutter. Measured
     first rather than guessed: 18 bodies were running at 120fps with the worst
     frame at 9.2ms, so the headroom was there all along, and the resolution came
     down to 192 to pay for the extra passes. */
  // the rim has to know where the lamp is, in the space the shader works in —
  // and the panel can swing the lamp, so this cannot be set once at build time
  RIM.dir.copy(key.position).normalize().transformDirection(camera.matrixWorldInverse);
  updateMirror();
  renderGel();
  renderAO();
  renderGlassLayers();
  renderer.render(scene, camera);
  compositeAO();
  // after the composite, so what is read back is the finished picture and not
  // the pass before the occlusion is laid over it
  if (bgSolveLeft > 0) solveBackdrop();
  requestAnimationFrame(frame);
}

/* ---------- handing the sculpture to a real renderer ----------
   Everything above is as far as a browser goes. The references this is chasing
   are path-traced: the light in them bounces, and that is a different technique
   rather than a setting, so the last stretch has to happen offline.

   This writes the pile out as a GLB to open in Cinema 4D and light with an HDRI
   under Redshift. Geometry and transforms only, deliberately. The look here is
   carried by a triplanar shader patched in through onBeforeCompile, which no
   interchange format can describe, and these bodies carry no UVs at all — the
   whole point of projecting from three axes is that they never needed any. So
   the materials travel as names on empty slots, and get rebuilt on the other
   side against the same scans in textures/, where C4D's own triplanar projection
   picks up where this leaves off.

   The turn is divided back out, so the file opens in the orientation it was
   drawn in rather than wherever the idle spin happened to be. */
async function exportGLB() {
  const btn = document.getElementById('export');
  const was = btn.textContent;
  let GLTFExporter;
  try {
    ({ GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js'));
  } catch (e) {
    // the shareable build is a classic script with no importmap behind it, so
    // there is nothing to resolve this against there
    btn.textContent = 'לא זמין כאן';
    setTimeout(() => { btn.textContent = was; }, 2200);
    return;
  }
  if (!bodies.length) return;
  btn.textContent = 'מייצא…';

  const out = new THREE.Scene();
  out.name = 'INTENT';
  world.updateMatrixWorld(true);
  const unturn = world.matrixWorld.clone().invert();
  const m4 = new THREE.Matrix4();
  // one slot per material name. Every shard builds its own material instance so
  // it can carry its own hue, and exported as-is that arrives in C4D as two
  // dozen near-identical slots to assign by hand. The variation gets rebuilt on
  // the Redshift side anyway, so what is worth carrying across is the family.
  const slots = new Map();
  pile.traverse(o => {
    if (!o.isMesh) return;
    const src = o.material;
    const name = src.name || 'part';
    let slot = slots.get(name);
    if (!slot) {
      slot = new THREE.MeshStandardMaterial({
        name,
        color: src.color ? src.color.clone() : new THREE.Color(0xffffff),
        roughness: src.roughness ?? 0.8,
        metalness: src.metalness ?? 0
      });
      slots.set(name, slot);
    }
    const copy = new THREE.Mesh(o.geometry, slot);
    copy.name = name + '_' + out.children.length;
    m4.multiplyMatrices(unturn, o.matrixWorld).decompose(copy.position, copy.quaternion, copy.scale);
    out.add(copy);
  });

  new GLTFExporter().parse(out, buf => {
    const url = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
    const a = document.createElement('a');
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    a.href = url;
    a.download = `intent-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.glb`;
    a.click();
    URL.revokeObjectURL(url);
    btn.textContent = was;
  }, err => {
    console.error(err);
    btn.textContent = 'נכשל';
    setTimeout(() => { btn.textContent = was; }, 2200);
  }, { binary: true });
}

/* ---------- controls ---------- */
document.getElementById('export').addEventListener('click', exportGLB);

/* TEMPORARY — devScene() dumps everything a fault needs to be diagnosed from,
   so a thing seen once on screen does not have to be described in words and
   guessed at. Run it while the fault is visible and paste the result back.

   It carries what usually turns out to matter: which materials are actually on
   screen and their real flags (a body that "looks half transparent" is either
   flagged transparent or it is not, and that alone splits the search in two),
   the rotation the fault was seen at, what each body came out as, and the state
   of every dial. */
window.devScene = () => {
  const mats = [];
  const seen = new Set();
  eachBodyMat(m => {
    const k = [m.name, m.transparent, m.opacity, m.depthWrite, m.transmission, m.side].join('|');
    if (seen.has(k)) return;
    seen.add(k);
    mats.push({ material: m.name || '(unnamed)', transparent: m.transparent, opacity: m.opacity,
                depthWrite: m.depthWrite, depthTest: m.depthTest, side: m.side,
                transmission: +(m.transmission || 0).toFixed(2), iridescence: +(m.iridescence || 0).toFixed(2),
                envMapIntensity: m.envMapIntensity });
  });
  return {
    angle: +world.rotation.y.toFixed(3),
    bodies: bodies.map(b => ({ material: b.matName, glass: !!b.glass, mirror: !!b.mirror,
                               cloud: !!b.cloud, parts: b.parts ? b.parts.length : 0 })),
    materialsOnScreen: mats,
    dials: { gel: tuneGel({}), rim: tuneRim({}), film: tuneRimFilm({}), depth: tuneDepth({}),
             mirror: tuneMirror({}), glassDepthComp: GLASS_DEPTH_COMP, ao: tuneAO({}) },
    caps: devCaps(),
    lastBody: (() => { try { return JSON.parse(devLast()); } catch (e) { return null; } })()
  };
};

/* ---------- devCheck: the faults that came back ----------

   Every entry here is something that was reported, fixed, and then reported
   AGAIN in a later form, usually because the fix was right and something
   downstream quietly undid it or a neighbouring change moved the measurement
   out from under it. A comment saying "a square is a cube now" does not survive
   the next person who touches the depth; a number that fails out loud does.

   So each one is the smallest measurement that would have caught the fault, with
   the threshold set where the fault actually sat rather than at a round number.
   Run it before freezing a version, and after touching shape, depth, glass or
   the mirror. It draws and then clears, so it costs the canvas and nothing else.

     await devCheck()          everything
     await devCheck('depth')   one group: shape | depth | tear | glass | mirror | light

   It is async because one of the checks reads a render target, which holds the
   previous frame and therefore has to be given one.

   A failing row carries what it measured and what it wanted, so it says which
   way it moved rather than only that it moved. */
window.devCheck = async (only) => {
  const rows = [];
  const wipe = () => document.getElementById('clear').click();
  const add = (group, name, pass, measured, wanted) =>
    rows.push({ group, check: name, pass: !!pass, measured, wanted });
  const ring = (f, n = 140, cx = 340, cy = 340) => {
    const p = [];
    for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2; const r = f(a);
      p.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }); }
    return p;
  };
  const box = (w, h, per = 26, cx = 340, cy = 340) => {
    const p = [], c = [[-1,-1],[1,-1],[1,1],[-1,1]];
    for (let s = 0; s < 4; s++) { const a = c[s], b = c[(s + 1) % 4];
      for (let i = 0; i < per; i++) { const t = i / per;
        p.push({ x: cx + (a[0] + (b[0]-a[0]) * t) * w / 2, y: cy + (a[1] + (b[1]-a[1]) * t) * h / 2 }); } }
    p.push({ ...p[0] }); return p;
  };
  /* The one outline shape that is not a simple closed curve, and the reason it
     needs its own generator: `ring` takes a radius per angle, and no function of
     one angle can cross itself. `kL`/`kR` scale the two lobes independently,
     because the fault this guards against was decided by which lobe won the
     total signed area — with equal lobes a build could fail it and still pass by
     luck. Gerono's lemniscate, which passes through its own centre at t=0 and
     t=pi, so the crossing lands exactly on a vertex: that is the awkward case,
     and the first version of the splitter missed every one of them. */
  const eight = (a = 150, kL = 1, kR = 1, n = 200, cx = 340, cy = 340) => {
    const p = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n * Math.PI * 2;
      const x = a * Math.sin(t), y = a * 0.85 * Math.sin(t) * Math.cos(t);
      const k = x >= 0 ? kR : kL;
      p.push({ x: cx + x * k, y: cy + y * k });
    }
    return p;
  };
  const draw = (mat, pts) => { wipe(); devMaterial(mat); birth(pts.slice()); return JSON.parse(devLast()); };
  const want = g => !only || only === g;

  /* Shape. The measurement that has now been wrong three separate times, each
     time looking like a tuning problem: an elongated smooth outline must not
     read as cornered. A 3:1 ellipse once scored MORE angular than a square. */
  if (want('shape')) {
    const circle = draw('jelly', ring(() => 120));
    add('shape', 'a drawn circle is not angular', circle.shape.angularity <= 0.05, circle.shape.angularity, '<= 0.05');
    const ell = draw('jelly', ring(a => 120 / Math.hypot(Math.cos(a) / 2.6, Math.sin(a)) * 0.62));
    add('shape', 'a smooth 3:1 ellipse is not angular', ell.shape.angularity <= 0.05, ell.shape.angularity, '<= 0.05');
    const sq = draw('tuff', box(220, 220));
    add('shape', 'a square is fully angular', sq.shape.angularity >= 0.95, sq.shape.angularity, '>= 0.95');
    const rect = draw('tuff', box(300, 100));
    add('shape', 'a 3:1 rectangle is fully angular', rect.shape.angularity >= 0.95, rect.shape.angularity, '>= 0.95');
  }

  /* Depth. Round things come back round; carved things do not come back deeper
     than they are wide. Both ends have drifted before. */
  if (want('depth')) {
    const circle = draw('jelly', ring(() => 120));
    add('depth', 'a circle returns a ball', Math.abs(circle.depthOverWidth - 1) <= 0.08, circle.depthOverWidth, '1.00 +/- 0.08');
    const sq = draw('tuff', box(220, 220));
    add('depth', 'a square returns a cube', Math.abs(sq.depthOverWidth - 1) <= 0.08, sq.depthOverWidth, '1.00 +/- 0.08');
    const ell = draw('jelly', ring(a => 120 / Math.hypot(Math.cos(a) / 2.6, Math.sin(a)) * 0.62));
    add('depth', 'an oval is a solid, not a slab', ell.depthOverShortSide >= 0.55, ell.depthOverShortSide, '>= 0.55');
    const rect = draw('tuff', box(300, 100));
    add('depth', 'a carved block is not deeper than wide', rect.depthOverWidth <= 0.85, rect.depthOverWidth, '<= 0.85');
  }

  /* Tears. A closed outline encloses a solid — for ANY closed outline, which is
     the part that kept being only nearly true. Zero thickness inside is a slit
     you can see the room through, invisible in stone and glaring in glass. */
  if (want('tear')) {
    const cases = {
      'wobbly blob':  ring(a => 120 * (1 + 0.13 * Math.sin(a * 3 + 0.7) + 0.07 * Math.sin(a * 5 + 2.1))),
      'deep 5-lobe':  ring(a => 120 * (1 + 0.30 * Math.sin(a * 5 + 1.1))),
      'peanut':       ring(a => 130 * (1 - 0.46 * Math.abs(Math.cos(a)))),
      'crescent':     ring(a => 120 * (1 - 0.55 * Math.max(0, Math.cos(a - 1.2)))),
      '6-point star': ring(a => 120 * (1 + 0.42 * Math.sin(a * 6))),
      'teardrop':     ring(a => 120 * (1 + 0.45 * Math.cos(a)) / 1.4)
    };
    for (const [name, pts] of Object.entries(cases)) {
      draw('seaglass', pts);
      const t = devField(1).thinnestInterior;
      add('tear', 'no tear: ' + name, t >= 0.15, t, '>= 0.15');
    }

    /* An 8, on a threshold of its own — and the threshold is the whole point.

       This belongs in this group because "a closed outline encloses a solid" was
       true of every shape above and false of this one, which is how it survived:
       the fill is earcut, earcut is undefined on a self-crossing polygon, and it
       takes one winding for the whole contour from the total signed area, so the
       lobe that disagreed came back wound backwards and you could see the room
       through it. Measured on the broken build as the share of each lobe's own
       interior still showing backdrop: 25.0% and 91.4% on the symmetric 8.

       THE FIRST VERSION OF THIS ROW WAS USELESS AND WAS CAUGHT BEING USELESS.
       It sat in the loop above on the shared 0.15, and the broken build scored
       0.2109 / 0.1607 / 0.1607 — worse than every honest shape and still a pass.
       A guard that goes green on the build it was written for is not a guard. So
       it was run against the unfixed file on a separate port before being kept,
       and the threshold set where the two populations actually separate:

           broken   0.16 - 0.21
           fixed    0.3366  (all three, which is itself the tell: once the lobes
                             are split each is measured on its own and the lobe
                             ratio stops mattering)

       0.28 sits between them with room on both sides, and below every one of the
       six shapes above, so it is not a stricter demand than the group already
       makes — it is the same demand, with a number that can tell the difference.

       Three cases, because one would pass by luck: the hollow lobe was always
       the SMALLER one, so equal lobes is the case least likely to show it. The
       two lopsided pairs are the test; the symmetric one is there because it is
       what a hand actually draws. */
    const eights = {
      'figure 8':            eight(150, 1.00, 1.00),
      'figure 8, big right': eight(150, 0.62, 1.35),
      'figure 8, big left':  eight(150, 1.35, 0.62)
    };
    for (const [name, pts] of Object.entries(eights)) {
      draw('seaglass', pts);
      const t = devField(1).thinnestInterior;
      add('tear', 'no tear: ' + name, t >= 0.28, t, '>= 0.28 (broken build scored 0.16 - 0.21)');
    }
  }

  /* Glass. Two separate things that both read to the eye as "the glass has gone
     wrong": the occlusion pass printing the pile onto the front of it, and the
     thin film blowing out over a dark body until it reads as a hole. */
  if (want('glass')) {
    wipe();
    devMaterial('tuff');   birth(ring(() => 95, 140, 250, 300));
    devMaterial('bubble'); birth(ring(() => 120, 140, 340, 360));
    // the mask is a render target: it holds the LAST frame, and the bodies
    // above were made between frames. Reading it now measures the empty scene
    // before them — which is a fault in the test, and read as a fault in the
    // code the first time this ran
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const mask = devGlassMask();
    const worst = mask.glassBodies.length ? Math.min(...mask.glassBodies.map(b => b.maskedFraction)) : 1;
    // a round body fills pi/4 of its own box, so 0.70 is full cover
    add('glass', 'occlusion is masked off the glass', worst >= 0.70, worst, '>= 0.70 (a disc fills 0.785)');
    /* And the mask has to STOP at whatever stands in front of the glass. Hiding
       the opaque bodies to render only the glass threw away the depth test, so
       the mask covered every transmissive body whether or not it could be seen —
       and the composite then lifted the occlusion off the opaque body in front,
       in a hard-edged patch shaped like the glass hiding behind it. That is what
       "the sponge looks half transparent, and torn" was. */
    wipe();
    devMaterial('bubble'); birth(ring(() => 70, 140, 345, 335));
    devMaterial('sponge'); birth(ring(() => 135, 140, 345, 335));
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const buried = devGlassMask().glassBodies;
    const leak = buried.length ? Math.max(...buried.map(b => b.maskedFraction)) : 0;
    add('glass', 'buried glass is not in the mask', leak <= 0.02, leak, '<= 0.02 (it was 0.76)');
    let film = 0;
    eachBodyMat(m => { if (m.iridescence > film) film = m.iridescence; });
    add('glass', 'thin film below its blow-out point', film <= 0.50, film, '<= 0.50');
    let atten = null;
    eachBodyMat(m => { if (m.name === 'jelly' && m.attenuationDistance) atten = m.attenuationDistance; });
    add('glass', 'shallow glass keeps its colour', GLASS_DEPTH_COMP > 0, GLASS_DEPTH_COMP, '> 0');

    /* AND THE EQUALISER MUST NOT COST FRAME-TO-FRAME STABILITY (9 Aug 26).

       The bubbles flickering while the sculpture turns was traced to the
       equaliser and then declared fixed on the strength of a scene that could
       not have shown the fault: three bubbles over an empty cove, where the
       opaque backdrop is very nearly uniform and the correction therefore has
       almost nothing to do. Put anything textured behind the glass and the
       local mean genuinely swings as it rotates, the correction follows it at
       unity gain, and the swing arrives on the front of the pane. Measured in a
       busy scene with the tent already in: median frame-to-frame disturbance
       0.43 with the equaliser off against 0.84 with it on, p95 1.48 against
       2.49 — twice the instability, right across the distribution.

       So the guard is a RATIO against the same turn with the dial at zero, not
       an absolute number: a busy scene is never still, and only the share of the
       movement that the equaliser adds is this row's business. It is measured
       here rather than left to the eye because the eye already passed it once. */
    {
      wipe();
      devMaterial('moss');   birth(ring(() => 120, 140, 300, 330));
      devMaterial('sponge'); birth(ring(() => 105, 140, 430, 370));
      devMaterial('bubble'); birth(ring(() =>  95, 140, 315, 320));
      devMaterial('bubble'); birth(ring(() =>  85, 140, 420, 355));
      // a body arrives growing, and growth measured as instability would drown
      // the thing being looked for
      await new Promise(r => setTimeout(r, 1300));
      /* Every frame wait in here is raced against a clock, because a hidden tab
         does not run requestAnimationFrame at all — and a row that waits forever
         does not fail devCheck, it WEDGES it, with no output and nothing to read.
         That is exactly what happened while this was being written: the preview
         pane stopped painting, document.hidden went true, and the whole run
         stalled on a frame that was never going to arrive. A measurement that
         cannot be taken has to say so and let the rest of the suite finish. */
      let stalled = false;
      const crop = () => new Promise(res => {
        let done = false;
        const timer = setTimeout(() => { if (!done) { done = true; stalled = true; res(null); } }, 1500);
        const orig = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = cb => orig(t => { cb(t); window.requestAnimationFrame = orig;
          if (done) return;
          done = true; clearTimeout(timer);
          const c = [...document.querySelectorAll('canvas')].find(x => x.id !== 'draw');
          const w = Math.round(c.width * 0.5), h = Math.round(c.height * 0.4);
          const o = document.createElement('canvas'); o.width = w; o.height = h;
          o.getContext('2d').drawImage(c, Math.round(c.width * 0.15), Math.round(c.height * 0.28),
                                       w, h, 0, 0, w, h);
          res(o.getContext('2d').getImageData(0, 0, w, h).data); });
      });
      /* Turned by hand and not by the idle spin: the same angle every frame, so
         the reading does not depend on how the frames happened to be paced while
         it ran. 0.0037 rad is what the idle spin covers in a sixtieth of a
         second, so this is the motion the sculpture actually makes. */
      const shake = async n => {
        const H = []; let prev = null, ang = 0.2;
        for (let i = 0; i < n; i++) {
          if (stalled) return null;
          devAngle(ang); ang += 0.0037;
          const cur = await crop();
          if (!cur) return null;
          if (prev) {
            let hot = 0, px = 0;
            for (let k = 0; k < cur.length; k += 4) {
              const d = Math.abs(cur[k] - prev[k]) + Math.abs(cur[k + 1] - prev[k + 1])
                      + Math.abs(cur[k + 2] - prev[k + 2]);
              px++; if (d > 60) hot++;
            }
            H.push(100 * hot / px);
          }
          prev = cur;
        }
        H.sort((x, y) => x - y);
        return H[H.length >> 1];
      };
      const eqWas = glassBodyUniforms.uGlassEq.value;
      glassBodyUniforms.uGlassEq.value = 0;
      const control = await shake(36);
      glassBodyUniforms.uGlassEq.value = eqWas;      // restored before anything can throw
      const live = control === null ? null : await shake(36);
      devAngle(0);
      if (control === null || live === null) {
        // not a pass and not a failure: no frames were drawn, so nothing was seen
        add('glass', 'the exposure equaliser does not flicker', false, 'no frames — run it in a visible window',
            '<= 1.40x the same turn with the dial at zero');
      } else {
        const cost = +(live / Math.max(control, 1e-3)).toFixed(2);
        add('glass', 'the exposure equaliser does not flicker', cost <= 1.4, cost,
            '<= 1.40x the same turn with the dial at zero');
      }
    }
  }

  /* Mirror. The reflection is sampled where the mirror is, it can see close
     enough to have neighbours in it, and glass never enters the cube as itself
     — the three separate reasons chrome has looked wrong. */
  if (want('mirror')) {
    wipe();
    devMaterial('moss');   birth(ring(() => 85, 140, 200, 280));
    devMaterial('chrome'); birth(ring(() => 110, 140, 350, 380));
    add('mirror', 'the cube is sampled at the mirror', MIRROR_NEAR <= 20, MIRROR_NEAR, 'near <= 20 so neighbours are not clipped');
    add('mirror', 'cube is fine enough not to step', MIRROR_RES >= 384, MIRROR_RES, '>= 384');
    add('mirror', 'a mirror was actually built', MIRRORS.length > 0, MIRRORS.length, '> 0');
  }

  /* Light through, and light stopped. Both of these were reported more than
     once and neither is visible in a number the geometry knows — they only
     exist on screen, so these read pixels. Slower than the rest; devCheck is a
     thing you run before freezing, not every keystroke. */
  if (want('light')) {
    const grab = () => new Promise(res => {
      const orig = window.requestAnimationFrame.bind(window);
      window.requestAnimationFrame = cb => orig(t => { cb(t); window.requestAnimationFrame = orig;
        const c = [...document.querySelectorAll('canvas')].find(x => x.id !== 'draw');
        const o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
        o.getContext('2d').drawImage(c, 0, 0);
        res(o.getContext('2d').getImageData(0, 0, c.width, c.height)); });
    });
    const boxRGB = async (x0, x1, y0, y1) => {
      const im = await grab(), w = im.width, h = im.height;
      let r = 0, g = 0, b = 0, n = 0;
      for (let y = (h*y0)|0; y < (h*y1)|0; y++) for (let x = (w*x0)|0; x < (w*x1)|0; x++) {
        const i = (y*w+x)*4; r += im.data[i]; g += im.data[i+1]; b += im.data[i+2]; n++; }
      return [r/n, g/n, b/n];
    };
    const settle = ms => new Promise(r => setTimeout(r, ms));

    wipe();
    const bareGround = await boxRGB(0.03, 0.18, 0.80, 0.93);
    devMaterial('moss'); birth(ring(() => 130, 140, 340, 330));
    await settle(900);
    const behind = await boxRGB(0.42, 0.58, 0.42, 0.58);
    devMaterial('bubble'); birth(ring(() => 105, 140, 340, 330));
    await settle(1400);
    const through = await boxRGB(0.42, 0.58, 0.42, 0.58);
    const sig = (behind[1] - behind[0]) || 1;
    const showThrough = +(((through[1] - through[0]) / sig)).toFixed(3);
    /* 0.35, down from 0.55, by the same 7 August decision that set the
       exposure equaliser to full strength: equal exposure outranks how much
       of a dark body's colour survives the lift, and at full strength the
       healthy reading here is ~0.42. The row still guards the fault it was
       born for — the film blowing out until the body reads as a hole — which
       lives well below 0.35. */
    add('light', 'glass shows what stands behind it', showThrough >= 0.35, showThrough, '>= 0.35 (crystal 0.78, flat film 0.46)');
    /* And the body has to BE there. A shader patch that fails to compile makes
       three drop the material silently, and a body that is not drawn scores a
       perfect 1.000 on the test above — which is exactly what happened once,
       and the number was believed. */
    const drawn = Math.abs(through[0] - bareGround[0]) + Math.abs(through[1] - bareGround[1]);
    add('light', 'the glass body is actually drawn', drawn > 12, +drawn.toFixed(1), '> 12 away from bare backdrop');

    /* The two rows below sample the LAST BODY'S OWN BOX via devBox, not a box
       parked in screen fractions. The fixed box has already lied here once:
       placeInFrame moves the composition after it is drawn, the parked box
       stays where the hand was, and what it reads there is the backdrop —
       which scored one of these rows as passing on a scene it never saw. */
    const lastBodyRGB = async () => {
      const bb = devBox();
      const mx = (bb.x0 + bb.x1) / 2 / innerWidth, my = (bb.y0 + bb.y1) / 2 / innerHeight;
      const hw = (bb.x1 - bb.x0) * 0.18 / innerWidth, hh = (bb.y1 - bb.y0) * 0.18 / innerHeight;
      return boxRGB(mx - hw, mx + hw, my - hh, my + hh);
    };

    /* Glass sees glass. The transmission target used to hold the opaque scene
       only, so a transmissive body behind a bubble was not dimmed — it was
       absent, and the bubble showed the bare backdrop where jelly stood
       (measured 0.03 of it surviving; seaglass 0.00). Jelly rather than
       seaglass here because seaglass draws its colour from a palette per body
       and a check must not roll dice. Jelly is pink, so the signature is
       negative in (g - r); the ratio cancels the sign. */
    wipe();
    devMaterial('jelly'); birth(ring(() => 130, 140, 340, 330));
    await settle(900);
    const gelBehind = await lastBodyRGB();
    devMaterial('bubble'); birth(ring(() => 105, 140, 340, 330));
    await settle(1400);
    const gelThrough = await lastBodyRGB();
    const gelSig = (gelBehind[1] - gelBehind[0]) || 1;
    const gelST = +((gelThrough[1] - gelThrough[0]) / gelSig).toFixed(3);
    // 0.25: the fault this guards against is 0.03 — the body VANISHING —
    // and a healthy reading through film, equaliser and tone mapper sits
    // around 0.4; the threshold lives between the two, nearer the fault
    add('light', 'a transmissive body shows through glass', gelST >= 0.25, gelST, '>= 0.25 (it was 0.03 — it vanished)');

    /* And the crowd stays off the front of the glass. The same bubble, alone
       and over five dark bodies, read 117 points apart before the transmitted
       light was re-exposed; the pile belongs BEHIND the window, not printed on
       it. Five bodies rather than twenty-eight because devCheck is a check and
       not the bench — the fault scaled smoothly with the pile, so a crowd this
       size is enough to catch its return. */
    wipe();
    devMaterial('bubble'); birth(ring(() => 105, 140, 340, 330));
    await settle(1400);
    const aloneRGB = await lastBodyRGB();
    wipe();
    for (const m of ['tuff', 'moss', 'clay', 'tuff', 'moss']) {
      devMaterial(m); birth(ring(() => 95, 140, 340, 330));
    }
    await settle(700);
    devMaterial('bubble'); birth(ring(() => 105, 140, 340, 330));
    await settle(1400);
    const crowdRGB = await lastBodyRGB();
    const crowdGap = +Math.abs(
      (aloneRGB[0] + aloneRGB[1] + aloneRGB[2]) / 3 -
      (crowdRGB[0] + crowdRGB[1] + crowdRGB[2]) / 3).toFixed(1);
    // 60: the fault sat at ~117 over five bodies; at the shipped equaliser
    // strength a healthy reading is in the forties, and the sample box rides
    // whatever happens to stand directly behind, so the line stays well
    // above healthy noise and well below the fault
    add('light', 'a crowd does not darken the glass', crowdGap <= 60, crowdGap, '<= 60 (it was ~117 over five bodies)');

    /* The shadow is FOUND rather than looked for in a fixed box. It lands
       wherever the lamp and the pivot put it, and a box in screen fractions
       stops covering it the moment the window changes shape — which is exactly
       what happened: this check failed on a resize and reported that an opaque
       body had stopped casting a shadow, while the shadow was plainly there in
       the corner. A guard that cries wolf is worse than no guard.

       So: photograph the empty room, photograph it again with the body, and
       take the deepest darkening over pixels that were ground to begin with.
       Where it falls does not matter. */
    const deepestShadow = async (mat) => {
      wipe();
      await settle(400);
      const bare = await grab();
      devMaterial(mat); birth(ring(() => 120, 140, 340, 300));
      await settle(1300);
      const withIt = await grab();
      const drops = [];
      for (let i = 0; i < bare.data.length; i += 4) {
        const b = (bare.data[i] + bare.data[i+1] + bare.data[i+2]) / 3;
        if (b < 190) continue;                       // only what was ground
        const w = (withIt.data[i] + withIt.data[i+1] + withIt.data[i+2]) / 3;
        if (w < b * 0.45) continue;                  // that is the body, not its shadow
        drops.push((b - w) / b);
      }
      if (!drops.length) return 0;
      drops.sort((x, y) => y - x);
      // a high percentile rather than the max: one stray pixel is not a shadow
      return +drops[Math.floor(drops.length * 0.004)].toFixed(3);
    };
    const opaqueShadow = await deepestShadow('tuff');
    const glassShadow = await deepestShadow('crystal');
    add('light', 'glass lays a shadow, not a glow', glassShadow > 0.004, glassShadow, '> 0.004 (it used to be negative)');
    add('light', 'and a lighter one than stone', glassShadow < opaqueShadow, glassShadow + ' vs ' + opaqueShadow.toFixed(3), 'below the opaque body');

    /* AND THE SAME QUESTION ASKED WHERE IT CAN ACTUALLY BE ANSWERED.

       The row directly above has the right idea and cannot see the fault it is
       named for. `deepestShadow` drops every pixel that lost more than 55% of
       its light as "that is the body, not its shadow" — so the deep end of a
       too-dark shadow is precisely what it throws away — and it compares two
       numbers built out of what survives that filter. The file already knew
       the row was unwell: three runs at identical settings returned 0.534,
       0.514 and 0.496 against the 0.004 margin being argued about, and the
       note above it says THE ROW ITSELF IS THE THING TO FIX. This is that fix,
       added beside it rather than instead of it, so the old number keeps being
       reported.

       Reported 11 Aug as "the shadow comes out too dark on some materials" and
       measured with devShadow, which excludes the body by its own projected
       box and can therefore read the floor all the way down. On the build the
       fault was reported against:

           crystal   floor keeps 0.762
           tuff      floor keeps 0.959   (opaque, the control)

       A body you can see through was darkening the ground SIX TIMES as much as
       a stone. The shipped build measures 0.927 against 0.966, a gap of 0.039.

       The line is at 0.12 below the control, which is neither the fault nor
       the healthy value but between them with room on both sides: the fault
       sat 0.197 below, the build sits 0.039 below, and the control itself
       wandered 0.959 to 0.969 across runs, so a tighter line would be reading
       its own noise. It is deliberately loose enough to pass the dials being
       moved a long way by hand and tight enough that the reported fault, or
       anything half of it, comes back red. */
    const stoneKeep = (await devShadow('tuff')).floorKeep;
    const glassKeep = (await devShadow('crystal')).floorKeep;
    add('light', 'a glass shadow is not deeper than a stone one',
        glassKeep >= stoneKeep - 0.12, glassKeep + ' vs ' + stoneKeep + ' opaque',
        'no more than 0.12 below the opaque body (the fault was 0.197 below)');
  }

  wipe();
  const failed = rows.filter(r => !r.pass);
  return { ran: rows.length, failed: failed.length,
           verdict: failed.length ? 'FAILED — see rows' : 'all clear',
           rows: failed.length ? failed : rows };
};

/* TEMPORARY — devDraw('crystal') draws one circular body, so a measurement can
   compose a scene from the console. `birth` is module-scope and every dev tool
   that wants a scene had to be module-scope with it; this is the one handle
   that lets a page-scope script drive the thing. */
/* TEMPORARY — devStroke('bark', 40) draws an open LINE at a given angle in
   degrees, which devDraw's circle cannot do. It exists because a question like
   "does the grain follow the stroke" is unanswerable on a body with no
   direction: a circle's principal axis is noise, so whatever the material does
   with it is noise too. */
window.devStroke = (mat, deg = 0, len = 320, cx = 400, cy = 420) => {
  const a = deg * Math.PI / 180, p = [];
  for (let i = 0; i <= 60; i++) {
    const t = (i / 60 - 0.5) * len;
    p.push({ x: cx + Math.cos(a) * t, y: cy + Math.sin(a) * t });
  }
  devMaterial(mat); birth(p);
  return { material: mat, degrees: deg, length: len };
};

window.devDraw = (mat, radius = 120, cx = 340, cy = 330) => {
  const p = [];
  for (let i = 0; i <= 140; i++) { const a = i / 140 * Math.PI * 2;
    p.push({ x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) }); }
  devMaterial(mat); birth(p);
  return { material: mat, radius, at: [cx, cy] };
};

/* TEMPORARY — devGelStats() reads the blurred gel map back off the GPU and
   reports what the receiver shader is about to do with it.

   It exists because `block = clamp(cover * uGelShade, 0, 1)` cannot be judged
   from either of its inputs alone, and the whole question of a too-dark shadow
   is whether that clamp is CLIPPING. `clippedShareOfCovered` is the answer:
   the share of the covered area where cover * shade has already reached 1,
   i.e. where the ground is being told to keep none of its light and where
   every further difference between materials is thrown away.

   Read from gelRT, which is where the second blur round leaves the result and
   what tGel points at. */
window.devGelStats = () => {
  if (!gelRT) return 'no gel target yet';
  const w = gelRT.width, h = gelRT.height;
  const buf = new Uint16Array(w * h * 4);
  renderer.readRenderTargetPixels(gelRT, 0, 0, w, h, buf);
  const shade = gelUniforms.uGelShade.value;
  const covers = [];
  let clipped = 0;
  for (let i = 0; i < w * h; i++) {
    const a = THREE.DataUtils.fromHalfFloat(buf[i * 4 + 3]);
    if (a <= 0.002) continue;                 // outside every body's footprint
    covers.push(a);
    if (Math.min(a, 1) * shade >= 1) clipped++;
  }
  if (!covers.length) return { shade, coveredTexels: 0, note: 'no glass in the gel' };
  covers.sort((x, y) => x - y);
  const pct = p => +covers[Math.min(covers.length - 1, Math.floor(covers.length * p))].toFixed(4);
  return { shade, coveredTexels: covers.length,
           coverP50: pct(0.5), coverP90: pct(0.9), coverMax: +covers[covers.length - 1].toFixed(4),
           clippedShareOfCovered: +(clipped / covers.length).toFixed(3) };
};

/* TEMPORARY — devCaus() reads the scatter target back off the GPU.

   Same reason devGelStats had to exist: the receiver adds lit * caus * uCausAmt
   and none of the three can be judged from the picture alone. What matters is
   not the peak but the SPREAD — a caustic that is doing its job is uneven, with
   a thin bright tail well above its own median. A pass that has landed every
   ray in a flat sheet is not focusing anything, it is just adding a wash, and
   the two look similar at low gain and completely different at high.

   hitShareOfTarget is the share of the target that received anything at all: it
   should be small, because the rays only come from where glass stood. If it
   approaches 1 the scatter is spraying, which usually means the plane or the
   inverse matrix is wrong rather than the gain. */
window.devCaus = () => {
  if (!causRT) return 'no caustic target yet';
  const w = causRT.width, h = causRT.height;
  const buf = new Float32Array(w * h * 4);
  renderer.readRenderTargetPixels(causRT, 0, 0, w, h, buf);
  const hits = [];
  for (let i = 0; i < w * h; i++) {
    const v = (buf[i * 4] + buf[i * 4 + 1] + buf[i * 4 + 2]) / 3;
    if (v > 1e-4) hits.push(v);
  }
  /* How many rays there were to begin with, so a loss can be attributed. A ray
     exists wherever the G-buffer holds a direction; it lands wherever the
     scatter wrote. The two numbers together say whether a thin result is the
     glass not being seen from the lamp, or the rays being thrown away at the
     ground plane — which are opposite faults with opposite fixes. */
  const gw = causGRT.width, gh = causGRT.height;
  const gbuf = new Float32Array(gw * gh * 4);
  renderer.readRenderTargetPixels(causGRT, 0, 0, gw, gh, gbuf);
  let rays = 0, nan = 0, drawn = 0;
  let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
  for (let i = 0; i < gw * gh; i++) {
    const x = gbuf[i * 4], y = gbuf[i * 4 + 1], z = gbuf[i * 4 + 2], d = gbuf[i * 4 + 3];
    const len = x * x + y * y + z * z;
    if (Number.isNaN(len) || Number.isNaN(d)) { nan++; continue; }
    if (d !== 0) drawn++;                       // a fragment was written here at all
    if (len > 1e-6) {
      rays++;
      const px = i % gw, py = (i / gw) | 0;
      if (px < bx0) bx0 = px; if (px > bx1) bx1 = px;
      if (py < by0) by0 = py; if (py > by1) by1 = py;
    }
  }
  /* Where the rays sit in the lamp's frame, as a fraction of it. A compact box
     in one place is a footprint and the count is only a matter of resolution; a
     box spanning the whole frame is noise wearing a footprint's clothes. */
  const box = rays ? [bx0 / gw, by0 / gh, bx1 / gw, by1 / gh].map(v => +v.toFixed(3)) : null;

  /* And how wide the lamp's frame is against the glass standing in it. The
     scatter spends one texel per ray whether or not there is any glass at that
     texel, so this ratio is the pass's real resolution: at 0.02 a 512 map gives
     a body about ten texels across, and ten rays cannot make a caustic however
     they are tuned. */
  const gbox = new THREE.Box3();
  for (const b of bodies) if (b.glass) gbox.expandByObject(b.mesh);
  const gsize = gbox.isEmpty() ? new THREE.Vector3() : gbox.getSize(new THREE.Vector3());
  const frameW = causCam.right - causCam.left;
  const gelFrameW = key.shadow.camera.right - key.shadow.camera.left;
  if (!hits.length) return { amount: causRecv.uCausAmt.value, raysCast: rays, litTexels: 0,
                             note: rays ? 'rays exist but none reached the ground plane' : 'the G-buffer is empty' };
  hits.sort((a, b) => a - b);
  const pct = p => +hits[Math.min(hits.length - 1, Math.floor(hits.length * p))].toFixed(4);
  /* RING OR BLOB, as one number, because this is the brief's own acceptance
     test for the bubble and the eye cannot settle it on a wash this faint.

     Centroid of the landed energy, then the mean energy inside the middle of
     the footprint against the mean out at its rim. A filled patch — which is
     all the occlusion model could ever make — puts its weight in the middle and
     returns below 1. A ring puts its weight at the rim and returns above it.
     The reference photograph is "a thin elliptical ring and almost nothing in
     the middle", so this is the number that says whether that is happening. */
  let cx = 0, cy = 0, wsum = 0;
  for (let i = 0; i < w * h; i++) {
    const v = (buf[i * 4] + buf[i * 4 + 1] + buf[i * 4 + 2]) / 3;
    if (v <= 1e-4) continue;
    cx += (i % w) * v; cy += ((i / w) | 0) * v; wsum += v;
  }
  cx /= wsum; cy /= wsum;
  let rMax = 0;
  for (let i = 0; i < w * h; i++) {
    const v = (buf[i * 4] + buf[i * 4 + 1] + buf[i * 4 + 2]) / 3;
    if (v <= 1e-4) continue;
    rMax = Math.max(rMax, Math.hypot((i % w) - cx, ((i / w) | 0) - cy));
  }
  /* Both energies, same geometry. The raw field is what the pass landed; the
     EXCESS field is that minus uCausFloor, clamped at zero — exactly the
     max(caus - floor, 0) the receiver draws, see its own comment. They answer
     different questions: raw says where rays went, excess says what the floor
     will actually show. A bubble whose middle is undeflected lands one ray per
     texel there — that is the floor itself, so raw reads a lit disc while the
     picture correctly shows nothing. Reported side by side so neither number
     has to be inferred from the other. */
  const flr = causRecv.uCausFloor.value;
  let inSum = 0, inN = 0, outSum = 0, outN = 0, inXS = 0, outXS = 0;
  for (let i = 0; i < w * h; i++) {
    const v = (buf[i * 4] + buf[i * 4 + 1] + buf[i * 4 + 2]) / 3;
    const r = Math.hypot((i % w) - cx, ((i / w) | 0) - cy) / Math.max(rMax, 1e-6);
    if (r < 0.4) { inSum += v; inN++; inXS += Math.max(v - flr, 0); }
    else if (r > 0.6 && r < 1.0) { outSum += v; outN++; outXS += Math.max(v - flr, 0); }
  }
  const inner = inN ? inSum / inN : 0, outer = outN ? outSum / outN : 0;
  const innerX = inN ? inXS / inN : 0, outerX = outN ? outXS / outN : 0;

  return { amount: causRecv.uCausAmt.value, gain: causUniforms.uCausGain.value,
           floorUsed: flr,
           innerExcess: +innerX.toFixed(4), outerExcess: +outerX.toFixed(4),
           ringRatioExcess: +(outerX / Math.max(innerX, 1e-6)).toFixed(2),
           size: causUniforms.uCausSize.value,
           innerMean: +inner.toFixed(4), outerMean: +outer.toFixed(4),
           ringRatio: +(outer / Math.max(inner, 1e-6)).toFixed(2),
           causFrameW: +frameW.toFixed(1), gelFrameW: +gelFrameW.toFixed(1),
           glassW: +gsize.x.toFixed(1),
           glassShareOfFrame: +(gsize.x / frameW).toFixed(4),
           texelsAcrossGlass: Math.round(gsize.x / frameW * causGRT.width),
           gbufDrawn: drawn, gbufNaN: nan, gbufBox: box,
           raysCast: rays, litTexels: hits.length,
           landedShareOfRays: +(hits.length / Math.max(rays, 1)).toFixed(3),
           hitShareOfTarget: +(hits.length / (w * h)).toFixed(3),
           p50: pct(0.5), p90: pct(0.9), p99: pct(0.99),
           max: +hits[hits.length - 1].toFixed(4),
           peakOverMedian: +(hits[hits.length - 1] / Math.max(pct(0.5), 1e-4)).toFixed(2) };
};

/* TEMPORARY — devCausShot() photographs the scatter target itself, because
   ringRatio is one number about a shape and the shape is worth an eye. Blob
   against ring is exactly the reference photograph's question, and the buffer
   is where it is answered before any receiver dresses it up. Normalised to the
   99th percentile so one hot texel cannot black out the picture, gamma so the
   faint floor of undeflected rays stays visible. Returns a PNG data url. */
window.devCausShot = () => {
  if (!causRT) return 'no caustic target yet';
  const w = causRT.width, h = causRT.height;
  const buf = new Float32Array(w * h * 4);
  renderer.readRenderTargetPixels(causRT, 0, 0, w, h, buf);
  const vals = [];
  for (let i = 0; i < w * h; i++) {
    const v = (buf[i * 4] + buf[i * 4 + 1] + buf[i * 4 + 2]) / 3;
    if (v > 1e-4) vals.push(v);
  }
  vals.sort((a, b) => a - b);
  const top = vals.length ? vals[Math.floor(vals.length * 0.99)] : 1;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); const im = ctx.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    const x = i % w, y = (i / w) | 0;
    // the GL read comes back bottom row first, so the row order flips here
    const j = ((h - 1 - y) * w + x) * 4;
    const v = (buf[i * 4] + buf[i * 4 + 1] + buf[i * 4 + 2]) / 3;
    const g = Math.pow(Math.min(v / Math.max(top, 1e-6), 1), 0.4545);
    im.data[j] = im.data[j + 1] = im.data[j + 2] = Math.round(g * 255);
    im.data[j + 3] = 255;
  }
  ctx.putImageData(im, 0, 0);
  return { normalisedTo: +top.toFixed(4), litTexels: vals.length,
           dataUrl: c.toDataURL('image/png') };
};

/* TEMPORARY — devThick() puts the two thicknesses side by side, because the
   whole question of why a bubble throws a filled patch instead of a ring turns
   on which of them the caustic pass is actually using.

   `geometric` is what the pass measures: back-face depth minus front-face
   depth, in world units — the width of the SOLID BALL the mesh actually is.
   `film` is what the material says it is: MeshPhysicalMaterial.thickness, which
   is what three uses to attenuate light crossing it, and what makes a bubble
   read as a bubble rather than a glass marble.

   If those two are far apart the pass is modelling the wrong object, and the
   brief's ring cannot appear: the ring exists because a film is nearly nothing
   head-on and a long crossing at the silhouette, and a solid ball is a long
   crossing everywhere. */
window.devThick = (mat = 'bubble') => {
  const b = bodies.find(x => x.glass);
  if (!b) return 'draw a glass body first';
  let film = null, ior = null;
  b.mesh.traverse(o => {
    if (o.isMesh && o.material && o.material.transmission && film === null) {
      film = o.material.thickness; ior = o.material.ior;
    }
  });
  /* setFromObject and not expandByObject: it updates the world matrices on the
     way down itself. Measured the other way this returned 0.3 for a body that
     the caustic pass, at the same moment, was framing at 518 — a probe wrong by
     three orders of magnitude, which is the kind of number that would have been
     believed if it had been only a little wrong. */
  const bb = new THREE.Box3().setFromObject(b.mesh);
  const size = bb.getSize(new THREE.Vector3());
  return { material: mat, ior, filmThickness: film,
           geometricWidth: +size.x.toFixed(1),
           ratio: film ? +(size.x / film).toFixed(0) : null,
           // what the pass actually decided this frame, not what it should have
           treatedAsFilm: !!(b.causMat && b.causMat.uniforms.uFilm.value > 0),
           note: 'ratio is how many times thicker a solid reading would be' };
};

/* tuneCaus({amount, gain, size}) — amount is how much of the result reaches the
   picture, gain how much light each ray carries, size how wide a landed ray is
   spread. tuneCaus({amount: 0}) turns the whole pass off at the receiver without
   stopping it running, which is the comparison to hold against the eye. */
window.tuneCaus = v => {
  if (v.amount !== undefined) causRecv.uCausAmt.value = v.amount;
  if (v.gain !== undefined) causUniforms.uCausGain.value = v.gain;
  if (v.size !== undefined) causUniforms.uCausSize.value = v.size;
  if (v.soft !== undefined) causRecv.uCausSoft.value = v.soft;
  if (v.bend !== undefined) causBend.value = v.bend;
  if (v.floor !== undefined) causRecv.uCausFloor.value = v.floor;
  if (v.filmGain !== undefined) causUniforms.uFilmGain.value = v.filmGain;
  if (v.dark !== undefined) causUniforms.uCausDark.value = v.dark;
  if (v.body !== undefined) causUniforms.uFilmBody.value = v.body;
  return { amount: causRecv.uCausAmt.value, gain: causUniforms.uCausGain.value,
           size: causUniforms.uCausSize.value, soft: causRecv.uCausSoft.value,
           bend: causBend.value, filmGain: causUniforms.uFilmGain.value };
};

/* ---------- devShadow: the darkest floor a body leaves, per material ----------

   Kept in the devBox spirit: a diagnostic that exists because a measurement
   could not see a reported fault. Reported 11 Aug as "the shadow comes out too
   dark on some materials", and the existing shadow rows were structurally
   blind to it — they discard every pixel that lost more than 55% of its light
   as "that is the body, not its shadow", which is exactly where a too-dark
   shadow lives. A pitch-black shadow therefore read as ~0.5 and passed.

   Same photograph-twice method as the shadow rows, but the body's own pixels
   are excluded by devBox (its projected vertices, not the drawn position), so
   the dark end of the floor can be read all the way down. Returns how much of
   its light the darkest patch of floor kept: 1 = no shadow at all, 0 = black.
   The same 0.004 percentile as the shadow rows — one stray pixel is not a
   shadow. */
window.devShadow = async (mat = 'crystal') => {
  const grab = () => new Promise(res => {
    const orig = window.requestAnimationFrame.bind(window);
    window.requestAnimationFrame = cb => orig(t => { cb(t); window.requestAnimationFrame = orig;
      const c = [...document.querySelectorAll('canvas')].find(x => x.id !== 'draw');
      const o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
      o.getContext('2d').drawImage(c, 0, 0);
      res(o.getContext('2d').getImageData(0, 0, c.width, c.height)); });
  });
  const settle = ms => new Promise(r => setTimeout(r, ms));
  const wipe = () => document.getElementById('clear').click();
  const pts = [];
  for (let i = 0; i <= 140; i++) { const a = i / 140 * Math.PI * 2;
    pts.push({ x: 340 + 120 * Math.cos(a), y: 300 + 120 * Math.sin(a) }); }
  wipe(); await settle(400);
  const bare = await grab();
  devMaterial(mat); birth(pts);
  await settle(1300);
  const withIt = await grab();
  const bb = devBox();
  const sx = withIt.width / innerWidth, sy = withIt.height / innerHeight;
  // a small margin over the box: the silhouette's own antialiased edge is body
  const ex = { x0: bb.x0 * sx - 8, x1: bb.x1 * sx + 8, y0: bb.y0 * sy - 8, y1: bb.y1 * sy + 8 };
  const keeps = [];
  const w = withIt.width;
  for (let i = 0; i < bare.data.length; i += 4) {
    const px = (i / 4) % w, py = (i / 4 / w) | 0;
    if (px > ex.x0 && px < ex.x1 && py > ex.y0 && py < ex.y1) continue;
    const b = (bare.data[i] + bare.data[i + 1] + bare.data[i + 2]) / 3;
    if (b < 190) continue;                       // only what was ground
    keeps.push((withIt.data[i] + withIt.data[i + 1] + withIt.data[i + 2]) / 3 / b);
  }
  wipe();
  if (!keeps.length) return { material: mat, error: 'no ground pixels seen' };
  keeps.sort((a, b) => a - b);
  return { material: mat,
           floorKeep: +keeps[Math.floor(keeps.length * 0.004)].toFixed(3),
           sampled: keeps.length };
};

document.getElementById('clear').addEventListener('click', () => {
  // a body is a group — the core plus its colony of parts — so freeing it
  // means walking it. Reaching for .geometry on the group itself threw on
  // the first body and left every other one standing.
  bodies.forEach(b => {
    b.mesh.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
    pile.remove(b.mesh);
  });
  bodies.length = 0; TRI_MATS.length = 0; LAMP_COUNT = 0; FLASH_LAMPS.length = 0;
  world.rotation.y = 0; spinning = false; idle = 0; zCursor = 0;
  // the pivot has wandered to wherever the last composition stood, and an empty
  // canvas has no cluster to put it back on: park it at the centre by hand
  world.position.set(0, 0, 0);
  pile.position.set(0, 0, 0); world.scale.setScalar(1);
  document.getElementById('readout').textContent = '';
});
document.getElementById('spin').addEventListener('click', () => { spinning = !spinning; idle = 0; });
// dev handle: park the turn at an exact angle to check the framing, which
// the idle spin is too slow (and, in a background tab, too throttled) to show
window.devAngle = a => { spinning = false; world.rotation.y = a; };
/* Holds the turntable still. devAngle only stops it until the idle timer starts
   it again a second and a half later, which is fine for one screenshot and
   useless for comparing two things side by side — the composition drifts out
   from under the comparison while you look at it. Pinning it from outside by
   re-setting the angle on a timer fights the animation loop and reads as a
   stutter, so the loop is told instead. */
window.devSpin = on => { SPIN_LOCK = !on; if (!on) spinning = false; return { spinning: on }; };
/* devMaterial('chrome') pins the next body to a profile, and devMaterial() lets
   the cycle run again. Judging one material used to mean drawing a dozen bodies
   to walk the rotation round to it, and a dozen bodies is a pile you cannot see
   the one you came for through. */
/* TEMPORARY. Built from MATERIALS so it can never fall out of step with the
   library, and wired through the same devMaterial hook rather than reaching into
   the state itself — one way in means one thing to delete later. */
(function buildPicker() {
  const box = document.getElementById('matpick');
  const tag = document.createElement('div');

  tag.textContent = 'dev · material';
