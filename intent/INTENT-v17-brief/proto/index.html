  // sampled inside the lighting, and mapping it twice bends every colour
  const tmWas = renderer.toneMapping;
  renderer.toneMapping = THREE.NoToneMapping;
  const clearWas = renderer.getClearColor(new THREE.Color()), alphaWas = renderer.getClearAlpha();
  renderer.setRenderTarget(glassLayerRT);
  renderer.setClearColor(0xffffff, 0.5);   // the internal pass's own idea of "nothing"
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.setClearColor(clearWas, alphaWas);
  renderer.toneMapping = tmWas;
  for (const [o, m] of swapped) o.material = m;
}

const GLASS_BODY = { amount: 0.035, lift: 0.85 };
/* ---------- every pane at the same exposure ----------

   The other half of the same report, and it is not the same lever. `uGlassBody`
   mixes the window toward the material's own tint, and closing the gap with it
   costs seeing-through one for one — measured, declined, and fenced off in the
   brief. What actually darkens the twentieth bubble is not that it shows the
   pile; it is that it shows the pile AT THE PILE'S OWN EXPOSURE, so the
   accumulated darkness of everything behind is printed onto the front of the
   glass.

   So the transmitted light is re-exposed instead of repainted. The OPAQUE
   scene's local mean behind the pane (a deep mip of three's own opaque-only
   transmission target, which conveniently still renders) is brought toward
   that map's overall mean, and the transmitted sample is scaled by the ratio
   — luminance only, chroma and detail ride along untouched. Judged against
   the opaque map and not against the glass layer, deliberately: a dark stone
   pile is darkness the glass should not wear, but a dark glass neighbour is
   a body at its own exposure, and lifting it burns its colour into the tone
   mapper's shoulder (measured: the seaglass through-reading fell by a third). A bubble alone reads the room against the room and
   moves nothing; a bubble over twenty dark bodies is lifted back to the room's
   level and still shows every one of them, displaced and tinted, at their own
   contrast. Nothing is mixed toward a constant, so this is not the trade the
   brief forbids: what stands behind stays visible, it just stops deciding how
   bright the glass is.

   `strength` is the whole dial: 0 is version 9's pure window, 1 pins every
   pane to the scene's exposure. `detail` is how local "local" is, in octaves
   below the whole screen — 0 judges by the entire scene and does nothing (the
   scene against itself), and each step judges by a neighbourhood half the
   size. Measured on the bench: at 2 the neighbourhood is still mostly
   backdrop and the dial barely moves; 4 to 5 is where the neighbourhood is
   the size of what a bubble actually covers and the gap actually closes.
   Both live on the bench in tune.html. */
/* 1.0 by an explicit decision, 7 August 2026: every pane at the same
   exposure comes FIRST, and the version-9 guardrail on this axis was waived
   in so many words — "the problem was never solved there". The trade is
   real and measured, not painted over: at 1.0 the eight-body pile gap closes
   to 16 points and a dark body behind a bubble keeps 0.421 of its colour
   (at 0 it keeps 0.733 and the gap is 73). The bench slider spans the whole
   axis for anyone who wants to look at the other end; the light checks below

const glassBodyUniforms = {
  uGlassBody: { value: GLASS_BODY.amount },
  uGlassLift: { value: GLASS_BODY.lift },
  uGlassEq: { value: GLASS_EQ.strength },
  uGlassEqDetail: { value: GLASS_EQ.detail }

function glassOwnColour(mat) {
  const prev = mat.onBeforeCompile;

    if (prev) prev(shader);
    Object.assign(shader.uniforms, glassBodyUniforms, glassLayerUniforms, glassEqMapUniforms);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform float uGlassBody, uGlassLift, uGlassEq, uGlassEqDetail;
        /* The equaliser's own picture of the room, rendered opaque-only in
           renderExposure and damped against the frame before it. It used to
           re-adopt three's live transmission target by re-declaring the
           originals here — same content, but arriving at whatever speed the
           scene happened to move, which is where the brightness wobble came
           from. The decision it encodes is unchanged: judge exposure against
           what is OPAQUE behind a pane, because a dark stone pile is darkness
           the glass should not wear, while a dark glass neighbour is a body at
           its own exposure and lifting it burns its colour into the tone
           mapper's shoulder. */
        uniform sampler2D uExposureMap;
        /* Two sizes, and they are not the same one. uExposureSize is the map's
           own resolution, which is what the mip arithmetic is in; the viewport
           is what gl_FragCoord is in, and is what turns a fragment into a uv.
           They used to be a single uniform only because the old map happened to
           be the size of the drawing buffer. */
        uniform vec2 uExposureSize;
        uniform vec2 uExposureViewport;`)
      /* The whole of "glass sees glass", in one substitution: the resolved
         pars chunk is inlined with its sampler renamed, so every helper it
         defines — getTransmissionSample, getIBLVolumeRefraction — reads the
         layer target this file renders instead of the private opaque-only one.
         Refraction, roughness blur, attenuation: all untouched, pointed at a
         picture that has the glass in it. */
      .replace('#include <transmission_pars_fragment>',
        THREE.ShaderChunk.transmission_pars_fragment
          .split('transmissionSamplerMap').join('uGlassLayersMap')
          .split('transmissionSamplerSize').join('uGlassLayersSize'))
      /* After transmission_fragment, which is where three overwrites
         totalDiffuse with the sample from behind. It is inside main and runs
         after the lighting, so everything needed is already in scope —
         including `transmitted`, the sample itself, which is what makes the

      .replace('#include <transmission_fragment>', `#include <transmission_fragment>
        #ifdef USE_TRANSMISSION
        if (uGlassEq > 0.0) {

             (or the gel patch it throws) crosses a coarse texel's boundary,
             that texel's value does not slide, it steps. eqScale is that
             value in the denominator, so the step is multiplied straight onto
             the transmitted colour and the pane changes brightness in one
             frame, in a hard-edged rectangle the size of a texel at this
             level. Measured while spinning, three bubbles, spikes counted as
             frames where more than 3% of the bubble area moves hard against a
             median of 0.43%: four interleaved runs of 280 frames each came
             back 0/0/0/0 with the equaliser off and 20/88/0/2 with it at full
             strength. Dose-dependent in the other dial too, which is what
             named the mechanism: at detail 4 the spikes are 2 and 12, at 3
             they are 0 and 2, at 2 they are 0 and 0 — the coarser the level,
             the wider the box, the smaller the step.

             So the level stays where Hadar put it and the READ is widened
             instead: centre weighted double, four taps one texel out on the
             diagonals, which is a tent about three texels wide at this level.
             Each offset tap is itself bilinear over four texels, so the
             support moves smoothly with the content instead of snapping to
             the grid, and a feature crossing a boundary now ramps across the
             tent rather than switching. Five samples, no new target, no extra

             7 August decision is spent on exposure, not on this.

/* ---------- the film belongs on the rim ----------

   A bubble kept arriving as a white shell whenever anything opaque stood behind
   it, and the level was not the answer at either end: measured, show-through
   goes 0.46, 0.54, 0.61, 0.82 as the iridescence comes down 0.45, 0.30, 0.18, 0.
   Turn it up and the bubble is a shell; turn it down and it is a plain window
   with nothing of a bubble about it. Both of those were reported, in that order.

   The mistake is that three applies iridescence evenly over the whole surface,
   and a soap film does not work that way. Its colour comes from interference in
   a film whose PATH LENGTH grows as the view slants across it, so the spectrum
   lives on the silhouette and the part facing you is very nearly clear — which
   is exactly why you can read a newspaper through the middle of a real bubble
   and see an oil slick around its edge.

   So the film is weighted by the grazing angle instead of being dialled. The
   centre goes clear, which is where you look through it, and the rim keeps the

        uniform float uFilmPower, uFilmFloor;`)

         actually assigned and which sits inside main() below the normals.
         `iridescence_fragment` was the obvious-looking anchor and is the wrong
         one: it is the thin-film FUNCTIONS, at file scope, so the block landed
         outside main and the shader failed to compile. three logs that and
         carries on, so the bubble simply stopped being drawn — and the
         see-through measurement happily reported a perfect 1.000 for a body
         that was not there. Measure the thing, then check the thing exists. */
      .replace('#include <lights_physical_fragment>', `#include <lights_physical_fragment>
        #ifdef USE_IRIDESCENCE
        {

// tuneRimFilm({power: 3, floor: 0.05}) — how fast the film gives way to clear

/* ---------- the wire of light round a mirror ----------

   Chrome keeps disappearing into the backdrop, and the reason is in what a
   mirror is. It has no colour of its own to separate it from anything: what it
   shows at its edge is whatever lies behind IT, and behind it is the same pale
   room the backdrop is made of. The black flags in the mirror room already fight
   this, and they cannot finish the job, because they darken the rim — and a dark
   rim against a pale ground is a silhouette, not an edge.

   A bubble never has the problem, and not because it is brighter: it has a
   grazing-angle highlight. Reflectance climbs toward one at glancing incidence
   for every material, so a thin band of light rides the silhouette wherever the
   surface turns away — the wire that says "there is a form here" before the eye
   has read anything else. Metal has the same Fresnel climb and it is being
   swamped by the reflection sitting on top of it.

   So it is put back explicitly, and narrow: a high power on the grazing term
   makes a wire rather than a wash. Weighted toward the key, because a rim that
   runs the whole way round is a cartoon outline — it belongs where the light
   actually is, which is what makes it read as light rather than as a stroke. */
/* Set on screen against a lone chrome body on the bare backdrop, which is the

      .replace('#include <common>', `#include <common>
        uniform float uRimStrength, uRimPower;
        uniform vec3 uRimDir, uRimColor;`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        {
          // normal and vViewPosition are both view space here, so the grazing
          // term needs no extra matrices

          float wire = pow(graze, uRimPower);

// tuneRim({strength: 0.8, power: 5}) — a wire this thin is only judgeable on screen

  if (v.power !== undefined) rimUniforms.uRimPower.value = v.power;
  return { strength: rimUniforms.uRimStrength.value, power: rimUniforms.uRimPower.value };

/* Patched into the ground's own shader rather than laid over it, so the patch

               through. The dimming has to reach the DIRECT term as well: the
               cove is lit mostly by the key lamp, and taking it only out of the
               indirect one meant the shade could be wound all the way up and
               still never make a shadow. Measured, glass came out BRIGHTER than
               bare ground at every setting — a glow with no shadow under it,
               which is what "transparent things cast nothing" looked like. */
            /* THE COLOUR MULTIPLIES, IT DOES NOT ADD.

               keep 12's shadow, and taken up again on 10 Aug when the fault it

               that is the diagnosis.

               arriving — it is light that got through and was coloured on the

               cannot give. Multiplying scales the whole light the ground was

               value of either dial can make the ground emit.

               cover = 1/shade every material returns the identical value 1, so
               the ground is told to keep NONE of its light and every material
               that gets there arrives at the same black. One body does not get
               there — crystal peaks at 0.945 of the way up — but coverage
               ACCUMULATES across overlapping bodies, and measured on a pile of
               five crystals a quarter of the covered area is pinned flat on
               that top. In a busy scene, which is the only scene that counts
               here, the wall is not hypothetical.

               of what the earlier tuning was judged on, are unchanged to

               Every channel of a normalised hue is at or below 1, so tinting

               one than stone" and is wrong on its face: colour is not opacity.
               Dividing the tint by its own mean shifts the balance between
               channels and leaves the total where the shade dial put it, so

               exceed 1: the tint only departs from white in proportion to
               block, which is also what dims it. */
            float tintAmt = clamp(uGelTint * block, 0.0, 1.0);

               key.shadow.camera; the environment never passed through it. An

               the fill and the dome untouched, so a transmissive body scaling

                 photograph — and the softening round made it worse rather than

              vec2 edge = smoothstep(0.0, 0.12, cuv) * smoothstep(0.0, 0.12, 1.0 - cuv);

              float dark = min(c4.a * uCausDark, 0.8) * edge.x * edge.y * onFloor;

  mat.needsUpdate = true;
}

/* How far back the pile actually reaches, which is what decides how close the
   ground is allowed to come before a body starts poking through it. */

  let lo = Infinity, hi = -Infinity;
  for (const b of bodies) {
    lo = Math.min(lo, b.mesh.position.z - b.radius);
    hi = Math.max(hi, b.mesh.position.z + b.radius);
  }
  return { back: Math.round(lo + world.position.z), front: Math.round(hi + world.position.z),

};

/* TEMPORARY — devGlassLayer(x, y) reads what the glass-layer target actually

  const px = Math.round(x * s.x / innerWidth), py = Math.round((innerHeight - y) * s.y / innerHeight);

  const isHalf = glassLayerRT.texture.type === THREE.HalfFloatType;
  const buf = isHalf ? new Uint16Array(w * w * 4) : new Uint8Array(w * w * 4);
  renderer.readRenderTargetPixels(glassLayerRT,
    Math.max(0, px - half), Math.max(0, py - half), w, w, buf);
  let r = 0, g = 0, b = 0, a = 0;
  for (let i = 0; i < w * w; i++) {
    const v = k => isHalf ? THREE.DataUtils.fromHalfFloat(buf[i * 4 + k]) : buf[i * 4 + k] / 255;
    r += v(0); g += v(1); b += v(2); a += v(3);
  }
  const n = w * w;
  return { r: +(r / n).toFixed(4), g: +(g / n).toFixed(4), b: +(b / n).toFixed(4), a: +(a / n).toFixed(3) };
};

/* TEMPORARY — devBox(i) is the screen box of body i (the last body when no
   index is given), in CSS pixels, taken from the body's own projected vertices.
   It exists because of a measurement that lied twice: a sample box parked where
   a body was DRAWN keeps measuring that spot after placeInFrame and the pivot
   have moved the composition, and what it reads there is the backdrop. The
   brief's "a tool that does not frame what it measured" — this is the frame. */
window.devBox = i => {
  const b = bodies[i === undefined ? bodies.length - 1 : i];
  if (!b) return null;
  const v = new THREE.Vector3();
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  b.mesh.updateWorldMatrix(true, true);
  b.mesh.traverse(o => {
    if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
    const p = o.geometry.attributes.position;
    const step = Math.max(1, Math.floor(p.count / 400));
    for (let k = 0; k < p.count; k += step) {
      v.fromBufferAttribute(p, k).applyMatrix4(o.matrixWorld).project(camera);
      x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x);
      y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
    }
  });
  if (x0 > x1) return null;
  // NDC y runs up, CSS y runs down
  return { material: b.matName,
           x0: +((x0 * 0.5 + 0.5) * innerWidth).toFixed(1),
           x1: +((x1 * 0.5 + 0.5) * innerWidth).toFixed(1),
           y0: +((1 - (y1 * 0.5 + 0.5)) * innerHeight).toFixed(1),
           y1: +((1 - (y0 * 0.5 + 0.5)) * innerHeight).toFixed(1) };
};

window.devWhere = () => bodies.map(b => {
  const w = b.mesh.getWorldPosition(new THREE.Vector3());
  return { drawnAt: b.drawnAt === undefined ? null : Math.round(b.drawnAt),
           nowAt: Math.round(w.x / VIEW + innerWidth / 2),
           movedBy: b.drawnAt === undefined ? null
                  : Math.round(w.x / VIEW + innerWidth / 2 - b.drawnAt) };
});

/* The cross-section of the last body, as numbers.

   "Flat front face and then a pull back into depth" and "a ball" are the same
   silhouette from the front and differ only in the profile between the rim and
   the middle, which is exactly what cannot be judged from a screenshot taken
   head-on. So: bin every vertex by how far it sits from the outline, and report
   the surface height in each bin against the height a true sphere would have
   there. Ratios near 1 across the range are a dome. Ratios that climb fast and
   then sit at 1.0 for the whole middle are a plateau with a wall, which is the
   flat face. */
window.devProfile = (bins = 10) => {
  const b = bodies[bodies.length - 1];
  const core = b && b.mesh.children[0];
  if (!core || !core.geometry || !core.geometry.attributes.position) return 'nothing to measure';
  const pos = core.geometry.attributes.position;
  let cx = 0, cy = 0, R = 0;
  core.geometry.computeBoundingBox();
  const bb = core.geometry.boundingBox;
  cx = (bb.min.x + bb.max.x) / 2; cy = (bb.min.y + bb.max.y) / 2;
  R = Math.min(bb.max.x - bb.min.x, bb.max.y - bb.min.y) / 2;
  /* Mean per ring, not peak. Taking the tallest vertex in a ring and comparing it
     to a sphere's height at the ring's MIDDLE compares two different radii, and
     it flatters the profile by exactly the width of a ring — enough, near the
     rim, to make a dome look like a plateau. The mean sits at the middle of the
     ring, which is where the sphere is being evaluated. */
  const sum = new Float64Array(bins), cnt = new Float64Array(bins);
  for (let i = 0; i < pos.count; i++) {
    const dx = pos.getX(i) - cx, dy = pos.getY(i) - cy;
    // r = 0 at the middle, 1 at the rim
    const r = Math.min(0.9999, Math.hypot(dx, dy) / Math.max(R, 1e-6));
    const k = Math.floor(r * bins);
    sum[k] += Math.abs(pos.getZ(i)); cnt[k]++;
  }
  let top = 0;
  for (let k = 0; k < bins; k++) if (cnt[k]) top = Math.max(top, sum[k] / cnt[k]);
  return Array.from({ length: bins }, (_, k) => {
    if (!cnt[k]) return null;
    const rMid = (k + 0.5) / bins;
    const sphere = Math.sqrt(Math.max(0, 1 - rMid * rMid));   // what a ball would give
    return { atRadius: +rMid.toFixed(2),
             height: +((sum[k] / cnt[k]) / Math.max(top, 1e-6)).toFixed(3),
             sphereWouldBe: +sphere.toFixed(3) };
  }).filter(Boolean);
};

// walks every live body's material, so a finish parameter can be judged by eye
window.eachBodyMat = f => {
  for (const b of bodies) b.mesh.traverse(o => { if (o.isMesh && o.material) f(o.material); });
};

// tuneAO({radius: 60, strength: 1, power: 2}) from the console, same idea as tuneLight
window.tuneAO = v => {
  if (v.radius !== undefined) aoUniforms.uRadius.value = v.radius;
  if (v.strength !== undefined) blurUniforms.uStrength.value = v.strength;
  if (v.power !== undefined) aoUniforms.uPower.value = v.power;
  if (v.bias !== undefined) aoUniforms.uBias.value = v.bias;
  return { radius: aoUniforms.uRadius.value, strength: blurUniforms.uStrength.value,
           power: aoUniforms.uPower.value, bias: aoUniforms.uBias.value };
};

/* TEMPORARY — devLevels(4) forces every new body's subdivision depth, and
   devLevels() puts it back. The one question it answers: is a seam a mesh too
   coarse for its curvature, or a kink the surface really has? Raising the depth
   moves the first and leaves the second exactly where it was. */
window.devLevels = n => { LEVEL_OVERRIDE = (n === undefined || n === null) ? null : n; return LEVEL_OVERRIDE ?? 'per-material'; };

/* TEMPORARY — walks a scanline across the last body's height field and reports
   the biggest step between neighbouring samples. A smooth field steps by well
   under 0.02 per two units; the medial-axis crease showed up as a cliff. This
   is what separated "the profile has a ridge" from "the triangles are uneven",
   which looked the same on screen and needed opposite fixes. */
window.devField = (rows = 3) => {
  const f = LAST_FIELD;
  if (!f) return 'draw something first';
  const out = [];
  for (let r = 0; r < rows; r++) {
    const y = f.rcy + (r - (rows - 1) / 2) * f.dmax * 0.5;
    let prev = null, worst = 0, atX = 0;
    for (let x = -f.dmax * 4; x <= f.dmax * 4; x += f.dmax * 0.02) {
      const t = f.radialW > 0 ? f.radialT(x, y) : 0;
      if (prev !== null && Math.abs(t - prev) > worst) { worst = Math.abs(t - prev); atX = x; }
      prev = t;
    }
    out.push({ scanY: +y.toFixed(1), worstStep: +worst.toFixed(4), atX: +atX.toFixed(1) });
  }
  // vetoes counts vertex-moves the fold guard refused. Zero on a convex
  // outline; a large number on a crescent is the guard doing its job, and is
  // what tells a torn body apart from a merely coarse one
  return { verts: f.P.length, radialWeight: f.radialW, dmax: +f.dmax.toFixed(1),
           relaxVetoes: RELAX_VETOES,
           // must stay well clear of 0: at 0 the body is pinched through
           thinnestInterior: LAST_THIN, scans: out };
};

/* TEMPORARY — diagnostic for "glass comes out dark".
   Reads the glass mask back off the GPU and reports, per transmissive body,
   how much of its own screen footprint the mask actually covers. A body the
   mask misses is a body the composite is still multiplying occlusion onto,
   and the number says so instead of the eye guessing. Coverage near 1 means
   the mask is doing its job there and the darkness is coming from the
   material, not from the AO. */
window.devGlassMask = () => {
  if (!glassRT) return 'no target yet';
  const w = glassRT.width, h = glassRT.height;
  const buf = new Uint8Array(w * h * 4);
  renderer.readRenderTargetPixels(glassRT, 0, 0, w, h, buf);
  let lit = 0;
  for (let i = 0; i < w * h; i++) if (buf[i * 4] > 127) lit++;

  // a body's footprint, taken from the screen-space box of its own vertices
  const v = new THREE.Vector3();
  const rows = [];
  for (const b of bodies) {
    if (!b.glass) continue;
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    b.mesh.updateWorldMatrix(true, true);
    b.mesh.traverse(o => {
      if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
      const p = o.geometry.attributes.position;
      const step = Math.max(1, Math.floor(p.count / 400));
      for (let i = 0; i < p.count; i += step) {
        v.fromBufferAttribute(p, i).applyMatrix4(o.matrixWorld).project(camera);
        x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x);
        y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
      }
    });
    if (x0 > x1) { rows.push({ material: b.matName, note: 'no geometry found' }); continue; }
    // NDC -> mask pixels. readRenderTargetPixels comes back bottom-up, and so
    // does NDC y, so no flip is needed here
    const px0 = Math.max(0, Math.floor((x0 * 0.5 + 0.5) * w)), px1 = Math.min(w - 1, Math.ceil((x1 * 0.5 + 0.5) * w));
    const py0 = Math.max(0, Math.floor((y0 * 0.5 + 0.5) * h)), py1 = Math.min(h - 1, Math.ceil((y1 * 0.5 + 0.5) * h));
    let n = 0, on = 0;
    for (let y = py0; y <= py1; y++) for (let x = px0; x <= px1; x++) { n++; if (buf[(y * w + x) * 4] > 127) on++; }
    rows.push({ material: b.matName, boxPixels: n, maskedFraction: +(on / Math.max(1, n)).toFixed(3) });
  }
  return { maskSize: w + 'x' + h, maskedScreenFraction: +(lit / (w * h)).toFixed(3), glassBodies: rows };
};

/* ---------- drawing surface ---------- */
const dc = document.getElementById('draw');
const dctx = dc.getContext('2d');
let pts = [], drawing = false;

function toWorld(x, y) { return { x: (x - innerWidth / 2) * VIEW, y: -(y - innerHeight / 2) * VIEW }; }

/* Graphite v2. Constant-width core drawn as quadratic curves through
   segment midpoints (no joins, no width steps), pressure only modulates
   OPACITY and is smoothed over time. Grain is fine and hugs the core. */
function tooth(x, y) {
  return fbm(x * 0.11, y * 0.11, 3.1, 2) * 0.5 + 0.5;
}
let pressS = 0.75;                                   // smoothed pressure
function strokeSegment(p0, p1, p2, speed) {
  const target = Math.max(0.35, Math.min(1, 1 - speed / 90));
  pressS += (target - pressS) * 0.12;                // slow, pencil-like response
  const press = pressS;

  const m1 = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
  const m2 = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };

  // core: one smooth curve, fixed width
  dctx.strokeStyle = `rgba(40,38,35,${0.34 * press + 0.08})`;
  dctx.lineWidth = 1.6;
  dctx.lineCap = 'round';
  dctx.beginPath();
  dctx.moveTo(m1.x, m1.y);
  dctx.quadraticCurveTo(p1.x, p1.y, m2.x, m2.y);
  dctx.stroke();

  // grain: sparse, tight to the line, gated by fixed paper tooth
  const d = Math.hypot(m2.x - m1.x, m2.y - m1.y);
  const steps = Math.max(1, Math.round(d));
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    const x = m1.x + (m2.x - m1.x) * t, y = m1.y + (m2.y - m1.y) * t;
    for (let k = 0; k < 3; k++) {
      const gx = x + (Math.random() - 0.5) * 3.2;
      const gy = y + (Math.random() - 0.5) * 3.2;
      if (tooth(gx, gy) < 0.42) continue;
      const fall = 1 - Math.hypot(gx - x, gy - y) / 2.4;
      if (fall <= 0) continue;
      dctx.fillStyle = `rgba(46,44,41,${(0.05 + Math.random() * 0.08) * press * fall})`;
      dctx.fillRect(gx, gy, 1, 1);
    }
  }
}
function clearStroke() { dctx.clearRect(0, 0, innerWidth, innerHeight); }

let lastT = 0;
dc.addEventListener('pointerdown', e => {
  drawing = true; pts = [{ x: e.clientX, y: e.clientY }];
  lastT = performance.now();
  try { dc.setPointerCapture(e.pointerId); } catch (_) {}
  idle = 0; spinning = false;
});
dc.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = { x: e.clientX, y: e.clientY }, last = pts[pts.length - 1];
  const d = Math.hypot(p.x - last.x, p.y - last.y);
  if (d < 2) return;
  const now = performance.now();
  const speed = d / Math.max(1, now - lastT) * 16;
  lastT = now;
  // the core is a quadratic through segment midpoints, so it needs three
  // consecutive points — the first move only seeds them
  if (pts.length > 1) strokeSegment(pts[pts.length - 2], last, p, speed);
  // the speed rides along on the point: the ink has always used it, and the body
  // is about to. A stroke that slowed down was pressed harder
  p.v = speed;
  pts.push(p);
});
function endStroke() {
  if (!drawing) return;
  drawing = false;
  if (pts.length > 3) birth(pts.slice());
  pts = []; clearStroke();
}
// listen on window: a pointerup that lands outside the canvas must still
// end the stroke, or the drawn line is stranded on screen forever
addEventListener('pointerup', endStroke);
addEventListener('pointercancel', endStroke);

/* ---------- stroke analysis ---------- */

/* Roundness that does not confuse "long" with "cornered".

   The isoperimetric quotient, 4πA/L², answers one question — how close is this
   to a CIRCLE — and the shape pipeline was asking it a different one: does this
   drawing have corners in it. Those are the same question only for shapes that
   are as wide as they are tall. Measured on this build: a smooth ellipse at 3:1
   scores 0.665 and a square scores 0.785, so an oval drawn by hand came out
   MORE angular than a square. Everything downstream followed: the depth profile
   went to a plateau with a wall, the outline kept its creases, and jelly drawn
   as a long soft blob returned a flat slab with hard edges.

   Whitening fixes it at the source. Take the outline's own principal axes and
   scale each to unit variance: an ellipse of any elongation becomes a circle, a
   rectangle of any elongation becomes a square, and the quotient of THAT is
   about corners alone. Verified: ellipses from 1:1 to 6:1 land 1.00–0.966,
   every rectangle 0.77–0.785, a triangle 0.61. The 0.88→0.80 window it feeds
   was calibrated against those same numbers and still holds.

   Even resampling first is not optional — covariance over points the hand left
   bunched up in the slow parts of a stroke describes the hand, not the shape. */
function cornerRoundness(poly) {
  const n = poly.length;
  if (n < 8) return 1;
  const seg = [];
  let L = 0;
  for (let i = 0; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n];
    const d = Math.hypot(b.x - a.x, b.y - a.y);
    seg.push(d); L += d;
  }
  if (L < 1e-6) return 1;
  const N = 256, step = L / N, R = [];
  let e = 0, acc = 0;
  for (let k = 0; k < N; k++) {
    const target = k * step;
    while (e < n - 1 && acc + seg[e] < target) { acc += seg[e]; e++; }
    const t = seg[e] > 1e-9 ? (target - acc) / seg[e] : 0;
    const a = poly[e], b = poly[(e + 1) % n];
    R.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  }
  let mx = 0, my = 0;
  for (const q of R) { mx += q.x; my += q.y; }
  mx /= N; my /= N;
  let sxx = 0, syy = 0, sxy = 0;
  for (const q of R) { const dx = q.x - mx, dy = q.y - my; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
  sxx /= N; syy /= N; sxy /= N;
  const tr = sxx + syy;
  const disc = Math.sqrt(Math.max(0, tr * tr / 4 - (sxx * syy - sxy * sxy)));
  const l1 = tr / 2 + disc, l2 = tr / 2 - disc;
  // a stroke with no width at all in one direction has no shape to judge
  if (l2 < 1e-9) return 0;
  let ex, ey;
  if (Math.abs(sxy) > 1e-9) { ex = l1 - syy; ey = sxy; } else { ex = 1; ey = 0; }
  const en = Math.hypot(ex, ey); ex /= en; ey /= en;
  let len = 0, area = 0;
  const W = R.map(q => {
    const dx = q.x - mx, dy = q.y - my;
    return { x: (dx * ex + dy * ey) / Math.sqrt(l1), y: (-dx * ey + dy * ex) / Math.sqrt(l2) };
  });
  for (let k = 0; k < N; k++) {
    const a = W[k], b = W[(k + 1) % N];
    len += Math.hypot(b.x - a.x, b.y - a.y);
    area += a.x * b.y - b.x * a.y;
  }
  area = Math.abs(area) / 2;
  return Math.min(1, 4 * Math.PI * area / Math.max(len * len, 1e-9));
}

function analyse(p) {
  let len = 0;
  for (let i = 1; i < p.length; i++) len += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9, cx = 0, cy = 0;
  p.forEach(q => {
    minx = Math.min(minx, q.x); maxx = Math.max(maxx, q.x);
    miny = Math.min(miny, q.y); maxy = Math.max(maxy, q.y);
    cx += q.x; cy += q.y;
  });
  cx /= p.length; cy /= p.length;
  // shoelace area
  let area = 0;
  for (let i = 0; i < p.length; i++) {
    const a = p[i], b = p[(i + 1) % p.length];
    area += a.x * b.y - b.x * a.y;
  }
  area = Math.abs(area) / 2;
  const gap = Math.hypot(p[0].x - p[p.length - 1].x, p[0].y - p[p.length - 1].y);
  const closed = gap / Math.max(len, 1) < 0.28;
  // isoperimetric quotient: 1 = perfect circle. Kept because it is genuinely
  // "how circular", which the readout reports and the pivot logic reads
  const round = Math.min(1, (4 * Math.PI * area) / Math.max(len * len, 1));
  // and "how cornered", which is the different question the shape pipeline asks
  const corner = cornerRoundness(p);
  return { len, cx, cy, w: maxx - minx, h: maxy - miny, area, closed, round, corner };
}

/* Which way the drawing lies: the long axis of the points, in world terms.

   Not the bounding box, which is why this is worth its own function — a box only
   knows horizontal and vertical, so a trunk drawn on the diagonal comes back
   square and reports no direction at all. This is the first principal axis, the
   direction of greatest spread, by the same half-angle formula the whitening
   step uses to measure corners.

   Screen y runs down and world y runs up, so the sign flips on the way in. */
function principalAngle(p) {
  let cx = 0, cy = 0;
  for (const q of p) { cx += q.x; cy += q.y; }
  cx /= p.length; cy /= p.length;
  let sxx = 0, syy = 0, sxy = 0;
  for (const q of p) {
    const dx = q.x - cx, dy = -(q.y - cy);
    sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
  }
  return 0.5 * Math.atan2(2 * sxy, sxx - syy);
}

/* Poured colour, painted into the vertices.

   The reference is a puddle of marbled paint: four or five saturated colours
   folded through each other in ribbons with hard edges, not a gradient. Which
   rules out a map — the triplanar projection would tile a swirl into a
   wallpaper of identical swirls — and rules out `paintGradient`, which runs one
   stop to another down an axis and can only ever make a fade.

   So the colour is chosen per vertex from a DOMAIN-WARPED field: a smooth noise
   whose input coordinates have themselves been pushed around by another noise,
   which is what turns concentric blobs into folded ribbons. The bands are then
   read off it by rank rather than by threshold, the same correction the bead
   cloud needed: any smooth field is bell-shaped, so cutting it at even values
   gives the middle colours all the room and leaves the ends nearly empty. */
function paintSwirl(g, stops, seed) {
  const pos = g.attributes.position;
  g.computeBoundingBox();
  const bb = g.boundingBox;
  const ext = Math.max(1e-3, Math.max(bb.max.x - bb.min.x, bb.max.y - bb.min.y));
  const k = 3.1 / ext;
  const vals = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    // the warp: two noise fields read at a coarse scale, used as an offset into
    // the third. This is the whole trick, and without it the bands are rings
    const wx = fbm(x * k * 0.7 + seed, y * k * 0.7, z * k * 0.5, 3) * ext * 0.9;
    const wy = fbm(x * k * 0.7 + 4.7, y * k * 0.7 + seed, z * k * 0.5, 3) * ext * 0.9;
    // stretched hard on one axis, because paint is poured and runs
    vals[i] = fbm((x + wx) * k * 0.42, (y + wy) * k * 1.35, z * k * 0.3 + seed, 4);
  }
  const sorted = Array.from(vals).sort((a, b) => a - b);
  const cuts = [];
  for (let s = 1; s < stops.length; s++) cuts.push(sorted[Math.floor(s / stops.length * sorted.length)]);
  const cols = stops.map(c => new THREE.Color(c));
  const out = new Float32Array(pos.count * 3);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    let fi = cuts.length;
    for (let s = 0; s < cuts.length; s++) if (vals[i] < cuts[s]) { fi = s; break; }
    /* A hair of blend at the borders and no more. Poured paint does have an
       edge — that is what makes it read as poured rather than airbrushed — but a
       perfectly hard one on a curved body crawls with aliasing as it turns. */
    const edge = fi > 0 ? Math.min(1, Math.abs(vals[i] - cuts[fi - 1]) / (ext * 1e-4 + 0.012)) : 1;
    tmp.copy(cols[fi]);
    if (edge < 1) tmp.lerp(cols[fi - 1], (1 - edge) * 0.5);
    out[i * 3] = tmp.r; out[i * 3 + 1] = tmp.g; out[i * 3 + 2] = tmp.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(out, 3));
}

/* Ribs cut into the body, along the axis it was drawn on.

   Every other relief in this piece comes off a scan: the height is a photograph
   and the material decides how deep to push it. This one has no scan and never
   could — a rib is exact, evenly spaced and machine-regular, and the moment it
   is photographed it stops being regular. So it is arithmetic: a cosine across
   the surface, quantised toward a square profile so the ridge has a flank
   rather than being a sine hill, displaced along the normal.

   Across the long axis, not along it, so the ribs run round the body the way
   corrugation does — and driven by position rather than by the normal, so they
   continue across the rim instead of stopping where the surface turns. */

/* ---------- inflation ----------
   The move that turns a drawing into a body. An extrude gives constant depth
   with a bevel, which is a coin: the front silhouette is right and the side
   view gives the whole thing away.

   Here the outline is triangulated as drawn, the triangles are subdivided so
   the inside gains vertices the outline never had, and every vertex is pushed
   out of the page by how far it sits from the drawn edge. The edge keeps a
   distance of zero and therefore never moves, so the front silhouette is still
   exactly the line the hand made, while the middle swells to its own
   thickness. Thickness follows the shape instead of being dialled in: a fat

     each one is free to land negative at exactly the deepest point. On top of
     that the profile only reaches its peak where a vertex happens to sit on the
     deepest point inside the outline, which no triangulation promises. Between
     them a circle asked to be as deep as it is wide was arriving at 0.85, and by
     a different amount per material: sponge, with the heaviest relief, was
     furthest off. Depth was a suggestion.

  for (let i = 0; i < P.length; i++) {

    if (radialW > 0) {

         floored by the distance field, which is the thing that cannot be wrong.

         star-shaped about its own centroid. Real drawings are not: a lobe that
         swings back on itself has vertices further from the centre than the rim
         is in that direction, and there the radial term reads zero and the body
         is pinched to zero thickness — front and back surfaces meeting in a
         lens-shaped slit you can see straight through. That is the tear, and on
         glass it is unmissable because there is nothing opaque to hide it.

         everywhere strictly inside, always, for any closed outline whatever.
         So it sets a floor. Where the two measures agree the floor never binds
         and the profile is the smooth radial one; where the radial term
         collapses, the floor holds the body open. The seam that leaves is then
         ironed by the same relax passes that were already running. */

    if (wob) h *= 1 + wob * fbm(P[i].x * 0.011 + seed, P[i].y * 0.011, seed * 0.31, 3);

      // one still reads as a plane rather than as noise
      const f = fbm(P[i].x * 0.0075 + seed * 2.3, P[i].y * 0.0075, seed * 0.77, 2);
      h *= 1 + chisel * (Math.floor(f * 4) / 4 - 0.38) * 0.55;
    }
