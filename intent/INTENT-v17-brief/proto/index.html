   much of the sky that surface can actually see, and that is the whole of the
   contact darkening the eye uses to read one form as touching another: the
   crease where two bodies meet, the seam under a part, the ring where the pile
   sits against the cove. Without it every body floats, however good the shading

   straight to the canvas with its own tone mapping and colour space, and the

const aoUniforms = {

  tAO: { value: null }, tDepth: { value: null }, tGlass: { value: null },
  uTexel: { value: new THREE.Vector2() },
  uNear: { value: 0 }, uFar: { value: 0 },
  uStrength: { value: 0.85 },

const QUAD_VERT = `
varying vec2 vUv;
void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
`;

const aoMat = new THREE.ShaderMaterial({
  uniforms: aoUniforms, vertexShader: QUAD_VERT, toneMapped: false, depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D tDepth, tNormal;
    uniform vec2 uRes, uHalf;
    uniform float uNear, uFar, uRadius, uBias, uPower;
    varying vec2 vUv;

    // the projection is orthographic, so depth maps to view Z by a straight
    // line and the inverse needs no divide — the awkward part of screen-space
    // occlusion under perspective simply is not here
    float viewZ(float d) { return d * (uNear - uFar) - uNear; }
    vec3 viewPos(vec2 uv, float d) {

         in a disc in screen space. A disc is the version that is quicker to
         write, and on anything tilted away from the camera half of its samples
         fall behind the surface itself: the plane then occludes itself, at
         roughly a constant half, and the whole backdrop comes out grey and
         crawling with noise. Turning the sample set to face along the normal is

         occlusion at all, which is correct. */
      float rot = hash(gl_FragCoord.xy) * 6.2831853;

        // cosine-weighted, so the sample density matches how much each
        // direction actually contributes to the light a surface receives

        // and spending samples out at full radius wastes most of them
        vec3 S = P + (TBN * h) * (uRadius * mix(0.22, 1.0, fi));

        vec2 sUv = (S.xy / uHalf) * 0.5 + 0.5;
        if (sUv.x < 0.0 || sUv.x > 1.0 || sUv.y < 0.0 || sUv.y > 1.0) continue;
        float sd = texture2D(tDepth, sUv).r;
        if (sd >= 0.9999) continue;

        // front of our sample, so it blocks it

          // form — otherwise a body floating well clear of the ground would
          // smear a dark halo across it

/* The blur, and the multiply onto the canvas, in one draw. Occlusion computed
   from 16 rays per pixel is noisy by construction; the noise is the price of
   not taking 200 samples, and a wide blur is how it is paid off.

   The blur has to be depth-aware, and that is not a refinement — it is what
   stops the pass from drawing a halo. A plain box blur mixes every neighbour
   equally, so along the silhouette the deep occlusion computed in the
   sculpture's own creases is smeared out over the backdrop behind it, and the
   backdrop picks up a dark fringe that the eye reads as a bright rim just
   inside it. Weighting each tap by how close it is in depth to the centre pixel
   keeps the sculpture's occlusion on the sculpture and the ground's on the
   ground, and the fringe disappears. */
const blurMat = new THREE.ShaderMaterial({
  uniforms: blurUniforms, vertexShader: QUAD_VERT, toneMapped: false,
  depthTest: false, depthWrite: false,
  blending: THREE.CustomBlending,
  blendSrc: THREE.DstColorFactor, blendDst: THREE.ZeroFactor,   // dst * src = multiply
  fragmentShader: `
    uniform sampler2D tAO, tDepth, tGlass;

    varying vec2 vUv;

         COMPUTED, so that nothing occludes them and they occlude nothing — but
         this composite is a full-screen multiply, so it landed on their pixels
         anyway and stamped the occlusion of whatever stands behind them onto
         the front of the glass. A bubble in front of a crowded pile came out a

      ao = mix(ao, 1.0, clamp(texture2D(tGlass, vUv).r, 0.0, 1.0));

      // and crushing the creases is the other way to look synthetic

const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadScene = new THREE.Scene();

   transmission target, live, every frame. Two things came out of that and only
   one of them has been fixed.

   one frame, in a hard-edged rectangle. The tent below fixed that and still does.

   The second is not a sampling problem and no amount of better sampling touches
   it: the answer itself moves fast. Turn something textured behind the glass and
   the local mean genuinely swings, the correction follows it at unity gain

   the front of the pane as a brightness wobble. Measured in a busy scene with the

    /* A body that emits joins the glass on the protected side of this mask. The
       mask says which pixels the occlusion pass must leave alone, and the answer
       for a light is all of them: shading a source darker where it is close to
       something else is backwards, and it is what put the grey film on the neon
       and a grey patch on whatever it was lighting. */
    const m = (b.glass || b.lit) ? glassMat : maskBlockMat;
    b.mesh.traverse(o => { if (o.isMesh) { dressed.push([o, o.material]); o.material = m; } });
  }
  const coveWas = cove.material;
  cove.material = maskBlockMat;
  renderer.setRenderTarget(glassRT);
  // the clear colour is renderer-wide state, so it has to be put back or the
  // beauty pass clears to whatever this pass wanted
  const clearWas = renderer.getClearColor(new THREE.Color()), alphaWas = renderer.getClearAlpha();
  renderer.setClearColor(0x000000, 1);
  renderer.clear();
  renderer.render(scene, camera);
  renderer.setClearColor(clearWas, alphaWas);
  cove.material = coveWas;
  for (const [o, m] of dressed) o.material = m;

  renderer.setRenderTarget(null);
}

/* ---------- the coloured patch a transmissive body throws ----------

   A shadow map answers one question, "did light reach here", and its answer is
   a number. That is right for stone and wrong for everything the light goes
   THROUGH: what lands under a pink jelly is not a grey shadow with less of it,
   it is pink. The grey version was the single thing that most gave away that
   these were solids with a transparent shader on them rather than transparent
   things.

   So the glass gets a pass of its own. It is rendered from the lamp's point of
   view into a small target, each body flat in the colour the light would come
   out as — the attenuation colour, which is exactly "what this material does to
   light crossing it" — accumulating where bodies overlap, alpha carrying how
   much was in the way. The ground then projects that back and uses it twice:
   the alpha takes a little light out, because a body in the way does dim things,
   and the colour puts colour back in. Dimmer AND coloured, which is what a gel
   does.

   It is added as light rather than painted on, inside the lighting so it is
   tone-mapped with everything else — a patch composited after tone mapping
   reads as a decal lying on the floor, which is the same mistake in a different
   place. */
/* 1024, up from 512, and the reason is the multiply.

   The gel is projected from the LAMP, which sits at about 25 degrees — so its
   texels land on the floor at a grazing angle and stretch, badly, along the
   receding direction. One texel of a 512 map covers a great many screen pixels
   down there. The additive term never showed it, because adding a small number
   is smooth wherever it lands; a multiply scales what is already on the ground
   and the grid comes with it. Reported as blotches, squares and dots.

   Measured at 512, second difference across the floor: 0.05 on a tile of open
   backdrop against 9.7 to 11.8 on the tiles holding the shadow — two hundred
   times the structure, in the one place that is supposed to be a soft wash.

   Doubling the grid is the honest fix rather than blurring harder, which would
   only trade a visible grid for a shadow with no shape. The blur step doubles
   with it so the softness stays exactly where it was in world terms: the radius
   below is written per texel, and there are now twice as many of them. */
const GEL_RES = 1024;
let gelRT = null, gelBlurRT = null;
const gelCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 100);
const gelMatrix = new THREE.Matrix4();
const gelUniforms = {
  tGel: { value: null },
  uGelMatrix: { value: gelMatrix },
  /* How much colour it puts back, and how much light the body takes out.

     The tint used to be 8 and had to be, because it multiplied a raw colour that
     was ADDED to the ground — a number that had to be large enough to see and
     was therefore always one step from a light source. It was reported as one:
     neon cyan under the crystal, neon magenta under the jelly, and again on 10
     Aug as "cyan and pink and yellow" once a dark backdrop gave it nothing to
     hide behind. Now it scales the share of the BLOCKED light that comes back
     coloured, so the scale means something: 1 returns exactly what the body
     took, wearing the colour that came through it, and cannot exceed the
     unshadowed ground at any value up to 1. Above 1 it starts adding light
     again — which is the old fault, on a dial where it can at least be seen
     coming. */
  /* 2.0, retuned 10 Aug for this build. 2.5 came over with the formula from
     version 11 and reads heavier here — see the shade note below for why the
     pair had to move together. */
  uGelTint: { value: 2.0 },
  /* And the shade is not a small number, because what it multiplies is not a
     large one: the patch is blurred across a wide radius, so the alpha arriving
     at any given spot is a few hundredths. At 0.30 the tint won outright and
     every transmissive body came out BRIGHTER than the bare ground — measured,
     bubble -0.059, crystal -0.043, seaglass -0.011, against an opaque tuff at
     +0.035. A glow with no shadow under it, which is what "the transparent
     shapes cast nothing" was. At 8 and 5 a crystal darkens the ground 0.017,
     about half what the stone does, and the patch keeps its colour. */
  /* 4.0, DOWN FROM 5.0, and this is the number the multiply actually needed.
     block is clamp(cover * shade), so at 5 it reaches 1 as soon as coverage
     passes a fifth — and the blurred gel spends most of its area above that.
     The whole patch therefore sat on the flat top of the clamp: uniformly
     black, edged hard, and showing the gel target's own texel grid because a
     clipped signal has no gradient left to hide it. Reported as "dark grey with
     a cyan halo, too dark and murky" and "dotty, not smooth", which is three
     descriptions of one clipped buffer.

     The additive version never showed it: adding a small number is gentle
     wherever it lands, so the clamp was never reached. Swapping to a multiply
     is what made the dial's old value wrong, not the multiply itself.

     At 4 the ramp stays inside the blur and the patch comes back as a gradient
     — a shadow stained by the body above it. Swept by eye: 2.0 loses the shadow
     altogether, 3.2 is faint, 5.0 is the fault above. */
  /* 3.4. 4.0 fixed the clipping but still read heavy once the grid stopped
     hiding it — "still a bit too dark". Below about 3 the shadow stops being a
     shadow: 2.0 loses it entirely and 3.2 is faint. */
  /* 3.0, and the honest reason is Hadar's eye, not a measurement.

     It went 5.0 -> 4.0 to stop the clamp clipping, then 4.0 -> 3.4 on "still a
     bit too dark", then 3.4 -> 3.0 chasing a red row — and that last step was
     me tuning against noise. `and a lighter one than stone` compares the glass
     shadow's depth to an opaque one, and run three times at identical settings
     it returned 0.534, 0.514 and 0.496: a spread of 0.04 against the 0.004
     margin being argued about, failing once and passing twice. The dial never
     moved it. 3.0 stays because it is lighter and she asked for lighter.

     THE ROW ITSELF IS THE THING TO FIX, not the dial. It is luck-dependent in
     the same way the moss row was before it was made deterministic — see the
     brief's warning about single runs. Until then, treat one red result from it
     as no information. */
  uGelShade: { value: 3.0 },
  /* THE CEILING: the most of the ground's light a transmissive body may take.
     Added 11 Aug for "the shadow comes out too dark on some materials".

     "Some materials" is not a figure of speech, it is a line in the code with
     five names on it. renderGel writes alpha 0.55 for a body with a finite
     attenuationDistance — crystal, iris, seaglass, jelly, gem — and 0.08 for
     everything else that transmits. Measured on this build, one body alone, as
     the darkest patch of floor each one leaves with its own silhouette
     excluded (devShadow, 1 = untouched) against the gel coverage underneath it:

         bubble    floor keeps 0.994     cover peaks 0.033
         jelly                 0.882                 0.204
         crystal               0.762                 0.315
         tuff                  0.959     opaque, the control

     The last two rows are the whole report in one line: A BODY YOU CAN SEE
     THROUGH WAS DARKENING THE GROUND SIX TIMES AS MUCH AS A STONE.

     THE FIRST GUESS WAS WRONG AND IS WORTH LEAVING HERE. It looked like
     clamp(cover * uGelShade) clipping, and on one body it does not: crystal
     peaks at 0.945 of the way up the clamp and clippedShareOfCovered came back
     0 for every single body. It clips the moment bodies OVERLAP, because
     renderGel accumulates alpha additively (blendDstAlpha is OneFactor):

         1 crystal   cover peaks 0.320   nothing clipped
         2                     0.613     12.7% of the covered area pinned flat
         3                     0.901     19.4%
         5                     1.320     25.5%

     Which is the brief's "check it in a busy scene" arriving on schedule — a
     quarter of the patch flat at black, all five materials identical there,
     and the shade dial with no reach inside it at all. It also explains the
     dial's own history: 5.0 -> 4.0 -> 3.4 -> 3.0 each moved the EDGE of that
     flat top inward and none of them could touch its middle.

     But clipping is the smaller half of it. What let the shadow go deeper than
     a stone's is that one keep multiplied BOTH light terms — see uGelSky. This
     dial is the other half: at 0.945 of the light removed, the difference
     between that and clipping is arithmetic, not appearance, and a body that
     transmits cannot take nearly all the light. 0.72 measured, with tuff as
     the control and the whole sweep taken in one page load:

         dials              tuff   bubble  crystal  jelly  seaglass
         before             0.959  0.994   0.762    0.882  —
         knee only, 1/1     0.965  0.994   0.884    0.948  0.958
         0.90 / 0.55        0.966  —       0.927    0.966  —
         0.72 / 0.25        0.969  0.997   0.957    0.983  0.982
         0.60 / 0.25        0.959  0.999   0.959    0.985  0.987

     0.90 / 0.55 IS THE SHIPPED PAIR, AND IT IS NOT THE ONE THE NUMBER ALONE
     WOULD PICK. 0.72 / 0.25 puts crystal inside the opaque control's own noise
     — 0.012 under a control that wandered 0.959 to 0.969 across runs — and on
     that column it is plainly the better answer. Photographed, it is not: with
     a crystal, a jelly and a bubble together the patch all but disappears, and
     "the transparent shapes cast nothing" is a fault this file has already
     paid for once.

     The measurement was aiming at the wrong target, and that is worth saying
     plainly. devShadow excludes the body's own projected box, and an opaque
     body keeps most of its shadow UNDER itself, inside that box — so the
     opaque control reads 0.966 not because a stone barely shades the floor but
     because the part of its shadow that escapes the box barely does. Matching
     it drives a transmissive body's much wider patch down to nothing.

     So 0.90 / 0.55 is chosen against the photograph, with the number used to
     bound it rather than to set it: the six-fold fault becomes twofold, the
     patch stays a patch, and nothing clips even in a pile (the block at five
     overlapping crystals reaches 0.883 against a ceiling of 0.90). Whoever
     holds the visual language moves it from here — tuneGel({deep, sky}). */
  uGelDeep: { value: 0.90 },
  /* And how much of that block is allowed to touch the SKY rather than the
     lamp. This is the term that let a glass shadow out-darken a stone one.

     The gel is rendered from `key.position`, framed to `key.shadow.camera`:
     it is a picture of what happened to the KEY LAMP's light and it knows
     nothing about any other. Multiplying `indirectDiffuse` by it in full
     therefore claims the glass occluded the environment as well, which no
     opaque body in this scene claims — an opaque body takes the key away with
     a shadow map and leaves the fill and the environment alone. That is the
     whole reason the glass shadow could go deeper than the stone's, and why
     `and a lighter one than stone` has been sitting one noisy run away from
     red for two versions.

     Not zero. A body does sit between the ground and part of the dome, and
     dropping the term outright takes the patch's colour off the ambient with
     it. A quarter of it keeps the contact reading without letting one lamp's
     view speak for the whole room.

     This is the half of the fix that does the work. With the knee in and both
     terms still fully multiplied (deep 1.00, sky 1.00), crystal came back at
     0.884 against an opaque control of 0.965 — better than the 0.762 it
     started at, and still plainly the darkest thing on the floor. Admitting
     only part of the block to the ambient is what ends the fault: 0.55 of it
     takes crystal to 0.927, and 0.25 all the way to 0.957.

     0.55 rather than 0.25 for the reason given on uGelDeep — the lower pair
     measures better and photographs worse. */
  uGelSky: { value: 0.55 }
};

function gelTargets() {
  if (gelRT) return;
  const opt = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, type: THREE.HalfFloatType };
  gelRT = new THREE.WebGLRenderTarget(GEL_RES, GEL_RES, opt);
  gelBlurRT = new THREE.WebGLRenderTarget(GEL_RES, GEL_RES, opt);
  gelUniforms.tGel.value = gelBlurRT.texture;
  /* Built here rather than lazily inside the caustic pass, because the ground's
     material compiles the first time it is drawn and a sampler bound to null at
     that moment is a warning at best and a black floor at worst. Both sets of
     targets exist before anything samples either. */
  causTargets();
}

/* Wide and cheap. A caustic has no edge worth keeping — the whole point is that
   it is soft — so this is a big-radius blur at low resolution rather than an
   accurate one, taken in two separable passes. */
const gelBlurUniforms = { tSrc: { value: null }, uDir: { value: new THREE.Vector2() } };
const gelBlurMat = new THREE.ShaderMaterial({
  uniforms: gelBlurUniforms, vertexShader: QUAD_VERT, toneMapped: false,
  depthTest: false, depthWrite: false,
  fragmentShader: `
    uniform sampler2D tSrc;
    uniform vec2 uDir;
    varying vec2 vUv;
    void main() {
      vec4 s = vec4(0.0);
      float w = 0.0;
      for (int i = -8; i <= 8; i++) {
        float f = float(i);
        float k = exp(-f * f / 32.0);
        s += texture2D(tSrc, vUv + uDir * f) * k;
        w += k;
      }
      gl_FragColor = s / w;
    }
  `
});

/* The colour light comes out as, not the colour the body looks. For a
   transmissive material those are different things and the second one is the
   surface — using it put a pink patch under a bubble whose tint is white. */
/* ---------- caustics: the glass bends the light instead of blocking it ----------

   Version 14's brief, and the reason the gel model could never satisfy it: what
   `renderGel` builds is a model of OCCLUSION. It records how much body stood in
   the way and multiplies the floor down by it, so the only shape it can ever
   produce is the silhouette, softened. A glass does not remove light — it moves
   it. The light missing from one place is landing, concentrated, in another.

   Both of the reference photographs are that one fact. A tumbler throws a
   coloured footprint with bright THREADS inside it, because its curved wall
   focuses rays into lines. A soap bubble throws a thin elliptical RING and
   almost nothing in the middle, because at ior 1.05 a ray entering head-on is
   barely bent at all while a ray entering at the silhouette crosses the film at
   a grazing angle and is bent hard. Neither can be drawn by darkening a
   silhouette, and neither has to be drawn at all once the light is actually
   carried: the ring falls out of the arithmetic for free.

   Three passes, all from the lamp's own camera, which already exists:

   1. A G-BUFFER. The glass is rendered from the lamp storing, per texel, the
      direction the ray leaves in after being bent by that surface, plus the
      depth it was bent at. The direction is computed in the fragment shader
      rather than the normal being stored raw, because that is where the
      material's own `ior` is available — one number per body that would
      otherwise need a channel of its own.

   2. A SCATTER. A grid of points, one per texel, each reading the G-buffer,
      reconstructing where its ray entered the glass, following the bent ray to
      the ground plane, and placing ITSELF there. Additive, so where many rays
      land together the ground gets brighter. This is image-space caustics, and
      it needs no compute shader.

   3. ENERGY. Every point carries the same amount, so a texel that sent its light
      elsewhere has none left where it started. The dark parts and the bright
      threads come out of the same pass rather than being two effects tuned
      against each other. */
const CAUS_RES = 512;
let causGRT = null, causBRT = null, causRT = null, causBlurRT = null;
let causPoints = null, causScene = null;

/* A CAMERA OF ITS OWN, AND THIS IS THE CORRECTION THAT MADE THE PASS WORK.

   As first built, both caustic passes borrowed the gel's framing — which is
   `key.shadow.camera`, sized to cover the cove. Measured on two bodies: the
   lamp's frame is 10400 units across and the glass standing in it is 235, so
   the glass owns 2.3% of the frame and a 512 map gives a body TWELVE TEXELS
   ACROSS. Twelve rays is not a caustic at any gain, and 99.95% of a quarter of
   a million points were being spent on empty room. The pass was not mistuned,
   it was starved.

   So the caustic gets its own orthographic camera down the same lamp direction,
   framed to the glass AND to where that glass throws light — the bodies' box
   plus its own shadow on the ground plane, which is the only region any ray can
   land in. Same 512 map, now spending every texel on something.

   It is re-framed every frame because the pile turns. The cost is that the
   pass's resolution follows the bodies, so a caustic can shimmer slightly as
   the frame breathes; the alternative is a fixed frame sized for the worst
   case, which is the starvation above with extra steps. */
const causCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 100);
const causMatrix = new THREE.Matrix4();
const causMatrixInv = new THREE.Matrix4();
const causUniforms = {
  tCausG: { value: null }, tCausB: { value: null }, tGelRaw: { value: null },
  // the caustic's own frame, for reading the G-buffer back out and for landing
  uCausMatrix: { value: causMatrix }, uCausMatrixInv: { value: causMatrixInv },
  // view space back to world, for the exit normal, and the lamp's own direction
  uCausNormal: { value: new THREE.Matrix3() },
  uLightDirW: { value: new THREE.Vector3() },
  // an orthographic depth is linear between these two, which is what turns the
  // difference between the buffers into a distance in world units
  uCausNear: { value: 1 }, uCausFar: { value: 100 },
  // and the gel's, which is a different frame, used only to fetch the colour
  // the ray picked up on its way through
  uGelMatrix: { value: gelMatrix },
  uPlaneP: { value: new THREE.Vector3() }, uPlaneN: { value: new THREE.Vector3() },
  uCausSize: { value: 2.0 }, uCausGain: { value: 1.0 },
  // one texel of the scatter frame, in world units — the yardstick for "did
  // this ray actually go anywhere", set beside the frame it measures
  uCausTexel: { value: 1.0 },
  /* The film's own brightness, separate from everyone else's. uCausAmt is
     global — crystal's threads and the bubble's fringe ride the same dial —
     and the reference wants the bubble's fringe FAINT under a dark edge
     while the threads stay lit. Scaled at the source, per ray, so only the
     film pays. tuneCaus({filmGain}). 0.15: the photograph keeps barely a
     hint of it. */
  uFilmGain: { value: 0.15 },
  /* Which of the scatter's two truths this draw writes. Mode 0 is the light
     that ARRIVED — sprites at each ray's landing, in rgb. Mode 1 is the
     light that LEFT — the same rays drawn at the spot they would have lit
     unbent, into ALPHA, and the receiver turns that channel into darkness.
     This is the brief's own third step finally done whole: "what goes
     missing where the ray set out IS the shadow." One geometry, two draws,
     because a point cannot stand in two places in one pass. */
  uCausMode: { value: 0 },
  /* How much light the floor loses where a film's deficit landed. Named for
     the receiver dial it feeds. tuneCaus({dark}). */
  uCausDark: { value: 0.65 },
  /* The interior's own small loss. The reference's footprint is not bare
     floor inside — the film reflects and scatters a little everywhere it
     stands, so every film ray leaves this fraction of a deficit at its own
     spot even when it never bent. The rim's full deficit sits on top of it.
     tuneCaus({body}). */
  uFilmBody: { value: 0.18 }
};
/* How strongly the ground reads what the scatter produced. Kept separate from
   the gain inside the pass: that one is about how much light each ray carries,
   this one is about how much of the result reaches the picture, and they are
   turned for different reasons. */
/* How hard a film's curvature throws the light it carries. Shared by every film
   material so one dial moves them together. DIMENSIONLESS, and 1.0 is the
   physical value: the bend is now derived from the body's own curvature, and
   this only scales it for judging.

   The previous form multiplied a hand-picked 0.05 by a crossing that ran to
   fifty times the film — half a radian of bend at the rim, on the theory that
   "the bend is half a radian, which is the ring". Measured on version 16, that
   half radian was the OPPOSITE of the ring: rim rays crossed the whole
   footprint and piled up in the middle (innerMean 1.20 against 0.04 out at the
   rim, ringRatio 0.03), and the strays that missed everything inflated the
   footprint devCaus measures, so the real disc sat entirely inside the "inner
   40%". A thin shell cannot do half a radian: the most it can turn a ray is
   (ior - 1) times the longest chord the geometry allows, and the chord is
   capped by the body's own radius — see the crossing in causGMaterial. For the
   bubble that ceiling is ~0.024 rad, twenty times less than what was written,
   and it is exactly the "all the deflection happens at the contour" the brief
   asked for: 0.0015 rad head-on, 0.024 at the silhouette.

   Negative flips the bend inward (toward the axis). Kept as a dial because the
   sign question — does the rim light land just inside the silhouette or just
   outside it — was settled by measurement, not by argument: swept at
   0, ±0.5, ±1, ±2, −4 on 14 Aug, ring energy (outerExcess) 0.121 inward at
   half strength against 0.030 outward at the same, the middle clean at
   exactly zero for both halves and fouled from −2 on. Inward, gently.

   −1 and not −0.5, revised the same afternoon against the reference
   photograph: at −0.5 the bright ring hugged the silhouette and sat exactly
   on the dark rim band the shadow draws (FILM_RIM), cancelling it. One step
   deeper the fringe lands INSIDE the dark edge — which is where the
   photograph keeps it — and the sweep already showed −1 holds the middle at
   exactly zero (outerExcess 0.155, its strongest). */
const causBend = { value: -1.0 };

/* The film's rim shadow — how much extra gel cover the silhouette carries
   (boost, on top of the flat 0.08) and how tightly it hugs the edge (focus).
   Judged against the bubble-on-ground reference of 14 Aug: at 0.10 the rim's
   block lands around 0.3 after the knee, a soft dark band, not a drawn line.
   tuneGel({rim, rimFocus}) moves them live. */
/* DORMANT, AND THE NUMBER SAYS WHY. This was the first attempt at the
   reference's dark rim: extra gel cover on a film's silhouette. It could
   never have worked and the measurement is the caustic pass's own from
   13 Aug wearing a new coat: the gel is framed to the COVE — ten thousand
   units across a 1024 map — so the whole bubble is ~23 gel texels and the
   rim band is one or two, which the gel's own blur erases entirely. The
   dark ring lives in the caustic pass now (uCausMode, uCausDark), which
   holds ~390 texels across the same body. The mechanism stays, at zero,
   the way ember stayed: pulling it means touching every glass body's gel
   for nothing. tuneGel({rim}) still reaches it. */
const FILM_RIM = { boost: 0 };
const FILM_RIM_FOCUS = { value: 2.4 };
// the lamp's travel direction, for the gel's rim term — written by
// renderCaustics, which already derives it each frame
const gelLightDir = new THREE.Vector3(0, -1, 0);

/* WHAT AN UNBENT RAY WOULD HAVE DELIVERED ANYWAY, and subtracting it is what
   turns a white patch into a ring.

   Reported 13 August: the bubble's shadow reads WHITE, brighter than the bare
   floor, with no rim. The cause is double counting and it is structural, not a
   tuning error. The floor already receives this lamp's light directly. The
   scatter then arrives and ADDS a whole disc of it on top — and a bubble blocks
   almost nothing, so nothing was subtracted first. Light gets counted twice and
   the footprint comes out brighter than the floor around it.

   The brief said this in its third step and it was read as a description rather
   than as an instruction: every texel carries a fixed amount, so what is MISSING
   where a ray set out is the shadow, and the pass has to be a redistribution
   rather than a donation.

   The honest form is therefore the EXCESS over the undeflected case. Where the
   glass bends nothing — the middle of a bubble at ior 1.05 — the rays land where
   they would have landed anyway, the excess is zero, and the floor is left
   exactly as bare floor. That is the reference photograph's "almost nothing in
   the middle". Where rays converge, the excess is positive and the ground is
   brighter than bare floor, which is the ring and the threads.

   It is a constant because the undeflected density is one: this grid emits one
   point per texel of a target of the same resolution, so a field that bends
   nothing lands at one point per texel everywhere. What that reads as after the
   sprite's own falloff and the softening round is what this number is, and it is
   measured rather than derived — see devCaus, whose p50 on a body that is barely
   refracting IS this value. */
const causRecv = { uCaustic: { value: null }, uCausAmt: { value: 1.15 },
                   uCausFloor: { value: 0.11 },
                   /* Tap spacing of the softening round, in texels of the
                      caustic target. 0 turns it off and the grain comes back.

                      0.7 and not 1.5: the kernel is seventeen taps, so the
                      spacing is multiplied by that reach. At 1.5 it carried the
                      landing across the WHOLE target — measured, hitShare went
                      from 0.25 to 1.00 — and flattened the peak from 4.8 to
                      1.1, which is the focusing this pass exists to produce
                      being blurred back out. This is the least that closes the
                      grain. */
                   uCausSoft: { value: 0.7 } };

function causTargets() {
  if (causGRT) return;
  const opt = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
                format: THREE.RGBAFormat, type: THREE.FloatType, depthBuffer: true };
  /* Float, and it has to be. The G-buffer stores a direction and a depth, and
     an eighth of a unit of error in a direction is a caustic landing in the
     wrong place by a body's width. The scatter target is float for a different
     reason: it accumulates, and eight bits saturate after a few dozen rays land
     on the same texel — which is exactly where the brightest thread is. */
  causGRT = new THREE.WebGLRenderTarget(CAUS_RES, CAUS_RES, opt);
  /* THE BACK SURFACE, which is what makes this a lens instead of a window.

     Refracting once, at the face the light enters, bends every ray by the same
     sort of amount and sends them off in a spray: measured that way the pass
     put light on half its own target and the ground read as a wide pale wash.
     A caustic is not one bend, it is the bend on the way IN and the bend on the
     way OUT, and the second one is what turns a spray into a convergence — the
     threads inside a tumbler's footprint and the ring under a bubble are both
     that exit.

     So a second buffer, drawn with the back faces only. It carries the exit
     surface's normal and its depth; the depth against the front buffer's is the
     thickness the brief asked for, and the normal is what the ray leaves
     through. The normal is stored in VIEW SPACE and only two of its components
     are kept, because a face turned away from this camera must have a negative
     view z — the sign is knowable and the channel it would cost is needed for
     the ior, which belongs to the body and to nothing else in the pass. */
  causBRT = new THREE.WebGLRenderTarget(CAUS_RES, CAUS_RES, opt);
  causRT = new THREE.WebGLRenderTarget(CAUS_RES, CAUS_RES,
    { ...opt, depthBuffer: false });
  /* Somewhere to soften the landing. Every ray is a point sprite two pixels
     wide, and at a quarter of the target covered the gaps between them read as
     GRAIN — reported as "the shadow is full of little dots". The gel already
     solved this exact problem for itself and the same rule applies here: taps
     that are further apart than they are wide stop blurring and start
     sampling, and what comes back is a grid. */
  causBlurRT = new THREE.WebGLRenderTarget(CAUS_RES, CAUS_RES,
    { ...opt, depthBuffer: false });
  causRecv.uCaustic.value = causRT.texture;

  /* One point per texel of the G-buffer. The grid is the SOURCE resolution, not
     the destination: each point is one ray, and where it ends up is the whole
     question. Positions carry the uv and nothing else — the vertex shader
     computes every coordinate that matters. */
  const n = CAUS_RES;
  const pos = new Float32Array(n * n * 3);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const i = (y * n + x) * 3;
      pos[i] = (x + 0.5) / n; pos[i + 1] = (y + 0.5) / n; pos[i + 2] = 0;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const mat = new THREE.ShaderMaterial({
    uniforms: causUniforms, toneMapped: false, depthTest: false, depthWrite: false,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
    vertexShader: `
      uniform sampler2D tCausG;
      uniform sampler2D tCausB;
      uniform sampler2D tGelRaw;
      uniform mat4 uCausMatrix;
      uniform mat4 uCausMatrixInv;
      uniform mat4 uGelMatrix;
      uniform mat3 uCausNormal;
      uniform vec3 uLightDirW;
      uniform float uCausNear;
      uniform float uCausFar;
      uniform vec3 uPlaneP;
      uniform vec3 uPlaneN;
      uniform float uCausSize;
      uniform float uCausTexel;
      uniform float uFilmGain;
      uniform float uCausMode;
      uniform float uFilmBody;
      varying vec3 vTint;
      varying float vDeficit;
      void main() {
        vec2 uv = position.xy;
        vec4 g = texture2D(tCausG, uv);
        // a cleared texel is all zeros, so a stored direction of no length means
        // there was no glass in front of this ray at all
        if (dot(g.xyz, g.xyz) < 1e-6) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; vTint = vec3(0.0);
          return;
        }
        /* The stored length is a flag, not an accident: 1 for a solid body,
           whose exit bend still has to be found on its back face, and 2 for a
           film, which did both of its bends in the G-buffer because it has no
           far side worth looking up. */
        float enc = length(g.xyz);
        vec3 dir = g.xyz / enc;
        bool solid = enc < 1.5;
        // where the ray entered: the texel's own position at the depth it was
        // recorded at, taken back through the lamp camera
        vec4 e = uCausMatrixInv * vec4(uv * 2.0 - 1.0, g.w * 2.0 - 1.0, 1.0);
        vec3 entry = e.xyz / e.w;
        // kept because the colour belongs to where the ray went IN, and entry
        // is about to be moved to where it comes out
        vec3 tintAt = entry;

        /* THE SECOND BEND, ON THE WAY OUT.

           The thickness first: an orthographic depth is linear, so the gap
           between the back buffer and the front one is a distance in world
           units straight away. It is measured down the CAMERA's axis, and this
           camera looks along the lamp, so it is the distance the unbent ray
           would have crossed; the bent one goes further, by the cosine of how
           far it was turned. A texel with no back face reads zero and simply
           keeps its single bend, which is what an open ribbon should do. */
        vec4 bk = texture2D(tCausB, uv);
        float thick = max(bk.z - g.w, 0.0) * (uCausFar - uCausNear);
        if (solid && thick > 1e-5) {
          float ior = max(bk.w, 1.0001);
          vec3 exitP = entry + dir * (thick / max(dot(dir, uLightDirW), 0.2));
          /* The exit normal is read where the ray actually ARRIVES, not where
             it set out: the ray has been travelling sideways inside the glass,
             and the back of a sphere is a different surface at every step of
             that. Reading it at the entry texel is the approximation that makes
             a sphere behave like a slab, and a slab has no focus. */
          vec4 xp = uCausMatrix * vec4(exitP, 1.0);
          vec2 xuv = clamp(xp.xy / xp.w * 0.5 + 0.5, 0.0, 1.0);
          vec4 bk2 = texture2D(tCausB, xuv);
          vec2 nxy = bk2.xy;
          float nsq = dot(nxy, nxy);
          if (nsq < 1.0 && bk2.z > 0.0) {
            // the missing component: a face turned away from this camera has a
            // negative view z, so the sign never had to be stored
            vec3 nOut = normalize(uCausNormal * vec3(nxy, -sqrt(1.0 - nsq)));
            if (dot(nOut, dir) < 0.0) nOut = -nOut;     // it points the way out
            vec3 r2 = refract(dir, -nOut, ior);
            // total internal reflection: the ray stays in. Let it carry on
            // rather than vanish — a vanished ray is a hole in the light
            if (dot(r2, r2) > 1e-6) dir = normalize(r2);
            entry = exitP;
          }
        }

        // and where it meets the ground
        float denom = dot(dir, uPlaneN);
        if (abs(denom) < 1e-5) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; vTint = vec3(0.0);
          return;
        }
        float t = dot(uPlaneP - entry, uPlaneN) / denom;
        if (t <= 0.0) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; vTint = vec3(0.0);
          return;
        }
        vec3 hit = entry + dir * t;
        /* A FILM RAY THAT WENT NOWHERE IS NOT DRAWN, and this is what makes
           the middle of the bubble's footprint read as bare floor on the
           ORIGINAL floor value. An undeflected film ray lands on its own
           texel and deposits exactly the light the floor already received
           directly — the double counting the brief's third step names. The
           receiver's uCausFloor was one answer, but its 0.11 was measured on
           the SOLID regime (double refraction spreads a body's rays thin);
           a film's undeflected sheet sits at 1.0 per texel, nine times the
           floor, and the footprint came back as a glowing disc. Rather than
           split the floor per regime, the ray that reproduces the floor is
           dropped at the source: films only ever WRITE their excess. Solids
           are untouched — their whole field is redistribution. Sub-texel is
           the yardstick because a sprite that lands within its own texel is
           the identity map wearing a different position. */
        bool moved = false;
        if (!solid) {
          vec3 off = hit - tintAt;
          off -= uLightDirW * dot(off, uLightDirW);
          moved = dot(off, off) >= uCausTexel * uCausTexel * 0.56;
        }
        if (uCausMode > 0.5) {
          /* THE DEFICIT DRAW. A film ray that moved left a hole where the
             unbent ray would have landed, and the hole is drawn there, into
             the alpha channel, at the caustic's own resolution — the gel was
             tried first and measured too coarse to hold it (~23 texels for
             a whole body against ~390 here). Only films: a solid's whole
             field is redistribution and its block already owns its shadow. */
          float den0 = dot(uLightDirW, uPlaneN);
          // every film ray leaves at least the body's small loss; only a
          // solid is excused — its block already owns its whole shadow
          if (solid || abs(den0) < 1e-5) {
            gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0;
            vTint = vec3(0.0); vDeficit = 0.0;
            return;
          }
          float t0 = dot(uPlaneP - tintAt, uPlaneN) / den0;
          if (t0 <= 0.0) {
            gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0;
            vTint = vec3(0.0); vDeficit = 0.0;
            return;
          }
          hit = tintAt + uLightDirW * t0;
        } else if (!solid && !moved) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0;
          vTint = vec3(0.0); vDeficit = 0.0;
          return;
        }
        /* The colour the ray picked up on its way through, from the same pass
           that already works out what each body does to light. It has to be
           looked up through the GEL's frame and not this one: the two cameras
           see the same world from the same lamp but at wildly different widths,
           so the ray's own uv means nothing over there. The entry point is the
           common ground between them. */
        vec4 gp = uGelMatrix * vec4(tintAt, 1.0);
        vec2 guv = gp.xy / gp.w * 0.5 + 0.5;
        vec4 gel = texture2D(tGelRaw, guv);
        float peak = max(gel.r, max(gel.g, gel.b));
        vTint = peak > 1e-4 ? gel.rgb / peak : vec3(1.0);
        // the reference keeps a film's relocated light FAINT under its dark
        // edge; a solid's threads are the whole show and keep full strength
        if (!solid) vTint *= uFilmGain;
        if (uCausMode > 0.5) vTint = vec3(0.0);
        // a moved ray's absence is total; a ray that stayed still leaves
        // only the film's own small loss behind
        vDeficit = uCausMode * (moved ? 1.0 : uFilmBody);
        gl_Position = uCausMatrix * vec4(hit, 1.0);
        gl_PointSize = uCausSize;
      }
    `,
    fragmentShader: `
      varying vec3 vTint;
      varying float vDeficit;
      uniform float uCausGain;
      void main() {
        /* Round, and soft toward the edge. A square point is a square of light,
           and a field of them at this density reads as a grid the moment two
           land next to each other — the same aliasing the gel blur was already
           caught by once. */
        vec2 d = gl_PointCoord - 0.5;
        float r = 1.0 - smoothstep(0.18, 0.5, length(d));
        // rgb is the light that arrived; alpha is the light that left. The
        // two never mix in one draw — vDeficit is 0 or 1 per pass.
        gl_FragColor = vec4(vTint * (uCausGain * r), vDeficit * r);
      }
    `
  });
  causPoints = new THREE.Points(g, mat);
  causPoints.frustumCulled = false;
  causScene = new THREE.Scene();
  causScene.add(causPoints);
}

/* The material that writes the G-buffer, one per body so the ior is its own.
   The bend is computed here and stored as a direction, not as a normal: this is
   the only place where the surface, the lamp and the material's ior are all in
   scope at once, and asking the scatter to redo it would mean finding a channel
   to carry the ior in. */
function causGMaterial(ior, film = 0) {
  return new THREE.ShaderMaterial({
    uniforms: { uIor: { value: ior }, uLightDir: { value: new THREE.Vector3() },
                uFilm: { value: film }, uFilmBend: causBend,
                // the body's own radius, world units — the curvature that does
                // the bending. Set by renderCaustics next to the film test,
                // from the same Box3 the test already measures.
                uFilmR: { value: 1 } },
    toneMapped: false, side: THREE.FrontSide,
    vertexShader: `
      varying vec3 vN;
      void main() {
        vN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vN;
      uniform float uIor;
      uniform float uFilm;
      uniform float uFilmBend;
      uniform float uFilmR;
      uniform vec3 uLightDir;
      void main() {
        vec3 n = normalize(vN);
        // face the normal against the ray, so a back face bends the same way a
        // front one does rather than inverting the whole caustic
        if (dot(n, uLightDir) > 0.0) n = -n;

        /* A FILM IS NOT A BODY, AND TREATING IT AS ONE IS WHY THERE WAS NO RING.

           Measured: the pass read the bubble as 267 units thick because that is
           how wide the BALL is, while the material calls itself 3.9 — sixty-nine
           times out. And that difference is the whole photograph. A solid body
           is a long crossing everywhere, so it fills its footprint. A film is
           almost nothing head-on and a long crossing only where the ray meets it
           edge-on, which is the silhouette — so the middle stays clear and the
           rim does all the bending. That is the brief's own account of why a
           soap bubble throws a thin ring and almost nothing in the middle.

           So the crossing is the film's thickness divided by how squarely the
           ray meets the surface — 3.9 at the centre — but NOT without a limit
           at the rim. The limit was the missing physics, and paying for its
           absence was version 16's whole result: an uncapped crossing times a
           hand-picked constant put half a radian of bend on the rim, rim rays
           crossed the entire footprint and stacked up in the middle, and the
           measured picture was the exact inverse of the reference photograph
           (innerMean 1.20, outerMean 0.04, ringRatio 0.03).

           The limit is the body's own curvature. A ray tangent to a shell of
           radius R and thickness t leaves it after a chord of sqrt(8*R*t) —
           the 1/cos divergence is real but the geometry cuts it off. And the
           bend is not free to be chosen: along that crossing the surface
           normal turns by chord/R radians, a curved slab element deflects by
           (ior - 1) of the turn it spans, so the most a thin film can throw a
           ray is (ior - 1) * sqrt(8*t/R) — for this bubble ~0.024 rad, at the
           silhouette only, falling to ~0.0015 head-on. That ratio, sixteen to
           one inside a tenth of the radius, is "all the deflection happens at
           the contour" said in numbers, and the ring is that contour landing
           a body's-width scale away all round.

           Both refractions are done here for a film. There is no second surface
           to look up: the two faces of a film are parallel and a parallel slab
           deflects nothing at all, so the deflection that matters is the one the
           CURVATURE produces along that crossing. The chord carries it. */
        if (uFilm > 0.0) {
          float cosI = max(abs(dot(n, uLightDir)), 1e-3);
          float chord = min(uFilm / cosI, sqrt(8.0 * max(uFilmR, uFilm) * uFilm));
          /* GATED AT THE MIDDLE, and the picture demanded it before the theory
             did. Parallel faces cancel a head-on deviation EXACTLY — not
             approximately — so until the crossing is a few films long there is
             nothing honest to bend. Without the gate the leftover microbend
             rode every lump of the inflated surface: devCausShot showed the
             whole interior covered in an interference web, and innerMean rose
             to 1.5 on a disc whose middle should sit at exactly 1.0. The gate
             opens across crossings of two-to-six films, which is the last
             ~quarter of the radius — the contour, where the brief wants all
             of the deflection to live. */
          float gate = smoothstep(2.0, 6.0, chord / uFilm);
          float bend = uFilmBend * (uIor - 1.0) * gate * chord / max(uFilmR, uFilm);
          vec3 d = normalize(uLightDir + n * bend);
          // stored at length 2 so the scatter knows this ray is finished and
          // must not be bent again on a back face that belongs to a ball
          gl_FragColor = vec4(d * 2.0, gl_FragCoord.z);
          return;
        }

        vec3 r = refract(uLightDir, n, 1.0 / uIor);
        // total internal reflection returns zero: let that ray carry straight on
        // rather than vanishing, since a vanished ray is a hole in the light
        if (dot(r, r) < 1e-6) r = uLightDir;
        gl_FragColor = vec4(normalize(r), gl_FragCoord.z);
      }
    `
  });
}

/* ---------- and the wiring, added 13 Aug for version 15 ----------

   Everything above was built and left dormant: the targets, the G-buffer
   material and the scatter shader all existed and nothing in the frame called
   them. This is what makes them run.

   THE PLACE IN THE ORDER IS NOT FREE. The scatter reads the gel BEFORE the
   blur. The blur ping-pongs back into gelRT, so by the time the receiver
   samples it the raw signal is gone — and the raw signal is what tells each ray
   what colour it picked up on the way through. So this sits between the gel
   render and the blur, and nowhere else.

   It also runs INSIDE renderGel's own swap, while the cove is hidden and the
   opaque bodies are hidden with it. Both matter: the ground must not appear in
   a buffer that records what light did on its way TO the ground, and an opaque
   body writing a bent direction here would scatter light it actually stopped. */
function renderCaustics() {
  /* One direction for every ray. The key is a DirectionalLight and the gel
     camera is orthographic, so the lamp has no position in the optical sense —
     `key.position` only states which way it points. */
  const dir = new THREE.Vector3().copy(key.position).normalize().negate();
  gelLightDir.copy(dir);

  const swapped = [];
  for (const b of bodies) {
    if (!b.glass) continue;
    if (!b.causMat) {
      /* The ior belongs to the body and nothing else in the pass can carry it,
         which is why the bend is computed in the G-buffer shader rather than
         being redone later from a stored normal. 1.45 is only the fallback for
         a transmissive material that never set one. */
      // stashed by renderGel before it swapped the real materials away — see
      // the note there for why it cannot be read at this point
      const ior = b.causIor || 1.45;
      b.causMat = causGMaterial(ior, 0);
      b.causBMat = causBMaterial(ior);
    }
    b.causMat.uniforms.uLightDir.value.copy(dir);

    /* FILM OR BODY, decided every frame and not once at birth. Decided by the
       material against its own size rather than by name: `bubble` is the one
       that matters today — 3.9 of film across a 255-unit ball — but the test is
       the ratio, so a later membrane is caught without anyone remembering to
       add it to a list, and a solid body cannot fall into it by accident.

       IT IS RE-TESTED EVERY FRAME BECAUSE AT BIRTH THE ANSWER IS WRONG. A body
       is not placed or scaled when its materials are first built, and measured
       there the bubble came back 0.3 wide against 3.9 of film — a ratio of 13,
       which reads as a solid slab and silently disabled the whole film path.
       That is the same "the framing moves the composition after the drawing"
       trap the brief warns about, arriving in a new costume. */
    const filmT = b.causThick || 0;
    const width = new THREE.Box3().setFromObject(b.mesh).getSize(new THREE.Vector3()).x;
    const isFilm = width > 0 && filmT > 0 && filmT / width < 0.05;
    b.causMat.uniforms.uFilm.value = isFilm ? filmT : 0;
    // the same verdict feeds the gel's rim shadow: a film darkens its
    // silhouette band, a solid keeps the flat cover it always had
    if (b.gelRim) b.gelRim.value = isFilm ? FILM_RIM.boost : 0;
    // the radius the bend divides by — same Box3 the film test just measured,
    // so the curvature the shader assumes is the size the body actually is
    b.causMat.uniforms.uFilmR.value = Math.max(width / 2, 1e-3);
    b.mesh.traverse(o => {
      if (o.isMesh) { swapped.push([o, o.material, b]); o.material = b.causMat; }
    });
  }

  /* An empty frame has to CLEAR, not skip. The scatter target holds whatever
     the last frame put there, so returning early leaves a caustic burnt onto
     the floor of a scene with no glass left in it. */
  renderer.setRenderTarget(causGRT);
  renderer.clear();
  if (!swapped.length) {
    renderer.setRenderTarget(causRT);
    renderer.clear();
    return;
  }
  /* THE GROUND IS NOT HORIZONTAL, and assuming it is was the first trap waiting
     here. `placeCove` tips it (`cove.rotation.x = -0.42`) so its normal leans
     toward the camera; a hard-coded (0,1,0) would still find an intersection
     for every ray, just the wrong one, and the whole caustic would land
     somewhere plausible and be wrong by a body's width. Taken from the object
     itself, it cannot drift when the framing moves the cove again. */
  cove.updateMatrixWorld(true);
  const planeP = causUniforms.uPlaneP.value.setFromMatrixPosition(cove.matrixWorld);
  const planeN = causUniforms.uPlaneN.value.set(0, 0, 1).transformDirection(cove.matrixWorld);

  /* The region the pass has to cover: every corner of the glass, and where the
     lamp would drop that corner onto the ground. Framing to the bodies alone
     would clip the caustic off the bottom of its own target, since the light
     lands well below and behind the thing that bent it. */
  const gbox = new THREE.Box3();
  for (const b of bodies) if (b.glass) gbox.expandByObject(b.mesh);
  if (gbox.isEmpty()) { renderer.setRenderTarget(causRT); renderer.clear();
                        for (const [o, m] of swapped) o.material = m; return; }
  const pts = [];
  const denom = dir.dot(planeN);
  for (const x of [gbox.min.x, gbox.max.x])
    for (const y of [gbox.min.y, gbox.max.y])
      for (const z of [gbox.min.z, gbox.max.z]) {
        const p = new THREE.Vector3(x, y, z);
        pts.push(p);
        if (Math.abs(denom) > 1e-5) {
          const t = planeP.clone().sub(p).dot(planeN) / denom;
          if (t > 0) pts.push(p.clone().addScaledVector(dir, t));
        }
      }

  // point the camera down the lamp, then measure the region in its own space
  const centre = new THREE.Vector3();
  for (const p of pts) centre.add(p);
  centre.divideScalar(pts.length);
  let reach = 0;
  for (const p of pts) reach = Math.max(reach, p.distanceTo(centre));
  causCam.position.copy(centre).addScaledVector(dir, -(reach * 2 + 1));
  causCam.lookAt(centre);
  causCam.updateMatrixWorld(true);
  let x0 = 1e9, y0 = 1e9, z0 = 1e9, x1 = -1e9, y1 = -1e9, z1 = -1e9;
  const v = new THREE.Vector3();
  for (const p of pts) {
    v.copy(p).applyMatrix4(causCam.matrixWorldInverse);
    x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x);
    y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
    z0 = Math.min(z0, v.z); z1 = Math.max(z1, v.z);
  }
  // a margin, so a body on the edge of the region still has room for the point
  // sprite that represents it
  const pad = Math.max((x1 - x0), (y1 - y0)) * 0.06 + 1e-3;

  /* AND THE FRAME IS QUANTISED, WHICH IS WHAT STOPS THE CRAWLING.

     Reported as "the shadow moves like waves". The region is measured from the
     bodies, the bodies are on a turntable, so every frame produced a slightly
     different width and a slightly different centre — and the whole caustic was
     resampled onto a grid that had shifted underneath it. What the eye reads is
     not the caustic moving with the light, which would be right, but the
     SAMPLING moving, which is never right.

     Two steps, the same pair used to settle a shadow map. The extent is rounded
     up to a coarse increment so it changes rarely instead of continuously, and
     the frame is then snapped to whole texels of itself so a small drift moves
     the window by an exact texel rather than by a fraction of one. */
  let halfW = (x1 - x0) / 2 + pad, halfH = (y1 - y0) / 2 + pad;
  const step = Math.max(halfW, halfH) * 0.08;
  halfW = Math.ceil(halfW / step) * step;
  halfH = Math.ceil(halfH / step) * step;
  const midX = (x0 + x1) / 2, midY = (y0 + y1) / 2;
  const texW = (halfW * 2) / CAUS_RES, texH = (halfH * 2) / CAUS_RES;
  const snapX = Math.round(midX / texW) * texW, snapY = Math.round(midY / texH) * texH;
  x0 = snapX - halfW; x1 = snapX + halfW;
  y0 = snapY - halfH; y1 = snapY + halfH;

  causCam.left = x0; causCam.right = x1;
  causCam.bottom = y0; causCam.top = y1;
  causCam.near = Math.max(-z1 - pad, 0.01); causCam.far = -z0 + pad;
  causCam.updateProjectionMatrix();
  causMatrix.multiplyMatrices(causCam.projectionMatrix, causCam.matrixWorldInverse);
  causMatrixInv.copy(causMatrix).invert();
  // the frame just settled, so this is the moment the texel yardstick is true
  causUniforms.uCausTexel.value = (x1 - x0) / CAUS_RES;

  renderer.render(scene, causCam);

  /* The same scene again, back faces only. Two draws of the glass per frame is
     the price of the exit bend, and it is the honest price: there is no way to
     know where a ray leaves a body without drawing the surface it leaves
     through. */
  for (const [o, , b] of swapped) o.material = b.causBMat;
  renderer.setRenderTarget(causBRT);
  renderer.clear();
  renderer.render(scene, causCam);

  causUniforms.tCausG.value = causGRT.texture;
  causUniforms.tCausB.value = causBRT.texture;
  causUniforms.tGelRaw.value = gelRT.texture;
  causUniforms.uCausNear.value = causCam.near;
  causUniforms.uCausFar.value = causCam.far;
  causUniforms.uLightDirW.value.copy(dir);
  causUniforms.uCausNormal.value.setFromMatrix4(causCam.matrixWorld);

  renderer.setRenderTarget(causRT);
  renderer.clear();
  /* The camera argument is a formality: the scatter's vertex shader writes
     gl_Position from uCausMatrix itself, because a point's home is where its
     ray lands and not where its vertex started. */
  causUniforms.uCausMode.value = 0;
  renderer.render(causScene, causCam);
  // and the same points again as absences — see uCausMode. Films only, so a
  // scene with no film pays one cleared draw of culled points and nothing else
  causUniforms.uCausMode.value = 1;
  renderer.render(causScene, causCam);
  causUniforms.uCausMode.value = 0;

  /* One separable round over the landed rays, to close the gaps between point
     sprites without erasing what the pass went to the trouble of focusing. The
     gel runs two rounds because it wants a soft blob; this wants the opposite,
     so it gets the smallest amount that fills the grain. The spacing stays
     under the tap width for the reason written on the gel's own blur — wider
     taps do not blur, they sample, and a grid comes back. */
  const soft = causRecv.uCausSoft.value;
  if (soft > 0) {
    quadMesh.material = gelBlurMat;
    gelBlurUniforms.tSrc.value = causRT.texture;
    gelBlurUniforms.uDir.value.set(soft / CAUS_RES, 0);
    renderer.setRenderTarget(causBlurRT);
    renderer.clear();
    renderer.render(quadScene, quadCam);
    gelBlurUniforms.tSrc.value = causBlurRT.texture;
    gelBlurUniforms.uDir.value.set(0, soft / CAUS_RES);
    renderer.setRenderTarget(causRT);
    renderer.clear();
    renderer.render(quadScene, quadCam);
  }

  for (const [o, m] of swapped) o.material = m;
}

/* The back-face buffer's material: the exit surface, stored so the scatter can
   bend a ray on its way out. View-space normal, two components (the third is
   recoverable — see causTargets), the depth, and the body's own ior. */
function causBMaterial(ior) {
  return new THREE.ShaderMaterial({
    uniforms: { uIor: { value: ior } },
    toneMapped: false, side: THREE.BackSide,
    vertexShader: `
      varying vec3 vNV;
      void main() {
        vNV = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }

    fragmentShader: `
      varying vec3 vNV;
      uniform float uIor;
      void main() {
        vec3 n = normalize(vNV);
        gl_FragColor = vec4(n.xy, gl_FragCoord.z, uIor);
      }
    `

}

function gelColour(b) {
  const out = new THREE.Color(0xffffff);
  let found = false;
  b.mesh.traverse(o => {
    if (found || !o.isMesh || !o.material || !o.material.transmission) return;
    const m = o.material;
    out.copy(m.attenuationColor && m.attenuationDistance < 1e4 ? m.attenuationColor : m.color);
    found = true;
  });
  return out;
}

function renderGel() {
  gelTargets();
  // the lamp's own view, framed exactly like its shadow camera so the two agree
  const sc = key.shadow.camera;
  gelCam.left = sc.left; gelCam.right = sc.right;
  gelCam.top = sc.top; gelCam.bottom = sc.bottom;
  gelCam.near = sc.near; gelCam.far = sc.far;
  gelCam.position.copy(key.position);
  gelCam.lookAt(0, 0, 0);

  for (const b of bodies) {
    if (b.glass) {

         the last moment they exist. Two lines below, every mesh is swapped to
         b.gelMat — a MeshBasicMaterial, which has no transmission, no ior and
         no thickness — and the caustic pass runs after that swap. Read there,
         `o.material.thickness` is undefined for every body in the scene, the
         film test can never fire, and the bubble is silently treated as a solid
         ball. That cost two rounds of measuring a fix that was running
         correctly and being handed zeroes. */
      b.mesh.traverse(o => {
        if (o.isMesh && o.material && o.material.transmission) {
          b.causThick = o.material.thickness || 0;
          b.causIor = o.material.ior || 1.45;
        }
      });
      if (!b.gelMat) {
        /* How much light this body's gel takes out of the ground. It was a
           flat 0.55 for every glass body, and sixteen clear bubbles then
           stacked sixteen dimmings into one grey pool behind the cluster —
           which the front bodies showed through themselves, and which read as
           "the front bubbles are darker". A body that actually absorbs light
           (a finite attenuation distance: jelly, seaglass, crystal, gem,
           iris) keeps its patch; a clear film takes almost nothing, which is
           what a film does. */
        let gelDim = 0.08;
        b.mesh.traverse(o => {
          if (o.isMesh && o.material && o.material.transmission &&
              o.material.attenuationDistance && isFinite(o.material.attenuationDistance)) gelDim = 0.55;

          color: gelColour(b), toneMapped: false,
          transparent: true, opacity: gelDim, depthWrite: false,
          blending: THREE.CustomBlending,
          // colour adds so overlapping bodies stack, alpha accumulates the same
          // way — one pass gives both the tint and how much was in the way
          blendEquation: THREE.AddEquation,
          blendSrc: THREE.SrcAlphaFactor, blendDst: THREE.OneFactor,
          blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor
        });
        /* THE DARK RING IS THE SHADOW'S, 14 Aug evening. The reference
           photograph (a real bubble on real ground) settled what the scatter
           could not: the footprint's EDGE is dark. Physically that is the rim
           annulus whose light the film deflected away — the same rays the
           caustic pass relocates into the bright fringe — so the deficit
           belongs to the shadow model, exactly where the receiver's own
           doctrine says darkening lives. A film's gel therefore stops being
           one flat 0.08: head-on it stays almost nothing, and toward the
           silhouette the cover climbs, so the block draws a soft dark ring
           through the pipeline that already knows how to draw shadows —
           knee, ceiling, tint and blur included. uGelRim stays 0 for every
           solid body, decided per frame beside the film test it borrows. */
        b.gelRim = { value: 0 };
        b.gelMat.onBeforeCompile = sh => {
          sh.uniforms.uGelRim = b.gelRim;
          sh.uniforms.uGelRimFocus = FILM_RIM_FOCUS;
          sh.uniforms.uGelLightDir = { value: gelLightDir };
          sh.vertexShader = sh.vertexShader
            .replace('#include <common>', '#include <common>\nvarying vec3 vGelN;')
            .replace('#include <begin_vertex>', '#include <begin_vertex>\nvGelN = normalize(mat3(modelMatrix) * normal);');
          sh.fragmentShader = sh.fragmentShader
            .replace('#include <common>', '#include <common>\nvarying vec3 vGelN;\nuniform float uGelRim;\nuniform float uGelRimFocus;\nuniform vec3 uGelLightDir;')
            .replace('#include <color_fragment>', `#include <color_fragment>
        if (uGelRim > 0.0) {
          float grz = 1.0 - abs(dot(normalize(vGelN), uGelLightDir));
          diffuseColor.a += uGelRim * pow(grz, uGelRimFocus);
        }`);
        };
      }
      b.mesh.traverse(o => {
        if (o.isMesh) { swapped.push([o, o.material]); o.material = b.gelMat; }
      });
    } else if (b.mesh.visible) {
      // opaque bodies are not in this pass at all: they already have a shadow,
      // and letting them write here would put a black hole in the middle of it
      b.mesh.visible = false; hidden.push(b.mesh);
    }
  }

  const groundWas = cove.visible;
  cove.visible = false;
  const bgWas = scene.background;
  scene.background = null;
  const clearWas = renderer.getClearColor(new THREE.Color()), alphaWas = renderer.getClearAlpha();
  renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(gelRT);
  renderer.clear();
  if (swapped.length) renderer.render(scene, gelCam);

  // before the blur, and while the cove and the opaque bodies are still hidden
  renderCaustics();

  /* TWO ROUNDS AT A TAP SPACING THAT DOES NOT SKIP TEXELS.

     The kernel is seventeen taps, and its reach was being bought by spreading
     them: 2.2 texels apart at 512, and 4.4 when the map was doubled to keep the
     same softness in world terms. Taps 4.4 texels apart do not blur a signal,
     they SAMPLE it — every fifth texel, with the four between them ignored —
     and since the pass is separable, the aliasing that comes back is a grid.
     Squares. Worst under the crystal, which has the most structure in its alpha
     to alias in the first place.

     So the spacing goes back to where a tap still overlaps its neighbour, and
     the width is bought by running the separable pair TWICE instead. Two
     gaussians compose into one of sigma * sqrt(2), which lands close to the
     original softness with nothing skipped. Four quad passes over a 1024 map,
     which is not where this frame's time goes. */
  quadMesh.material = gelBlurMat;
  for (let pass = 0; pass < 2; pass++) {
    gelBlurUniforms.tSrc.value = gelRT.texture;
    gelBlurUniforms.uDir.value.set(2.2 / GEL_RES, 0);
    renderer.setRenderTarget(gelBlurRT);
    renderer.clear();
    renderer.render(quadScene, quadCam);
    gelBlurUniforms.tSrc.value = gelBlurRT.texture;
    gelBlurUniforms.uDir.value.set(0, 2.2 / GEL_RES);
    renderer.setRenderTarget(gelRT);
    renderer.clear();
    renderer.render(quadScene, quadCam);
  }
  gelUniforms.tGel.value = gelRT.texture;

  renderer.setClearColor(clearWas, alphaWas);
  renderer.setRenderTarget(null);
  scene.background = bgWas;
  cove.visible = groundWas;
  for (const [o, m] of swapped) o.material = m;
  for (const m of hidden) m.visible = true;
}

/* ---------- how much of itself the glass is ----------

   "Why can't the twentieth piece of glass look like the first?" Because as
   written it cannot: three's transmission replaces the body's own colour with a
   sample of whatever is behind it, so the first bubble is the colour of an empty
   bright room and the twentieth is the colour of nineteen dark bodies. Measured,
   a bubble alone reads 227 and the same bubble over a pile of 28 reads 93. That
   is not a fault to tune out — it is what a window does — and no amount of
   attenuation or ior moves it, both of which were tried and measured.

   The way out is to stop the glass being purely a window. Real glass of any
   thickness scatters a little light inside itself, and a soap film has its own
   colour that does not come from the wall behind it; both mean some fixed share
   of what you see belongs to the material rather than to the backdrop. That
   share is what makes a row of glass objects read as the same material.

   So: a floor. `uGlassBody` mixes the transmitted colour toward the body's own
   tint, and the higher it is the less the backdrop decides what the glass looks
   like. At 0 the glass is a pure window, which is what version 9 shipped.

   Set to 0.035 by Hadar, off the bench, and it is deliberately a whisper: it
   takes about an eighth off the gap between a bubble standing alone and one
   over twenty bodies, and leaves seeing through it untouched. The larger values
   that close the gap properly cost transparency one for one, and that trade was
   looked at and declined. */
/* ---------- the glass layer: what the glass actually samples ----------

   three's transmission is a second pass that renders the OPAQUE scene into a
   private target, and every transmissive material samples that target instead
   of carrying a colour of its own. Both reported faults fall straight out of
   that: glass is not in the target, so glass cannot see glass (jelly behind a
   bubble measured 0.03 of itself, seaglass 0.00 — not dimmed, absent); and the
   sample arrives at the pile's own exposure, so the twentieth bubble wears the
   accumulated darkness of everything behind it (227 alone against 93 over 28).

   r160 does try to help — it re-renders the back faces of DOUBLE-SIDED
   transmissive materials into that target — and on this renderer that
   contribution measures exactly zero (flipping a body between FrontSide,
   DoubleSide and BackSide moved the through-reading by 0.001). Rather than
   lean harder on a private mechanism that provably does not deliver here, the
   glass now samples a target THIS file owns:

   the layer pass renders the whole scene once more with every glass body
   swapped to a translucent tinted shell — the same swap-in-place technique the
   gel pass uses, so nothing joins the scene graph and nothing leaks into the
   GLB. Painter-sorted alpha blending does the seeing-through: a shell is
   blended over whatever already stands behind it, so the target ends up
   holding the opaque scene WITH every glass body present as a tinted window.
   Glass sampling that target sees its neighbours; a body's own shell at its
   own pixels only tints the view with the body's own colour, which is a
   whisper of self and not a wall. The bubble's shell is nearly clear — a film
   seen from behind is nearly nothing, and a milky shell would print itself on
   everything the bubble shows.

   The internal transmission pass still runs (the materials keep their real
   transmission so nothing else about them changes); its target is simply no
   longer sampled. That costs one redundant opaque render per frame, measured
   under "fps" before freezing — the alternative was to fake the material into
   the opaque list and re-plumb five uniforms by hand, and that trade was
   declined for surface area. */
let glassLayerRT = null;
const glassLayerUniforms = {
  uGlassLayersMap: { value: null },
  uGlassLayersSize: { value: new THREE.Vector2(1, 1) }
};
function makeGlassLayerTarget() {
  const s = renderer.getDrawingBufferSize(new THREE.Vector2());
  if (glassLayerRT && glassLayerRT.width === s.x && glassLayerRT.height === s.y) return;
  if (glassLayerRT) glassLayerRT.dispose();
  glassLayerRT = new THREE.WebGLRenderTarget(s.x, s.y, {
    generateMipmaps: true,
    minFilter: THREE.LinearMipmapLinearFilter,
    magFilter: THREE.LinearFilter,
    // no MSAA: the layer is only ever read through mip levels and refraction
    // blur, so edge smoothing buys nothing here — and a plain target stays
    // readable by devGlassLayer without a resolve step in the way
    type: renderer.capabilities.isWebGL2 ? THREE.HalfFloatType : THREE.UnsignedByteType
  });
  glassLayerUniforms.uGlassLayersMap.value = glassLayerRT.texture;
  glassLayerUniforms.uGlassLayersSize.value.set(s.x, s.y);
}
/* The shell a glass body wears inside the layer target. Colour, in order of
   who actually knows it: the colour painted on the body (a palette profile
   keeps its material white and wears its hue in the vertices — read the
   material and the shell says nothing), else the attenuation colour when it
   is a real colour, else the body's own tint. Milk: a volume reads through
   glass as a BODY, so its shell is most of the way to solid; a film reads as
   nearly nothing, and a milky shell would print itself onto everything the
   bubble shows — measured, 0.06 of shell costs about a tenth of the moss
   show-through and 0.6 would have cost most of it. */
const GLASS_SHELL = { milk: 0.9 };
function glassShell(b) {
  let colour = new THREE.Color(0xffffff), milk = 0.06, found = false;
  b.mesh.traverse(o => {
    if (found || !o.isMesh || !o.material || !o.material.transmission) return;
    const m = o.material;
    const att = m.attenuationColor;
    const attSat = att ? Math.max(att.r, att.g, att.b) - Math.min(att.r, att.g, att.b) : 0;
    if (m.userData.shellColour) colour.copy(m.userData.shellColour);
    else colour.copy(att && attSat > 0.04 ? att : m.color);
    if (m.name !== 'bubble') {
      milk = GLASS_SHELL.milk;
      /* Pushed a quarter more saturated than the body's mid tone, because the
         shell is fighting two dilutions on its way to the eye: the front
         glass's own film and specular add white on top, and the tone mapper's
         shoulder flattens whatever arrives bright. Measured on the seaglass:
         at the body's own saturation the through-reading was 0.13 of the
         direct one; the target for a body to still read as ITSELF is 0.5. */
      const hsl = { h: 0, s: 0, l: 0 };
      colour.getHSL(hsl);
      colour.setHSL(hsl.h, Math.min(1, hsl.s * 1.25), hsl.l);
    }
    found = true;
  });
  return { colour, milk };
}
/* tuneGlassShell({milk: 0.75}) — how much of a volume-glass body's shell is
   body rather than window inside the glass layer. Takes effect on the NEXT
   body drawn and, for bodies already standing, immediately. */
window.tuneGlassShell = v => {
  if (v.milk !== undefined) {
    GLASS_SHELL.milk = v.milk;
    for (const b of bodies) {

    }

};
function renderGlassLayers() {
  makeGlassLayerTarget();
  const swapped = [];
  for (const b of bodies) {
    if (!b.glass || !b.mesh.visible) continue;
    if (!b.shellMat) {
      const s = glassShell(b);
      /* Unlit on purpose. A lit shell takes the room's light on top of its
         colour and arrives in the layer as a bright pastel — measured, an
         aqua body's shell sampled [0.61, 0.94, 0.91] where the body itself
         reads [0.09, 0.28, 0.29] on screen, and the tone mapper's shoulder
         then crushed what little chroma survived. Flat colour lands the
         shell where the body actually sits. */
      b.shellMat = new THREE.MeshBasicMaterial({
        color: s.colour,
        transparent: true, opacity: s.milk, depthWrite: false
      });
    }
    b.mesh.traverse(o => {
      if (o.isMesh) { swapped.push([o, o.material]); o.material = b.shellMat; }
    });
