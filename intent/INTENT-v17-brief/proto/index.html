<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>INTENT — ניסוי 17: קו → חומר</title>
<style>
  :root {
    --ground: #e6e4dd;
    --ink: #1a1c19;
    --muted: #7d7f76;
    /* the interface's own lines, as variables rather than as the same rgba
       written out nine times — once the paper can be any colour, every one of
       them has to be able to turn over with it */
    --edge: rgba(26,28,25,.28);
    --edge-strong: rgba(26,28,25,.5);
    --wash: rgba(26,28,25,.06);
    --wash-on: rgba(26,28,25,.10);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--ground);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    direction: rtl;   /* stated here too: a shareable build has no <html dir> */
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  #draw {
    position: fixed; inset: 0; z-index: 2; cursor: crosshair;
  }
  .hud {
    position: fixed; z-index: 5; color: var(--ink);
    font-size: 13px; letter-spacing: .01em;
  }
  #title { top: 22px; right: 24px; font-weight: 500; }
  #title small { display: block; color: var(--muted); font-weight: 400; margin-top: 3px; }
  #hint {
    bottom: 24px; right: 24px; color: var(--muted); max-width: 40ch; line-height: 1.6;
  }
  @media (max-width: 720px) { #hint { display: none; } }
  /* TEMPORARY — the material picker.

     The finished piece gives no choice at all: a body's material is drawn for
     you, and not knowing what the line will become is part of what the thing is.
     This exists only so a material can be judged without drawing a dozen bodies
     to walk the cycle round to it, and it comes out before anything ships. It is
     styled as a dev tool on purpose — small, grey, unlovely — so nobody mistakes
     it for part of the work. */
  #matpick {
    top: 62px; left: 24px; display: flex; flex-wrap: wrap; gap: 5px;
    max-width: 260px; direction: ltr;
  }
  #matpick button { font-size: 10px; padding: 3px 8px; opacity: .55; }
  #matpick button[aria-pressed="true"] { opacity: 1; }
  #matpick .devtag {
    width: 100%; font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 1px;
  }
  #readout {
    bottom: 24px; left: 24px; color: var(--muted);
    font-variant-numeric: tabular-nums; text-align: left; direction: ltr;
    font-size: 12px; line-height: 1.7;
  }
  #tools { top: 20px; left: 24px; display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 12px; padding: 7px 14px;
    background: transparent; color: var(--ink);
    border: 1px solid var(--edge); border-radius: 999px;
    cursor: pointer; transition: background .15s;
  }
  button:hover { background: var(--wash); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  button[aria-pressed="true"] { background: var(--wash-on); border-color: var(--edge-strong); }

  /* The backdrop swatch. A native colour input carries an OS-drawn box that
     cannot be talked out of its own border and padding, so the input is made
     to fill a round label and the label does the looking. */
  #bgpick {
    width: 30px; height: 30px; border-radius: 999px; overflow: hidden;
    border: 1px solid var(--edge); cursor: pointer; position: relative;
    display: inline-block; flex: 0 0 auto;
  }
  #bgpick:hover { border-color: var(--edge-strong); }
  #bgpick input {
    position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px);
    padding: 0; border: none; background: none; cursor: pointer;
  }
  #bgpick input::-webkit-color-swatch-wrapper { padding: 0; }
  #bgpick input::-webkit-color-swatch { border: none; }
  #bgpick:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* the tuning panel. Deliberately quiet: it sits over the picture it is
     changing, so anything with weight of its own would compete with the thing
     being judged */
  #panel {
    top: 62px; left: 24px; width: 216px;
    background: rgba(255,255,255,.72); backdrop-filter: blur(12px);
    border: 1px solid rgba(26,28,25,.12); border-radius: 12px;
    padding: 12px 14px 14px;
  }
  #panel[hidden] { display: none; }
  #panel .grp {
    font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin: 12px 0 6px;
  }
  #panel .grp:first-child { margin-top: 0; }
  #panel label { display: block; margin: 0 0 7px; font-size: 11px; color: var(--ink); }
  #panel .row { display: flex; justify-content: space-between; margin-bottom: 2px; }
  #panel .row b {
    font-weight: 400; color: var(--muted);
    font-variant-numeric: tabular-nums; direction: ltr;
  }
  #panel input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 14px;
    background: transparent; margin: 0; cursor: pointer; direction: ltr;
  }
  #panel input[type=range]::-webkit-slider-runnable-track {
    height: 2px; background: rgba(26,28,25,.22); border-radius: 2px;
  }
  #panel input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--ink); margin-top: -4.5px;
  }
  #panel .reset {
    width: 100%; margin-top: 12px; font-size: 11px; padding: 5px 0;
  }
  @media (max-height: 760px) { #panel { top: 62px; max-height: calc(100vh - 110px); overflow-y: auto; } }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';

/* ---------- noise (value noise + fbm) ---------- */
/* A random stream you can ask for twice.

   Everything generated here used to reach for Math.random, which is right for a
   piece where every stroke should be its own — and wrong for a bench, where the
   whole job is moving ONE dial and seeing what only that dial did. With the
   global generator, every redraw also reshuffled the quills, the lumps and the
   scatter, so a slider looked like it was changing the body's size when it was
   changing nothing of the sort. Seeded from the body's own seed, a redraw at the
   same settings is identical, and a redraw at new settings differs only by them. */
function rng(seed) {
  let a = (seed * 2654435761) >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash3(x, y, z) {
  let h = x * 374761393 + y * 668265263 + z * 1274126177;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967295;
}
function smooth(t) { return t * t * (3 - 2 * t); }
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = smooth(xf), v = smooth(yf), w = smooth(zf);
  let r = 0;
  for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) for (let k = 0; k < 2; k++) {
    const wx = i ? u : 1 - u, wy = j ? v : 1 - v, wz = k ? w : 1 - w;
    r += hash3(xi + i, yi + j, zi + k) * wx * wy * wz;
  }
  return r * 2 - 1;
}
/* fbm and vnoise are SIGNED — vnoise ends on `r * 2 - 1`, so both run about -1 to
   1 around zero. Every use that wants a probability, a mix factor or an index into
   a list wants 0 to 1 instead, and treating one as the other is a bug that hides:
   it does not throw, it just quietly clamps half of everything to nothing. It cost
   a bead cloud that dropped whole stretches of a stroke and a palette that only
   ever showed its first colour. This is that conversion, named. */
function fbm01(x, y, z, oct = 4) { return fbm(x, y, z, oct) * 0.5 + 0.5; }

/* A smooth field with a GUARANTEED spread, for the places that need one.

   The colour regions in a bead cloud were being taken from fbm, and the measured
   result was that every bead came out white: red 0.78 to 1.0, blue 0.95 to 1.0,
   not one warm bead in five thousand. The palette was fine and the selection never
   left its first entry — fbm over a patch this small was returning nearly the same
   value everywhere, so the noise had no say and its own bias decided everything.

   Three sine waves at three angles instead. It is a quasi-periodic interference
   pattern, which is what a slow noise field looks like anyway at this scale, and
   its range is arithmetic rather than statistical: it genuinely covers 0 to 1
   whatever coordinates it is handed. Regions get chosen; the palette gets used. */
function field01(x, y, k, seed) {
  const a1 = seed * 0.7, a2 = seed * 1.9 + 2.1, a3 = seed * 3.3 + 4.7;
  const s = Math.sin(x * k * 0.9 + y * k * 0.35 + a1)
          + Math.sin(-x * k * 0.4 + y * k * 1.05 + a2) * 0.85
          + Math.sin(x * k * 0.65 - y * k * 0.75 + a3) * 0.7;
  return Math.max(0, Math.min(1, 0.5 + s / 5.1));
}

function fbm(x, y, z, oct = 4) {
  let a = 1, f = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += a * vnoise(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; }
  return sum / norm;
}

/* ---------- material library (placeholder scans) ----------
   These are procedural stand-ins. The real system uses photographed
   material, shot neutral so it can be tinted here in code. */
function tex(draw, size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* Triplanar projection: samples the material from three axes and blends.
   Kills UV seams and stretching on organic bodies — the "gift wrap" problem.

   It carries the whole material response, not only colour. An eye reads
   material from the way light CHANGES across a surface, so the scan's own
   luminance also drives a bump and a roughness break-up — one flat albedo
   map is what makes a body read as default plastic. Two more things the
   scans need: conditioning on load (see conditionScan), and sampling as two
   layers at different scales and angles, so no repeat ever lines up. */
function triplanar(mat, scale, o = {}) {
  // the bump is computed from screen derivatives, which are core in WebGL2
  // but an extension below it — declaring it costs nothing and keeps older
  // builds of three from compiling a shader that cannot run
  mat.extensions = { derivatives: true };
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTriScale = { value: scale };
    shader.uniforms.uBump = { value: o.bump ?? 70 };
    shader.uniforms.uRoughVar = { value: o.roughVar ?? 0.35 };
    shader.uniforms.uTriSharp = { value: o.sharp ?? 4.0 };
    /* How much of the second, rotated layer is mixed in. It exists so no repeat
       ever lines up, and on an isotropic surface that is a straight gain. On a
       DIRECTIONAL one it is not: bark got a second set of fissures laid across
       the first at 37 degrees and came back as basketwork, and the printed sheet
       got a second page of type over the first. So it is a dial now, and the two
       materials that have a direction turn it down or off. */
    shader.uniforms.uLayer2 = { value: o.layer2 ?? 0.85 };
    /* And which way the projection is turned. Zero for everything that looks the
       same whichever way up it is, which is everything here except bark: its
       fissures have to run along the trunk that was actually drawn rather than
       down the screen. Set per body at birth from the drawing's own long axis,
       and the SAME angle is handed to the relief displacement, or the shading
       would run one way while the geometry ran another. */
    shader.uniforms.uTriRot = { value: o.rot ?? 0 };
    /* Twinkle. Glitter in the world is never still, because the thing looking at
       it never is: the smallest movement of the head swaps which flakes are
       aimed at the lamp. A body sitting still on a screen has none of that, so
       every flake that caught the light at birth catches it for ever and the
       sparkle reads as a printed pattern of white dots.

       So the flakes are given the movement the viewer is not making. The
       roughness threshold walks with time at a rate set per flake by its own
       luminance, which means neighbours cross into shiny at different moments
       and the surface twinkles rather than pulsing as one. Off at zero, and
       every other material in the library leaves it there. */
    shader.uniforms.uSparkle = { value: o.sparkle ?? 0 };
    shader.uniforms.uTime = { value: 0 };
    /* Ember: light coming out of the surface's own dark places. Everything else
       in this shader reads the scan to decide how light BOUNCES; this reads it to
       decide where light is MADE. The crust is charcoal and the fractures are
       what has not gone out yet, so the glow is keyed to the dark end of the
       scan — which on the volcanic tile means the cracks and the deep vesicles,
       already drawn there and already carved into the geometry by the same
       values. The shading and the glow therefore agree about where the cracks
       are, without either being told twice. */
    shader.uniforms.uEmber = { value: new THREE.Color(o.ember ? o.ember.colour : 0xffffff) };
    shader.uniforms.uEmberGain = { value: o.ember ? o.ember.gain : 0 };
    // hold the conditioned mean so layering cannot drift off it
    shader.uniforms.uMean = { value: Math.pow(SCAN_MEAN, 2.2) };
    /* aGrainRot — a PER-VERTEX turn added on top of the body's one angle,
       14 Aug, for grain that follows a curved stroke. The uniform can only
       state one direction for the whole body, and the reference is a bent
       piece of wood whose fibres bend with it. Geometry that knows its local
       direction (lumpyTube along a stroke, the outline field on a closed
       body) writes the DELTA from the body angle into this attribute; a
       geometry that writes nothing reads zero everywhere — an unfed vertex
       attribute is (0,0,0,1) by spec — and the uniform rules alone, so every
       other material is byte-identical to before. */
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vTriPos;\nvarying vec3 vTriNrm;\nattribute float aGrainRot;\nvarying float vGrainRot;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvTriPos = position;\nvTriNrm = normal;\nvGrainRot = aGrainRot;');
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec3 vTriPos;
        varying vec3 vTriNrm;
        varying float vGrainRot;
        uniform float uTriScale;
        uniform float uBump;
        uniform float uRoughVar;
        uniform float uTriSharp;
        uniform float uLayer2;
        uniform float uTriRot;
        uniform float uSparkle;
        uniform float uTime;
        uniform vec3 uEmber;
        uniform float uEmberGain;
        uniform float uMean;
        float triLum = 0.0;
        const mat2 TRI_ROT = mat2(0.7986, -0.6018, 0.6018, 0.7986);   // 37 degrees
        vec4 triLayer(sampler2D t, vec2 uv0, float bias) {
          // the body's angle plus the vertex's own bend — zero everywhere the
          // geometry did not write the attribute, so this line IS the old line
          float rotT = uTriRot + vGrainRot;
          float cs = cos(rotT), sn = sin(rotT);
          vec2 uv = mat2(cs, -sn, sn, cs) * uv0;
          vec4 a = texture2D(t, uv, bias);
          vec4 b = texture2D(t, TRI_ROT * uv * 0.43 + 7.3, bias);
          return a + (b - uMean) * uLayer2;
        }`)
      .replace('#include <map_fragment>', `
        /* The blend exponent, and on a wall it is the difference between a
           surface and a smear. At 4 the three projections overlap generously,
           which is what keeps a curved body seamless — but a face pulled back
           into depth barely moves in x and y, so the front projection sampled
           along it repeats the same pixels down the whole wall as streaks. The
           sharper the weighting, the sooner the wall switches to the projection
           that is actually facing it. Per material, since the seams the soft
           blend was hiding are real on anything round. */
        vec3 triW = pow(abs(normalize(vTriNrm)), vec3(uTriSharp));
        triW /= (triW.x + triW.y + triW.z);
        vec4 triC = triLayer(map, vTriPos.yz * uTriScale, 0.0) * triW.x
                  + triLayer(map, vTriPos.xz * uTriScale, 0.0) * triW.y
                  + triLayer(map, vTriPos.xy * uTriScale, 0.0) * triW.z;
        // height comes off a deliberately blurred mip: a screen-derivative
        // bump on the sharp sample amplifies the scan's own JPEG noise into
        // a fizz of pixel-sized dents
        vec4 triH = triLayer(map, vTriPos.yz * uTriScale, 2.2) * triW.x
                  + triLayer(map, vTriPos.xz * uTriScale, 2.2) * triW.y
                  + triLayer(map, vTriPos.xy * uTriScale, 2.2) * triW.z;
        triLum = dot(triH.rgb, vec3(0.2126, 0.7152, 0.0722));
        diffuseColor *= triC;
      `)
      /* The glow, injected after the emissive include so `totalEmissiveRadiance`
         exists and `triLum` has already been read by the map fragment above.
         Deep in the dark end only: a wide threshold would light the whole crust
         and turn charcoal into a lamp shaped like a rock. The breathing is slow
         and shallow, the way a coal actually pulses as air moves over it. */
      .replace('#include <emissivemap_fragment>', `
        #include <emissivemap_fragment>
        if (uEmberGain > 0.0) {
          float crack = 1.0 - smoothstep(uMean - 0.26, uMean - 0.10, triLum);
          float breath = 0.78 + 0.22 * sin(uTime * 1.3 + triLum * 21.0);
          totalEmissiveRadiance += uEmber * crack * uEmberGain * breath;
        }
      `)
      // crevices scatter, ridges catch — a single uniform highlight is the
      // giveaway that nothing is actually varying across the surface
      .replace('#include <roughnessmap_fragment>', `
        float roughnessFactor = clamp(roughness + (uMean - triLum) * uRoughVar, 0.04, 1.0);
        // declared out here so the lighting below can still see them: a glint is
        // decided by which flake and at what moment, and both are worked out here
        float isFlake = 0.0, wink = 0.0;
        if (uSparkle > 0.0) {
          // each flake keeps its own clock, taken from its own brightness, so the
          // field twinkles instead of breathing in unison
          float flakePhase = fract(triLum * 137.7) * 6.2832;
          wink = sin(uTime * 1.9 + flakePhase) * 0.5 + 0.5;
          // and only the flakes, not the ground between them: below the mean
          // there is nothing reflective to catch anything
          isFlake = smoothstep(uMean, uMean + 0.16, triLum);
          roughnessFactor = clamp(roughnessFactor - uSparkle * isFlake * pow(wink, 3.0), 0.02, 1.0);
        }
      `)
      // bump straight off the scan's luminance, via screen derivatives, so
      // it needs no tangents and follows the triplanar sample exactly
      .replace('#include <normal_fragment_maps>', `
        vec3 triSurf = -vViewPosition;
        vec3 triSx = dFdx(triSurf), triSy = dFdy(triSurf);
        vec3 triR1 = cross(triSy, normal), triR2 = cross(normal, triSx);
        float triDet = dot(triSx, triR1);
        vec3 triGrad = sign(triDet) * (dFdx(triLum) * triR1 + dFdy(triLum) * triR2) * uBump;
        // derivatives blow up along the silhouette; without this the rim
        // turns into a ring of glitter
        triGrad = clamp(triGrad, -1.5 * abs(triDet), 1.5 * abs(triDet));
        /* And this is the rest of the streaking on a wall pulled back into depth.
           The bump is built from SCREEN derivatives, so it depends on how much
           world distance one pixel covers — and on a face turned nearly edge-on
           that distance is enormous in one screen direction and tiny in the other.
           The gradient it measures is therefore wildly stretched along the wall,
           which arrives as lines running backwards. It is not a texture artefact
           and no projection fixes it: the measurement itself is degenerate there.

           So the bump fades out as the surface turns away from the camera. That is
           also the honest thing physically — a relief you are looking along rather
           than at has no shading to give — and the colour and the real displaced
           geometry carry the wall on their own, which they can now that it has
           vertices of its own. */
        float triGraze = abs(dot(normalize(normal), normalize(vViewPosition)));
        triGrad *= smoothstep(0.10, 0.42, triGraze);
        normal = normalize(abs(triDet) * normal - triGrad);
      `)
      /* A GLINT, because lowering roughness is not a sparkle in this room.

         Reported as "it does not really twinkle". The wink above only makes a
         flake smoother, and a smooth flake shows whatever is in front of it —
         which here is a pale even cyclorama with no small bright source
         anywhere in it. A mirror facing a grey wall returns grey. Every flake
         was dutifully turning into a mirror and none of them had anything to
         catch, so the surface changed roughness and never changed brightness.

         So the flake is given the highlight the room cannot supply. It is a
         SPECULAR term and not an emission: it rides on the light already
         reaching that point, it is gated to the flakes alone, and its exponent
         is high enough that a flake is either flaring or it is not — which is
         what separates a glitter from a wet surface. */
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        if (uSparkle > 0.0) {
          float flare = pow(wink, 14.0) * isFlake;
          reflectedLight.directSpecular += vec3(uSparkle * 2.4 * flare) *
            (reflectedLight.directDiffuse + reflectedLight.indirectDiffuse);
        }
      `);
    mat.userData.tri = shader.uniforms;   // live tuning handle, see tuneTri()
  };
  mat.customProgramCacheKey = () => 'tri3-' + (o.sharp ?? 4);
  TRI_MATS.push(mat);
}
/* Colour that depends on which way the surface is turned, rather than on what
   is painted on it.

   three's `iridescence` is the physically-founded version of this and it was
   tried first, three times: on a white body it drowns in the albedo, on metal
   there is nothing but a grey room to tint, and on frosted glass it is real but
   so quiet that the body reads as pearl. All three are the same fact — the film
   only colours the light a surface REFLECTS, and in a pale even room that
   reflection is small and already white.

   So this states it directly instead. The angle between the surface and the eye
   picks a colour off a three-stop ramp: one colour where the body faces you,
   another as it turns away, a third at the silhouette. It is what an oil film
   or a beetle's back actually does to the eye, arrived at by declaration rather
   than by simulation — and unlike the film it does not care how bright the room
   is, because it multiplies the colour that is there instead of adding to it.

   Injected at `lights_physical_fragment`, which is inside main and is where the
   material struct exists. The functions-only include next door compiles and
   silently drops the material, and a body that is not drawn measures as a
   perfect result — that trap is documented and this is the hook that avoids it. */
function duochrome(mat, cols, power = 2.0) {
  const prevCompile = mat.onBeforeCompile;
  const prevKey = mat.customProgramCacheKey;
  mat.onBeforeCompile = shader => {
    if (prevCompile) prevCompile(shader);
    shader.uniforms.uDuoA = { value: new THREE.Color(cols[0]) };
    shader.uniforms.uDuoB = { value: new THREE.Color(cols[1]) };
    shader.uniforms.uDuoC = { value: new THREE.Color(cols[2]) };
    shader.uniforms.uDuoP = { value: power };
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform vec3 uDuoA; uniform vec3 uDuoB; uniform vec3 uDuoC; uniform float uDuoP;`)
      .replace('#include <lights_physical_fragment>', `#include <lights_physical_fragment>
        float duoF = pow(1.0 - clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0), uDuoP);
        vec3 duoC = mix(uDuoA, uDuoB, smoothstep(0.0, 0.42, duoF));
        duoC = mix(duoC, uDuoC, smoothstep(0.42, 0.96, duoF));
        material.diffuseColor *= duoC;
        material.specularColor *= duoC;
      `);
    mat.userData.duo = shader.uniforms;
  };
  mat.customProgramCacheKey = () => (prevKey ? prevKey() : 'std') + '-duo';
}

const TRI_MATS = [];
// tuneTri({bump: 60}) from the console: retunes every material on screen at
// once, so a value can be judged against the real thing before it is baked in
function tuneTri(v) {
  TRI_MATS.forEach(m => {
    const u = m.userData.tri;
    if (!u) return;
    for (const k in v) if (u['u' + k[0].toUpperCase() + k.slice(1)]) u['u' + k[0].toUpperCase() + k.slice(1)].value = v[k];
  });
  return TRI_MATS.length + ' materials';
}
window.tuneTri = tuneTri;   // dev handle: the page is a module, so the
                            // console cannot reach anything not hung here
// tuneLight({exposure: .8, key: 1.2}) — same idea for the room, since exposure
// and lamp strength can only really be judged against each other on screen
window.tuneLight = v => {
  if (v.exposure !== undefined) renderer.toneMappingExposure = v.exposure;
  if (v.key !== undefined) key.intensity = v.key;
  if (v.rim !== undefined) rim.intensity = v.rim;
  if (v.back !== undefined) back.intensity = v.back;
  return { exposure: renderer.toneMappingExposure, key: key.intensity,
           rim: rim.intensity, back: back.intensity };
};
/* The scans are photographs, not tiles: 16:9, lit with a vignette, each with
   its own big soft blob in the middle. Tiled raw, the vignette becomes a grid
   of patches and the edges become hard straight lines across the body — the
   "technical, patterned" read. So every scan is conditioned once on load:
   cropped square, high-passed to strip everything at the scale of the shot
   itself, normalised so a near-flat scan carries the same grain as a
   contrasty one, and closed into a tile that actually repeats. */
const SCAN_MEAN = 200 / 255;      // every conditioned scan is centred here
function conditionScan(img) {
  const S = 768;
  const a = document.createElement('canvas'); a.width = a.height = S;
  const ga = a.getContext('2d', { willReadFrequently: true });
  ga.drawImage(img, (img.naturalWidth - S) / 2, (img.naturalHeight - S) / 2, S, S, 0, 0, S, S);

  // the blur radius is the cut: wide enough to keep brush strokes and grain,
  // narrow enough to take the lighting of the shot with it
  const b = document.createElement('canvas'); b.width = b.height = S;
  const gb = b.getContext('2d', { willReadFrequently: true });
  gb.filter = `blur(${Math.round(S / 8)}px)`;
  gb.drawImage(a, 0, 0);

  const A = ga.getImageData(0, 0, S, S), B = gb.getImageData(0, 0, S, S);
  const da = A.data, db = B.data;
  let sum2 = 0, n = 0;
  for (let i = 0; i < da.length; i += 4) {
    const d = 0.299 * (da[i] - db[i]) + 0.587 * (da[i + 1] - db[i + 1]) + 0.114 * (da[i + 2] - db[i + 2]);
    sum2 += d * d; n++;
  }
  const gain = Math.min(9, 26 / Math.max(1, Math.sqrt(sum2 / n)));
  const base = SCAN_MEAN * 255;
  const hp = new Float32Array(da.length);
  for (let i = 0; i < da.length; i += 4) {
    for (let k = 0; k < 3; k++) {
      hp[i + k] = Math.max(0, Math.min(255, base + (da[i + k] - db[i + k]) * gain));
    }
  }

  /* Close the tile. Mirrored wrapping also hides the seam, but it hides it
     behind a kaleidoscope — an X across a small body, which reads as pattern
     just as loudly as the seam did. So blend in a half-shifted copy of the
     same scan near the borders: the shifted copy's edges are the original's
     continuous middle, and the join disappears. */
  const half = S / 2, band = S * 0.25;
  const feather = d => { const t = Math.min(1, d / band); return t * t * (3 - 2 * t); };
  for (let y = 0; y < S; y++) {
    const wy = feather(Math.min(y, S - 1 - y));
    for (let x = 0; x < S; x++) {
      const w = feather(Math.min(x, S - 1 - x)) * wy;
      const i = (y * S + x) * 4;
      const j = (((y + half) % S) * S + ((x + half) % S)) * 4;
      for (let k = 0; k < 3; k++) da[i + k] = hp[i + k] * w + hp[j + k] * (1 - w);
    }
  }
  ga.putImageData(A, 0, 0);
  return a;
}
// filled in once the renderer exists; every scan is created lazily, well after
let MAX_ANISO = 8;

/* Tuff: lava that cooled, drawn rather than photographed.

   The first pass at this was granite — angular crystals, because a rock of flat
   broken planes covered in round craters is two contradictory claims about how
   it was made. That reasoning was sound and the rock was wrong. Volcanic stone is
   not crystalline at all: it is foam that froze. The holes in it are gas bubbles
   caught while the melt went stiff, and bubbles are round because pressure is
   the same in every direction. So here the roundness is the evidence, and the
   angularity belongs only to the outline, where the block broke.

   Dark, and matte to the point of dusty. What separates volcanic rock from every
   other dark stone is that it barely reflects at all — the surface is broken at
   a scale finer than the eye resolves, so light goes in and does not come back.

   The vesicles are drawn dark on purpose. Their darkness becomes depth twice
   over: once through the shader bump, and once as real geometry, since the body
   is displaced along its normals by exactly this luminance. A painted hole and a
   hole are not the same thing, and on this material the difference is the whole
   material. */
function tuffCanvas(s) {
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const base = Math.round(SCAN_MEAN * 255);
  g.fillStyle = `rgb(${base},${base},${base})`;
  g.fillRect(0, 0, s, s);
  const wraps = [[0, 0], [s, 0], [0, s], [-s, 0], [0, -s], [s, s], [-s, -s], [s, -s], [-s, s]];
  const R = (n) => Math.random() * n;
  const grey = (v) => `rgb(${Math.max(0, Math.min(255, v | 0))},${Math.max(0, Math.min(255, v | 0))},${Math.max(0, Math.min(255, v | 0))})`;

  /* Vesicles, and the first pass at these was wrong in a way worth keeping a
     note about: sparse, evenly sized, and drawn with a soft radial falloff, they
     came out as CRATERS and the rock read as the moon. A crater is a hole made by
     something arriving. A vesicle is a bubble that was already there when the
     melt went stiff, and the melt was full of them — so they crowd, they overlap,
     they burst into each other, their sizes run over two orders of magnitude, and
     every edge is broken glass rather than a slope. Hard fills, no gradients, and
     enough of them to touch. */
  const vesicle = (x, y, r) => {
    const deep = base - 58 - R(34);
    const lip = base + 26 + R(26);
    for (const [ox, oy] of wraps) {
      // the proud lip on the side the melt drained from: a bright crescent, which
      // the bump reads as a raised rim
      g.globalAlpha = 0.55;
      g.fillStyle = grey(lip);
      g.beginPath(); g.arc(x + ox, y + oy, r * 1.14, 0, 6.2832); g.fill();
      // and the hollow, hard-edged and slightly off-centre inside its own lip
      g.globalAlpha = 0.92;
      g.fillStyle = grey(deep);
      g.beginPath(); g.arc(x + ox + r * 0.06, y + oy - r * 0.05, r, 0, 6.2832); g.fill();
    }
  };
  // sizes on a power law: a few large, a great many small
  for (let i = 0; i < 40; i++)   vesicle(R(s), R(s), 13 + R(20));
  for (let i = 0; i < 260; i++)  vesicle(R(s), R(s), 5 + R(9));
  for (let i = 0; i < 1300; i++) vesicle(R(s), R(s), 1.8 + R(3.6));
  for (let i = 0; i < 3600; i++) vesicle(R(s), R(s), 0.6 + R(1.3));

  // fractures: a rock this brittle is always cracked, and a crack is the one
  // mark on it that runs in a line
  g.globalAlpha = 0.5;
  for (let i = 0; i < 22; i++) {
    let x = R(s), y = R(s), a = R(6.2832);
    const pts = [[x, y]];
    for (let k = 0; k < 8 + R(10); k++) {
      a += (Math.random() - 0.5) * 0.9;
      x += Math.cos(a) * (6 + R(16)); y += Math.sin(a) * (6 + R(16));
      pts.push([x, y]);
    }
    for (const [ox, oy] of wraps) {
      g.strokeStyle = grey(base - 48 - R(26));
      g.lineWidth = 0.7 + R(1.8);
      g.beginPath();
      pts.forEach(([px, py], k) => k ? g.lineTo(px + ox, py + oy) : g.moveTo(px + ox, py + oy));
      g.stroke();
    }
  }

  // ash grit between the bubbles, coarse enough to still be there at body scale
  const grit = (x, y, r, v, a) => {
    g.globalAlpha = a;
    g.fillStyle = grey(v);
    const n = 3 + Math.floor(Math.random() * 3), rot = R(6.2832);
    for (const [ox, oy] of wraps) {
      g.beginPath();
      for (let k = 0; k < n; k++) {
        const a2 = rot + k / n * 6.2832, rr = r * (0.6 + Math.random() * 0.6);
        const px = x + ox + Math.cos(a2) * rr, py = y + oy + Math.sin(a2) * rr;
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.fill();
    }
  };
  for (let i = 0; i < 2600; i++) grit(R(s), R(s), 1.4 + R(3.4), base - 34 + R(74), 0.28);
  g.globalAlpha = 1;

  /* And the whole thing high-passed, which is the step that separates a material
     from a picture of one. Drawing thousands of overlapping marks leaves large
     soft fields of light and dark behind — one side of the tile ends up brighter
     than the other — and wrapped onto a body that field arrives as a painted
     shadow that does not move when the light does. The scans coming off the
     camera get exactly this treatment on load, for exactly this reason; this one
     was drawn here and still needs it. */
  highPass(c, base);
  return c;
}

/* Subtract the low frequencies: downscale hard, scale back up, and the
   difference is everything smaller than the blur. Twelve pixels across is chosen
   so a large vesicle survives and a gradient across the whole tile does not. */
function highPass(c, base) {
  const s = c.width;
  const small = document.createElement('canvas');
  small.width = small.height = 12;
  small.getContext('2d').drawImage(c, 0, 0, 12, 12);
  const up = document.createElement('canvas');
  up.width = up.height = s;
  const ug = up.getContext('2d');
  ug.imageSmoothingEnabled = true;
  ug.drawImage(small, 0, 0, s, s);
  const g = c.getContext('2d');
  const A = g.getImageData(0, 0, s, s), B = ug.getImageData(0, 0, s, s);
  for (let i = 0; i < A.data.length; i += 4) {
    for (let k = 0; k < 3; k++) {
      const v = A.data[i + k] - B.data[i + k] + base;
      A.data[i + k] = v < 0 ? 0 : v > 255 ? 255 : v;
    }
  }
  g.putImageData(A, 0, 0);
}

/* Sandblasting, which is not a shape but a surface.

   Sea glass with no map at all is geometrically perfect, and perfect is the one
   thing thirty years in surf does not leave behind. What frosting actually is: a
   field of micro-pits far too small to see one by one, each scattering the light
   its own way, so the glass stops giving a clean reflection and glows softly
   instead.

   Deliberately LOW contrast. This map drives roughness and a fine bump, not
   colour — all of it stays near the mean so the tint set on the material
   survives untouched, and only the way light leaves the surface changes. */
function frostCanvas(s) {
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const base = Math.round(SCAN_MEAN * 255);
  g.fillStyle = `rgb(${base},${base},${base})`;
  g.fillRect(0, 0, s, s);
  const wraps = [[0, 0], [s, 0], [0, s], [-s, 0], [0, -s], [s, s], [-s, -s], [s, -s], [-s, s]];
  const R = (n) => Math.random() * n;
  // grit marks: angular, because sand is angular, and that is what cuts glass
  const speck = (x, y, r, v, a) => {
    g.globalAlpha = a;
    g.fillStyle = `rgb(${v},${v},${v})`;
    const n = 3 + Math.floor(Math.random() * 3), rot = R(6.2832);
    for (const [ox, oy] of wraps) {
      g.beginPath();
      for (let k = 0; k < n; k++) {
        const a2 = rot + k / n * 6.2832, rr = r * (0.6 + Math.random() * 0.6);
        const px = x + ox + Math.cos(a2) * rr, py = y + oy + Math.sin(a2) * rr;
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.fill();
    }
  };
  for (let i = 0; i < 5200; i++) speck(R(s), R(s), 0.8 + R(2.2), base - 26 + R(52), 0.30);
  for (let i = 0; i < 1400; i++) speck(R(s), R(s), 2.0 + R(4.0), base - 16 + R(34), 0.16);
  /* And the knocks. A piece in the photograph is not evenly frosted — it has
     been hit: shallow dishes where something struck it, a chip or two with a
     brighter facet where the frosting broke away and clear glass shows through.
     Sparse on purpose. Frosting is the rule and these are the exceptions, and it
     is the exceptions that stop a surface reading as a setting. */
  for (let i = 0; i < 26; i++) {
    const x = R(s), y = R(s), rr = 14 + R(30);
    for (const [ox, oy] of wraps) {
      const grd = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, rr);
      grd.addColorStop(0, `rgba(${base - 34},${base - 34},${base - 34},0.55)`);
      grd.addColorStop(1, `rgba(${base},${base},${base},0)`);
      g.globalAlpha = 1; g.fillStyle = grd;
      g.beginPath(); g.arc(x + ox, y + oy, rr, 0, 6.2832); g.fill();
    }
  }
  for (let i = 0; i < 14; i++) speck(R(s), R(s), 5 + R(9), base + 30 + R(22), 0.5);   // chips, clear again
  g.globalAlpha = 1;
  return c;
}

/* Glitter, which is the one of the new surfaces that has to be drawn rather
   than photographed. A photograph of glitter is a photograph of one instant of
   it — the flakes are caught mid-flash, and every body wearing that scan shows
   the same frozen sparkle from every angle, which is the opposite of what
   glitter does. What is drawn here is not the sparkle: it is the FLAKES, as a
   field of tiny hard-edged facets, each one a different shade. The flash comes
   later and comes from the light, because the flake field is fed to the
   roughness break-up rather than to the colour — so a flake that catches the
   lamp is white and its neighbour is not, and turning the piece changes which. */
function glitterCanvas(s) {
  const o = SURFACE_OPTS.glitter;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const base = Math.round(SCAN_MEAN * 255);
  g.fillStyle = `rgb(${base},${base},${base})`;
  g.fillRect(0, 0, s, s);
  const R = n => Math.random() * n;
  const wraps = [[0, 0], [s, 0], [-s, 0], [0, s], [0, -s], [s, s], [-s, -s], [s, -s], [-s, s]];
  // hard-edged quadrilaterals, not dots: a flake is a flat cut piece of foil and
  // the straight edge is what makes it wink rather than glow
  const flake = (x, y, r, v, a) => {
    g.globalAlpha = a;
    g.fillStyle = `rgb(${v},${v},${v})`;
    const rot = R(6.2832);
    for (const [ox, oy] of wraps) {
      g.beginPath();
      for (let k = 0; k < 4; k++) {
        const a2 = rot + k / 4 * 6.2832 + R(0.5), rr = r * (0.5 + Math.random() * 0.9);
        const px = x + ox + Math.cos(a2) * rr, py = y + oy + Math.sin(a2) * rr;
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath(); g.fill();
    }
  };
  /* Fewer and bigger, which is both the speed fix and the look fix.

     Speed: every flake is drawn nine times for the wrap, so four thousand of
     them is nearly forty thousand polygon fills before the high pass even
     starts — seconds of it, on the main thread, while the page sits there.

     Look: at that count and that size the flakes were smaller than the eye can
     separate on a body, so they averaged into a single value and the material
     arrived as a blue stone with a rough surface. Glitter is not a fine texture,
     it is a scatter of individually visible mirrors with dull ground between
     them, and the gaps matter as much as the flakes. A quarter as many, twice
     the size, and pushed much harder toward both ends of the range so each one
     is either catching the light or clearly not. */
  /* SMALLER AND DENSER, asked for on 13 August, and the note above is left
     standing because it is still true — it is just answering a different
     question. It argued its way to fewer and bigger from a body that had gone
     flat: flakes below the eye's separation average into one value and the
     material becomes a rough blue stone. That failure is real. But the cure
     overshot, and what it produced reads as sequins rather than glitter.

     So the size is a dial now instead of three hardcoded ranges, and the count
     rises with it. The speed argument survives intact: every flake is drawn nine
     times for the wrap, so the count is what costs, and this is well under the
     four thousand that made the page sit and think. */
  const z = o.size ?? 1;
  const n = Math.round(o.flakes);
  for (let i = 0; i < n; i++)      flake(R(s), R(s), (4 + R(7)) * z,   base - 110 + R(230), 0.75);
  for (let i = 0; i < n / 4; i++)  flake(R(s), R(s), (8 + R(13)) * z,  base - 120 + R(250), 0.8);
  // and the few big ones that carry the eye
  for (let i = 0; i < 60; i++)     flake(R(s), R(s), (14 + R(20)) * z, base - 90 + R(230), 0.6);
  g.globalAlpha = 1;
  // NO high pass. It exists to strip a field that is larger than the marks, and
  // here the marks ARE the largest thing in the tile — running it just pulled the
  // brightest flakes back toward the mean, which is the one thing they must not
  // do
  return c;
}

/* Skin: the surface every made object has and no clean one does.

   The note that produced this was that the new materials all felt like the same
   plastic, and the cause is plain in the profiles: the ones invented in code
   carry `file: null`, so they get no scan, so the triplanar patch never runs,
   so they are mathematically perfect surfaces. Perfect is the single strongest
   signal of "rendered" there is — nothing you can pick up is perfect, and the
   eye reads the absence of small imperfection long before it reads the colour.

   Deliberately quiet and deliberately mixed in KIND: shallow round dents, a few
   proud bumps, a fine sanding grain, and a sparse scatter of small flat spots
   where something has rubbed. All of it close to the mean, so it changes how the
   light breaks across the surface without touching the colour the material was
   given — which is what lets one skin serve a glossy pour and a matte rib. */
/* One generator, three surfaces, and the reason it is parameterised rather than
   copied is a note from the studio: pour and rib were handed the SAME skin, so
   two materials that should feel nothing alike were wearing one another's
   micro-relief. Sharing a scan is normal here — gilt and glaze both sit on clay
   — but those two share a scan and differ in everything else, while these two
   were built to be a wet sheet and a dry moulding and had no difference left to
   read.

   So the marks are dialled instead: how many dents, how much proud grit, how
   fine the grain, and how big it all is. `skin` is handled and dented, `dust`
   is a nearly clean surface with only the finest tooth, and `sand` is granular
   the whole way through. */
function skinCanvas(s, o = {}) {
  const dents = o.dents ?? 1, grit = o.grit ?? 1, grain = o.grain ?? 1, size = o.size ?? 1;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const base = Math.round(SCAN_MEAN * 255);
  g.fillStyle = `rgb(${base},${base},${base})`;
  g.fillRect(0, 0, s, s);
  const R = n => Math.random() * n;
  const wraps = [[0, 0], [s, 0], [-s, 0], [0, s], [0, -s], [s, s], [-s, -s], [s, -s], [-s, s]];
  // dents: soft-edged and shallow, the mark of something that was handled
  const dish = (x, y, r, v, a) => {
    for (const [ox, oy] of wraps) {
      const grd = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
      grd.addColorStop(0, `rgba(${v},${v},${v},${a})`);
      grd.addColorStop(0.65, `rgba(${v},${v},${v},${a * 0.45})`);
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.beginPath(); g.arc(x + ox, y + oy, r, 0, 6.2832); g.fill();
    }
  };
  for (let i = 0; i < 90 * dents; i++)  dish(R(s), R(s), (10 + R(34)) * size, base - 30 - R(18), 0.55);
  for (let i = 0; i < 260 * dents; i++) dish(R(s), R(s), (3 + R(11)) * size,  base - 26 - R(20), 0.5);
  // and the proud side, fewer and smaller: a surface of pits alone reads as
  // corroded rather than as used
  for (let i = 0; i < 120 * grit; i++)  dish(R(s), R(s), (3 + R(9)) * size,   base + 24 + R(18), 0.45);
  // sanding grain, fine enough to live under everything else
  g.globalAlpha = 0.22;
  for (let i = 0; i < 6000 * grain; i++) {
    const v = base - 14 + R(28);
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.fillRect(R(s), R(s), (1 + R(1.4)) * size, (1 + R(1.4)) * size);
  }
  g.globalAlpha = 1;
  highPass(c, base);
  return c;
}

   the same contrast, which is exactly right for a surface — it is what stops
   one photographer's lighting arriving as a painted shadow. But it would grey
   the printed sheet down off white and pull the halo of a high-pass round every
   letter, and it would drag the paint stroke's turquoise and magenta back
   toward the same beige as everything else. Those two are read as pictures, not
   as surfaces, so they come through untouched. */
/* `bark` joined them on 11 August, and the reason is the third distinct one.
   Print and paint are here because conditioning would flatten a colour that IS
   the material. Bark is here because conditioning removes the wrong SCALE: the
   high pass blurs at an eighth of the tile, about ninety pixels, and the plates
   on this scan are sixty to a hundred wide — so the step that exists to strip a
   photographer's lighting was stripping the plates themselves and handing back
   fine grain on a smooth field. The scan is drawn evenly lit to begin with, so
   there is no lighting in it to remove. */
const RAW_SCANS = { press: 1, brushmark: 1, bark: 1, pull: 1, crayon: 1 };

/* Holes in a brush mark, taken from the mark itself.

   A loaded brush does not lay an even film: it skips, and the paper shows
   through in long thin gaps that run WITH the stroke, because that is the
   direction the bristles were travelling when they ran dry. The scan already has
   them — they are the white in it — so nothing needs inventing, only reading.
   Whiteness becomes transparency, and with `alphaTest` those gaps are real holes
   in the ribbon rather than pale patches painted on it: you can see the room
   through them, and they change shape as the mark turns.

   Cached per file, since it is a full read-back of the image. */
const ALPHA_CACHE = {};
function alphaFromScan(name, cut = 0.72, soft = 0.10) {
  if (ALPHA_CACHE[name]) return ALPHA_CACHE[name];
  const src = SCAN_CACHE[name] && SCAN_CACHE[name].image;
  if (!src || !src.width) return null;
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(src, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height);
  const px = d.data;
  const H = c.height;
  for (let i = 0; i < px.length; i += 4) {
    const lum = (px[i] * 0.2126 + px[i + 1] * 0.7152 + px[i + 2] * 0.0722) / 255;
    // white paper is a hole, paint is solid, and the band between them is
    // narrow: a soft edge here would fray every gap into a haze
    let a = 1 - Math.max(0, Math.min(1, (lum - cut) / soft));
    /* THE SPINE IS NEVER OPENED, and without this the mark tore in half.
       The ribbon's v runs across its width, so a row of this image is a line
       ACROSS the stroke — and the scan has places where the brush skipped all
       the way across, which became a hole spanning the full width. With alphaTest
       that is not a gap in the paint, it is a cut: the stroke ends, and the next
       piece begins with a straight machined edge where the geometry was sliced.

       A real dry brush does not do that. It runs out at the edges of the mark and
       thins toward them while the middle, where the bristles are loaded deepest,
       stays down. So the middle third is held solid and the holes are free to
       open toward both edges. */
    const v = Math.floor(i / 4 / c.width) / H;
    const spine = 1 - Math.min(1, Math.abs(v - 0.5) / 0.30);
    a = Math.max(a, spine);
    px[i] = px[i + 1] = px[i + 2] = 255;
    px[i + 3] = Math.round(a * 255);
  }
  g.putImageData(d, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  return (ALPHA_CACHE[name] = t);
}

function fileTex(name) {
  if (PROCEDURAL[name]) {
    const t = new THREE.CanvasTexture(PROCEDURAL[name](768));
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = MAX_ANISO;
    return t;
  }
  const t = new THREE.Texture();
  t.wrapS = t.wrapT = THREE.RepeatWrapping;   // the scan tiles for real now
  t.colorSpace = THREE.SRGBColorSpace;
  // the whole of what anisotropic filtering does is hold a texture together when
  // it is seen at a slant, and on a curved body most of the surface is at a
  // slant. It was pinned at 8; the hardware here allows more, and the docs are
  // explicit that the maximum is what to ask for
  t.anisotropy = MAX_ANISO;
  const img = new Image();
  img.onload = () => { t.image = RAW_SCANS[name] ? img : conditionScan(img); t.needsUpdate = true; };
  // a shareable build bakes the scans in, since a published page cannot
  // reach any file of its own (see build_artifact.py)
  img.src = (window.TEX_DATA && window.TEX_DATA[name]) || `textures/${name}.jpg`;
  return t;
}

  /* The colour is lifted a long way, and the raw scan is why. A conditioned scan
     is centred at 0.78 by construction, so a gradient written against one lands
     where it looks on paper. This one bypasses conditioning to keep its plate
     scale, which means it also keeps the photograph's own mid-tone of about
     0.45 — and the gradient then multiplies THAT. Two mid browns times a mid
     grey is a dark brown, which is what arrived. Written against what the map
     actually is, the stops have to start near paper white for the body to come
     out the weathered grey-brown the reference is. */
  { name: 'bark',    file: 'bark',   tint: 0xffffff, gradient: [0xbcae9c, 0xf4ece0], rough: 0.94, lumps: 0.24, grain: 0.30,
    // five levels, the same as the rock: the fissures are narrower than the
    // triangles the default gives, so this is what turns painted grooves into
    // carved ones. Relief and bump both up now that there is something to move.
    /* RELIEF DOWN FROM 1.35, and this is the fix for "the trunk still produces
       strange jagged shapes when they are closed".

       The needles were the carve itself, and the amplitude was simply too large
       for the signal driving it. This scan is a RAW one — it skips
       `conditionScan` — so it runs from near-black in the fissures to bright on
       the plates, and the negative side is then driven 1.7x harder again. At
       1.35 the gap between a fissure vertex and a plate vertex a few units away
       came to about fifty units of displacement on a body four hundred across.
       That is not relief, it is a spike per texel.

       THE "IT ONLY HAPPENS ON BIG ONES" WAS AN ILLUSION, and it is worth
       recording because it sent two fixes in the wrong direction. The small body
       that looked clean had `ofTotal: 0` on the vertex counter — the scan's CPU
       copy had not finished loading on that first draw, so the carve never ran
       at all. Bark was needled at every size. A material that looks fixed on the
       first draw after a reload is not fixed; it is unloaded.

       Diagnosed by pushing every vertex the SAME distance (`devReliefFlat`):
       the surface came back perfectly smooth with zero degenerate normals, which
       ruled out the mesh, the normals and the projection in one measurement and
       left only the amplitude. */
    // 400, down from 520, 14 Aug afternoon: "the trunk's texture is a bit too
    // big". The carve follows automatically — reliefScale rides 1/tile.
    tile: 400, bump: 20, relief: 0.45, roughVar: 0.62, levels: 5,
    /* `layer2: 0`, not 0.2. On an isotropic surface the second rotated sample is
       free variety; on this one it is a second trunk laid across the first at 37
       degrees, and at a fifth strength it was still enough to blur the plates
       into each other and read as noise. This scan is directional and regular
       enough not to need help hiding its repeat. */
    /* `log: 1` came out on 14 Aug and `depthScale` came in: the request moved
       from trunk to BARK — a shell split off the tree, not the tree. Closed
       shapes now come back flat-ish, brush-like but with a slab's body: the
       brush ribbon sits at 0.085 of its width, this sits at roughly twice
       that against the inradius. Judged by eye against the torn-slab
       reference; the number is a starting point for Hadar's eye, not a law. */
    layer2: 0, depthScale: 0.32, grainAlong: true, grainLocal: true, colony: 0,
    // and it ends the way a broken slab ends: torn across the plates at the ends,
    // following a fissure down the sides
    /* jag up from 0.024/run 14 on 14 Aug: the reference's ends are properly
       BROKEN, not nicked. Steps 4 and shorter runs give the break more teeth;
       the across-the-grain weighting (focus) still keeps the long sides
       following their fissures. */
    jag: { amount: 0.05, steps: 4, run: 10, focus: 2.8 },
    // a drawn line's caps get the same treatment from the tube itself — the
    // quantised-run tear, scaled into the cap, per-end seeds
    endTear: { amount: 0.34, steps: 3, run: 4, focus: 1.6 },
    // and a drawn LINE of bark is a split slab, not a branch: flat in section,
    // full width to the ends, as long as the line was
    /* `lineR` is what decides whether a drawn line is a plank or a stick, and it
       has to be much larger here than for any other stroke material. Every other
       one is a MARK — a brush stroke, a run of metal — and a mark is narrow by
       nature. This one is a piece of a tree: the reference is about three times
       as long as it is wide, and at the widths the rest of the library uses a
       500-pixel line came back at one to ten, which is a twig. */
    // narrower and thinner, 14 Aug afternoon: "the drawn lines are a bit too
    // thick and wide" — lineR 7.5 → 6.0, section 0.34 → 0.28
    slab: { flat: 0.28 }, lineR: 6.0,
    finish: { specularIntensity: 0.40, envMapIntensity: 0.35 } },

  /* Newsprint over a stone, against the 192b30 reference: a chunky rock of a few
     big planes with a printed sheet over it, the type large enough to read and
     cut wherever the rock ends.

     Six facets and not nine — nine is a gem, and what the reference has is a lump
     that broke into a handful of faces. `relief: 0` and a low bump because ink
     has no thickness: emboss the type and the stone stops being wrapped and
     starts being carved. `layer2: 0` for the same reason in the shader — one
     sheet, not two pages at different scales. */
  /* AND IT IS BRIGHTER, asked for on 13 August: "I would like to lighten the
     press further, like the first reference in its context." That reference is
     white paper on a stone, and what this had become was grey paper — because
     the round before had taken the room's share down to 0.10 to get the facets
     to separate, and with the ambient gone the whole sheet dropped with it.

     So the brightness comes back through the KEY rather than through the dome:
     a lower roughness lets the lamp carry more of the sheet, which lifts the
     planes that face it without lifting the ones that do not. The room goes
     back to 0.26, enough to keep the paper off grey and still far below the
     0.30 that flattened the folds. Brightness and separation are not in
     conflict here as long as they are bought from different lights. */
  { name: 'press',   file: 'press',  tint: 0xffffff, rough: 0.72, lumps: 0.16, grain: 0.20,
    /* `tile` is how much of the sheet lands on the body, and at 900 the answer
       was "one letter and a lot of paper". The scan is already set large — the
       type fills its frame — so the tile has to come DOWN for the lines to read
       as lines. At 300 something the size of a fist wears about three of them,
       which is what the reference has. */
    /* Fewer faces, softer arrises, and the sheet laid on continuously. Five
       planes rather than six with the chisel halved and the fillet doubled: the
       first pass came back as a cut gem with type stencilled on each face, and
       what the reference has is a lump of rock that broke into a handful of
       planes and was then wrapped. */
    /* FEWER FACETS AND MORE PAPER, both reported on 13 August: "the letters are
       always in the same direction, and I asked for a paper texture, fewer
       facets, that the newspaper should seem to wrap the object."

       The facets come down from five to three with the chisel almost off and the
       fillet up: what was left was still a cut stone wearing print, and paper
       wrapped round something does not have arrises — it has soft folds.

       FOUR PLANES AND NOT THREE: three was tried first and the body came out a
       TRIANGLE — one silhouette, no parcel about it. Four, with the chisel nearly
       off and the fillet up, is the fold count a wrapped thing actually has.

       The paper itself is bumped nearly twice as hard. The type has to stay flat,
       because ink has no thickness, but the SHEET is fibre and creases and that
       is the whole difference between "printed on" and "covered in". At 0.30 the
       surface was optically smooth and the eye read it as a print of paper rather
       than as paper. */
    /* AND THE FOLDS HAVE TO BE READABLE AS FOLDS. Reported 13 August: "there is
       not enough difference in the lighting between the faces, it is hard to see
       that there is an angle between them."

       Two causes, and the first was mine from the round before: softening the
       arrises to get away from a cut gem went too far — a fillet of 0.42 with
       the chisel almost off rounds each plane into the next until the body has
       no planes left, only a pillow. Back to a tight fillet and a real chisel;
       the faces meet at an edge again.

       The second is the light, and it is the same lesson as the coat of quills.
       A near-white matte surface under a pale dome is filled almost equally
       whichever way it turns, because most of what reaches it is ambient and
       ambient has no direction. Dropping the room's share to 0.10 lets the key
       lamp decide, and the difference between one plane and the next is then a
       difference in how each is TURNED rather than in what is printed on it. */
    tile: 200, bump: 0, roughVar: 0.18, layer2: 0, facets: 4, facetJitter: 0.55,
    /* AND THE SHADING BREAKS AT THE FOLDS. `softFacets` was on, which keeps the
       silhouette faceted while letting the light cross every join without a
       seam — written for "a stone that broke into planes and was then handled",
       whose arrises are rounded. Reported 13 August: "the press feels flat, I
       did not understand it." That is what a body with no shading break looks
       like: the outline says four planes and the light says one pillow, and the
       eye believes the light.

       Paper wrapped round something is not a handled stone. It creases, and a
       crease IS a hard line in the shading — the very thing the flag was added
       to avoid. So it comes off here and stays on for anything that is genuinely
       a rounded rock. */
    chisel: 0.30, round: 0.18, colony: 0,
    wrap: { bump: 0.55 },
    finish: { specularIntensity: 0.22, envMapIntensity: 0.26 } },

  /* Spines, against the red anemone in the weird set: dense enough to read as a
     mass, coral running to near-black at the tips, and not quite rigid. Spacing
     is what carries "dense" — it is a distance between quills, so halving it
     roughly quadruples the count, and this is a quarter of the first pass. */
  /* THE SKIN UNDER THE COAT IS DARK ON PURPOSE, and it was the other half of
     "the shading is greyish and washed out". At 0x9c7f63 the hide was a pale
     grey-brown, and at this spacing the coat does not close over it completely —
     so what showed between several thousand spines was PALE CLAY, and the gaps
     that should read as depth read as a light grey haze laid over the colour.
     An anemone's interstices are nearly black. Darkening the skin costs nothing
     anywhere else, because on this material the skin is only ever glimpsed. */
  { name: 'quills',  file: 'clay',   tint: 0x3a2016, rough: 0.90, lumps: 0.26, grain: 0.30,
    tile: 620, bump: 6, roughVar: 0.35, colony: 0,
    /* Spacing in pixels now that the dial works, and it is set where the body
       nearly disappears: at 2.4 a fist-sized shape carries several thousand
       quills and what you read is the mass, not the thing underneath. Shorter to
       match — long spines at this density become a haystack, and the reference
       is a pincushion. */
    /* Colour lifted off the floor. `tipDark` at 0.72 took the last fifth of every
       spine almost to black, and with several thousand of them overlapping, the
       dark ends were most of what the eye averaged — which is where "murky and
       gloomy" came from. The dark tip is what draws the second silhouette inside
       the first, so it stays, at a little over half strength, against colours
       that start brighter and warmer. */
    /* Rubber, not bristle: fewer, thicker, blunt-ended. The count comes down by
       roughly two thirds and each one is nearly twice as fat, which changes what
       the mass is made of — at the previous setting the eye read fur, and fur
       cannot be made of rubber however it is shaded. Roughness up into the matte
       range where rubber lives, and the sheen down with it: a rubber spine has a
       soft wide highlight, not the fibre glow that made these read as hair. */
    /* `sheen` down from 0.35, and `rootDark` is new. Reported together on 13
       August: "there is still a kind of halo on the quills" and "why is there no
       shading on the surface".

       The halo was the sheen doing exactly what it was put there to do. A fine
       fibre lit across or from behind glows along its whole length — that is
       real, and it is why the sheen went in — but at 0.35 on a rubber spine it
       stops being retroreflection and becomes a soft light around every quill,
       which fills the gaps and cancels the very occlusion `rootDark` is there to
       create. The two fight, so one had to give and it is this one: rubber has a
       broad dull highlight, not a glow. */
    coat: { spacing: 4.4, len: 0.19, thick: 0.115, curl: 0.30, jitter: 0.50, varyLen: 0.9,
            blunt: 0.42, rough: 0.62, tipDark: 0.34, rootDark: 0.62,
            sheen: 0.10, sheenColor: 0xffb59a,
            colours: [0xff6a3d, 0xe8402c, 0xff9d5c] },
    /* AND THE ROOM IS KEPT OFF IT, which is the rest of "the shading is still
       an ugly grey — the shadows between the quills should work as a multiply
       and not add grey".

       It read the room at 0.62, on the reasoning that a fibre picks up the whole
       surround where a hide does not. True of one fibre, wrong of a coat: the
       environment here is a pale near-neutral room, and neutral light arriving
       in the gaps between several thousand coral spines is exactly a grey wash
       laid over the colour. It is ADDED light, so no amount of darkening
       elsewhere removes it — the same category error the gel made when it added
       a tint to the floor instead of multiplying one.

       At 0.14 the gaps go deep red instead of grey and the coat holds one colour
       from the lit side to the shaded side, which is what the anemone does. */
    finish: { envMapIntensity: 0.14 } },

  /* The brush mark, against 33639e: wide, wet, and coloured. `shape: 'ribbon'` is
     the third shape mode in the piece after the outline and the cloud, and the
     only one that answers an open stroke with something that is not a tube.

     `lineR` is what makes it wide — a mark this size is a loaded flat brush, not
     a liner — and the map is a real scan of one, mapped by the ribbon's own UVs
     so the bristle streaks run along the mark instead of across it. */
  { name: 'brush',   file: 'brushmark', shape: 'ribbon', tint: 0xffffff,
    rough: 0.72, lumps: 0.2, grain: 0.3, tile: 0, bump: 0, roughVar: 0, colony: 0, lineR: 4.6,
    // thinner through the mark, not narrower across it, and the dry-brush gaps
    // in the scan become real holes in the ribbon
    ribbon: { thick: 0.085, twist: 1.5, flow: 0.14, bump: 0.35, holes: true, holeCut: 0.70 },
    finish: { specularIntensity: 0.30, clearcoat: 0.25, clearcoatRoughness: 0.5, envMapIntensity: 0.35 } },

  /* ---------- six that imitate nothing ----------
     Asked for on 11 August: strange rather than familiar, with sparkle, glow and
     colour. The rule taken from the brief was that a new material has to be a new
     MECHANISM and not a new set of numbers — so each of these six brings
     something the piece could not do the day before: flakes that flash, light
     from inside, poured colour, machined ribs, a coat of buds, and a frost that
     splits the light. */

  /* Flakes in a clear coat. The flash is not painted: the flake field drives the
     roughness break-up, so a flake catching the lamp is white while its neighbour
     is not, and turning the piece changes which. */
  /* Glitter glued on rather than cast in resin. The clearcoat is gone, and that
     is the change that matters most: a smooth lacquer over the top is one
     unbroken sheet of reflection, so the whole body caught the light as a single
     shape and the flakes underneath became a printed pattern. Without it every
     flake is its own little mirror at its own angle, the surface is rough where a
     finger would find it rough, and the specks read as stuck on.

     Finer, too — the tile is halved, so the flakes are the size of flakes rather
     than of chips — and a handful of sparks blink inside the body, because a
     flake catching the light is a moment and not a state. */
  { name: 'glitter', file: 'glitter', tint: 0xffffff, gradient: [0x1f3bd6, 0x4f8cff],
    rough: 0.72, lumps: 0.26, grain: 0.30, tile: 320, bump: 30, roughVar: 1.5,
    relief: 0.10, round: 0.42, colony: 0, sparkle: 1.0,
    lamps: { count: 4, power: 9, reach: 0.34, flash: true },
    finish: { metalness: 0.30, specularIntensity: 1.0, envMapIntensity: 1.25 } },

  /* Light from inside, and the first thing here that is brighter than the room.
     A ribbon, because a light is a line before it is a body, and `emissiveTrack`
     gives each stroke the glow of the pair it happened to draw. */
  /* And the settled answer on the glow, after the halo came out: the colour has
     to live in the BODY as well as in the emission. Emission alone desaturates
     as it brightens, so a stroke bright enough to read as lit was always a pale
     one — but a saturated body with a moderate emission on top reads as a tube
     that is on, which is as close to neon as a beige room allows. So the palette
     paints the vertices after all, and the emission is held low enough to keep
     its hue. */
  { name: 'neon',    file: null, shape: 'ribbon', tint: 0xffffff,
    palette: [[0x18e0ff, 0xff2fd0, 0x18e0ff], [0x39ff88, 0x1f6bff, 0x39ff88],
              [0xff9a1f, 0xff2f6b, 0xff9a1f]],
    /* Intensity, and 1.35 was not light — it was a pale material. Emission is
       added to whatever the room already put on the surface, and this room is
       bright: at 1.35 the addition sat inside the range the beige cove was
       already filling, so the stroke read as painted rather than as lit. It has
       to clear the room by a margin before the eye calls it a source, and ACES
       then rolls the top off so the colour survives instead of clipping white. */
    /* 4.2 was light and no colour. Past about two and a half the emission clears
       the top of the range in all three channels at once, and three channels at
       the top is white however saturated the colour going in was — a neon tube
       photographed with the exposure left open. Held just above the room instead,
       which is where it reads as lit AND still reads as cyan. */
    emissive: 0xffffff, emissiveIntensity: 1.15, emissiveTrack: true,
    // the part that makes it a light rather than a bright object: real lamps
    // strung along the stroke, in its own colour, lighting what stands near it
    lamps: { count: 3, power: 30, reach: 2.2 },
    rough: 0.22, lumps: 0.10, grain: 0, tile: 0, bump: 0, roughVar: 0, colony: 0, lineR: 2.6,
    ribbon: { thick: 0.46, twist: 1.9, flow: 0.05 },
    finish: { clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 0.25 } },

  /* Poured paint: four colours folded through each other in hard-edged ribbons,
     painted per vertex off a domain-warped field. Glossy, because what makes a
     pour read as liquid is that the whole surface reflects as one sheet. */
  /* `file: 'skin'` on the three below is the answer to "everything feels like
     the same plastic". They had no scan at all, so they had no micro-relief, and
     a mathematically smooth surface is the strongest tell there is. The skin is
     shared but the ROUGHNESS is not: poured paint is a wet sheet, ribs are a
     matte moulding, and the two now sit at opposite ends rather than both
     landing on the same satin. */
  { name: 'pour',    file: 'dust', tint: 0xffffff,
    swirl: [0x1b2fd4, 0xff4f7d, 0xffc9a3, 0xf4f1ec, 0x6a2ad6],
    rough: 0.10, lumps: 0.18, grain: 0.3, tile: 560, bump: 3.5, roughVar: 0.18, relief: 0.10,
    /* Never settles. `liquid` is the unrest already in the piece — a slow drift
       plus a quicker quiver — and past 0.85 the quiver comes in at more than
       three times its usual share, which is the difference between something
       heavy that has not finished settling and something that is not going to.
       At the top of the range this reads as a drop held in the air. */
    // `flow` moves the surface itself; `liquid` is dropped right back, since two
    // kinds of unrest at once read as a wobble rather than as a liquid
    round: 0.78, colony: 0, liquid: 0.25, flow: 1.0,
    finish: { clearcoat: 1.0, clearcoatRoughness: 0.05, envMapIntensity: 0.85 } },

  /* Ribs. Everything else in the library is relief taken off a photograph, which
     can never be regular; this is arithmetic, so it is exactly regular, and that
     is the whole of what makes it read as made rather than grown. Across the
     drawn axis, so the corrugation runs round the body. */
  { name: 'rib',     file: 'skin', tint: 0xffffff, gradient: [0xff3d8b, 0xffd23d],
    /* Depth measured against the body rather than by eye, and 0.85 was a saw.
       A rib displaces along the normal, so at the RIM the normal points sideways
       and the displacement moves the silhouette itself — which means the depth
       that reads as corrugation across the face reads as serration around the
       edge, and the edge is what the eye checks first. A third of it keeps the
       corrugation and gives the outline back. */
    /* Back up after seeing it: the scalloped silhouette is not a fault, it is
       what corrugation looks like from the side, and the reference has it. What
       0.85 got wrong was the FREQUENCY — ribs closer together than the mesh can
       resolve turn the edge into a saw rather than a scallop. Fewer, deeper. */
    rib: { freq: 15, depth: 0.78 }, grainAlong: true,
    rough: 0.68, lumps: 0.10, grain: 0.3, tile: 420, bump: 6, roughVar: 0.34, relief: 0.14,
    round: 0.55, colony: 0,
    finish: { specularIntensity: 0.55, envMapIntensity: 0.4 } },

  /* A crust of buds, from the terrarium reference: the coat mechanism again with
     spheres instead of spines, in two clumped colour families, and the brighter
     family lit from inside so the growth glows against the pale body under it. */
  /* The buds were burnt out, and the emission on them was doing it. Emission is
     added AFTER the shading, so it fills the shadow side of every bud with the
     same flat value as the lit side — which is exactly "no depth in the shading":
     the light was still falling on them correctly and then being painted over.
     Gone, and the colour it was standing in for is put into the buds themselves,
     deeper and further apart, so the shape of each one comes back. */
  /* Built the way the moss is built, which is what "matte, or granular" is
     asking for. Moss does not read as moss because of its colour: it reads
     because of `sheen`, the retroreflective nap that lights up along the rim
     instead of going black there, over a scan coarse enough to break every
     highlight. The buds get the same treatment rather than the wet plastic
     shine they had — matte to the point of chalk, with a sheen the colour of
     the sand they look dusted in. */
  // `sand`, not `sponge`: it was borrowing another material's scan, and a body
  // dusted in grit is not a body full of holes
  { name: 'bloom',   file: 'sand', tint: 0xbfc9a8, rough: 0.98, lumps: 0.30, grain: 0.9,
    // a drawn LINE of bloom came out fat for what it is — a stem wears its
    // growth, it is not the growth. Reported 14 Aug, asked for about 70%.
    lineR: 0.7,
    tile: 300, bump: 16, roughVar: 0.55, round: 0.55, colony: 0,
    coat: { shape: 'blob', spacing: 4.6, len: 0.15, jitter: 0.9, varyLen: 1.3,
            rough: 0.97, sheen: 1.0, sheenColor: 0xdff0a8,
            colours: [0x9ec93a, 0x4f8f3c, 0xc8dd6a, 0x2f6b34] },
    finish: { sheen: 1.0, sheenRoughness: 0.95, sheenColor: 0xdff0a8, envMapIntensity: 0.40 } },

  /* Frost that splits the light. Nothing here was both matte and iridescent
     before: the film lived on clear glass, where it is a soap bubble, and on a
     sugared surface it becomes something else entirely — the rainbow arrives
     through a granular skin, so it blooms in patches instead of running in
     bands. Weighted to the rim by `filmAtRim`, which is where a film's path
     through itself is longest. */
  /* First pass came back as a plain pearl, and the reason is worth keeping: a
     thin film colours the light a surface REFLECTS, so a material with almost no
     specular return has nothing for the film to tint. Roughness at 0.52 with a
     clearcoat over it was scattering the reflection away before the film could
     work on it — the rainbow was being computed and then buried. Roughness down,
     specular up, the clearcoat gone, and the film's thickness range widened so
     the colour sweeps through more than one band across the body. */
  /* Three passes to get here and each one was the same mistake in a different
     place: the film was being computed and then buried under something. First
     under a white diffuse, which drowns its own rainbow in its own albedo. Then
     under metal — which does remove the diffuse, and removes everything else
     with it: a mirror in a neutral room is a dark mirror, and the film had
     nothing but grey to tint.

     What a film needs is a surface that returns light without returning COLOUR,
     which is glass. So it is built on the sea glass recipe: clear underneath at
     a very low roughness, with the frosting moved up into a rough clearcoat —
     the same trick, because roughness on a transmissive body scatters what
     passes THROUGH it and turns the whole thing milky, while roughness on the
     lacquer over it scatters only what bounces off. Frost on the outside, clear
     underneath, and the rainbow lives between them. */
  /* `ember` stood here and was removed on 13 August at Hadar's request — the
     dark crust with the glow coming out of its cracks, which had itself taken
     `opal`'s place on 11 August. Twenty-seven materials become twenty-six.

     ITS MACHINERY IS DELIBERATELY LEFT IN THE SHADER (`uEmber`, `uEmberGain`,
     and the `ember` key that `tuneMat` still accepts). It is dead as written:
     no material carries an `ember` key any more, so the gain resolves to 0 and
     the branch never lights. It stays because it is the only mechanism here
     that reads a glow out of a scan's own luminance rather than declaring it,
     and that is worth having in reach if a lit material is ever wanted again —
     whereas tearing it out touches the shared surface shader that every one of
     the other twenty-six goes through. The same call was made when ember was
     dropped from the shared build of 14. */

  /* ---------- two more, from paint that was actually made ----------
     Both are scans rather than inventions, and both are here because the
     library had drifted toward things that are LIT interestingly and away from
     things that are COLOURED interestingly. These two carry their colour in the
     scan and ask the light for very little, which is the opposite bet from the
     six before them and the reason they sit next to each other. */

  /* Acrylic pulled with a squeegee. It is directional in the strongest way
     anything here is: the comb marks and the branching veins all record one
     movement, so the projection follows the drawn axis and the second layer is
     nearly off — a second pull crossing the first at 37 degrees would undo the
     one thing the material is about. Wet and glossy, with just enough real
     relief for the ridges the blade left standing to catch the lamp. */
  /* Wrapped, not projected — the same decision the printed sheet needed and for
     the same reason. Triplanar samples a different part of the scan per axis,

     its own target and its own idea of what is behind the glass. Neighbouring

     abruptly as the pile turns, and the reflection on the chrome jumps. Which
     is exactly the report: the jumping happens when there is something
     transparent standing next to the chrome.

     still appears in the reflection as a pale ghost, which is about what a
     bubble contributes to a mirror anyway, and it appears the same on every

/* The lamps now sit on top of a room that is already lighting everything, so

scene.add(back);

/* ---------- the cyclorama ----------

     sculpture — but emitted light is not received light, so no shadow can

const cove = limboGround();
scene.add(cove);           // outside `world`, so the room does not turn with the pile

/* Sits the ground behind and below the sculpture at whatever the current zoom

   would tear through it — while staying close enough that the shadow it catches
   still reads as belonging to the sculpture rather than to something else. */

   towards the camera as it descends the frame, so the point where it is

let frameHalf = { w: 1, h: 1 };        // kept so the panel can re-place the ground

function placeCove(halfW, halfH) {

/* ---------- ambient occlusion ----------
